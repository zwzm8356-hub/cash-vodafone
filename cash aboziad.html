        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {

        // Initialize Firebase
        try {

        const firebaseApp = firebase.app();
        const db = firebase.database();

        // ⭐ الحدود الصحيحة
        const LINES_LIMIT_MONTHLY = 200000;
        const LINES_LIMIT_DAILY = 60000;
        const VISA_LIMIT_MONTHLY = 200000;
        const VISA_LIMIT_DAILY = 30000;

        const initialLines = Array.from({ length: 16 }, (_, i) => ({
            id: `line-${i + 1}`, name: `خط ${i + 1}`, number: "", 
            usedTodayTransfer: 0, usedMonthTransfer: 0,
            usedTodayReceive: 0, usedMonthReceive: 0,
            balance: 0, available: true,
        }));
        const initialVisas = Array.from({ length: 3 }, (_, i) => ({
            id: `visa-${i + 1}`, name: `فيزا فوري ${i + 1}`, number: "", 
            usedTodayTransfer: 0, usedMonthTransfer: 0,
            usedTodayReceive: 0, usedMonthReceive: 0,
            balance: 0, available: true,
        }));

        const TABS_ORDER = ["dashboard", "transactions", "people", "lines", "finance"];

        // ⭐ Safe Storage (localStorage مع fallback لـ in-memory لو مش متاح)
        const _memStore = {};
        const saveToLocalStorage = (key, data) => {
            try {
                const str = JSON.stringify(data);
                _memStore[key] = str;
                localStorage.setItem(key, str);
            } catch (error) {
                _memStore[key] = JSON.stringify(data);
            }
        };

        const loadFromLocalStorage = (key, defaultValue) => {
            try {
                const data = localStorage.getItem(key);
                if (data) return JSON.parse(data);
            } catch (e) {}
            try {
                if (_memStore[key]) return JSON.parse(_memStore[key]);
            } catch (e) {}
            return defaultValue;
        };

        function pad(n) { return String(n).padStart(2, "0"); }
        function nowStr() {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        function today() {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        }
        function currentMonthStr() {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
        }
        function formatNum(n) { return Number(n).toLocaleString("ar-EG"); }
        function formatDateOnly(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split(" ");
            const dateParts = parts[0].split("-");
            return `${dateParts[2]}/${dateParts[1]}/${dateParts[0]} ${parts[1]||""}`;
        }
        function formatDateArabic(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split("-");
            const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
            const d = new Date(dateStr);
            const dayName = days[d.getDay()];
            return `${dayName} ${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        // ⭐ دالة ذكية لاستخراج البيانات من الرسالة
        const evaluateExpression = (input) => {
            try {
                const sanitized = input.replace(/[^0-9+\-*/.]/g, '');
                if (!sanitized) return "";
                const result = Function(`"use strict"; return (${sanitized})`)();
                return isNaN(result) ? input : String(result);
            } catch (e) {
                return input;
            }
        };

                function parseSmartMessage(text, lines = [], visas = []) {
            const result = {
                amount: "",
                personNumber: "",
                lineId: "",
                type: "transfer",
                notes: ""
            };
            if (!text.trim()) return result;
            // 1. استخراج المبلغ الذكي
            const amountMatch = text.match(/(?:مبلغ|قيمة)\s*(\d+(?:\.\d+)?)/) || text.match(/(\d{2,}(?:\.\d{1,2})?)\s*(?:جنيه|EGP)/) || text.match(/(\d{2,}(?:\.\d{1,2})?)/);
            if (amountMatch) result.amount = amountMatch[1];
            // 2. استخراج رقم تليفون العميل
            const phoneMatch = text.match(/(01[0-9]{9})/);
            if (phoneMatch) result.personNumber = phoneMatch[1];
            // 3. تحديد نوع العملية أوتوماتيك
            if (text.includes("تم استلام") || text.includes("إيداع") || text.includes("حوّل لك") || text.includes("تم استقبال")) {
                result.type = "receive";
            } else if (text.includes("تم تحويل") || text.includes("سحب") || text.includes("خصم")) {
                result.type = "transfer";
            }
            // 4. التعرف الذكي على اسم الخط أو الفيزا
            const allSources = [...lines, ...visas];
            for (const source of allSources) {
                if (source.name && text.includes(source.name)) {
                    result.lineId = source.id;
                    break;
                }
            }
            // 5. حفظ نص الرسالة في الملاحظات
            result.notes = `[رسالة تلقائية]: ${text.trim()}`;
            return result;
        }
        function ProgressBar({ used, limit, color }) {
            const pct = Math.min((used / limit) * 100, 100);
            const danger = pct >= 85; const warn = pct >= 60;
            return (
                <div style={{ width:"100%", background:"#1e293b", borderRadius:6, height:8, overflow:"hidden" }}>
                    <div style={{ width:`${pct}%`, height:"100%", background: danger?"#ef4444":warn?"#f59e0b":color||"#22d3ee", borderRadius:6, transition:"width 0.4s ease" }} />
                </div>
            );
        }

        function LoginPage({ onLogin }) {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);
            const [showPassword, setShowPassword] = useState(false);

            // ADMIN_EMAIL يحدده أنت من Firebase Console
            const ADMIN_EMAIL = "ziad@gmail.com";

            const handleLogin = async () => {
                if (!email.trim() || !password.trim()) {
                    setError("أدخل الإيميل وكلمة المرور");
                    return;
                }
                setLoading(true);
                setError("");
                try {
                    const result = await auth.signInWithEmailAndPassword(email.trim(), password);
                    const role = result.user.email === ADMIN_EMAIL ? "admin" : "user";
                    onLogin(role, result.user);
                } catch (err) {
                    const msgs = {
                        "auth/user-not-found": "الإيميل غير موجود",
                        "auth/wrong-password": "كلمة المرور خاطئة",
                        "auth/invalid-email": "صيغة الإيميل غير صحيحة",
                        "auth/too-many-requests": "محاولات كثيرة، حاول لاحقاً",
                        "auth/invalid-credential": "بيانات الدخول غير صحيحة",
                    };
                    setError(msgs[err.code] || "خطأ في تسجيل الدخول");
                } finally {
                    setLoading(false);
                }
            };

            const handleGuest = () => {
                onLogin("guest", null);
            };

            return (
                <div style={{minHeight:"100vh", background:"linear-gradient(135deg,#0a0f1e,#0f1e3d)", display:"flex", alignItems:"center", justifyContent:"center", padding:20}}>
                    <div style={{width:"100%", maxWidth:380, textAlign:"center"}}>
                        <div style={{width:80, height:80, borderRadius:20, background:"linear-gradient(135deg,#e40000,#cc0000)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:40, fontWeight:900, color:"#fff", boxShadow:"0 0 30px #e4000055", margin:"0 auto 30px"}}>V</div>
                        
                        <h1 style={{fontSize:28, fontWeight:900, color:"#fff", marginBottom:10}}>فودافون كاش</h1>
                        <p style={{fontSize:14, color:"#94a3b8", marginBottom:40}}>مدير الخزينة والعمليات المالية</p>

                        <div style={{background:"#0f1e3d", border:"1px solid #1e3a5f", borderRadius:16, padding:30, marginBottom:20}}>
                            
                            <div style={{marginBottom:16}}>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={e => { setEmail(e.target.value); setError(""); }}
                                    onKeyPress={e => e.key === "Enter" && handleLogin()}
                                    placeholder="الإيميل"
                                    style={{width:"100%", background:"#0a0f1e", border:"1px solid #1e3a5f", borderRadius:12, padding:"14px", color:"#e2e8f0", fontSize:15, outline:"none", boxSizing:"border-box", textAlign:"right", direction:"ltr"}}
                                />
                            </div>

                            <div style={{position:"relative", marginBottom:20}}>
                                <input 
                                    type={showPassword ? "text" : "password"}
                                    value={password}
                                    onChange={e => {setPassword(e.target.value); setError("");}}
                                    onKeyPress={e => e.key === "Enter" && handleLogin()}
                                    placeholder="كلمة المرور"
                                    style={{width:"100%", background:"#0a0f1e", border:"1px solid #1e3a5f", borderRadius:12, padding:"14px 40px 14px 14px", color:"#e2e8f0", fontSize:15, outline:"none", boxSizing:"border-box", textAlign:"right"}}
                                />
                                <button 
                                    onClick={() => setShowPassword(!showPassword)}
                                    style={{position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", background:"none", border:"none", color:"#64748b", cursor:"pointer", fontSize:16}}
                                >
                                    {showPassword ? "👁️" : "👁️‍🗨️"}
                                </button>
                            </div>

                            {error && <div style={{background:"#ef444420", border:"1px solid #ef4444", color:"#ef4444", padding:12, borderRadius:10, fontSize:13, marginBottom:20, fontWeight:600}}>{error}</div>}

                            <button 
                                onClick={handleLogin}
                                disabled={loading}
                                style={{width:"100%", background: loading ? "#666" : "linear-gradient(135deg,#e40000,#cc0000)", border:"none", borderRadius:12, padding:14, color:"#fff", fontSize:16, fontWeight:700, cursor: loading ? "not-allowed" : "pointer", boxShadow:"0 4px 15px #e4000040", marginBottom:12, opacity: loading ? 0.7 : 1}}
                            >
                                {loading ? "جاري الدخول..." : "دخول"}
                            </button>

                            <button 
                                onClick={handleGuest}
                                style={{width:"100%", background:"#1e293b", border:"1px solid #334155", borderRadius:12, padding:14, color:"#94a3b8", fontSize:16, fontWeight:700, cursor:"pointer"}}
                            >
                                دخول كضيف 👤
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [userRole, setUserRole] = useState(null);
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [tab, setTab] = useState("dashboard");
            
            // ⭐ Load from localStorage on first load
            const [lines, setLines] = useState(() => loadFromLocalStorage('lines', initialLines));
            const [visas, setVisas] = useState(() => loadFromLocalStorage('visas', initialVisas));
            const [transactions, setTransactions] = useState(() => loadFromLocalStorage('transactions', []));
            const [people, setPeople] = useState(() => loadFromLocalStorage('people', []));
            const [capital, setCapital] = useState(() => loadFromLocalStorage('capital', 0));
            const [financeLogs, setFinanceLogs] = useState(() => loadFromLocalStorage('financeLogs', []));
            
            const [syncStatus, setSyncStatus] = useState("✓ جاهز");


            const [modal, setModal] = useState(null);
            const [editLineId, setEditLineId] = useState(null);
            const [selectedPersonId, setSelectedPersonId] = useState(null);
            const [filter, setFilter] = useState("all");
            const [searchQ, setSearchQ] = useState("");
            const [toast, setToast] = useState(null);
            const [financeTab, setFinanceTab] = useState("daily");
            
            const [form, setForm] = useState({ 
                type: "transfer",
                date: today(), 
                time: "12:00",
                fromNumber: "", 
                toNumber: "", 
                personName: "", 
                amount: "", 
                sourceId: "", 
                sourceType: "line", 
                notes: "",
                image: null 
            });

            // ⭐ حقل Paste الذكي الجديد
            const [smartPaste, setSmartPaste] = useState("");

            const [financeForm, setFinanceForm] = useState({ type: "income", amount: "", desc: "" });
            const [capitalInput, setCapitalInput] = useState("");
            const [viewImg, setViewImg] = useState(null);
            const fileRef = useRef();

            const [peopleForm, setPeopleForm] = useState({ personName: "", debtAmount: "", desc: "" });
            const [editPersonId, setEditPersonId] = useState(null);
            const [confirmDelete, setConfirmDelete] = useState(null);

            const touchStartX = useRef(0);
            const touchEndX = useRef(0);

            // ⭐ Firebase Auth Listener
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) {
                        const ADMIN_EMAIL = "ziad@gmail.com";
                        const role = user.email === ADMIN_EMAIL ? "admin" : "user";
                        setFirebaseUser(user);
                        setUserRole(role);
                    } else {
                        setFirebaseUser(null);
                        setUserRole(null);
                    }
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Load from Firebase
            useEffect(() => {
                if (!userRole || userRole === "guest") return;

                try {
                    db.ref('lines').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) setTimeout(() => setLines(data), 0);
                    });

                    db.ref('visas').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) setTimeout(() => setVisas(data), 0);
                    });

                    db.ref('transactions').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) setTimeout(() => setTransactions(Array.isArray(data) ? data : Object.values(data)), 0);
                    });

                    db.ref('people').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) setTimeout(() => setPeople(Array.isArray(data) ? data : Object.values(data)), 0);
                    });

                    db.ref('capital').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data !== null) setTimeout(() => setCapital(data), 0);
                    });

                    db.ref('financeLogs').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) setTimeout(() => setFinanceLogs(Array.isArray(data) ? data : Object.values(data)), 0);
                    });
                } catch (error) {
                    console.error('Error setting up Firebase listeners:', error);
                }

                return () => {
                    db.ref('lines').off();
                    db.ref('visas').off();
                    db.ref('transactions').off();
                    db.ref('people').off();
                    db.ref('capital').off();
                    db.ref('financeLogs').off();
                };
            }, [userRole]);

            // ⭐ Auto-save to localStorage AND Firebase
            useEffect(() => { 
                saveToLocalStorage('lines', lines);
                if (userRole && userRole !== "guest" && auth.currentUser) { try { db.ref('lines').set(lines); } catch(e){} }
            }, [lines, userRole]);
            
            useEffect(() => { 
                saveToLocalStorage('visas', visas);
                if (userRole && userRole !== "guest" && auth.currentUser) { try { db.ref('visas').set(visas); } catch(e){} }
            }, [visas, userRole]);
            
            useEffect(() => { 
                saveToLocalStorage('transactions', transactions);
                if (userRole && userRole !== "guest" && auth.currentUser) { try { db.ref('transactions').set(transactions); } catch(e){} }
            }, [transactions, userRole]);
            
            useEffect(() => { 
                saveToLocalStorage('people', people);
                if (userRole && userRole !== "guest" && auth.currentUser) { try { db.ref('people').set(people); } catch(e){} }
            }, [people, userRole]);
            
            useEffect(() => { 
                saveToLocalStorage('capital', capital);
                if (userRole && userRole !== "guest" && auth.currentUser) { try { db.ref('capital').set(capital); } catch(e){} }
            }, [capital, userRole]);
            
            useEffect(() => { 
                saveToLocalStorage('financeLogs', financeLogs);
                if (userRole && userRole !== "guest" && auth.currentUser) { try { db.ref('financeLogs').set(financeLogs); } catch(e){} }
            }, [financeLogs, userRole]);

            // ⭐ Auto daily reset (must be before early returns)
            useEffect(() => {
                const lastResetDay = loadFromLocalStorage('lastResetDay', null);
                const todayStr = today();
                if (lastResetDay && lastResetDay !== todayStr) {
                    setLines(p=>p.map(l=>({...l,usedTodayTransfer:0,usedTodayReceive:0})));
                    setVisas(p=>p.map(v=>({...v,usedTodayTransfer:0,usedTodayReceive:0})));
                }
                saveToLocalStorage('lastResetDay', todayStr);
            }, []);

            // ⭐ Alert when line hits 80%
            useEffect(() => {
                const warned = loadFromLocalStorage('warnedSources', []);
                const newWarned = [...warned];
                let changed = false;
                [...lines, ...visas].forEach(s => {
                    const monthlyLimit = s.id.startsWith('visa') ? VISA_LIMIT_MONTHLY : LINES_LIMIT_MONTHLY;
                    const usedMonth = (s.usedMonthTransfer||0) + (s.usedMonthReceive||0);
                    const pct = (usedMonth / monthlyLimit) * 100;
                    if (pct >= 80 && !newWarned.includes(s.id)) {
                        const msg = `⚠️ ${s.name} وصل ${Math.round(pct)}% من الحد الشهري`;
                        setTimeout(() => setToast({msg, type:"error"}), 100);
                        setTimeout(() => setToast(null), 4000);
                        newWarned.push(s.id);
                        changed = true;
                    }
                });
                if (changed) saveToLocalStorage('warnedSources', newWarned);
            }, [lines, visas]);

            if (authLoading) {
                return (
                    <div style={{minHeight:"100vh",background:"#0a0f1e",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <div style={{textAlign:"center"}}>
                            <div style={{width:60,height:60,borderRadius:15,background:"linear-gradient(135deg,#e40000,#cc0000)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,fontWeight:900,color:"#fff",margin:"0 auto 20px"}}>V</div>
                            <div className="loading-spinner" style={{margin:"0 auto"}}></div>
                        </div>
                    </div>
                );
            }

            if (!userRole) {
                return <LoginPage onLogin={(role, user) => {
                    setUserRole(role);
                    setFirebaseUser(user);
                }} />;
            }

            function logout() {
                if (firebaseUser) {
                    auth.signOut();
                }
                setUserRole(null);
                setFirebaseUser(null);
                setTab("dashboard");
            }

            function showToast(msg, type="success") { setToast({msg,type}); setTimeout(()=>setToast(null),3000); }

            const sources = [
                ...lines.map(l => ({...l, type:"line", dailyLimit:LINES_LIMIT_DAILY, monthlyLimit:LINES_LIMIT_MONTHLY,
                    usedToday: (l.usedTodayTransfer||0)+(l.usedTodayReceive||0),
                    usedMonth: (l.usedMonthTransfer||0)+(l.usedMonthReceive||0),
                })),
                ...visas.map(v => ({...v, type:"visa", dailyLimit:VISA_LIMIT_DAILY, monthlyLimit:VISA_LIMIT_MONTHLY,
                    usedToday: (v.usedTodayTransfer||0)+(v.usedTodayReceive||0),
                    usedMonth: (v.usedMonthTransfer||0)+(v.usedMonthReceive||0),
                })),
            ];

            function handleImagePick(e) {
                const file = e.target.files[0]; if (!file) return;
                const imageKey = `img_${Date.now()}`;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        try { localStorage.setItem(imageKey, ev.target.result); } catch(err) {}
                        _memStore[imageKey] = ev.target.result;
                        setForm(f => ({...f, image: imageKey}));
                        showToast("✓ تم حفظ الصورة");
                    } catch (err) {
                        showToast("فشل حفظ الصورة - جرب صورة أصغر", "error");
                    }
                };
                reader.readAsDataURL(file);
            }

            // ⭐ جلب الصورة الحقيقية من localStorage أو memory باستخدام المفتاح
            function getImageSrc(imageRef) {
                if (!imageRef) return null;
                if (imageRef.startsWith("http") || imageRef.startsWith("data:")) return imageRef;
                try { const v = localStorage.getItem(imageRef); if (v) return v; } catch(e) {}
                return _memStore[imageRef] || null;
            }

            // ⭐ دالة معالجة الـ Smart Paste
            function handleSmartPaste() {
                const parsed = parseSmartMessage(smartPaste, lines, visas);
                
                setForm(f => ({
                    ...f,
                    amount: parsed.amount || f.amount,
                    toNumber: parsed.personNumber || f.toNumber,
                    type: parsed.type || f.type,
                    sourceId: parsed.lineId ? parsed.lineId : f.sourceId,
                    sourceType: parsed.lineId ? (sources.find(s => s.id === parsed.lineId)?.type || "line") : f.sourceType,
                }));

                if (parsed.lineId) {
                    const source = sources.find(s => s.id === parsed.lineId);
                    showToast(`✅ تم تحديد ${source?.name} تلقائياً`);
                }
                
                setSmartPaste("");
                showToast("✓ تم استخراج البيانات");
            }

            function addTransaction() {
                const amount = parseFloat(form.amount);
                if (!form.date || !form.time || !form.personName || !amount || !form.sourceId) { 
                    showToast("أكمل كل البيانات","error"); 
                    return; 
                }

                if (form.type === "transfer" && (!form.fromNumber || !form.toNumber)) {
                    showToast("أكمل أرقام التحويل","error"); 
                    return;
                }

                const personName = form.personName.trim();
                const fullDateTime = `${form.date} ${form.time}`;
                
                const newTxn = {
                    id: Date.now(),
                    type: form.type,
                    date: form.date,
                    dateTime: fullDateTime,
                    fromNumber: form.fromNumber,
                    toNumber: form.toNumber,
                    personName: personName,
                    amount: amount,
                    sourceId: form.sourceId,
                    sourceType: form.sourceType,
                    createdAt: nowStr(),
                    notes: form.notes || "",
                    image: null
                };

                setTransactions(prev => [newTxn, ...prev]);
                updateSource(form.sourceId, form.sourceType, amount, form.type);

                const existingPerson = people.find(p => p.personName.toLowerCase() === personName.toLowerCase());
                if (existingPerson) {
                    setPeople(prev => prev.map(p => {
                        if (p.id !== existingPerson.id) return p;
                        
                        const newRecord = {
                            id: Date.now(),
                            type: form.type,
                            amount: amount,
                            date: fullDateTime,
                            description: form.type === "transfer" ? `تحويل: ${form.fromNumber} → ${form.toNumber}` : "استلام"
                        };

                        return {
                            ...p,
                            records: [...(p.records || []), newRecord],
                            lastUpdated: nowStr()
                        };
                    }));
                    const action = form.type === "transfer" ? "تحويل لـ" : "استلام من";
                    showToast(`${action} ${personName} تم التسجيل ✓`);
                } else {
                    const txnType = form.type === "transfer" ? "تحويل" : "استلام";
                    showToast(`تم ${txnType} بنجاح ✓`);
                }

                setForm({ type: "transfer", date: today(), time: "12:00", fromNumber: "", toNumber: "", personName: "", amount: "", sourceId: "", sourceType: "line", notes: "", image: null });
                setModal(null);
            }

            function updateSource(sourceId, sourceType, amount, txnType) {
                const delta = txnType === "transfer" ? -amount : amount;
                if (sourceType === "line") {
                    setLines(prev => prev.map(l => {
                        if (l.id !== sourceId) return l;
                        return {
                            ...l,
                            usedTodayTransfer: (l.usedTodayTransfer||0) + (txnType==="transfer" ? amount : 0),
                            usedMonthTransfer: (l.usedMonthTransfer||0) + (txnType==="transfer" ? amount : 0),
                            usedTodayReceive:  (l.usedTodayReceive||0)  + (txnType==="receive"  ? amount : 0),
                            usedMonthReceive:  (l.usedMonthReceive||0)  + (txnType==="receive"  ? amount : 0),
                            balance: (l.balance||0) + delta
                        };
                    }));
                } else {
                    setVisas(prev => prev.map(v => {
                        if (v.id !== sourceId) return v;
                        return {
                            ...v,
                            usedTodayTransfer: (v.usedTodayTransfer||0) + (txnType==="transfer" ? amount : 0),
                            usedMonthTransfer: (v.usedMonthTransfer||0) + (txnType==="transfer" ? amount : 0),
                            usedTodayReceive:  (v.usedTodayReceive||0)  + (txnType==="receive"  ? amount : 0),
                            usedMonthReceive:  (v.usedMonthReceive||0)  + (txnType==="receive"  ? amount : 0),
                            balance: (v.balance||0) + delta
                        };
                    }));
                }
            }

            function deleteTransaction(txn) {
                setTransactions(prev => prev.filter(t => t.id !== txn.id));
                const delta = txn.type === "transfer" ? txn.amount : -txn.amount;
                if (txn.sourceType === "line") {
                    setLines(prev => prev.map(l => {
                        if (l.id !== txn.sourceId) return l;
                        return {
                            ...l,
                            usedTodayTransfer: Math.max(0, (l.usedTodayTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                            usedMonthTransfer: Math.max(0, (l.usedMonthTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                            usedTodayReceive:  Math.max(0, (l.usedTodayReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                            usedMonthReceive:  Math.max(0, (l.usedMonthReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                            balance: (l.balance||0) + delta
                        };
                    }));
                } else {
                    setVisas(prev => prev.map(v => {
                        if (v.id !== txn.sourceId) return v;
                        return {
                            ...v,
                            usedTodayTransfer: Math.max(0, (v.usedTodayTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                            usedMonthTransfer: Math.max(0, (v.usedMonthTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                            usedTodayReceive:  Math.max(0, (v.usedTodayReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                            usedMonthReceive:  Math.max(0, (v.usedMonthReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                            balance: (v.balance||0) + delta
                        };
                    }));
                }
                setConfirmDelete(null);
                showToast("تم حذف التحويل ✓");
            }

            // ⭐ عكس العملية - بيرجع الأرقام كأن شيئاً لم يكن
            function reverseTransaction(txn) {
                // نوع معكوس: لو كان transfer يبقى receive والعكس
                const reversedType = txn.type === "transfer" ? "receive" : "transfer";
                const delta = txn.type === "transfer" ? txn.amount : -txn.amount;

                // نحذف العملية من القائمة
                setTransactions(prev => prev.filter(t => t.id !== txn.id));

                // نعكس أرقام الخط/الفيزا
                if (txn.sourceType === "line") {
                    setLines(prev => prev.map(l => {
                        if (l.id !== txn.sourceId) return l;
                        return {
                            ...l,
                            usedTodayTransfer: Math.max(0, (l.usedTodayTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                            usedMonthTransfer: Math.max(0, (l.usedMonthTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                            usedTodayReceive:  Math.max(0, (l.usedTodayReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                            usedMonthReceive:  Math.max(0, (l.usedMonthReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                            balance: (l.balance||0) + delta
                        };
                    }));
                } else {
                    setVisas(prev => prev.map(v => {
                        if (v.id !== txn.sourceId) return v;
                        return {
                            ...v,
                            usedTodayTransfer: Math.max(0, (v.usedTodayTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                            usedMonthTransfer: Math.max(0, (v.usedMonthTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                            usedTodayReceive:  Math.max(0, (v.usedTodayReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                            usedMonthReceive:  Math.max(0, (v.usedMonthReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                            balance: (v.balance||0) + delta
                        };
                    }));
                }

                // نعكس سجل الشخص لو موجود
                setPeople(prev => prev.map(p => {
                    if (p.personName.toLowerCase() !== txn.personName?.toLowerCase()) return p;
                    return {
                        ...p,
                        records: (p.records || []).filter(r => !(
                            Math.abs(r.amount) === txn.amount &&
                            r.date === (txn.dateTime || txn.date)
                        )),
                        lastUpdated: nowStr()
                    };
                }));

                setConfirmDelete(null);
                showToast("↩️ تم عكس العملية وإرجاع الأرقام ✓");
            }

            // ⭐ إضافة دين جديد للشخص
            function addDebtToPerson() {
                const personName = peopleForm.personName.trim();
                const debtAmount = parseFloat(peopleForm.debtAmount);
                if (!personName || !debtAmount || debtAmount <= 0 || !peopleForm.desc.trim()) {
                    showToast("أكمل كل البيانات بشكل صحيح", "error");
                    return;
                }

                const existingPerson = people.find(p => p.personName.toLowerCase() === personName.toLowerCase());
                if (existingPerson) {
                    // إضافة دين جديد للشخص الموجود
                    setPeople(prev => prev.map(p => {
                        if (p.id !== existingPerson.id) return p;
                        const newRecord = {
                            id: Date.now(),
                            type: "debt",
                            amount: debtAmount,
                            date: nowStr(),
                            description: `دين جديد: ${formatNum(debtAmount)} ج - ${peopleForm.desc}`
                        };
                        return {
                            ...p,
                            records: [...(p.records || []), newRecord],
                            lastUpdated: nowStr()
                        };
                    }));
                    showToast(`تم إضافة دين جديد لـ ${personName} ✓`);
                } else {
                    // إنشاء شخص جديد بأول دين
                    const newPerson = {
                        id: Date.now(),
                        personName,
                        desc: peopleForm.desc,
                        records: [{
                            id: Date.now(),
                            type: "debt",
                            amount: debtAmount,
                            date: nowStr(),
                            description: `دين أولي: ${formatNum(debtAmount)} ج`
                        }],
                        createdAt: nowStr(),
                        lastUpdated: nowStr()
                    };
                    setPeople(prev => [newPerson, ...prev]);
                    showToast("تم إضافة الشخص بنجاح ✓");
                }

                setPeopleForm({ personName: "", debtAmount: "", desc: "" });
                setModal(null);
            }

            function addPayment(personId, paymentAmount) {
                const amt = parseFloat(paymentAmount);
                if (!amt || amt <= 0) {
                    showToast("أدخل مبلغ صحيح", "error");
                    return;
                }

                setPeople(prev => prev.map(p => {
                    if (p.id === personId) {
                        const newRecord = {
                            id: Date.now(),
                            type: "payment",
                            amount: -amt,
                            date: nowStr(),
                            description: `دفع: ${formatNum(amt)} ج`
                        };
                        return {...p, records: [...(p.records || []), newRecord], lastUpdated: nowStr()};
                    }
                    return p;
                }));
                showToast("تم تسجيل الدفعة ✓");
            }

            function deletePerson(person) {
                setPeople(prev => prev.filter(p => p.id !== person.id));
                setConfirmDelete(null);
                showToast("تم حذف الشخص ✓");
            }

            function deletePersonRecord(personId, recordId) {
                setPeople(prev => prev.map(p => {
                    if (p.id === personId) {
                        return {...p, records: p.records.filter(r => r.id !== recordId), lastUpdated: nowStr()};
                    }
                    return p;
                }));
                showToast("تم حذف السجل ✓");
            }

            function addFinanceLog() {
                const amt = parseFloat(financeForm.amount);
                if (!amt || amt <= 0 || !financeForm.desc.trim()) { 
                    showToast("أكمل البيانات", "error"); 
                    return; 
                }

                const newLog = {
                    id: Date.now(),
                    type: financeForm.type,
                    amount: amt,
                    desc: financeForm.desc,
                    date: nowStr(),
                    monthDate: currentMonthStr(),
                    logType: financeTab,
                };

                setFinanceLogs(prev => [newLog, ...prev]);
                if (financeForm.type === "income") {
                    setCapital(c => c + amt);
                } else {
                    setCapital(c => c - amt);
                }

                setFinanceForm({ type: "income", amount: "", desc: "" });
                setModal(null);
                showToast("تم تسجيل العملية ✓");
            }

            function updateCapitalDirectly() {
                const amt = parseFloat(capitalInput);
                if (isNaN(amt) || amt < 0) { showToast("أدخل مبلغ صحيح", "error"); return; }
                setCapital(amt);
                setCapitalInput("");
                setModal(null);
                showToast("تم تحديث رأس المال ✓");
            }

            function saveDailySummary(isAutomatic = false) {
                const todayStr = today();
                const todayTxnsToArchive = transactions.filter(t => t.date === todayStr);
                const todayIncome = financeLogs.filter(l => l.date && l.date.startsWith(todayStr) && l.type === "income").reduce((s, l) => s + l.amount, 0);
                const todayExpense = financeLogs.filter(l => l.date && l.date.startsWith(todayStr) && l.type === "expense").reduce((s, l) => s + l.amount, 0);
                
                const totalTransferred = todayTxnsToArchive.filter(t => t.type === "transfer").reduce((s, t) => s + t.amount, 0);
                const totalReceived = todayTxnsToArchive.filter(t => t.type === "receive").reduce((s, t) => s + t.amount, 0);

                const summary = {
                    date: todayStr,
                    savedAt: nowStr(),
                    isAutomatic,
                    totalTransactions: todayTxnsToArchive.length,
                    totalTransferred,
                    totalReceived,
                    income: todayIncome,
                    expense: todayExpense,
                    netProfit: todayIncome - todayExpense,
                    capital,
                    linesSnapshot: lines.map(l => ({
                        id: l.id, name: l.name, number: l.number,
                        usedTodayTransfer: l.usedTodayTransfer || 0,
                        usedTodayReceive: l.usedTodayReceive || 0,
                        usedMonthTransfer: l.usedMonthTransfer || 0,
                        usedMonthReceive: l.usedMonthReceive || 0,
                        balance: l.balance || 0,
                    })),
                    visasSnapshot: visas.map(v => ({
                        id: v.id, name: v.name, number: v.number,
                        usedTodayTransfer: v.usedTodayTransfer || 0,
                        usedTodayReceive: v.usedTodayReceive || 0,
                        usedMonthTransfer: v.usedMonthTransfer || 0,
                        usedMonthReceive: v.usedMonthReceive || 0,
                        balance: v.balance || 0,
                    })),
                };

                // حفظ في Firebase تحت daily_summaries/YYYY-MM-DD
                if (auth.currentUser) {
                    db.ref(`daily_summaries/${todayStr}`).set(summary)
                        .then(() => showToast(`✓ تم أرشفة يوم ${todayStr}`))
                        .catch(() => showToast("فشل الأرشفة", "error"));
                }
                
                return summary;
            }

            function resetDaily() {
                saveDailySummary(false);
                setLines(p=>p.map(l=>({...l,usedTodayTransfer:0,usedTodayReceive:0}))); 
                setVisas(p=>p.map(v=>({...v,usedTodayTransfer:0,usedTodayReceive:0}))); 
                showToast("تم الأرشفة والتصفير اليومي ✓"); 
            }
            function resetMonthly() { 
                setLines(p=>p.map(l=>({...l,usedTodayTransfer:0,usedTodayReceive:0,usedMonthTransfer:0,usedMonthReceive:0}))); 
                setVisas(p=>p.map(v=>({...v,usedTodayTransfer:0,usedTodayReceive:0,usedMonthTransfer:0,usedMonthReceive:0}))); 
                showToast("تم تصفير الشهري ✓"); 
            }



            function deleteFinanceLog(log) {
                setFinanceLogs(prev => prev.filter(item => item.id !== log.id));
                if (log.type === "income") {
                    setCapital(c => c - log.amount);
                } else {
                    setCapital(c => c + log.amount);
                }
                showToast("تم حذف السجل ✓");
            }

            function handleTouchStart(e) {
                if (modal || viewImg || e.target.closest('input') || e.target.closest('select')) return;
                touchStartX.current = e.targetTouches[0]?.clientX;
            }

            function handleTouchEnd(e) {
                if (modal || viewImg || e.target.closest('input') || e.target.closest('select')) return;
                touchEndX.current = e.changedTouches[0]?.clientX;
                const swipeDistance = touchStartX.current - touchEndX.current;
                const minSwipeDistance = 60;
                const currentIdx = TABS_ORDER.indexOf(tab);

                if (swipeDistance > minSwipeDistance && currentIdx < TABS_ORDER.length - 1) {
                    setTab(TABS_ORDER[currentIdx + 1]);
                }
                if (swipeDistance < -minSwipeDistance && currentIdx > 0) {
                    setTab(TABS_ORDER[currentIdx - 1]);
                }
            }

            const selectedSource = form.sourceId ? sources.find(s=>s.id===form.sourceId) : null;
            const alertSources = sources.filter(s=>(s.usedMonth/s.monthlyLimit)>=0.8);
            const todayTxns = transactions.filter(t => t.date === today());
            
            const getPersonBalance = (person) => {
                let balance = 0;
                if (person.records && person.records.length > 0) {
                    balance = person.records.reduce((sum, r) => sum + (r.amount || 0), 0);
                }
                return Math.max(0, balance);
            };
            
            const totalDebt = people.reduce((s, p) => s + getPersonBalance(p), 0);

            const thisMonth = currentMonthStr();
            const monthlyLogs = financeLogs.filter(l => l.monthDate === thisMonth);
            
            // ⭐ فصل اليومي والشهري
            const dailyLogs = monthlyLogs.filter(l => l.logType === "daily");
            const monthlyFinanceLogs = monthlyLogs.filter(l => l.logType === "monthly");
            
            const currentLogs = financeTab === "daily" ? dailyLogs : monthlyFinanceLogs;
            
            const monthIncome = currentLogs.filter(l => l.type === "income").reduce((s, l) => s + l.amount, 0);
            const monthExpense = currentLogs.filter(l => l.type === "expense").reduce((s, l) => s + l.amount, 0);
            const netMonthProfit = monthIncome - monthExpense;

            const selectedPerson = selectedPersonId ? people.find(p => p.id === selectedPersonId) : null;
            const isAdmin = userRole === "admin";
            const isUser = userRole === "user";
            const isGuest = userRole === "guest";

            const tabs = ["dashboard", "transactions", "people", "lines", "finance"];

            const displayTabs = [
                {id:"dashboard",icon:"🏠",label:"الرئيسية"},
                {id:"transactions",icon:"💸",label:"العمليات"},
                {id:"people",icon:"👥",label:"الأشخاص"},
                {id:"lines",icon:"📱",label:"الخطوط"},
                {id:"finance",icon:"💰",label:"المالية"}
            ].filter(t => tabs.includes(t.id));

            const getRoleName = () => {
                if (isAdmin) return "👑 أدمن";
                if (isUser) return "👤 مستخدم";
                return "🌐 ضيف (قراءة فقط)";
            };

            return (
                <div 
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                    style={{minHeight:"100vh",background:"#0a0f1e",direction:"rtl",color:"#e2e8f0",paddingBottom:80}}
                >
                    
                    {/* Header */}
                    <div style={{background:"linear-gradient(135deg,#0a0f1e,#0f1e3d)",borderBottom:"1px solid #1e3a5f",padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                            <div style={{width:38,height:38,borderRadius:10,background:"linear-gradient(135deg,#e40000,#cc0000)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:900,color:"#fff",boxShadow:"0 0 16px #e4000055"}}>V</div>
                            <div>
                                <div style={{fontSize:16,fontWeight:700,color:"#fff"}}>فودافون كاش</div>
                                <div style={{fontSize:11,color:"#64748b"}}>{getRoleName()}</div>
                            </div>
                        </div>
                        <div style={{display:"flex", gap:10, alignItems:"center"}}>
                            <div style={{fontSize:10,color:"#10b981"}}>{syncStatus}</div>
                            {alertSources.length>0 && <div style={{background:"#ef444420",border:"1px solid #ef4444",borderRadius:20,padding:"4px 12px",fontSize:12,color:"#ef4444",animation:"blink 1s infinite"}}>⚠️ {alertSources.length}</div>}

                    {/* Modal تأكيد الحذف */}
                    {confirmDelete && (

                                <div style={{fontSize:14,color:"#94a3b8",marginBottom:20}}>
                                    {confirmDelete.type==="reverse" ? "هيتم عكس العملية وإرجاع الأرقام كأن شيئاً لم يكن" : "هل متأكد من الحذف؟"}
                                </div>
                                <div style={{display:"flex",gap:10}}>
                                    <button onClick={()=>setConfirmDelete(null)} style={{flex:1,background:"#1e293b",border:"none",borderRadius:10,padding:12,color:"#94a3b8",cursor:"pointer",fontWeight:600}}>إلغاء</button>
                                    <button onClick={()=>{

                    {/* Image Viewer */}

                            <button onClick={()=>setViewImg(null)} style={{position:"absolute",top:20,left:20,background:"#fff2",border:"none",borderRadius:20,color:"#fff",padding:"6px 14px",cursor:"pointer",fontSize:14}}>✕</button>
                        </div>
                    )}

                    <div className="page-container" key={tab} style={{padding:"16px 16px 0"}}>

                        {tab==="dashboard" && (
                            <div>
                                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
                                    {[
                                        {label:"عمليات اليوم",value:todayTxns.length,icon:"📊",color:"#22d3ee"},

                                        {label:"الديون الباقية",value:formatNum(totalDebt)+" ج",icon:"💳",color:"#ef4444"},

                                {isAdmin && (
                                    <div style={{display:"flex",gap:10}}>
                                        <button onClick={resetDaily} style={{flex:1,background:"#1e293b",border:"1px solid #334155",borderRadius:12,padding:12,color:"#94a3b8",fontSize:13,fontWeight:600,cursor:"pointer"}}>تصفير يومي</button>
                                        <button onClick={()=>{if(window.confirm("هتتصفر كل الأرقام الشهرية واليومية. متأكد؟")) resetMonthly();}} style={{flex:1,background:"#ef444415",border:"1px solid #ef444440",borderRadius:12,padding:12,color:"#ef4444",fontSize:13,fontWeight:600,cursor:"pointer"}}>تصفير شهري</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* FINANCE */}
                        {tab==="finance" && (
                            <div>
                                <div style={{background:"linear-gradient(135deg,#0f1e3d,#0a1628)",border:"1px solid #3b82f640",borderRadius:16,padding:16,marginBottom:16,textAlign:"center"}}>
                                    <div style={{fontSize:13,color:"#94a3b8"}}>👑 رأس المال</div>
                                    <div style={{fontSize:28,fontWeight:900,color:"#3b82f6",margin:"8px 0"}}>{formatNum(capital)} ج</div>
                                    {isAdmin && <button onClick={()=>{setCapitalInput(capital.toString()); setModal("editCapital");}} style={{background:"#1e293b",border:"none",borderRadius:8,padding:"6px 14px",color:"#94a3b8",fontSize:12,cursor:"pointer"}}>✏️ تعديل</button>}
                                </div>

                                {/* ⭐ Tabs للمالية اليومية والشهرية */}
                                <div style={{display:"flex",gap:10,marginBottom:16}}>
                                    <button onClick={()=>setFinanceTab("daily")} style={{flex:1,background:financeTab==="daily"?"linear-gradient(135deg,#3b82f6,#2563eb)":"#1e293b",border:"none",borderRadius:12,padding:12,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>📅 يومي</button>
                                    <button onClick={()=>setFinanceTab("monthly")} style={{flex:1,background:financeTab==="monthly"?"linear-gradient(135deg,#3b82f6,#2563eb)":"#1e293b",border:"none",borderRadius:12,padding:12,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>📆 شهري</button>
                                </div>

                                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
                                    <div style={{background:"#10b9810a",border:"1px solid #10b98120",borderRadius:12,padding:12,textAlign:"center"}}>
                                        <div style={{fontSize:16,fontWeight:700,color:"#10b981"}}>{formatNum(monthIncome)} ج</div>
                                        <div style={{fontSize:10,color:"#475569"}}>المكاسب</div>
                                    </div>
                                    <div style={{background:"#ef44440a",border:"1px solid #ef444420",borderRadius:12,padding:12,textAlign:"center"}}>
                                        <div style={{fontSize:16,fontWeight:700,color:"#ef4444"}}>{formatNum(monthExpense)} ج</div>
                                        <div style={{fontSize:10,color:"#475569"}}>المصاريف</div>
                                    </div>
                                </div>

                                {isAdmin && (
                                    <button onClick={()=>setModal("addFinance")} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#2563eb)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:16}}>➕ عملية {financeTab === "daily" ? "يومية" : "شهرية"}</button>
                                )}

                                <div style={{fontSize:14,fontWeight:700,color:"#94a3b8",marginBottom:10}}>📜 السجل</div>
                                {currentLogs.length > 0 ? (
                                    currentLogs.map(log => (
                                        <div key={log.id} style={{background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:12,padding:12,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                            <div>
                                                <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{log.desc}</div>
                                                <div style={{fontSize:11,color:"#475569",marginTop:2}}>{formatDateOnly(log.date)}</div>
                                            </div>
                                            <div style={{display:"flex",alignItems:"center",gap:8}}>
                                                <span style={{fontSize:14,fontWeight:700,color: log.type === "income" ? "#10b981" : "#ef4444"}}>
                                                    {log.type === "income" ? `+ ${formatNum(log.amount)}` : `- ${formatNum(log.amount)}`}
                                                </span>
                                                {isAdmin && <button onClick={()=>deleteFinanceLog(log)} style={{background:"none",border:"none",color:"#475569",cursor:"pointer"}}>🗑️</button>}
                                            </div>
                                        </div>
                                    ))
                                ) : (
                                    <div style={{textAlign:"center",color:"#475569",padding:20}}>لا توجد عمليات</div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Bottom Nav */}
                    <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0a0f1e",borderTop:"1px solid #1e293b",display:"flex",padding:"8px 0",zIndex:100}}>
                        {displayTabs.map(item=>(
                            <button key={item.id} onClick={()=>setTab(item.id)} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"6px 0"}}>
                                <span style={{fontSize:20}}>{item.icon}</span>
                                <span style={{fontSize:11,color:tab===item.id?"#22d3ee":"#475569",fontWeight:tab===item.id?700:400}}>{item.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* MODAL: Add Transaction */}
                    {modal==="addTxn" && (
                        <Modal title="إضافة عملية جديدة" onClose={() => setModal(null)}>
                            {/* 1. حقل اللصق الذكي (Smart Paste) في بداية الفورم */}
                            <div style={{ marginBottom: 20, background: "#162545", padding: 15, borderRadius: 12, border: "1px dashed #1e3a5f" }}>
                                <label style={{ display: "block", fontSize: 13, color: "#22d3ee", marginBottom: 8, fontWeight: "bold" }}>
                                    📋 صندوق الرسائل الذكي (انسخ الرسالة هنا لتعبئة البيانات تلقائياً):
                                </label>
                                <div style={{ display: "flex", gap: 8 }}>
                                    <textarea
                                        value={smartPaste}
                                        onChange={(e) => setSmartPaste(e.target.value)}
                                        placeholder="ضع نص رسالة فودافون كاش أو إنستا باي هنا..."
                                        rows="2"
                                        style={{
                                            flex: 1,
                                            background: "#0a0f1e",
                                            border: "1px solid #1e3a5f",
                                            borderRadius: 10,
                                            padding: 10,
                                            color: "#e2e8f0",
                                            fontSize: 13,
                                            outline: "none",
                                            resize: "none",
                                            textAlign: "right",
                                            fontFamily: "'Tajawal', sans-serif"
                                        }}
                                    />
                                    <button
                                        onClick={handleSmartPaste}
                                        style={{
                                            background: "linear-gradient(135deg,#22d3ee,#0891b2)",
                                            border: "none",
                                            borderRadius: 10,
                                            padding: "0 15px",
                                            color: "#0a0f1e",
                                            fontSize: 14,
                                            fontWeight: "bold",
                                            cursor: "pointer"
                                        }}
                                    >
                                        تطبيق
                                    </button>
                                </div>
                            </div>

                            {/* 2. باقي حقول الفورم */}
                            <Field label="نوع العملية">
                                <select
                                    value={form.type}
                                    onChange={e => setForm({...form, type: e.target.value})}
                                    style={{ width: "100%", background: "#0f1e3d", border: "1px solid #1e3a5f", borderRadius: 10, padding: 11, color: "#e2e8f0" }}
                                >
                                    <option value="transfer">تحويل (سحب من المحفظة) ↙</option>
                                    <option value="receive">استلام (إيداع في المحفظة) ↗</option>
                                </select>
                            </Field>

                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                                <Field label="التاريخ"><Input type="date" value={form.date} onChange={v => setForm({...form, date: v})}/></Field>
                                <Field label="الوقت"><Input type="time" value={form.time} onChange={v => setForm({...form, time: v})}/></Field>
                            </div>

                            <Field label="المبلغ (ج)">
                                <input
                                    type="text"
                                    value={form.amount || ""}
                                    placeholder="0.00 (يمكنك كتابة حسبة مثل 1000+20)"
                                    onChange={(e) => setForm({...form, amount: e.target.value})}
                                    onBlur={(e) => {
                                        const val = e.target.value.trim();
                                        if (!val) return;
                                        const evaluated = evaluateExpression(val);
                                        const num = parseFloat(evaluated);
                                        if (!isNaN(num) && isFinite(num) && num > 0) {
                                            setForm({...form, amount: String(Math.round(num * 100) / 100)});
                                        }
                                    }}
                                    style={{
                                        width: "100%",
                                        background: "#0f1e3d",
                                        border: "1px solid #1e3a5f",
                                        borderRadius: 10,
                                        padding: "11px 14px",
                                        color: "#e2e8f0",
                                        fontSize: 14,
                                        outline: "none",
                                        boxSizing: "border-box",
                                        textAlign: "right"
                                    }}
                                />
                            </Field>

                            <Field label="اسم العميل">
                                <Input value={form.personName} onChange={v => setForm({...form, personName: v})} placeholder="اسم الشخص أو العميل"/>
                            </Field>

                            {form.type === "transfer" && (
                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                                    <Field label="من رقم المحفظة"><Input value={form.fromNumber} onChange={v => setForm({...form, fromNumber: v})} placeholder="01xxxxxxxxx"/></Field>
                                    <Field label="إلى رقم المحفظة"><Input value={form.toNumber} onChange={v => setForm({...form, toNumber: v})} placeholder="01xxxxxxxxx"/></Field>
                                </div>
                            )}

                            <Field label="اختر الخط أو الفيزا">
                                <select
                                    value={form.sourceId}
                                    onChange={e => {
                                        const sel = sources.find(s => s.id === e.target.value);
                                        setForm({...form, sourceId: e.target.value, sourceType: sel ? sel.type : "line"});
                                    }}
                                    style={{ width: "100%", background: "#0f1e3d", border: "1px solid #1e3a5f", borderRadius: 10, padding: 11, color: "#e2e8f0" }}
                                >
                                    <option value="">-- اختر خط العملية --</option>
                                    {sources.map(s => (
                                        <option key={s.id} value={s.id}>{s.name} (رصيده: {formatNum(s.balance || 0)} ج)</option>
                                    ))}
                                </select>
                            </Field>

                            <button
                                onClick={addTransaction}
                                style={{
                                    width: "100%",
                                    background: "linear-gradient(135deg,#e40000,#cc0000)",
                                    border: "none",
                                    borderRadius: 12,
                                    padding: 14,
                                    color: "#fff",
                                    fontSize: 15,
                                    fontWeight: 700,
                                    cursor: "pointer",
                                    marginTop: 10,
                                    boxShadow: "0 4px 15px #e4000030"
                                }}
                            >
                                ✓ حفظ العملية وتحديث الأرصدة
                            </button>
                        </Modal>
                    )}

                    {/* MODAL: Add Debt */}
                    {modal==="addDebt" && (
                        <Modal title="دين جديد" onClose={()=>setModal(null)}>
                            <Field label="اسم الشخص"><Input value={peopleForm.personName} onChange={v=>setPeopleForm(f=>({...f,personName:v}))} placeholder="محمود..."/></Field>
                            <Field label="مبلغ الدين"><Input value={peopleForm.debtAmount} onChange={v=>setPeopleForm(f=>({...f,debtAmount:v}))} placeholder="0" type="number"/></Field>
                            <Field label="الوصف/الملاحظة"><Input value={peopleForm.desc} onChange={v=>setPeopleForm(f=>({...f,desc:v}))} placeholder="ملاحظة..."/></Field>
                            <button onClick={addDebtToPerson} style={{width:"100%",background:"linear-gradient(135deg,#a78bfa,#9370db)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                        </Modal>
                    )}

                    {/* MODAL: Add Finance */}
                    {modal==="addFinance" && (
                        <Modal title={`عملية مالية ${financeTab === "daily" ? "يومية" : "شهرية"}`} onClose={()=>setModal(null)}>
                            <Field label="النوع">
                                <select value={financeForm.type} onChange={e=>setFinanceForm(f=>({...f, type: e.target.value}))}
                                    style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:10,padding:"11px 14px",color:"#e2e8f0",fontSize:14,outline:"none"}}>
                                    <option value="income">مكسب</option>
                                    <option value="expense">مصاريف</option>
                                </select>
                            </Field>
                            <Field label="المبلغ"><Input value={financeForm.amount} onChange={v=>setFinanceForm(f=>({...f, amount: v}))} placeholder="0" type="number"/></Field>
                            <Field label="الوصف"><Input value={financeForm.desc} onChange={v=>setFinanceForm(f=>({...f, desc: v}))} placeholder="..."/></Field>
                            <button onClick={addFinanceLog} style={{width:"100%",background: financeForm.type === "income" ? "linear-gradient(135deg,#10b981,#059669)" : "linear-gradient(135deg,#ef4444,#dc2626)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                        </Modal>
                    )}

                    {/* MODAL: Edit Capital */}
                    {modal==="editCapital" && (
                        <Modal title="تعديل رأس المال" onClose={()=>setModal(null)}>
                            <Field label="المبلغ"><Input value={capitalInput} onChange={setCapitalInput} placeholder="0" type="number"/></Field>
                            <button onClick={updateCapitalDirectly} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#2563eb)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                        </Modal>
                    )}

                    {/* MODAL: Edit Line */}
                    {modal==="editLine" && editLineId && (
                        <EditSourceModal
                            source={[...lines,...visas].find(s=>s.id===editLineId)}
                            isVisa={editLineId.startsWith("visa")}
                            onSave={updated=>{
                                if (editLineId.startsWith("visa")) setVisas(p=>p.map(v=>v.id===editLineId?{...v,...updated}:v));
                                else setLines(p=>p.map(l=>l.id===editLineId?{...l,...updated}:l));
                                setModal(null); showToast("تم التحديث ✓");
                            }}
                            onClose={()=>setModal(null)}
                        />
                    )}
                </div>
            );
        }

        function Modal({title, onClose, children}) {
            return (
                <div style={{position:"fixed",inset:0,background:"#000a",zIndex:200,display:"flex",alignItems:"flex-end"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
                    <div style={{background:"#0a1628",borderRadius:"20px 20px 0 0",border:"1px solid #1e3a5f",padding:20,width:"100%",maxHeight:"90vh",overflowY:"auto"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                            <div style={{fontSize:17,fontWeight:700,color:"#e2e8f0"}}>{title}</div>
                            <button onClick={onClose} style={{background:"#1e293b",border:"none",borderRadius:8,width:32,height:32,color:"#94a3b8",cursor:"pointer",fontSize:16}}>×</button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        }

        function Field({label, children}) {
            return <div style={{marginBottom:14}}><div style={{fontSize:12,color:"#64748b",marginBottom:6,fontWeight:600}}>{label}</div>{children}</div>;
        }

        function Input({value, onChange, placeholder, type="text"}) {
            return <input type={type} value={value} placeholder={placeholder} onChange={e=>onChange(e.target.value)} style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:10,padding:"11px 14px",color:"#e2e8f0",fontSize:14,outline:"none",boxSizing:"border-box",textAlign:"right"}}/>;
        }

        function EditSourceModal({source, isVisa, onSave, onClose}) {
            const [name, setName] = useState(source.name);
            const [number, setNumber] = useState(source.number||"");
            const [balance, setBalance] = useState(String(source.balance || 0));
            return (
                <Modal title="تعديل" onClose={onClose}>
                    <Field label="الاسم"><Input value={name} onChange={setName} placeholder="..."/></Field>
                    <Field label="الرقم"><Input value={number} onChange={setNumber} placeholder="01xxxxxxxxx"/></Field>
                    <Field label="الرصيد الحالي (ج)"><Input value={balance} onChange={setBalance} placeholder="0" type="number"/></Field>
                    <button onClick={()=>onSave({name,number,balance:parseFloat(balance)||0})} style={{width:"100%",background:"linear-gradient(135deg,#22d3ee,#0891b2)",border:"none",borderRadius:12,padding:14,color:"#0a0f1e",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                </Modal>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
