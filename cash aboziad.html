                                            <div style={{background: "#0f1e3d", borderRadius: 8, padding: "8px 4px"}}>
                                                <div style={{fontSize: 10, color: "#64748b", marginBottom: 4}}>المبلغ الأصلي</div>
                                                <div style={{fontSize: 15, fontWeight: 700, color: "#e2e8f0"}}>{(amt||0).toLocaleString('ar-EG')} ج</div>
                                            </div>
                                            <div style={{background: "#ef444410", borderRadius: 8, padding: "8px 4px"}}>
                                                <div style={{fontSize: 10, color: "#64748b", marginBottom: 4}}>العمولة</div>
                                                <div style={{fontSize: 15, fontWeight: 700, color: "#ef4444"}}>+ {commission.toLocaleString('ar-EG')} ج</div>
                                                <div style={{fontSize: 9, color: "#475569", marginTop: 2}}>{commDetail}</div>
                                            </div>
                                            <div style={{background: `${accent}15`, borderRadius: 8, padding: "8px 4px"}}>
                                                <div style={{fontSize: 10, color: accent, marginBottom: 4}}>⬇️ يُخصم من الرصيد</div>
                                                <div style={{fontSize: 16, fontWeight: 900, color: accent}}>{total.toLocaleString('ar-EG')} ج</div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })()}

                            <Field label="اسم العميل">
                                <Input value={form.personName} onChange={v => setForm({...form, personName: v})} placeholder="اسم الشخص أو العميل"/>
                            </Field>

                            {form.type === "transfer" && (
                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                                    <Field label="من رقم المحفظة"><Input value={form.fromNumber} onChange={v => setForm({...form, fromNumber: v})} placeholder="01xxxxxxxxx"/></Field>
                                    <Field label="إلى رقم المحفظة"><Input value={form.toNumber} onChange={v => setForm({...form, toNumber: v})} placeholder="01xxxxxxxxx"/></Field>
                                </div>
                            )}

                            {/* ⭐ التحويل الداخلي — اختر الخط المستقبِل */}
                            {form.type === "internal_transfer" && (
                                <Field label="🔄 الخط / الفيزا المستقبِل (وجهة التحويل)">
                                    <select
                                        value={form.toInternalId || ""}
                                        onChange={e => setForm({...form, toInternalId: e.target.value})}
                                        style={{
                                            width: "100%",
                                            background: "#0f1e3d",
                                            border: "1px solid #22d3ee60",
                                            borderRadius: 10,
                                            padding: 11,
                                            color: "#e2e8f0",
                                            boxShadow: "0 0 0 2px #22d3ee15"
                                        }}
                                    >
                                        <option value="">-- اختر الخط / الفيزا المستقبل --</option>
                                        <optgroup label="📱 الخطوط">
                                            {lines.filter(l => l.id !== form.sourceId).map(l => (
                                                <option key={l.id} value={l.id}>{l.name} (رصيده: {formatNum(l.balance || 0)} ج)</option>
                                            ))}
                                        </optgroup>
                                        <optgroup label="💳 فيزا فوري">
                                            {visas.filter(v => v.id !== form.sourceId).map(v => (
                                                <option key={v.id} value={v.id}>{v.name} (رصيده: {formatNum(v.balance || 0)} ج)</option>
                                            ))}
                                        </optgroup>
                                        {instaPays.length > 0 && (
                                            <optgroup label="⚡ إنستا باي">
                                                {instaPays.filter(ip => ip.id !== form.sourceId).map(ip => (
                                                    <option key={ip.id} value={ip.id}>{ip.name} (رصيده: {formatNum(ip.balance || 0)} ج)</option>
                                                ))}
                                            </optgroup>
                                        )}
                                    </select>
                                    {form.toInternalId && (() => {
                                        const dest = [...lines,...visas,...instaPays].find(s=>s.id===form.toInternalId);
                                        const src  = sources.find(s=>s.id===form.sourceId);
                                        const amt  = parseFloat(form.amount)||0;
                                        if (!dest || !src || !amt) return null;
                                        return (
                                            <div style={{marginTop:8,background:"#22d3ee10",border:"1px solid #22d3ee30",borderRadius:10,padding:"8px 12px",fontSize:12}}>
                                                <div style={{color:"#22d3ee",fontWeight:700,marginBottom:4}}>🔄 ملخص التحويل الداخلي</div>
                                                <div style={{display:"flex",justifyContent:"space-between"}}>
                                                    <span style={{color:"#7a8fa8"}}>من: <b style={{color:"#e2e8f0"}}>{src.name}</b></span>
                                                    <span style={{color:"#7a8fa8"}}>إلى: <b style={{color:"#e2e8f0"}}>{dest.name}</b></span>
                                                </div>
                                                <div style={{textAlign:"center",marginTop:4,color:"#10b981",fontWeight:700,fontSize:14}}>{formatNum(amt)} ج ← {formatNum((dest.balance||0)+amt)} ج</div>
                                            </div>
                                        );
                                    })()}
                                </Field>
                            )}

                            <Field label="اختر الخط أو الفيزا">
                                {/* ⭐ تنبيه: جميع الخطوط عند الحد */}
                                {autoRouting.allAtLimit && (
                                    <div style={{
                                        display: "flex", alignItems: "center", gap: 8,
                                        background: "#ef444415", border: "1px solid #ef444440",
                                        borderRadius: 10, padding: "8px 12px", marginBottom: 8,
                                        fontSize: 12, color: "#ef4444", fontWeight: 700
                                    }}>
                                        <span>⚠️</span>
                                        <span>تنبيه: جميع الخطوط تقترب من حدها الأقصى أو لا تمتلك رصيداً كافياً</span>
                                    </div>
                                )}
                                {/* ⭐ شارة الاقتراح الذكي */}
                                {autoRouting.suggestedId && !autoRouting.userOverrode && (
                                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
                                        <span className="smart-badge">
                                            <span className="smart-badge-dot"/>
                                            💡 مقترح ذكي — الأنسب للعملية
                                        </span>
                                        <span style={{ fontSize: 10, color: "#64748b" }}>يمكنك تغييره يدوياً</span>
                                    </div>
                                )}
                                {autoRouting.suggestedId && autoRouting.userOverrode && (
                                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
                                        <span style={{ fontSize: 10, background: "#3b82f620", border: "1px solid #3b82f640", borderRadius: 20, padding: "2px 10px", color: "#3b82f6", fontWeight: 700 }}>
                                            ✏️ اختيار يدوي
                                        </span>
                                        <button
                                            onClick={() => {
                                                setAutoRouting(prev => ({ ...prev, userOverrode: false }));
                                                const result = getSmartRoute(form.amount, form.type);
                                                if (result.suggestedId) {
                                                    const sel = sources.find(s => s.id === result.suggestedId);
                                                    setForm(f => ({ ...f, sourceId: result.suggestedId, sourceType: sel ? sel.type : "line" }));
                                                    setAutoRouting({ suggestedId: result.suggestedId, allAtLimit: false, userOverrode: false });
                                                }
                                            }}
                                            style={{ fontSize: 10, background: "none", border: "none", color: "#a78bfa", cursor: "pointer", textDecoration: "underline", padding: 0 }}
                                        >↩ استعادة الاقتراح الذكي</button>
                                    </div>
                                )}
                                <select
                                    value={form.sourceId}
                                    onChange={e => {
                                        const sel = sources.find(s => s.id === e.target.value);
                                        setForm({...form, sourceId: e.target.value, sourceType: sel ? sel.type : "line"});
                                        // المستخدم غيّر يدوياً → ضع علامة override
                                        if (e.target.value !== autoRouting.suggestedId) {
                                            setAutoRouting(prev => ({ ...prev, userOverrode: true }));
                                        } else {
                                            setAutoRouting(prev => ({ ...prev, userOverrode: false }));
                                        }
                                    }}
                                    style={{
                                        width: "100%",
                                        background: autoRouting.suggestedId && !autoRouting.userOverrode
                                            ? "linear-gradient(135deg,#1a0a3d,#0f1e3d)"
                                            : "#0f1e3d",
                                        border: autoRouting.suggestedId && !autoRouting.userOverrode
                                            ? "1px solid #a78bfa60"
                                            : "1px solid #1e3a5f",
                                        borderRadius: 10,
                                        padding: 11,
                                        color: "#e2e8f0",
                                        boxShadow: autoRouting.suggestedId && !autoRouting.userOverrode
                                            ? "0 0 0 2px #a78bfa20"
                                            : "none",
                                        transition: "all 0.3s ease"
                                    }}
                                >
                                    <option value="">-- اختر خط العملية --</option>
                                    <optgroup label="📱 الخطوط">
                                        {lines.map(s => (
                                            <option key={s.id} value={s.id}>
                                                {s.id === autoRouting.suggestedId ? "💡 " : ""}{s.name} (رصيده: {formatNum(s.balance || 0)} ج)
                                            </option>
                                        ))}
                                    </optgroup>
                                    <optgroup label="💳 فيزا فوري">
                                        {visas.map(s => (
                                            <option key={s.id} value={s.id}>
                                                {s.id === autoRouting.suggestedId ? "💡 " : ""}{s.name} (رصيده: {formatNum(s.balance || 0)} ج)
                                            </option>
                                        ))}
                                    </optgroup>
                                    {instaPays.length > 0 && (
                                        <optgroup label="⚡ إنستا باي">
                                            {instaPays.map(s => (
                                                <option key={s.id} value={s.id}>
                                                    {s.id === autoRouting.suggestedId ? "💡 " : ""}{s.name} (رصيده: {formatNum(s.balance || 0)} ج)
                                                </option>
                                            ))}
                                        </optgroup>
                                    )}
                                </select>
                            </Field>

                            {/* ⭐ Smart Line Suggestion — اقتراح ذكي بناءً على نوع العملية */}
                            {(form.type === "transfer" || form.type === "fawri_transfer" || form.type === "receive") && (() => {
                                const amt = parseFloat(form.amount) || 0;
                                const avail = sources.filter(s => s.available !== false && s.type === "line");
                                if (avail.length === 0) return null;

                                if (form.type === "transfer" || form.type === "fawri_transfer") {
                                    // ترتيب: أعلى رصيد كاش + أبعد عن الحد اليومي
                                    const ranked = [...avail]
                                        .filter(s => (s.balance || 0) > 0)
                                        .sort((a, b) => {
                                            const aScore = (a.balance || 0) - (a.usedToday || 0) * 0.5;
                                            const bScore = (b.balance || 0) - (b.usedToday || 0) * 0.5;
                                            return bScore - aScore;
                                        })
                                        .slice(0, 3);
                                    if (ranked.length === 0) return null;
                                    return (
                                        <div style={{background:"linear-gradient(135deg,#0a1a10,#0d1120)",border:"1px solid #10b98135",borderRadius:12,padding:12,marginBottom:14}}>
                                            <div style={{fontSize:12,fontWeight:700,color:"#10b981",marginBottom:8}}>
                                                💡 أنسب الخطوط للسحب — ترتيب بالرصيد الكاش
                                            </div>
                                            {ranked.map((s, i) => {
                                                const dailyPct = s.dailyLimit > 0 ? Math.round((s.usedToday||0)/s.dailyLimit*100) : 0;
                                                const enoughBalance = (s.balance||0) >= amt && amt > 0;
                                                return (
                                                    <div key={s.id}
                                                        onClick={()=>setForm(f=>({...f,sourceId:s.id,sourceType:"line"}))}
                                                        style={{
                                                            display:"flex",alignItems:"center",gap:8,
                                                            background: form.sourceId===s.id ? "#10b98120" : "rgba(255,255,255,0.02)",
                                                            border:`1px solid ${form.sourceId===s.id?"#10b98150":"#1e3a5f"}`,
                                                            borderRadius:8,padding:"7px 10px",marginBottom:5,
                                                            cursor:"pointer",transition:"all 0.15s"
                                                        }}>
                                                        <div style={{width:20,height:20,borderRadius:"50%",background:i===0?"#10b981":"#1e3a5f",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,color:"#fff",flexShrink:0}}>{i+1}</div>
                                                        <div style={{flex:1}}>
                                                            <div style={{fontSize:12,fontWeight:700,color:"#c8d6e8"}}>{s.name}</div>
                                                            <div style={{fontSize:10,color:"#475569"}}>
                                                                اليومي: {dailyPct}% • {enoughBalance && amt>0 ? <span style={{color:"#10b981"}}>رصيد كافٍ ✓</span> : <span style={{color:"#64748b"}}>رصيد: {formatNum(s.balance||0)} ج</span>}
                                                            </div>
                                                        </div>
                                                        <div style={{fontSize:13,fontWeight:900,color:"#10b981"}}>{formatNum(s.balance||0)} ج</div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                } else {
                                    // receive — ترتيب بـ usedMonthReceive تصاعدياً (أقل استهلاكاً = أفضل)
                                    const ranked = [...avail]
                                        .sort((a, b) => {
                                            const aUsed = a.usedMonthReceive || 0;
                                            const bUsed = b.usedMonthReceive || 0;
                                            return aUsed - bUsed; // الأقل استهلاكاً أولاً
                                        })
                                        .slice(0, 3);
                                    return (
                                        <div style={{background:"linear-gradient(135deg,#0a1020,#0d1120)",border:"1px solid #22d3ee35",borderRadius:12,padding:12,marginBottom:14}}>
                                            <div style={{fontSize:12,fontWeight:700,color:"#22d3ee",marginBottom:8}}>
                                                💡 أنسب الخطوط للاستلام — الأقل استهلاكاً للحد الشهري
                                            </div>
                                            {ranked.map((s, i) => {
                                                const limit = s.monthlyLimit || 200000;
                                                const used = s.usedMonthReceive || 0;
                                                const left = limit - used;
                                                const pct = Math.round(used / limit * 100);
                                                const willExceed = amt > 0 && (used + amt) > limit;
                                                return (
                                                    <div key={s.id}
                                                        onClick={()=>setForm(f=>({...f,sourceId:s.id,sourceType:"line"}))}
                                                        style={{
                                                            display:"flex",alignItems:"center",gap:8,
                                                            background: form.sourceId===s.id ? "#22d3ee15" : "rgba(255,255,255,0.02)",
                                                            border:`1px solid ${form.sourceId===s.id?"#22d3ee50":willExceed?"#ef444430":"#1e3a5f"}`,
                                                            borderRadius:8,padding:"7px 10px",marginBottom:5,
                                                            cursor:"pointer",transition:"all 0.15s",
                                                            opacity: willExceed ? 0.65 : 1
                                                        }}>
                                                        <div style={{width:20,height:20,borderRadius:"50%",background:i===0?"#22d3ee":"#1e3a5f",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,color:"#0a0c16",flexShrink:0}}>{i+1}</div>
                                                        <div style={{flex:1}}>
                                                            <div style={{fontSize:12,fontWeight:700,color:"#c8d6e8"}}>{s.name}</div>
                                                            <div style={{fontSize:10,color:"#475569",marginTop:1}}>
                                                                استُهلك: {formatNum(used)} ج ({pct}%) •{" "}
                                                                <span style={{color: left < 20000 ? "#ef4444" : left < 50000 ? "#f59e0b" : "#10b981", fontWeight:700}}>
                                                                    متبقي: {formatNum(left)} ج
                                                                </span>
                                                            </div>
                                                            {willExceed && <div style={{fontSize:9,color:"#ef4444",marginTop:1}}>⚠️ المبلغ يتجاوز المتبقي</div>}
                                                        </div>
                                                        <div style={{textAlign:"left"}}>
                                                            <div style={{fontSize:11,color: pct>=80?"#ef4444":pct>=60?"#f59e0b":"#10b981",fontWeight:900}}>{pct}%</div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                }
                            })()}

                            {/* ⭐ تحويل إلى فوري — معلومات إضافية */}

        function AbuAdiScreen({
            target, setTarget, targetInput, setTargetInput,
            amountInput, setAmountInput, payments, setPayments,
            editModal, setEditModal,
            mediaRecorderRef, audioChunksRef,
            recordingId, setRecordingId, recordingState, setRecordingState,
            pendingAudio, setPendingAudio,
            showToast, formatNum,
            abuadiDate, setAbuadiDate,
            history, setHistory,
            db, auth, firebaseReady,
            saveToLocalStorage,
            canEdit = false,
            isAdmin = false,
            setActiveAbuAdiReceipt = null
        }) {
            // ── حسابات اليوم الحالي ──────────────────────────────────
            const todayStr = new Date().toISOString().slice(0, 10);
            const todayPayments = [...payments]
                .filter(p => new Date(p.ts).toISOString().slice(0, 10) === todayStr)
                .sort((a, b) => b.ts - a.ts);
            const totalPaid = todayPayments.reduce((s, p) => s + p.amount, 0);
            const remaining = Math.max(0, target - totalPaid);
            const pct = target > 0 ? Math.min(100, (totalPaid / target) * 100) : 0;
            const settled = target > 0 && totalPaid >= target;

            // ── عرض السجل التاريخي ───────────────────────────────────
            const [showHistory, setShowHistory] = useState(false);
            const [historyDetailDate, setHistoryDetailDate] = useState(null); // dateStr لعرض التفاصيل
            const [dayNote, setDayNote] = useState(""); // ملاحظات اليوم قبل الأرشفة
            const [historyFilter, setHistoryFilter] = useState(""); // فلتر التاريخ YYYY-MM-DD

            function nowMsStr() {
                const d = new Date();
                const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
                const dd = String(d.getDate()).padStart(2,"0");
                const mm = String(d.getMonth()+1).padStart(2,"0");
                const yy = d.getFullYear();
                const hh = String(d.getHours()).padStart(2,"0");
                const min = String(d.getMinutes()).padStart(2,"0");
                const ss = String(d.getSeconds()).padStart(2,"0");
                return `${days[d.getDay()]} ${dd}/${mm}/${yy} — ${hh}:${min}:${ss}`;
            }

            // ── دالة الأرشفة اليومية (تحفظ اليوم في السجل التاريخي) ──
            function archiveToday(onDone, noteOverride) {
                if (totalPaid === 0 && target === 0) {
                    showToast("لا توجد بيانات لأرشفتها اليوم", "error");
                    return;
                }
                // لا نؤرشف اليوم لو موجود بالفعل في السجل بنفس التاريخ
                const alreadyExists = (history || []).find(h => h.dateStr === todayStr);
                const record = {
                    dateStr: todayStr,
                    target,
                    totalPaid,
                    remaining: Math.max(0, target - totalPaid),
                    settled: target > 0 && totalPaid >= target,
                    paymentsCount: todayPayments.length,
                    note: (noteOverride !== undefined ? noteOverride : dayNote).trim(),
                    // نحفظ الدفعات بدون الـ audio لتوفير المساحة
                    payments: todayPayments.map(p => ({ id: p.id, amount: p.amount, label: p.label, ts: p.ts })),
                    archivedAt: new Date().toISOString(),
                };

                let newHistory;
                if (alreadyExists) {
                    // تحديث السجل الموجود
                    newHistory = (history || []).map(h => h.dateStr === todayStr ? record : h);
                } else {
                    newHistory = [record, ...(history || [])];
                }
                newHistory.sort((a, b) => b.dateStr.localeCompare(a.dateStr));

                setHistory(newHistory);
                saveToLocalStorage('abuadiHistory', newHistory);

                // حفظ في Firebase تحت abuAdi_history/{dateStr}
                if (auth && auth.currentUser && db && firebaseReady) {
                    try {
                        db.ref(`abuAdi_history/${todayStr}`).set(record)
                            .then(() => { if (onDone) onDone(record); })
                            .catch(() => { if (onDone) onDone(record); });
                    } catch(e) { if (onDone) onDone(record); }
                } else {
                    if (onDone) onDone(record);
                }
            }

            // ── إنهاء اليوم: أرشفة ثم تصفير ─────────────────────────
            function closeDay() {
                if (!window.confirm(`هيتم أرشفة يوم ${todayStr} (هدف: ${formatNum(target)} ج | تم: ${formatNum(totalPaid)} ج) ثم تصفير اليوم. متأكد؟`)) return;
                const noteToSave = dayNote.trim();
                archiveToday(() => {
                    // تصفير دفعات اليوم فقط — الدفعات السابقة (لو موجودة) تفضل
                    setPayments(prev => prev.filter(p => new Date(p.ts).toISOString().slice(0, 10) !== todayStr));
                    setTarget(0);
                    setTargetInput("");
                    setDayNote("");
                    if (setAbuadiDate) setAbuadiDate(todayStr);
                    showToast(`✅ تم أرشفة يوم ${todayStr} وتصفير الحساب`);
                }, noteToSave);
            }

            // ── تصفير اليوم بدون أرشفة (طلب صريح من الأدمن) ─────────
            function clearTodayNoArchive() {
                if (!window.confirm("هيتم مسح دفعات اليوم والمستهدف بدون أرشفة. متأكد؟")) return;
                setPayments(prev => prev.filter(p => new Date(p.ts).toISOString().slice(0, 10) !== todayStr));
                setTarget(0);
                setTargetInput("");
                showToast("تم التصفير بدون أرشفة");
            }

            // ── حذف يوم من السجل التاريخي (أدمن فقط) ───────────────
            function deleteHistoryDay(dateStrToDelete) {
                if (!window.confirm(`هيتم حذف سجل يوم ${dateStrToDelete} نهائياً من الأرشيف. متأكد؟`)) return;
                const newHistory = (history || []).filter(h => h.dateStr !== dateStrToDelete);
                setHistory(newHistory);
                saveToLocalStorage('abuadiHistory', newHistory);
                if (auth && auth.currentUser && db && firebaseReady) {
                    try { db.ref(`abuAdi_history/${dateStrToDelete}`).remove(); } catch(e){}
                }
                if (historyDetailDate === dateStrToDelete) setHistoryDetailDate(null);
                showToast(`تم حذف سجل يوم ${dateStrToDelete} ✓`);
            }

            function startRecording() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast("المتصفح لا يدعم التسجيل الصوتي","error"); return;
                }
                navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
                    audioChunksRef.current = [];
                    const recorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = recorder;
                    recorder.ondataavailable = e => { if(e.data.size>0) audioChunksRef.current.push(e.data); };
                    recorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, {type:"audio/webm"});
                        const reader = new FileReader();
                        reader.onload = ev => {
                            setPendingAudio(ev.target.result);
                            setRecordingState("done");
                            stream.getTracks().forEach(t=>t.stop());
                        };
                        reader.readAsDataURL(blob);
                    };
                    recorder.start();
                    setRecordingState("recording");
                    showToast("🔴 جاري التسجيل...");
                }).catch(() => { showToast("لم يتم السماح بالمايك","error"); });
            }

            function stopRecording() {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
                    mediaRecorderRef.current.stop();
                }
            }

            function cancelRecording() {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
                    mediaRecorderRef.current.stop();
                }
                setRecordingState("idle");
                setPendingAudio(null);
                audioChunksRef.current = [];
            }

            function addPayment() {
                const amt = parseFloat(amountInput);
                if (!amt || amt <= 0) { showToast("أدخل مبلغ صحيح","error"); return; }
                if (navigator.vibrate) navigator.vibrate(15);
                const newP = {
                    id: Date.now(),
                    amount: amt,
                    ts: Date.now(),
                    label: nowMsStr(),
                    audio: pendingAudio || null,
                };
                const updatedPayments = [newP, ...payments];
                setPayments(updatedPayments);
                // ✅ كتابة مباشرة على Firebase فوراً

                    try {
                        abuAdiWriting.current = true;
                        db.ref('abuAdi').set({ target, payments: updatedPayments, date: abuadiDate })
                            .finally(() => { setTimeout(() => { abuAdiWriting.current = false; }, 1500); });
                    } catch(e) { abuAdiWriting.current = false; }
                }
                setAmountInput("");
                setPendingAudio(null);
                setRecordingState("idle");

                                    {settled && (

                        {/* ── ملاحظات اليوم + أزرار إنهاء اليوم (أدمن فقط) ── */}

                                ✓ تسجيل الدفعة

                        {/* TODAY'S PAYMENTS TABLE */}

        // ══════════════════════════════════════════════════════════════════

        const BACKUP_VERSION = "hawker_v2";

        // AES-256 encryption using SubtleCrypto (Web Crypto API — يشتغل على المتصفح والموبايل)
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false, ["encrypt", "decrypt"]
            );
        }

        async function aesEncrypt(data, password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv   = crypto.getRandomValues(new Uint8Array(12));
            const key  = await deriveKey(password, salt);
            const enc  = new TextEncoder();
            const ct   = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(data));
            // دمج salt + iv + ciphertext في base64 واحدة
            const combined = new Uint8Array(salt.length + iv.length + ct.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(ct), salt.length + iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function aesDecrypt(b64, password) {
            const bytes    = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
            const salt     = bytes.slice(0, 16);
            const iv       = bytes.slice(16, 28);
            const ct       = bytes.slice(28);
            const key      = await deriveKey(password, salt);
            const dec      = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
            return new TextDecoder().decode(dec);
        }

        // ── خانة إدخال الحد اليومي لفودافون — بارزة ومباشرة دائماً ────
        function VodDailyLimitEditor({ value, onSave }) {
            const [draft, setDraft] = React.useState(String(value));
            const [saved, setSaved] = React.useState(false);

            React.useEffect(() => { setDraft(String(value)); }, [value]);

            const QUICK = [30000, 40000, 50000, 60000, 70000, 80000];

            const commit = () => {
                const v = parseFloat(String(draft).replace(/[^0-9.]/g, ""));
                if (!v || v <= 0) { setDraft(String(value)); return; }
                onSave(Math.round(v));
                setSaved(true);
                setTimeout(() => setSaved(false), 2000);
            };

            return (
                <div>
                    {/* خانة الإدخال المباشرة */}
                    <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                        <input
                            type="number"
                            value={draft}
                            onChange={e => { setDraft(e.target.value); setSaved(false); }}
                            onKeyPress={e => { if(e.key === "Enter") commit(); }}
                            placeholder="مثال: 60000"
                            style={{
                                flex:1, background:"#0a0f1e", border:"2px solid #22d3ee50",
                                borderRadius:10, padding:"13px 16px", color:"#e2e8f0",
                                fontSize:17, fontWeight:700, outline:"none",
                                textAlign:"right", fontFamily:"'Tajawal',sans-serif",
                                boxSizing:"border-box"
                            }}
                        />
                        <button onClick={commit} style={{
                            background: saved ? "linear-gradient(135deg,#10b981,#059669)" : "linear-gradient(135deg,#22d3ee,#0891b2)",
                            border:"none", borderRadius:10, padding:"13px 20px",
                            color:"#0a0c16", fontWeight:900, fontSize:15,
                            cursor:"pointer", fontFamily:"'Tajawal',sans-serif",
                            flexShrink:0, minWidth:80, transition:"all 0.2s"
                        }}>
                            {saved ? "✅ تم" : "💾 حفظ"}
                        </button>
                    </div>
                    {/* أزرار اختيار سريع */}
                    <div style={{ marginBottom:4 }}>
                        <div style={{ fontSize:10, color:"#3d4f65", marginBottom:6, fontWeight:600 }}>⚡ اختيار سريع:</div>
                        <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                            {QUICK.map(q => (
                                <button key={q} onClick={() => { setDraft(String(q)); onSave(q); setSaved(true); setTimeout(()=>setSaved(false),2000); }}
                                    style={{
                                        background: value === q ? "linear-gradient(135deg,#22d3ee,#0891b2)" : "#0a0f1e",
                                        border: `1px solid ${value === q ? "#22d3ee" : "#1e3a5f"}`,
                                        borderRadius:8, padding:"6px 14px",
                                        color: value === q ? "#0a0c16" : "#94a3b8",
                                        fontSize:12, fontWeight: value === q ? 700 : 400,
                                        cursor:"pointer", fontFamily:"'Tajawal',sans-serif",
                                        transition:"all 0.15s"
                                    }}>
                                    {(q/1000).toFixed(0)}k
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

            const commit = () => {
                const v = parseFloat(draft.replace(/[^0-9.]/g, ""));

                            {isAdmin && (
                                <button onClick={()=>{setDraft(String(value));setEditing(true);}}
                                    style={{background:"none",border:`1px solid ${color}30`,borderRadius:7,padding:"4px 10px",color,fontSize:11,cursor:"pointer",fontFamily:"'Tajawal',sans-serif"}}>
                                    ✏️ تعديل
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function BackupRestoreScreen({
            lines, visas, instaPays, transactions, people,
            capital, financeLogs, abuadiTarget, abuadiPayments, abuadiDate, abuadiHistory,
            setLines, setVisas, setInstaPays, setTransactions, setPeople,
            setCapital, setFinanceLogs, setAbuadiTarget, setAbuadiPayments, setAbuadiDate, setAbuadiHistory,
            db, auth, firebaseReady, isAdmin, showToast, saveToLocalStorage,
            vodDailyLimit,    setVodDailyLimit,
            linesMonthlyLimit,  setLinesMonthlyLimit,
            visaDailyLimit,     setVisaDailyLimit,
            visaMonthlyLimit,   setVisaMonthlyLimit,
            instapayDailyLimit, setInstapayDailyLimit,
            instapayMonthlyLimit, setInstapayMonthlyLimit,
            commissionSettings, setCommissionSettings,
            formatNum
        }) {
            // aliases محلية للقراءة السريعة داخل BackupRestoreScreen
            const fawriWithdrawRate  = commissionSettings?.fawriWithdrawRate  ?? 0.0057;
            const fawriWithdrawFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
            const bankWithdrawRate   = commissionSettings?.bankWithdrawRate   ?? 0.002;
            const [status, setStatus] = useState({ msg: "", type: "" });
            const [loading, setLoading] = useState(false);
            const [confirmModal, setConfirmModal] = useState(null);
            const [encModal, setEncModal] = useState(null);
            const [pwInput, setPwInput] = useState("");
            const [showPw, setShowPw] = useState(false);

            // ⭐ Light Mode Toggle — يحفظ في localStorage
            const [isLight, setIsLight] = useState(() => document.documentElement.getAttribute("data-theme") === "light");
            function toggleTheme() {
                const next = !isLight;
                setIsLight(next);
                if (next) {
                    document.documentElement.setAttribute("data-theme", "light");
                    try { localStorage.setItem("hawker_theme", "light"); } catch(e) {}
                } else {
                    document.documentElement.removeAttribute("data-theme");
                    try { localStorage.setItem("hawker_theme", "dark"); } catch(e) {}
                }
            }
            const restoreFileRef = React.useRef();
            const encFileRef = React.useRef();

            const lastBackup = (() => {
                try { return localStorage.getItem("lastBackupTime") || null; } catch(e) { return null; }
            })();

            function buildBackupObject() {
                return {
                    _meta: {
                        version: BACKUP_VERSION,
                        createdAt: new Date().toISOString(),
                        appName: "Hawker - فودافون كاش",
                    },
                    lines,
                    visas,
                    instaPays,
                    transactions,
                    people,
                    capital,
                    financeLogs,
                    abuAdi: { target: abuadiTarget, payments: abuadiPayments, date: abuadiDate },
                    abuAdiHistory: abuadiHistory || [],
                    settings: {
                        lastResetDay: (() => { try { return localStorage.getItem("lastResetDay"); } catch(e){ return null; } })(),
                        warnedSources: (() => { try { return JSON.parse(localStorage.getItem("warnedSources") || "[]"); } catch(e){ return []; } })(),
                    }
                };
            }

            function validateBackup(obj) {
                if (!obj || typeof obj !== "object") return "الملف غير صالح — ليس JSON صحيح";
                if (!obj._meta || obj._meta.appName !== "Hawker - فودافون كاش") return "هذا الملف ليس نسخة احتياطية لتطبيق الحوكر";
                if (!Array.isArray(obj.lines)) return "بيانات الخطوط مفقودة أو تالفة";
                if (!Array.isArray(obj.visas)) return "بيانات الفيزا مفقودة أو تالفة";
                if (!Array.isArray(obj.transactions)) return "بيانات المعاملات مفقودة أو تالفة";
                if (!Array.isArray(obj.people)) return "بيانات العملاء مفقودة أو تالفة";
                if (!Array.isArray(obj.financeLogs)) return "السجلات المالية مفقودة أو تالفة";
                if (typeof obj.capital !== "number") return "بيانات رأس المال غير صالحة";
                return null; // كل شيء تمام
            }

            function downloadFile(content, filename, type) {
                const blob = new Blob([content], { type });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = filename; a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            function getNowStamp() {
                const d = new Date();
                const pad = n => String(n).padStart(2,"0");
                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}`;
            }

            function handleExportPlain() {
                try {
                    const obj = buildBackupObject();
                    const json = JSON.stringify(obj, null, 2);
                    const fname = `Backup_${getNowStamp()}.json`;
                    downloadFile(json, fname, "application/json");
                    try { localStorage.setItem("lastBackupTime", new Date().toLocaleString("ar-EG")); } catch(e){}
                    showToast(`✅ تم إنشاء النسخة: ${fname}`);
                    setStatus({ msg: `✅ تم تحميل: ${fname}`, type: "success" });
                } catch(err) {
                    setStatus({ msg: `❌ فشل الإنشاء: ${err.message}`, type: "error" });
                }
            }

            function handleImportFile(file) {
                if (!file) return;
                setLoading(true);
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const obj = JSON.parse(ev.target.result);
                        const err = validateBackup(obj);
                        if (err) {
                            setStatus({ msg: `❌ ${err}`, type: "error" });
                            setLoading(false);
                            return;
                        }
                        setConfirmModal({ type: "restore", data: obj, filename: file.name });
                    } catch(e) {
                        setStatus({ msg: "❌ الملف تالف أو ليس JSON صحيح", type: "error" });
                    }
                    setLoading(false);
                };
                reader.onerror = () => {
                    setStatus({ msg: "❌ فشل قراءة الملف", type: "error" });
                    setLoading(false);
                };
                reader.readAsText(file);
                restoreFileRef.current.value = "";
            }

            async function handleEncryptedExport() {
                const pw = pwInput.trim();
                if (!pw || pw.length < 4) {
                    setStatus({ msg: "❌ كلمة المرور يجب أن تكون 4 أحرف على الأقل", type: "error" });
                    return;
                }
                setLoading(true);
                try {
                    const obj = buildBackupObject();
                    const json = JSON.stringify(obj);
                    const encrypted = await aesEncrypt(json, pw);
                    const fname = `Backup_Encrypted_${getNowStamp()}.hbk`;
                    downloadFile(encrypted, fname, "application/octet-stream");
                    try { localStorage.setItem("lastBackupTime", new Date().toLocaleString("ar-EG")); } catch(e){}
                    showToast(`🔒 تم تصدير نسخة مشفرة: ${fname}`);
                    setStatus({ msg: `🔒 تم التصدير المشفر: ${fname}`, type: "success" });
                    setPwInput("");
                    setEncModal(null);
                } catch(err) {
                    setStatus({ msg: `❌ فشل التشفير: ${err.message}`, type: "error" });
                }
                setLoading(false);
            }

            async function handleEncryptedImport(file) {
                if (!file) return;
                const pw = pwInput.trim();
                if (!pw) {
                    setStatus({ msg: "❌ أدخل كلمة المرور أولاً", type: "error" });
                    return;
                }
                setLoading(true);
                try {
                    const b64 = await new Promise((res, rej) => {
                        const r = new FileReader();
                        r.onload = (e) => res(e.target.result.trim());
                        r.onerror = () => rej(new Error("فشل القراءة"));
                        r.readAsText(file);
                    });
                    const json = await aesDecrypt(b64, pw);
                    const obj = JSON.parse(json);
                    const err = validateBackup(obj);
                    if (err) {
                        setStatus({ msg: `❌ ${err}`, type: "error" });
                        setLoading(false);
                        return;
                    }
                    setConfirmModal({ type: "restore", data: obj, filename: file.name });
                    setPwInput("");
                    setEncModal(null);
                } catch(err) {
                    setStatus({ msg: "❌ فشل فك التشفير — كلمة المرور خاطئة أو الملف تالف", type: "error" });
                }
                setLoading(false);
                if (encFileRef.current) encFileRef.current.value = "";
            }

            async function applyRestore(obj) {
                setLoading(true);
                try {
                    // 1. تحديث React State
                    setLines(obj.lines || []);
                    setVisas(obj.visas || []);
                    setInstaPays(obj.instaPays || []);
                    setTransactions(obj.transactions || []);
                    setPeople(obj.people || []);
                    setCapital(typeof obj.capital === "number" ? obj.capital : 0);
                    setFinanceLogs(obj.financeLogs || []);
                    if (obj.abuAdi) {
                        setAbuadiTarget(obj.abuAdi.target || 0);
                        setAbuadiPayments(obj.abuAdi.payments || []);
                        setAbuadiDate(obj.abuAdi.date || "");
                    }
                    if (Array.isArray(obj.abuAdiHistory)) {
                        setAbuadiHistory(obj.abuAdiHistory);
                    }

                    // 2. تحديث localStorage
                    const keys = ["lines","visas","instaPays","transactions","people","capital","financeLogs"];
                    keys.forEach(k => { if (obj[k] !== undefined) saveToLocalStorage(k, obj[k]); });
                    if (obj.abuAdi) {
                        saveToLocalStorage("abuadiTarget", obj.abuAdi.target || 0);
                        saveToLocalStorage("abuadiPayments", obj.abuAdi.payments || []);
                        saveToLocalStorage("abuadiDate", obj.abuAdi.date || "");
                    }
                    if (Array.isArray(obj.abuAdiHistory)) {
                        saveToLocalStorage("abuadiHistory", obj.abuAdiHistory);
                    }
                    if (obj.settings) {
                        try {
                            if (obj.settings.lastResetDay) localStorage.setItem("lastResetDay", obj.settings.lastResetDay);
                            if (obj.settings.warnedSources) localStorage.setItem("warnedSources", JSON.stringify(obj.settings.warnedSources));
                        } catch(e){}
                    }

                    // 3. تحديث Firebase
                    if (auth.currentUser && firebaseReady) {
                        const historyWrites = (obj.abuAdiHistory || []).map(day =>
                            db.ref(`abuAdi_history/${day.dateStr}`).set(day)
                        );
                        await Promise.allSettled([
                            db.ref("lines").set(obj.lines || []),
                            db.ref("visas").set(obj.visas || []),
                            db.ref("instaPays").set(obj.instaPays || []),
                            db.ref("transactions").set(obj.transactions || []),
                            db.ref("financeLogs").set(obj.financeLogs || []),
                            db.ref("capital").set(typeof obj.capital === "number" ? obj.capital : 0),
                            db.ref("abuAdi").set(obj.abuAdi || {}),
                            ...historyWrites,
                            ...((obj.people || []).map(p => db.ref("customers").child(String(p.id)).set(p)))
                        ]);
                    }

                    setStatus({ msg: `✅ تمت الاستعادة بنجاح — ${new Date().toLocaleString("ar-EG")}`, type: "success" });
                    showToast("✅ تمت استعادة البيانات بالكامل!");
                } catch(err) {
                    setStatus({ msg: `❌ فشل الاستعادة: ${err.message}`, type: "error" });
                    showToast("❌ فشل الاستعادة", "error");
                }
                setLoading(false);
                setConfirmModal(null);
            }

            const inputStyle = {
                width: "100%", background: "#0a0e1a", border: "1px solid #1e3a5f",
                borderRadius: 10, padding: "11px 14px", color: "#c8d6e8",
                fontSize: 14, outline: "none", boxSizing: "border-box",
                textAlign: "right", fontFamily: "'Tajawal', sans-serif"
            };

            return (
                <div style={{ paddingBottom: 24 }}>
                    {/* Header */}
                    <div style={{
                        background: "linear-gradient(135deg,#05090e,#0d1120)",
                        border: "1px solid #22d3ee25",
                        borderRadius: 18, padding: 20, marginBottom: 16,
                        textAlign: "center", position: "relative", overflow: "hidden"
                    }}>
                        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 0%,#22d3ee08,transparent 70%)",pointerEvents:"none"}}/>
                        <div style={{ fontSize: 36, marginBottom: 6 }}>⚙️</div>
                        <div style={{ fontSize: 20, fontWeight: 900, color: "#22d3ee" }}>إعدادات النسخ الاحتياطي</div>
                        <div style={{ fontSize: 12, color: "#3d4f65", marginTop: 4 }}>Backup & Restore System v2</div>
                        {lastBackup && (
                            <div style={{ marginTop: 10, display: "inline-flex", alignItems: "center", gap: 6, background: "#10b98115", border: "1px solid #10b98130", borderRadius: 20, padding: "4px 14px", fontSize: 11, color: "#10b981" }}>
                                <div style={{ width: 6, height: 6, borderRadius: 99, background: "#10b981" }}/>
                                آخر نسخة: {lastBackup}
                            </div>
                        )}
                    </div>

                    {/* ⭐ Light Mode Toggle */}
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg-card)",border:"1px solid var(--border-dim)",borderRadius:14,padding:"14px 18px",marginBottom:14}}>
                        <div>
                            <div style={{fontSize:14,fontWeight:700,color:"var(--text-bright)"}}>
                                {isLight ? "☀️ الوضع المضيء" : "🌙 الوضع المظلم"}
                            </div>
                            <div style={{fontSize:11,color:"var(--text-mid)",marginTop:2}}>
                                {isLight ? "اضغط للتبديل للوضع الداكن" : "اضغط للتبديل للوضع المضيء"}
                            </div>
                        </div>
                        <button
                            onClick={toggleTheme}
                            aria-label={isLight ? "تفعيل الوضع الداكن" : "تفعيل الوضع المضيء"}
                            style={{
                                width:52, height:28, borderRadius:99,
                                background: isLight ? "linear-gradient(135deg,#f59e0b,#eab308)" : "#1e3a5f",
                                border:"none", cursor:"pointer", position:"relative",
                                transition:"background 0.3s ease"
                            }}>
                            <div style={{
                                position:"absolute", top:4, left: isLight ? 28 : 4,
                                width:20, height:20, borderRadius:99,
                                background:"#fff",
                                transition:"left 0.3s ease",
                                boxShadow:"0 2px 6px rgba(0,0,0,0.3)"

                    </div>

                    {status.msg && (

                            {status.msg}

                    {/* ─── قسم 0: الحد اليومي لخطوط فودافون — الأهم والأكثر تغيراً ─── */}

                            </div>

                                                    style={{ flex: 1, background: "#0a0e1a", border: "1px solid #a78bfa40", borderRadius: 8, padding: "8px 10px", color: "#a78bfa", fontSize: 14, textAlign: "center", outline: "none", fontFamily: "'Tajawal',sans-serif" }}

                try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : []; } catch(e) { return []; }
            });
            const [input, setInput] = useState("");
            const [thinking, setThinking] = useState(false);
            const bottomRef = useRef(null);

                bottomRef.current?.scrollIntoView({ behavior: "smooth" });

            function persist(msgs) {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs.slice(-80))); } catch(e) {}
                try { firebase.database().ref("ai_chat_log").set(msgs.slice(-80)); } catch(e) {}
            }

            // ── بناء الـ System Prompt مع بيانات التطبيق ──────────────
            function buildSystemPrompt() {
                const todayStr  = today();
                const monthStr  = currentMonthStr();
                const todayTxns = transactions.filter(t => t.date === todayStr);
                const last15    = [...transactions].slice(-15).reverse();

                // ملخص الخطوط
                const linesSummary = lines.map(l => {
                    const s = sources.find(x => x.id === l.id) || l;
                    return `• ${l.name}: رصيد=${formatNum(l.balance||0)}ج | يومي=${formatNum(s.usedToday||0)}/${formatNum(LINES_LIMIT_DAILY)}ج | شهري=${formatNum(s.usedMonth||0)}/${formatNum(LINES_LIMIT_MONTHLY)}ج`;
                }).join("\n");

                // ملخص الفيزا
                const visasSummary = visas.map(v => {
                    const s = sources.find(x => x.id === v.id) || v;
                    return `• ${v.name}: رصيد=${formatNum(v.balance||0)}ج | يومي=${formatNum(s.usedToday||0)}/${formatNum(VISA_LIMIT_DAILY)}ج | شهري=${formatNum(s.usedMonth||0)}/${formatNum(VISA_LIMIT_MONTHLY)}ج`;
                }).join("\n");

                // ملخص InstaPay
                const ipaySummary = instaPays.length ? instaPays.map(ip => {
                    const s = sources.find(x => x.id === ip.id) || ip;
                    return `• ${ip.name}: رصيد=${formatNum(ip.balance||0)}ج | شهري=${formatNum(s.usedMonth||0)}/${formatNum(INSTAPAY_LIMIT_MONTHLY)}ج`;
                }).join("\n") : "لا يوجد";

                // أرباح الشهر
                const mLogs = financeLogs.filter(l => l.monthDate === monthStr);
                const mInc  = mLogs.filter(l=>l.type==="income").reduce((s,l)=>s+l.amount,0);
                const mExp  = mLogs.filter(l=>l.type==="expense").reduce((s,l)=>s+l.amount,0);

                // العملاء المديونين
                const debtors = people
                    .map(p => ({ name: p.personName, bal: getPersonBalance(p) }))
                    .filter(p => p.bal > 0)
                    .sort((a,b) => b.bal - a.bal)
                    .slice(0, 8)
                    .map(p => `${p.name}: ${formatNum(p.bal)}ج`)
                    .join(" | ");

                // أبو عدي
                const todayMsStr = new Date().toDateString();
                const abuPaid = abuadiPayments.filter(p=>new Date(p.ts).toDateString()===todayMsStr).reduce((s,p)=>s+p.amount,0);
                const abuRem  = Math.max(0, abuadiTarget - abuPaid);

                // آخر 15 عملية
                const txnSummary = last15.map(t => {
                    const typeLabel = t.type==="transfer"?"تحويل":t.type==="receive"?"استلام":t.type==="bank_withdraw"?"سحب بنك":t.type==="fawri_transfer"?"تحويل إلى فوري":t.type==="internal_transfer"?"تحويل داخلي":"سحب فوري";
                    return `[${t.date} ${t.time||""}] ${typeLabel} — ${t.personName} — ${formatNum(t.amount)}ج`;
                }).join("\n");

                // حساب إضافي — خطوط متاحة وعدد العملاء
                const availLines = lines.filter(l => l.available !== false).length;
                const availVisas = visas.filter(v => v.available !== false).length;
                const totalDebtVal = people.reduce((s, p) => s + Math.max(0, getPersonBalance(p)), 0);
                const debtorCount  = people.filter(p => getPersonBalance(p) > 0).length;
                const todayTransfer = todayTxns.filter(t=>t.type==="transfer").reduce((s,t)=>s+t.amount,0);
                const todayReceive  = todayTxns.filter(t=>t.type==="receive").reduce((s,t)=>s+t.amount,0);

                return `أنت مساعد ذكي اسمك "حوكر AI" داخل تطبيق "فودافون كاش" لإدارة محافظ فودافون كاش التجارية.
تكلم دايماً بالعامية المصرية بشكل ودود ومختصر وعملي.
- ردك يكون مباشر ومفيد، مش أكتر من 4-5 جمل إلا لو الموضوع يحتاج جدول أو تفاصيل.
- استخدم الأرقام الموجودة في البيانات دايماً، ومتقولش "مش عندي بيانات" لأن كل البيانات موجودة تحت.
- لو حد سألك على أحسن خط، اقترح الخط اللي عنده أقل استخدام شهري ومتاح.
- لو سألك عن الوضع العام، اعطيه ملخص سريع بالأرقام من البيانات دي.

═══════════════════════════════════════
📊 بيانات التطبيق اللحظية — ${todayStr}
═══════════════════════════════════════

💰 رأس المال الحالي: ${formatNum(capital)} ج
📅 عمليات اليوم: ${todayTxns.length} عملية (تحويل: ${formatNum(todayTransfer)}ج | استلام: ${formatNum(todayReceive)}ج)
📈 المالية الشهرية: دخل ${formatNum(mInc)}ج — مصاريف ${formatNum(mExp)}ج — صافي ${formatNum(mInc-mExp)}ج
👥 إجمالي المديونية: ${formatNum(totalDebtVal)}ج من ${debtorCount} عميل

📱 الخطوط (${availLines} متاح من ${lines.length}):
${linesSummary}

💳 فيزا فوري (${availVisas} متاح من ${visas.length}):
${visasSummary}

⚡ إنستا باي:
${ipaySummary}

👥 أكبر المديونين:
${debtors || "لا يوجد ديون حالياً"}

🤝 أبو عدي اليوم:
- هدف التصفية: ${formatNum(abuadiTarget)}ج
- تم تسليمه: ${formatNum(abuPaid)}ج
- المتبقي: ${formatNum(abuRem)}ج ${abuRem === 0 && abuadiTarget > 0 ? "✅ تم تصفية الحساب بالكامل!" : ""}

📋 آخر 15 عملية:
${txnSummary || "لا توجد عمليات مسجلة"}

═══════════════════════════════════════
حدود الخطوط: يومي ${formatNum(LINES_LIMIT_DAILY)}ج | شهري ${formatNum(LINES_LIMIT_MONTHLY)}ج
حدود الفيزا: يومي ${formatNum(VISA_LIMIT_DAILY)}ج | شهري ${formatNum(VISA_LIMIT_MONTHLY)}ج
حدود إنستا باي: يومي ${formatNum(INSTAPAY_LIMIT_DAILY)}ج | شهري ${formatNum(INSTAPAY_LIMIT_MONTHLY)}ج`;
            }

            async function sendMessage(overrideText) {
                const q = (overrideText || input).trim();
                if (!q || thinking) return;
                setInput("");

                const userMsg = { role: "user", text: q, ts: Date.now() };
                const newMsgs = [...messages, userMsg];
                setMessages(newMsgs);
                setThinking(true);

                try {
                    const sysPrompt = buildSystemPrompt();
                    const aiText = await callClaudeChat(sysPrompt, newMsgs.slice(-20));
                    const aiMsg = { role: "ai", text: aiText, ts: Date.now() };
                    const final = [...newMsgs, aiMsg];
                    setMessages(final);
                    persist(final);
                } catch(err) {
                    const aiMsg = { role: "ai", text: `❌ خطأ: ${err.message}`, ts: Date.now() };
                    const final = [...newMsgs, aiMsg];
                    setMessages(final);
                    persist(final);
                } finally {
                    setThinking(false);
                }
            }

                "كم رأس المال دلوقتي؟",

                            <div style={{width:6,height:6,borderRadius:99,background:hasKey?"#10b981":"#ef4444",animation:hasKey?"blink 2s infinite":"none"}}/>

                        </div>

                    {/* Key Input Section */}

                        {!hasKey && (

                    {/* Quick Suggestions */}
                    <div style={{marginBottom:14}}>

                                <div style={{fontSize:11,marginTop:6,color:"#1a2235"}}>مثلاً: "إيه أحسن خط أحول منه دلوقتي؟"</div>
                            </div>
                        )}

                        {messages.map((m, i) => (
                            <div key={i} style={{display:"flex",flexDirection:"column",alignItems: m.role==="user"?"flex-end":"flex-start"}}>

                                )}
                                <div style={{

                        {thinking && (

                    {/* Input Row */}
                    <div style={{display:"flex",gap:8,marginBottom:10}}>

        const root = ReactDOM.createRoot(document.getElementById('root'));

    <!-- ══ Service Worker Registration ══ -->
    <script>
    if ('serviceWorker' in navigator) {
        // نسجّل Service Worker لو موجود (Netlify/GitHub Pages)
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('✅ SW registered:', reg.scope))
            .catch(() => {
                // لو sw.js مش موجود، نعمل inline SW بـ blob
                const swCode = `
const CACHE = 'hawker-v1';
const ASSETS = [
    './',
    'https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap',
    'https://unpkg.com/react@18/umd/react.production.min.js',
    'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
    'https://unpkg.com/@babel/standalone/babel.min.js'
];
self.addEventListener('install', e => {
    e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
    self.skipWaiting();
});
self.addEventListener('activate', e => {
    e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    ));
    self.clients.claim();
});
self.addEventListener('fetch', e => {
    if (e.request.method !== 'GET') return;
    e.respondWith(
        fetch(e.request)
            .then(res => {
                const clone = res.clone();
                caches.open(CACHE).then(c => c.put(e.request, clone));
                return res;
            })
            .catch(() => caches.match(e.request))
    );
});`;
                const blob = new Blob([swCode], {type:'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob))
                    .then(r => console.log('✅ Inline SW registered'))
                    .catch(e => console.log('SW unavailable (file://)', e.message));
            });
    }

    // ══ Install Prompt (Android/Desktop Chrome) ══
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.getElementById('pwa-install-btn');
        if (btn) {
            btn.style.display = 'flex';
            btn.onclick = () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(choice => {
                    if (choice.outcome === 'accepted') btn.style.display = 'none';
                    deferredPrompt = null;
                });
            };
        }
    });
    window.addEventListener('appinstalled', () => {
        const btn = document.getElementById('pwa-install-btn');
        if (btn) btn.style.display = 'none';
        console.log('✅ PWA installed');
    });
    </script>
