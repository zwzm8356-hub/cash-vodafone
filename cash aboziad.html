                        const rcvWords = /استقبل|استقبلت|أودع|أودعت|إيداع|استلام|received|deposit|credited|تم إيداع|تم استقبال/i;
                        const sndWords = /حوّل|حولت|تم تحويل|سحب|خصم|sent|transfer|debit|دفع/i;
                        const fawriWords = /فوري|fawry|fawri/i;
                        const bankWords = /بنك|bank|atm|صراف/i;

                        const detectedType = fawriWords.test(text) && sndWords.test(text) ? "fawri_withdraw"
                            : bankWords.test(text) && sndWords.test(text) ? "bank_withdraw"
                            : rcvWords.test(text) ? "receive"
                            : sndWords.test(text) ? "transfer"
                            : null;

                        // وقت
                        let time = "12:00";
                        const tm = text.match(/(\d{1,2}):(\d{2})\s*(AM|PM|ص|م)?/i);
                        if (tm) {
                            let h = parseInt(tm[1]), mn = tm[2];
                            const ap = (tm[3]||"").toLowerCase();
                            if ((ap==="pm"||ap==="م") && h<12) h+=12;
                            if ((ap==="am"||ap==="ص") && h===12) h=0;
                            if (h>=0&&h<=23) time = `${String(h).padStart(2,"0")}:${mn}`;
                        }

                        // مطابقة الخط من الأرقام
                        let matchedSrc = null;
                        for (const ph of phones) {
                            const found = knownNumbers.find(s=>s.number===ph||ph.includes(s.number));
                            if (found) { matchedSrc = found; break; }
                        }

                        extractedData = {
                            amount,
                            fromPhone: phones[0] || "",
                            toPhone: phones[1] || "",
                            type: detectedType,
                            time,
                            date: null,
                            personName: null,
                            matchedSourceId: matchedSrc?.id || null,
                            matchedSourceType: matchedSrc?.type || "line",
                            confidence: amount && detectedType ? "medium" : "low"
                        };
                    }

                    // ── مطابقة الخط بالرقم ──
                    const d = extractedData || {};
                    let matchedSourceId = d.matchedSourceId || null;
                    let matchedSourceType = "line";

                    if (!matchedSourceId) {
                        const phones = [d.fromPhone, d.toPhone].filter(Boolean);
                        for (const phone of phones) {
                            const found = knownNumbers.find(s => s.number === phone || phone?.includes(s.number));
                            if (found) {
                                matchedSourceId = found.id;
                                matchedSourceType = found.type;
                                break;
                            }
                        }
                    } else {
                        const found = knownNumbers.find(s => s.id === matchedSourceId);
                        if (found) matchedSourceType = found.type;
                    }

                    const result = {
                        amount: d.amount || "",
                        phone: d.toPhone || d.fromPhone || "",
                        fromPhone: d.fromPhone || "",
                        type: d.type || null,
                        time: d.time || "12:00",
                        date: d.date || null,
                        personName: d.personName || null,
                        matchedSourceId,
                        matchedSourceType,
                        confidence: d.confidence || "low",
                        raw: rawText.slice(0, 300)
                    };
                    setOcrResult(result);

                    setOcrConfirm({
                        amount:       result.amount,
                        phone:        result.phone,
                        fromPhone:    result.fromPhone,
                        time:         result.time,
                        date:         result.date || today(),
                        detectedType: result.type,
                        personName:   result.personName || "",
                        matchedSourceId: result.matchedSourceId,
                        matchedSourceType: result.matchedSourceType,
                        confidence:   result.confidence,
                        previewUrl,
                        rawText:      rawText.slice(0, 200),
                    });

                    if (result.confidence === "high") {
                        showToast("✅ AI استخرج البيانات بدقة عالية");
                    } else if (result.confidence === "medium") {
                        showToast("⚡ تم استخراج البيانات — راجع قبل الحفظ");
                    } else {
                        showToast("⚠️ دقة منخفضة — راجع البيانات يدوياً", "error");
                    }

                } catch (e) {
                    showToast("❌ فشل استخراج البيانات: " + (e.message || "خطأ"), "error");
                } finally {
                    setOcrLoading(false);
                }
            }

            // ⭐ تأكيد بيانات OCR وملء الفورم
            function confirmOcrData() {
                if (!ocrConfirm) return;
                setForm(f => ({
                    ...f,
                    amount:     ocrConfirm.amount    || f.amount,
                    toNumber:   ocrConfirm.phone     || f.toNumber,
                    fromNumber: ocrConfirm.fromPhone  || f.fromNumber,
                    time:       ocrConfirm.time      || f.time,
                    date:       ocrConfirm.date      || f.date,
                    personName: ocrConfirm.personName || f.personName,
                    // ⭐ تطبيق الخط المكتشف تلقائياً
                    ...(ocrConfirm.matchedSourceId ? {
                        sourceId:   ocrConfirm.matchedSourceId,
                        sourceType: ocrConfirm.matchedSourceType || "line",
                    } : {}),
                    ...(ocrConfirm.detectedType ? { type: ocrConfirm.detectedType } : {}),
                }));
                setOcrConfirm(null);
                const srcName = ocrConfirm.matchedSourceId
                    ? sources.find(s=>s.id===ocrConfirm.matchedSourceId)?.name
                    : null;
                showToast(srcName
                    ? `✅ تم نقل البيانات — الخط: ${srcName}`
                    : "✅ تم نقل البيانات — راجع الخط والنوع قبل الحفظ");
            }

            // ⭐ حساب العمولة بناءً على نوع العملية — ديناميكي من commissionSettings
            // ── wrapper يستدعي calcCommissionPure المستقلة ──────────────
            function calcCommission(type, amount) {
                return calcCommissionPure(type, amount, commissionSettings);
            }

            // ══ تظبيط الرصيد الشهري — لمطابقة تطبيق الشركة عند وجود فرق ══
            function submitMonthlyAdjustment() {
                if (!adjustModal) return;
                const diff = parseFloat(adjustForm.amount);
                if (isNaN(diff) || diff === 0) { showToast("اكتب فرق صحيح (موجب أو سالب)", "error"); return; }

                const adjTxn = {
                    id: generateUniqueId(),
                    type: "monthly_adjustment",
                    adjustTarget: adjustForm.target, // "transfer" أو "receive"
                    date: today(),
                    dateTime: nowStr(),
                    sourceId: adjustModal.sourceId,
                    sourceType: adjustModal.sourceType,
                    sourceName: adjustModal.sourceName,
                    amount: diff, // ممكن تكون سالبة لتقليل العداد
                    notes: adjustForm.reason || "تظبيط يدوي لمطابقة تطبيق الشركة",
                    createdAt: nowStr(),
                    addedBy: firebaseUser?.displayName || firebaseUser?.email || userRole || "غير محدد",
                    addedAt: new Date().toISOString(),
                    reversed: false,
                };

                setTransactions(prev => {
                    const updated = [...prev, adjTxn];
                    saveToLocalStorage('transactions', updated);
                    return updated;
                });
                if (auth.currentUser && firebaseReady) safeFirebaseSet(db, `transactions/${adjTxn.id}`, adjTxn);

                showToast(`✓ تم تظبيط ${adjustForm.target === "transfer" ? "التحويل" : "الاستلام"} الشهري (${diff > 0 ? "+" : ""}${diff} ج)`);
                setAdjustModal(null);
                setAdjustForm({ target: "transfer", amount: "", reason: "" });
            }

            async function addTransaction() {
                // ⭐ منع الضغط المتكرر — Race Condition Protection
                if (isSubmitting) return;

                const amount = parseFloat(form.amount);
                if (!form.date || !form.time || !amount || !form.sourceId) { 
                    showToast("أكمل كل البيانات","error"); 
                    return; 
                }
                // ⭐ للتحويل الداخلي، اسم العميل غير مطلوب — يُملأ تلقائياً من اسم الخط المستقبِل
                if (form.type !== "internal_transfer" && !form.personName) {
                    showToast("أكمل كل البيانات","error");
                    return;
                }

                if (form.type === "transfer" && (!form.fromNumber || !form.toNumber)) {
                    showToast("أكمل أرقام التحويل","error"); 
                    return;
                }

                // ⭐ التحويل الداخلي — تحقق من الخط المستقبِل
                if (form.type === "internal_transfer") {
                    if (!form.toInternalId) { showToast("اختر الخط / الفيزا المستقبِل", "error"); return; }
                    if (form.toInternalId === form.sourceId) { showToast("الخط المرسِل والمستقبِل نفس الخط!", "error"); return; }
                }

                // ⭐ تفعيل حالة الحفظ الآمن
                setIsSubmitting(true);

                // ⭐ Haptic feedback — iOS
                if (navigator.vibrate) navigator.vibrate(15);
                // ⭐ للتحويل الداخلي: اسم العميل = اسم الخط المستقبِل تلقائياً
                let personName = form.personName.trim();
                if (form.type === "internal_transfer" && !personName && form.toInternalId) {
                    const destSrcName = [...lines, ...visas, ...instaPays].find(s => s.id === form.toInternalId);
                    personName = destSrcName ? `تحويل داخلي → ${destSrcName.name}` : "تحويل داخلي";
                }
                const fullDateTime = `${form.date} ${form.time}`;

                // ⭐ حساب العمولة للأنواع الجديدة
                const { commission, total: totalAmount } = calcCommission(form.type, amount);
                const isWithdraw = form.type === "bank_withdraw" || form.type === "fawri_withdraw";

                // ⭐ إضافة تفاصيل العمولة تلقائياً في الملاحظات
                let autoNotes = form.notes || "";
                if (isWithdraw && commission > 0) {
                    const commLabel = form.type === "bank_withdraw"
                        ? `عمولة بنك ${(bankWithdrawRate*100).toFixed(2)}%: ${commission} ج`
                        : `عمولة فوري (${(fawriWithdrawRate*100).toFixed(2)}%+${fawriWithdrawFixed}ج): ${commission} ج`;
                    autoNotes = `[${commLabel} | الإجمالي المسحوب: ${totalAmount} ج]${autoNotes ? " " + autoNotes : ""}`;
                }
                // ⭐ ملاحظات التحويل الداخلي التلقائية
                if (form.type === "internal_transfer" && form.toInternalId) {
                    const srcName = sources.find(s => s.id === form.sourceId)?.name || form.sourceId;
                    const destName = [...lines, ...visas, ...instaPays].find(s => s.id === form.toInternalId)?.name || form.toInternalId;
                    autoNotes = `[تحويل داخلي: ${srcName} ← ${destName}]${autoNotes ? " " + autoNotes : ""}`;
                }
                
                // ⭐ التقاط رقم الخط/الفيزا المختار تلقائياً لضمان المطابقة في calcSourceStats
                const selectedSrc = sources.find(s => s.id === form.sourceId);
                const actualLineNumber = selectedSrc?.number || "";
                const src = sources.find(s => s.id === form.sourceId);
                const autoFromNumber = form.fromNumber || src?.number || src?.fromNumber || (isWithdraw ? actualLineNumber : "");
                const autoToNumber   = form.toNumber   || (form.type === "receive" ? actualLineNumber : "");

                const newTxn = {
                    id: generateUniqueId(),
                    type: form.type,
                    date: form.date,
                    dateTime: fullDateTime,
                    fromNumber: autoFromNumber,
                    toNumber: autoToNumber,
                    toInternalId: form.type === "internal_transfer" ? (form.toInternalId || null) : null,
                    personName: personName,
                    amount: amount,
                    commission: commission,
                    totalAmount: totalAmount,
                    sourceId: form.sourceId,
                    sourceType: form.sourceType,
                    createdAt: nowStr(),
                    notes: autoNotes,
                    image: null,
                    // ══ Performance Tracking ══
                    addedBy: firebaseUser?.displayName || firebaseUser?.email || userRole || "غير محدد",
                    addedAt: new Date().toISOString(),
                    inputDurationSec: txnStartTime ? Math.round((Date.now() - txnStartTime) / 1000) : null,
                    reversed: false,
                };

                // ⭐ Fraud Detection — فحص العملية قبل الحفظ
                const fraudWarnings = detectPotentialFraud({
                    amount, type: form.type,
                    toNumber: autoToNumber, fromNumber: autoFromNumber,
                    date: form.date
                }, transactions);
                if (fraudWarnings.length > 0) {
                    const msg = `⚠️ تحذير أمني:\n${fraudWarnings.join("\n")}\n\nتأكد إن العملية صح قبل الحفظ — هل تكمل؟`;
                    if (!window.confirm(msg)) return;
                }

                // ⭐ Local-First: نحفظ فوراً محلياً علشان الهاتف ما يتأخرش
                setTransactions(prev => {
                    const updated = [newTxn, ...prev.filter(t => t.id !== newTxn.id)];
                    saveToLocalStorage('transactions', updated);
                    return updated;
                });

                // ⭐ Firebase في الخلفية مع Retry — بدون await حتى لا يعيق الـ UI
                // نحذف أي undefined قبل الرفع لـ Firebase (Firebase يرفض undefined)
                const cleanTxn = JSON.parse(JSON.stringify(newTxn, (k, v) => v === undefined ? null : v));
                if (auth.currentUser && firebaseReady) {
                    const saveToFirebase = (attempt = 1) => {
                        db.ref('transactions/' + cleanTxn.id).set(cleanTxn)
                            .then(() => {
                                if (attempt > 1) showToast("✅ تم مزامنة العملية مع السيرفر");
                            })
                            .catch(err => {
                                if (attempt < 3) {
                                    setTimeout(() => saveToFirebase(attempt + 1), 3000);
                                } else {
                                    showToast("⚠️ العملية حُفظت محلياً — اضغط 🔄 لمزامنة السيرفر", "error");
                                }
                            });
                    };
                    saveToFirebase();
                }

                updateSource(form.sourceId, form.sourceType, totalAmount, form.type);

                // ⭐ تحديث رصيد الخط أو الفيزا في Firebase بأمان عبر .transaction()
                // ✅ إصلاح: نبحث عن index الخط في الـ array لأن Firebase يخزّن كـ array لا كـ object
                if (form.sourceType === "line") {
                    const lineIdx = lines.findIndex(l => l.id === form.sourceId);
                    if (lineIdx !== -1) {
                        db.ref(`lines/${lineIdx}`).transaction((currentLine) => {
                            if (currentLine) {
                                const isOutgoing = form.type === "transfer" || form.type === "bank_withdraw" || form.type === "fawri_withdraw" || form.type === "fawri_transfer" || form.type === "internal_transfer";
                                // نستخدم totalAmount (شامل العمولة) لتطابق updateSource المحلية
                                const change = isOutgoing ? -totalAmount : amount;
                                currentLine.balance = (parseFloat(currentLine.balance) || 0) + change;

                                // تحديث الاستهلاك — totalAmount للصادر، amount للوارد
                                if (form.type === "transfer" || form.type === "bank_withdraw" || form.type === "fawri_withdraw" || form.type === "fawri_transfer" || form.type === "internal_transfer") {
                                    currentLine.usedTodayTransfer = (parseFloat(currentLine.usedTodayTransfer) || 0) + totalAmount;
                                    currentLine.usedMonthTransfer = (parseFloat(currentLine.usedMonthTransfer) || 0) + totalAmount;
                                } else if (form.type === "receive") {
                                    currentLine.usedTodayReceive = (parseFloat(currentLine.usedTodayReceive) || 0) + amount;
                                    currentLine.usedMonthReceive = (parseFloat(currentLine.usedMonthReceive) || 0) + amount;
                                }
                            }
                            return currentLine;
                        });
                    }
                } else if (form.sourceType === "visa") {
                    const visaIdx = visas.findIndex(v => v.id === form.sourceId);
                    if (visaIdx !== -1) {
                        db.ref(`visas/${visaIdx}`).transaction((currentVisa) => {
                            if (currentVisa) {
                                const isOutgoing = form.type === "transfer" || form.type === "bank_withdraw" || form.type === "fawri_withdraw" || form.type === "fawri_transfer" || form.type === "internal_transfer";
                                const change = isOutgoing ? -totalAmount : amount;
                                currentVisa.balance = (parseFloat(currentVisa.balance) || 0) + change;
                            }
                            return currentVisa;
                        });
                    }
                }

                const existingPerson = people.find(p => (p.personName || "").toLowerCase() === personName.toLowerCase());
                if (existingPerson) {
                    setPeople(prev => prev.map(p => {
                        if (p.id !== existingPerson.id) return p;
                        const typeLabel = form.type === "transfer" ? "تحويل" : form.type === "receive" ? "استلام" : form.type === "bank_withdraw" ? "سحب بنك" : form.type === "fawri_transfer" ? "تحويل إلى فوري" : "سحب فوري";
                        const newRecord = {
                            id: generateUniqueId(),
                            type: form.type,
                            amount: amount,
                            date: fullDateTime,
                            description: form.type === "transfer" ? `تحويل: ${form.fromNumber} → ${form.toNumber}` : typeLabel
                        };
                        return {
                            ...p,
                            records: [...(p.records || []), newRecord],
                            lastUpdated: nowStr()
                        };
                    }));
                }

                const txnLabels = { transfer: "تحويل", receive: "استلام", bank_withdraw: "سحب بنك", fawri_withdraw: "سحب فوري", fawri_transfer: "تحويل إلى فوري", internal_transfer: "تحويل داخلي" };

                // ⭐ تحويل مباشر لفوري — أضف المبلغ لرصيد فوري التراكمي
                if (form.type === "fawri_transfer") {
                    setFawriBalance(prev => Math.round((prev + parseFloat(amount)) * 100) / 100);
                }

                // ⭐ تحويل داخلي — أضف المبلغ للخط المستقبِل وسجّل عملية استلام مقابلة
                if (form.type === "internal_transfer" && form.toInternalId) {
                    const destSrc = [...lines, ...visas, ...instaPays].find(s => s.id === form.toInternalId);
                    if (destSrc) {
                        const destType = destSrc.id.startsWith('visa') ? 'visa' : destSrc.id.startsWith('instapay') ? 'instapay' : 'line';
                        // أضف المبلغ للمستقبِل مباشرةً
                        const destUpdater = prev => prev.map(item => item.id !== form.toInternalId ? item : {
                            ...item,
                            balance: (item.balance || 0) + amount,
                            usedTodayReceive: (item.usedTodayReceive || 0) + amount,
                            usedMonthReceive: (item.usedMonthReceive || 0) + amount,
                        });
                        if (destType === 'line') setLines(destUpdater);
                        else if (destType === 'visa') setVisas(destUpdater);
                        else setInstaPays(destUpdater);
                        // حدّث Firebase للمستقبِل
                        const destRef = destType === 'line' ? 'lines' : destType === 'visa' ? 'visas' : 'instaPays';
                        // ✅ إصلاح: نبحث عن index بدل ID لأن Firebase يخزّن كـ array
                        const destArr = destType === 'line' ? lines : destType === 'visa' ? visas : instaPays;
                        const destIdx = destArr.findIndex(s => s.id === form.toInternalId);
                        if (destIdx !== -1) {
                            db.ref(`${destRef}/${destIdx}`).transaction(curr => {
                                if (!curr) return curr;
                                curr.balance = (parseFloat(curr.balance) || 0) + amount;
                                curr.usedTodayReceive = (parseFloat(curr.usedTodayReceive) || 0) + amount;
                                curr.usedMonthReceive = (parseFloat(curr.usedMonthReceive) || 0) + amount;
                                return curr;
                            });
                        }
                    }
                }

                showToast(`تم ${txnLabels[form.type] || "العملية"} بنجاح ✓`);

                // ⭐ سرعة الإدخال — نفضّي الحقول اللي بتتغير كل عملية بس (المبلغ/العميل/رقم المحفظة)
                // ونسيب النوع + التاريخ + الوقت + الخط + رقم المرسِل زي ما هم لعملية تالية سريعة
                setForm(f => ({
                    ...f,
                    amount: "",
                    personName: "",
                    toNumber: "",
                    toInternalId: "",
                    notes: "",
                    image: null,
                    time: nowTime(),
                }));
                setOcrResult(null);
                setOcrPreviewUrl(null);
                setSmartPaste("");
                setSplitPlan(null);
                setSplitConfirmed(false);
                setAutoRouting({ suggestedId: null, allAtLimit: false, userOverrode: false });
                setTxnStartTime(Date.now());
                setIsSubmitting(false);
                // ⭐ نفضل في نفس الفورم جاهزين للعملية الجاية — التركيز يرجع للمبلغ فورًا
                setTimeout(() => amountFieldRef.current?.focus(), 60);
            }

            // ══════════════════════════════════════════════════════
            //  ✂️  تنفيذ خطة التقسيم — حفظ عمليات متعددة دفعة واحدة
            // ══════════════════════════════════════════════════════
            async function executeSplitPlan() {
                if (!splitPlan || !splitPlan.steps.length) return;
                if (isSubmitting) return;

                if (!form.date || !form.time || !form.personName) {
                    showToast("أكمل بيانات العميل والتاريخ أولاً", "error");
                    return;
                }

                setIsSubmitting(true);
                if (navigator.vibrate) navigator.vibrate([15, 50, 15]);

                const personName = form.personName.trim();
                const fullDateTime = `${form.date} ${form.time}`;
                const newTxns = [];

                splitPlan.steps.forEach((step, idx) => {
                    const src = sources.find(s => s.id === step.sourceId);
                    const txnId = generateUniqueId('txn');
                    const autoFromNumber = form.type === "transfer" ? (form.fromNumber || src?.number || "") : "";
                    const autoToNumber   = form.type === "transfer" ? (form.toNumber   || "") : (src?.number || "");

                    newTxns.push({
                        id: txnId,
                        type: form.type,
                        date: form.date,
                        dateTime: fullDateTime,
                        fromNumber: autoFromNumber,
                        toNumber:   autoToNumber,
                        personName: personName,
                        amount: step.amount,
                        commission: 0,
                        totalAmount: step.amount,
                        sourceId:   step.sourceId,
                        sourceType: step.sourceType,
                        createdAt: nowStr(),
                        notes: `[تقسيم ذكي ${idx+1}/${splitPlan.steps.length}]${form.notes ? " " + form.notes : ""}`,
                        image: null
                    });
                });

                // ⭐ Local-First: نحفظ فوراً محلياً
                setTransactions(prev => {
                    const newIds = new Set(newTxns.map(t => t.id));
                    const updated = [...newTxns, ...prev.filter(t => !newIds.has(t.id))];
                    saveToLocalStorage('transactions', updated);
                    return updated;
                });

                // ⭐ Firebase في الخلفية — كل عملية بـ ID مستقل مع Retry
                if (auth.currentUser && firebaseReady) {
                    newTxns.forEach(txn => {
                        // نظّف undefined قبل الرفع
                        const cleanTxn = JSON.parse(JSON.stringify(txn, (k, v) => v === undefined ? null : v));
                        const saveOne = (attempt = 1) => {
                            db.ref('transactions/' + cleanTxn.id).set(cleanTxn)
                                .catch(err => {
                                    if (attempt < 3) setTimeout(() => saveOne(attempt + 1), 3000);
                                    else showToast("⚠️ بعض العمليات لم تُزامَن — اضغط 🔄", "error");
                                });
                        };
                        saveOne();
                    });
                }

                // تحديث كل مصدر بالأمان عبر Firebase transaction
                newTxns.forEach(txn => {
                    updateSource(txn.sourceId, txn.sourceType, txn.amount, txn.type);
                    if (txn.sourceType === "line") {
                        const lineIdx = lines.findIndex(l => l.id === txn.sourceId);
                        if (lineIdx !== -1) {
                            db.ref(`lines/${lineIdx}`).transaction(curr => {
                                if (!curr) return curr;
                                const isOut = txn.type === "transfer";
                                curr.balance = (parseFloat(curr.balance) || 0) + (isOut ? -txn.amount : txn.amount);
                                if (isOut) {
                                    curr.usedTodayTransfer = (parseFloat(curr.usedTodayTransfer) || 0) + txn.amount;
                                    curr.usedMonthTransfer = (parseFloat(curr.usedMonthTransfer) || 0) + txn.amount;
                                } else {
                                    curr.usedTodayReceive = (parseFloat(curr.usedTodayReceive) || 0) + txn.amount;
                                    curr.usedMonthReceive = (parseFloat(curr.usedMonthReceive) || 0) + txn.amount;
                                }
                                return curr;
                            });
                        }
                    } else if (txn.sourceType === "visa") {
                        const visaIdx = visas.findIndex(v => v.id === txn.sourceId);
                        if (visaIdx !== -1) {
                            db.ref(`visas/${visaIdx}`).transaction(curr => {
                                if (!curr) return curr;
                                const isOut = txn.type === "transfer";
                                curr.balance = (parseFloat(curr.balance) || 0) + (isOut ? -txn.amount : txn.amount);
                                return curr;
                            });
                        }
                    }
                });

                // تحديث سجل العميل
                const existingPerson = people.find(p => (p.personName || "").toLowerCase() === personName.toLowerCase());

                        return { ...p, records: [...(p.records || []), ...newRecords], lastUpdated: nowStr() };
                    }));

                showToast(`✅ تم تنفيذ التقسيم: ${splitPlan.steps.length} عمليات — إجمالي ${maskNum(splitPlan.totalCovered, privacyMode)} ج`);

                // ✅ علّم العملية كـ reversed (للـ Performance Board) بدل حذفها كلياً
                setTransactions(prev => {

                    safeFirebaseSet(db, `transactions/${txn.id}/reversedAt`, nowStr());
                }
                // عكس المصدر الأصلي باستخدام helper
                applySourceUpdate(txn, effectiveAmount, setLines, setVisas, setInstaPays, true);
                // تحويل داخلي — اعكس الخط المستقبِل كمان
                if (txn.type === "internal_transfer" && txn.toInternalId) {
                    const destReverter = prev => prev.map(item => item.id !== txn.toInternalId ? item : {
                        ...item,
                        balance: (item.balance || 0) - effectiveAmount,
                        usedTodayReceive: Math.max(0, (item.usedTodayReceive||0) - effectiveAmount),
                        usedMonthReceive: Math.max(0, (item.usedMonthReceive||0) - effectiveAmount),
                    });
                    setLines(destReverter);
                    setVisas(destReverter);
                    setInstaPays(destReverter);
                }
                // عكس سجل الشخص لو موجود
                setPeople(prev => prev.map(p => {
                    if (p.personName?.toLowerCase() !== txn.personName?.toLowerCase()) return p;
                    return {
                        ...p,
                        records: (p.records || []).filter(r => !(
                            Math.abs(r.amount) === txn.amount &&
                            r.date === (txn.dateTime || txn.date)
                        )),
                        lastUpdated: nowStr()
                    };
                }));
                setConfirmDelete(null);
                showToast("↩️ تم عكس العملية وإرجاع الأرقام ✓");

                touchEndX.current = e.changedTouches[0]?.clientX;
                touchEndY.current = e.changedTouches[0]?.clientY;

                // عشان ما نلخبطش سكرول عادي (فوق/تحت) مع السحب بين الصفحات
                if (Math.abs(swipeDistanceX) <= Math.abs(swipeDistanceY) * 1.5) return;

                if (swipeDistanceX > minSwipeDistance && currentIdx < TABS_ORDER.length - 1) {
                    setTab(TABS_ORDER[currentIdx + 1]);

            // ⭐ كل الشهور اللي فيها بيانات فعلاً (من السجلات + من سجل الرصيد اليومي) — لعرضها في التنقل
            const availableFinanceMonths = React.useMemo(() => {
                const set = new Set([thisMonth]);

                dailyBalanceLog.forEach(d => { if (d.monthDate) set.add(d.monthDate); });

            }, [financeLogs, dailyBalanceLog, thisMonth]);

            function shiftFinanceMonth(dir) {
                const idx = availableFinanceMonths.indexOf(viewMonth);
                let target;
                if (idx === -1) {
                    // احسب الشهر يدوياً لو مش موجود في القايمة
                    const [y, m] = viewMonth.split("-").map(Number);
                    const d = new Date(y, (m - 1) + dir, 1);
                    target = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
                } else {
                    const newIdx = idx - dir; // القايمة الأحدث أولاً، فـ "التالي" = idx-1
                    target = availableFinanceMonths[newIdx] || viewMonth;
                }
                setFinanceViewMonth(target);
            }
            function monthLabel(m) {
                if (!m) return "";
                const [y, mo] = m.split("-");
                const names = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
                return `${names[parseInt(mo,10)-1] || mo} ${y}`;

            // ══ 🧠 الرادار الذكي — Smart Insights ══
            const smartInsights = React.useMemo(() => generateSmartInsights({
                todayTxns, warningSources, alertSources, oldDebtors, totalDebt,
                netMonthProfit, liquidityForecast, performanceBoard, capital
            }), [todayTxns, warningSources, alertSources, oldDebtors, totalDebt, netMonthProfit, liquidityForecast, performanceBoard, capital]);

            const selectedPerson = selectedPersonId ? people.find(p => p.id === selectedPersonId) : null;

            // ══════════════════════════════════════════════════════

            // قسم أبو عدي والأشخاص: عمر له صلاحيات كاملة كالأدمن
            const canEditAbuAdi  = isAdmin || isAssistant || isOmar;
            const canEditPeople  = isAdmin || isAssistant || isOmar;

            const canCopyLine    = isAdmin || isAssistant || isOmar;
            const canEditLines   = isAdmin;  // عمر محظور من التعديل
            const canAddLine     = isAdmin;  // عمر محظور من الإضافة

            // قسم المالية: أدمن فقط
            const canEditFinance = isAdmin;

            // سجل العمليات: عمر يطبع ويبحث لكن لا يحذف ولا يعكس
            const canDeleteTxn   = isAdmin;
            const canReverseTxn  = isAdmin;
            const canPrintTxn    = isAdmin || isOmar;  // عمر يطبع الفواتير

            // لوحة التحكم: عمر يرى كل شيء بالكامل
            const canViewDashboard = true;

            // التبويبات المتاحة لعمر
            const omarTabs = ["dashboard", "transactions", "people", "lines", "abuadi", "ai"];

            const displayTabs = [

                {id:"people",      icon:"👥", label:"الأشخاص"},

                    </div>

                    {toast && (() => {

                            error:   { bg:"linear-gradient(135deg,#dc2626,#ef4444)", icon:"❌", glow:"rgba(239,68,68,0.4)"  },
                            warning: { bg:"linear-gradient(135deg,#d97706,#f59e0b)", icon:"⚠️", glow:"rgba(245,158,11,0.4)" },
                            info:    { bg:"linear-gradient(135deg,#0891b2,#22d3ee)", icon:"ℹ️", glow:"rgba(34,211,238,0.4)"  },
                        };

                                {voiceListening ? "جاري الاستماع..." : voiceStatus==="processing" ? "⚙️ جاري التحليل..." : `✅ ${voiceTranscript}`}
                            </span>
                            <button onClick={()=>{setVoiceStatus("idle");setVoiceTranscript("");}} style={{marginRight:"auto",background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:16}}>✕</button>
                        </div>
                    )}

                    {/* ⭐ حارس ماليه المر */}
                    {(isAdmin || isAssistant) && (
                        <HawkerGuardian

                                                        {balance>0?"عليه":"له"}{balance===0?" مش عليه حاجة":""}

                                                </div>

                                                <div style={{flex:1,background:"#10b98115",borderRadius:8,padding:"6px 10px",textAlign:"center"}}>
                                                    <div style={{fontSize:12,fontWeight:700,color:"#10b981"}}>{formatNum(totalC)} ج</div>

                                            {canEditPeople && (

                                                        style={{background:"#0a1628",border:"1px solid #a78bfa30",borderRadius:8,padding:"7px 10px",color:"#a78bfa",fontSize:13,cursor:"pointer"}}>

                                    {canEditPeople && <button onClick={()=>setConfirmDelete({type:"person",data:selectedPerson})}
                                        style={{background:"#ef444420",border:"1px solid #ef444440",borderRadius:10,padding:"10px 14px",color:"#ef4444",cursor:"pointer",fontSize:13}}>🗑️</button>}
                                </div>

                                {/* ملخص الحساب المجمع */}
                                {(() => {

                                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
                                                <div style={{background:"#ef444415",borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
                                                    <div style={{fontSize:15,fontWeight:800,color:"#ef4444"}}>{formatNum(totalD)}</div>
                                                    <div style={{fontSize:9,color:"#94a3b8",marginTop:3}}>حوّل منك</div>
                                                </div>
                                                <div style={{background:"#10b98115",borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
                                                    <div style={{fontSize:15,fontWeight:800,color:"#10b981"}}>{formatNum(totalC)}</div>
                                                    <div style={{fontSize:9,color:"#94a3b8",marginTop:3}}>أعطاك</div>

                                                <div style={{background: balance>0?"#ef444420":"#10b98120",borderRadius:10,padding:"10px 6px",textAlign:"center",border:`1px solid ${balance>0?"#ef444440":"#10b98140"}`}}>
                                                    <div style={{fontSize:15,fontWeight:900,color:balance>0?"#ef4444":"#10b981"}}>{maskNum(Math.abs(balance), privacyMode)}</div>
                                                    <div style={{fontSize:9,color:"#94a3b8",marginTop:3}}>{balance>0?"عليه":"له"}</div>

                                            </div>

                                    );
                                })()}

                                {/* أزرار إضافة حركة */}
                                {canEditPeople && (
                                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
                                        <button onClick={()=>{setCustMoveForm({type:"debit",amount:"",note:"",isOld:false});setCustModal("addMove");}}
                                            style={{background:"linear-gradient(135deg,#ef4444,#dc2626)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>
                                            {selectedPerson.accountType==="gameya" ? "🔄 سحب/استرجاع" : "➕ حوّل مني"}
                                        </button>
                                        <button onClick={()=>{setCustMoveForm({type:"credit",amount:"",note:"",isOld:false});setCustModal("addMove");}}
                                            style={{background:"linear-gradient(135deg,#10b981,#059669)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>
                                            {selectedPerson.accountType==="gameya" ? "➕ دفعة جمعية يومية" : "💵 أعطاني / سدّد"}
                                        </button>
                                    </div>
                                )}

                                {/* ⭐ FEATURE: آخر عمليات التطبيق لهذا العميل */}
                                {(() => {
                                    const phone = selectedPerson.phone || "";
                                    const name = selectedPerson.personName || "";
                                    const personTxns = transactions.filter(t =>
                                        (phone && (t.fromNumber===phone || t.toNumber===phone)) ||
                                        (name && t.personName===name)
                                    ).slice(0, 5);
                                    if (personTxns.length === 0) return null;
                                    return (
                                        <div style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:12,padding:"12px 14px",marginBottom:14}}>
                                            <div style={{fontSize:12,fontWeight:700,color:"#7a8fa8",marginBottom:8}}>📱 آخر عمليات فودافون كاش</div>
                                            {personTxns.map(t=>(
                                                <div key={t.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #1a2235",fontSize:12}}>
                                                    <span style={{color:"#94a3b8"}}>{t.date} — {t.type==="transfer"?"💸 تحويل":t.type==="receive"?"📥 استلام":"💳"}</span>
                                                    <span style={{color:"#22d3ee",fontWeight:700}}>{formatNum(t.amount)} ج</span>
                                                </div>
                                            ))}
                                        </div>
                                    );
                                })()}

                                {/* جدول الحركات */}
                                <div style={{fontSize:13,fontWeight:700,color:"#94a3b8",marginBottom:10}}>📋 كشف الحساب</div>

                                {(!selectedPerson.moves || selectedPerson.moves.length === 0) && (
                                    <div style={{textAlign:"center",color:"#475569",padding:30,fontSize:13}}>لا توجد حركات بعد</div>
                                )}

                                {/* ⭐ كشف الحساب بالدورات — كل دورة منفصلة */}
                                {(() => {
                                    const moves = [...(selectedPerson.moves||[])].sort((a,b)=>a.id-b.id);

                                    // نقسّم الحركات لـ "دورات" — دورة بتقفل بس لما الرصيد يرجع صفر بالظبط
                                    // (لو الرصيد بينزل تحت الصفر — يعني بقى "له" — ده مش قفل دورة، ده رصيد متجمّع (زي الجمعية) ولازم يفضل في نفس الدورة المفتوحة)
                                    const sessions = [];
                                    let session = [];
                                    let running = 0;
                                    moves.forEach(m => {
                                        running += m.type==="debit" ? m.amount : -m.amount;
                                        running = Math.round(running*100)/100;
                                        session.push({ ...m, running });
                                        if (Math.abs(running) < 0.01) {
                                            sessions.push([...session]);
                                            session = [];
                                            running = 0;
                                        }
                                    });
                                    // لو فيه حركات لسه مش مسوّاها (الدورة الحالية المفتوحة)
                                    if (session.length > 0) sessions.push([...session]);

                                    // عرض من الأحدث للأقدم
                                    const reversedSessions = [...sessions].reverse();
                                    const currentBalance = moves.reduce((s,m)=> s + (m.type==="debit"?m.amount:-m.amount), 0);

                                    return (
                                        <div>
                                            {/* ⭐ بطاقة الرصيد — مع فصل القديم من الجديد */}
                                            {(()=>{
                                                const oldDebt  = moves.filter(m=>m.type==="debit" && m.isOld).reduce((s,m)=>s+m.amount,0);
                                                const oldPaid  = moves.filter(m=>m.type==="credit" && m.isOld).reduce((s,m)=>s+m.amount,0);
                                                const newDebt  = moves.filter(m=>m.type==="debit" && !m.isOld).reduce((s,m)=>s+m.amount,0);
                                                const newPaid  = moves.filter(m=>m.type==="credit" && !m.isOld).reduce((s,m)=>s+m.amount,0);
                                                // الطريقة: الكريدت بيسدد القديم الأول وبعدين الجديد
                                                const totalCredit = moves.filter(m=>m.type==="credit").reduce((s,m)=>s+m.amount,0);
                                                const remainOld = Math.max(0, Math.round((oldDebt - Math.min(totalCredit, oldDebt))*100)/100);
                                                const remainNew = Math.max(0, Math.round((currentBalance - remainOld)*100)/100);
                                                const hasOld = oldDebt > 0;
                                                return (
                                                    <div style={{
                                                        background: currentBalance>0?"linear-gradient(135deg,#1a0a0a,#200d0d)":currentBalance<0?"linear-gradient(135deg,#0a1a10,#0d2014)":"#0d1120",
                                                        border:`2px solid ${currentBalance>0?"#ef444460":currentBalance<0?"#10b98160":"#1e3a5f"}`,
                                                        borderRadius:14, padding:"14px 16px", marginBottom:14, textAlign:"center"
                                                    }}>
                                                        <div style={{fontSize:11,color:"#64748b",marginBottom:4}}>
                                                            {currentBalance>0?"⚠️ إجمالي المديونية":currentBalance<0?"✅ له عندك":"✅ الحساب صافي"}
                                                        </div>
                                                        <div style={{fontSize:28,fontWeight:900,color:currentBalance>0?"#ef4444":currentBalance<0?"#10b981":"#64748b"}}>
                                                            {maskNum(Math.abs(Math.round(currentBalance*100)/100), privacyMode)} ج
                                                        </div>
                                                        {/* فصل القديم من الجديد لو فيه ديون قديمة */}
                                                        {hasOld && currentBalance > 0 && (
                                                            <div style={{marginTop:10,background:"#0d1120",borderRadius:10,padding:"10px 12px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                                                                <div style={{background:"#f59e0b12",border:"1px solid #f59e0b40",borderRadius:8,padding:"8px 6px"}}>
                                                                    <div style={{fontSize:10,color:"#f59e0b",fontWeight:700,marginBottom:2}}>📌 قديم</div>
                                                                    <div style={{fontSize:16,fontWeight:900,color:"#f59e0b"}}>{maskNum(remainOld, privacyMode)} ج</div>
                                                                </div>
                                                                <div style={{background:"#ef444412",border:"1px solid #ef444440",borderRadius:8,padding:"8px 6px"}}>
                                                                    <div style={{fontSize:10,color:"#ef4444",fontWeight:700,marginBottom:2}}>🆕 جديد</div>
                                                                    <div style={{fontSize:16,fontWeight:900,color:"#ef4444"}}>{maskNum(remainNew, privacyMode)} ج</div>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })()}

                                            {/* الدورات */}
                                            {reversedSessions.map((sess, sIdx) => {
                                                const sessBalance = Math.round(sess.reduce((s,m)=>s+(m.type==="debit"?m.amount:-m.amount),0)*100)/100;
                                                const isSettled = Math.abs(sessBalance) < 0.01;
                                                const isOpen = sIdx === 0 && !isSettled;
                                                const owesMe = sessBalance > 0;   // العميل عليه
                                                const owedByMe = sessBalance < 0; // أنا عليّ (زي الجمعية)
                                                const realIdx = reversedSessions.length - 1 - sIdx;
                                                return (
                                                    <div key={sIdx} style={{marginBottom:16}}>
                                                        {/* هيدر الدورة */}
                                                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                                                            <div style={{fontSize:11,fontWeight:700,color: isOpen?(owedByMe?"#10b981":"#f59e0b"):"#10b981"}}>
                                                                {isOpen
                                                                    ? (owedByMe ? "🟢 دورة مفتوحة — له عندك" : "🔴 الدورة الحالية (مفتوحة)")
                                                                    : `✅ دورة ${realIdx+1} — مسوّاها`}
                                                            </div>
                                                            <div style={{fontSize:11,color: owesMe?"#ef4444":owedByMe?"#10b981":"#64748b",fontWeight:700}}>
                                                                {owesMe ? `باقي ${formatNum(sessBalance)} ج` : owedByMe ? `له ${formatNum(Math.abs(sessBalance))} ج` : "✓ صافي"}
                                                            </div>
                                                        </div>

                                                        {/* حركات الدورة */}
                                                        {[...sess].reverse().map(m => (
                                                            <div key={m.id} style={{
                                                                background:"#0a1628",
                                                                border:`1px solid ${m.type==="debit"?"#ef444425":"#10b98125"}`,
                                                                borderRadius:10, padding:"10px 12px", marginBottom:6
                                                            }}>
                                                                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                                                    <div style={{flex:1}}>
                                                                        <div style={{fontSize:12,fontWeight:700,color:m.type==="debit"?"#fca5a5":"#6ee7b7"}}>

                                                        <span style={{fontSize:10,background: isAvail ? "#22c55e20" : "#ef444420",color: availColor,border:`1px solid ${availColor}40`,borderRadius:20,padding:"2px 8px",fontWeight:700}}>{availLabel}</span>
                                                        {isCritical && <span style={{fontSize:10,background:"#ef444420",color:"#ef4444",border:"1px solid #ef444450",borderRadius:20,padding:"2px 8px",fontWeight:700,animation:"blink 1s infinite"}}>⚠️ تجاوز 85%</span>}
                                                        {isWarning  && <span style={{fontSize:10,background:"#f59e0b15",color:"#f59e0b",border:"1px solid #f59e0b40",borderRadius:20,padding:"2px 8px",fontWeight:700}}>⚡ اقترب من الحد</span>}
                                                    </div>
                                                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                                                        {isAdmin && <button onClick={()=>setInstaPays(p=>p.map(x=>x.id===ip.id?{...x,available:!isAvail}:x))} title={isAvail?"إخفاء إنستا باي من الموبايل (بياناته وسجله هيفضلوا محفوظين)":"إظهار إنستا باي تاني في الموبايل"} style={{background: isAvail?"#ef444420":"#22c55e20",border:`1px solid ${isAvail?"#ef444440":"#22c55e40"}`,borderRadius:8,padding:"3px 8px",color: isAvail?"#ef4444":"#22c55e",cursor:"pointer",fontSize:11,fontWeight:700}}>{isAvail?"📴 إخفاء من الموبايل":"✅ إظهار في الموبايل"}</button>}
                                                        {isAdmin && <button onClick={()=>{setEditLineId(ip.id);setModal("editLine");}} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer"}}>✏️</button>}

                                                            }
                                                        }} style={{background:"#ef444420",border:"1px solid #ef444440",borderRadius:8,padding:"3px 8px",color:"#ef4444",cursor:"pointer",fontSize:11,fontWeight:700}}>🗑️</button>}

                                                        <span style={{color:cntColor(mtPct)}}>شهري: <b>{maskNum(ipStats.usedMonthTransfer, privacyMode)}</b> / {formatNum(instapayMonthlyLimit)}</span>

                                                    <div style={{marginTop:3}}><ProgressBar used={ipStats.usedMonthTransfer} limit={instapayMonthlyLimit} color="#f59e0b" showPct={true}/></div>

                                                <div>
                                                    <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#7a8fa8",marginBottom:2}}>

                                                    </div>
                                                    <ProgressBar used={ipStats.usedTodayReceive} limit={instapayDailyLimit} color="#10b981"/>
                                                    <div style={{marginTop:3}}><ProgressBar used={ipStats.usedMonthReceive} limit={instapayMonthlyLimit} color="#10b981" showPct={true}/></div>
                                                </div>

                        {/* FINANCE */}
                        {tab==="finance" && (

                                                    {log.type === "income" ? `+ ${formatNum(log.amount)}` : `- ${formatNum(log.amount)}`}
                                                </span>
                                                {isAdmin && <button onClick={()=>deleteFinanceLog(log)} style={{background:"none",border:"none",color:"#475569",cursor:"pointer"}}>🗑️</button>}
                                            </div>
                                        </div>

                            const peopleOwedToMe = people.reduce((s,p)=>s+Math.max(0,getPersonBalance(p)),0);
                            const peopleIOwe     = people.reduce((s,p)=>s+Math.max(0,-getPersonBalance(p)),0);
                            const abuAdiIOwe     = abuadiTarget || 0;
                            const cashOnHand     = inventory.cash || 0;
                            const owedToOthers   = inventory.owedToOthers || 0;

                                    <div style={{fontSize:15,fontWeight:800,color:color||"#e2e8f0"}}>{formatNum(value)} ج</div>

                                        <div style={{fontSize:13,color:"#94a3b8"}}>💎 صافي فلوسك الحقيقية</div>
                                        <div style={{fontSize:32,fontWeight:900,color:netWorth>=0?"#10b981":"#ef4444",margin:"10px 0"}}>{formatNum(netWorth)} ج</div>
                                        <div style={{fontSize:11,color:"#64748b"}}>إجمالي اللي معاك ناقص إجمالي اللي عليك</div>
                                    </div>

                                                <input type="number" value={inventory.cash||0}
                                                    onChange={e=>setInventory(p=>({...p, cash: parseFloat(e.target.value)||0}))}
                                                    style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:8,padding:"8px 10px",color:"#fff",fontSize:14,marginTop:4}}/>
                                            </div>
                                            <div>
                                                <label style={{fontSize:11,color:"#64748b"}}>📤 ديون عليك لناس برة (مش أبو عدي)</label>
                                                <input type="number" value={inventory.owedToOthers||0}
                                                    onChange={e=>setInventory(p=>({...p, owedToOthers: parseFloat(e.target.value)||0}))}
                                                    style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:8,padding:"8px 10px",color:"#fff",fontSize:14,marginTop:4}}/>
                                            </div>
                                        </div>
                                        <div style={{marginTop:10}}>
                                            <label style={{fontSize:11,color:"#64748b"}}>📝 ملاحظات (اختياري)</label>
                                            <input type="text" value={inventory.note||""}

                                                style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:8,padding:"8px 10px",color:"#fff",fontSize:13,marginTop:4}}/>

                                    <Row icon="🤲" label="ديون ليك على الناس" value={peopleOwedToMe} color="#10b981" sub="من شاشة الأشخاص" />

                                    </div>

                                    <Row icon="📤" label="ديون عليك لناس برة النظام" value={owedToOthers} color="#ef4444" />
                                    <div style={{background:"#ef444415",border:"1px solid #ef444440",borderRadius:12,padding:"10px 14px",marginBottom:18,display:"flex",justifyContent:"space-between"}}>

                                </div>
                            );

                    {tab==="settings" && (

                            lines={lines} visas={visas} instaPays={instaPays}

                                background:"linear-gradient(135deg,#7c3aed,#6d28d9)",

                                background:"#1e293b",
                                border:"1px solid #334155",
                                borderRadius:10, padding:"8px 12px",
                                color:"#64748b", fontSize:12, cursor:"pointer",

                                            borderRadius: 10,

                                                <div style={{fontSize:12,color:"#a78bfa",fontWeight:700}}>✓ تم رفع الصورة</div>
                                                <div style={{fontSize:11,color:"#64748b"}}>اضغط لتغيير الصورة</div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div>
                                            <div style={{fontSize:24,marginBottom:4}}>📸</div>

                                            <div style={{fontSize:10,color:"#3d4f65",marginTop:3}}>يدعم صور فودافون كاش وإنستا باي</div>
                                        </div>
                                    )}
                                </div>
                                <input
                                    ref={ocrInputRef}
                                    type="file"
                                    accept="image/*"
                                    style={{display:"none"}}
                                    onChange={e=>{ if(e.target.files[0]) handleOcrImage(e.target.files[0]); }}
                                />

                                {/* نتيجة الـ OCR */}
                                {ocrResult && !ocrLoading && (

                                                <div style={{color: ocrResult.amount ? "#10b981" : "#ef4444",fontWeight:700}}>

                                            <div style={{background:"#111827",borderRadius:8,padding:"8px 10px"}}>

                                            </div>
                                        </div>
                                        <div style={{background:"#111827",borderRadius:8,padding:"8px 10px",marginBottom:8}}>

                                            </div>
                                        </div>
                                        <div style={{fontSize:10,color:"#475569",background:"#0d1120",borderRadius:6,padding:"6px 8px"}}>
                                            ⚠️ راجع نوع العملية في الأسفل قبل الحفظ
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* 2. باقي حقول الفورم */}

                                <select
                                    value={form.type}
                                    onChange={e => setForm({...form, type: e.target.value})}
                                    style={{ width: "100%", background: "#0f1e3d", border: "1px solid #1e3a5f", borderRadius: 10, padding: 11, color: "#e2e8f0" }}

                                    <option value="transfer">💸 تحويل (سحب من المحفظة)</option>
                                    <option value="receive">📥 استلام (إيداع في المحفظة)</option>
                                    <option value="internal_transfer">🔄 تحويل داخلي (من خط لخط)</option>
                                    <option value="bank_withdraw">🏦 سحب بنك (عمولة {(bankWithdrawRate*100).toFixed(2)}%)</option>

                                </select>

                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>

                                <Field label="الوقت"><Input type="time" value={form.time} onChange={v => setForm({...form, time: v})}/></Field>
                            </div>

                            <Field label="المبلغ (ج)">
                                <input
                                    ref={amountFieldRef}
                                    type="text"
                                    value={form.amount || ""}
                                    placeholder="0.00 (يمكنك كتابة حسبة مثل 1000+20)"

                                    onBlur={(e) => {
                                        const val = e.target.value.trim();
                                        if (!val) return;
                                        const evaluated = evaluateExpression(val);
                                        const num = parseFloat(evaluated);
                                        if (!isNaN(num) && isFinite(num) && num > 0) {
                                            setForm({...form, amount: String(Math.round(num * 100) / 100)});
                                        }
                                    }}
                                    onKeyDown={(e) => {
                                        if (e.key === "Enter") { e.preventDefault(); personNameFieldRef.current?.focus(); personNameFieldRef.current?.select?.(); }

                                        width: "100%",
                                        background: "#0f1e3d",
                                        border: "1px solid #1e3a5f",
                                        borderRadius: 10,

                                        color: "#e2e8f0",
                                        fontSize: 14,
                                        outline: "none",
                                        boxSizing: "border-box",
                                        textAlign: "right"

                            {/* ⭐ FEATURE: حاسبة العمولة المدمجة */}

                                const amt = parseFloat(form.amount) || 0;
                                if (!amt || amt <= 0) return null;
                                const fRate  = commissionSettings?.fawriWithdrawRate  ?? 0.0057;
                                const fFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
                                const bRate  = commissionSettings?.bankWithdrawRate   ?? 0.002;
                                let commLabel = null, commVal = 0;
                                if (form.type === "fawri_withdraw") { commLabel = "عمولة سحب فوري"; commVal = Math.round((amt * fRate + fFixed) * 100) / 100; }
                                else if (form.type === "bank_withdraw") { commLabel = "عمولة سحب بنك"; commVal = Math.round(amt * bRate * 100) / 100; }
                                if (!commLabel) return null;
                                return (
                                    <div style={{background:"#10b98110",border:"1px solid #10b98130",borderRadius:10,padding:"8px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>

                                                        background:`${stepColors[i % stepColors.length]}20`,
                                                        border:`1.5px solid ${stepColors[i % stepColors.length]}`,
                                                        display:"flex",alignItems:"center",justifyContent:"center",

                                                    </div>
                                                    <div style={{textAlign:"left",flexShrink:0}}>

                                                                background: isSubmitting || !form.personName

                                                                border:"none",borderRadius:10,padding:"12px 0",
                                                                color:"#fff",fontSize:14,fontWeight:900,

                                                            onClick={() => setSplitConfirmed(false)}
