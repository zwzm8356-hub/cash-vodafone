    <style>
        /* ══════════════════════════════════════════
           Ultra-Dark OLED Theme — فودافون كاش
        ══════════════════════════════════════════ */
        :root {
            --bg-void:     #05070f;
            --bg-deep:     #0a0c16;
            --bg-card:     #0d1120;
            --bg-card2:    #111827;

            --text-mid:    #7a8fa8;

            --accent-red:  #e40000;

            --accent-green:#10b981;
            --accent-gold: #f59e0b;
            --accent-violet:#a78bfa;
            --accent-blue: #3b82f6;

            --glass-blur:  blur(18px);

            --radius-card: 14px;
            --radius-btn:  10px;

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-void);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-bright);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-void); }
        ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }

        /* ── Page fade-in ── */
        .page-container { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px) scale(0.99); }
            to   { opacity: 1; transform: translateY(0)   scale(1);    }
        }

        /* ── Blink ── */
        @keyframes blink {
            0%, 50%     { opacity: 1;   }
            50.1%, 100% { opacity: 0.45;}
        }

        /* ── Spinner ── */
        .loading-spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid rgba(30,58,95,0.35);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Glassmorphism Modal Overlay ── */
        .glass-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: flex-end;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

        }
        @keyframes overlayIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── Glass Modal Panel ── */
        .glass-modal {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(34,211,238,0.1);
            border-bottom: none;
            border-radius: 22px 22px 0 0;
            padding: 22px 20px 32px;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.25s cubic-bezier(0.22,0.61,0.36,1);
            box-shadow: 0 -4px 40px rgba(0,0,0,0.7);
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* ── Collapsible Accordion ── */
        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 10px 0;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid var(--border-dim);
            margin-bottom: 12px;
        }
        .accordion-arrow {
            width: 24px; height: 24px;
            background: var(--bg-card2);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: var(--text-mid);
            transition: transform 0.25s ease, background 0.2s ease;
            flex-shrink: 0;
        }
        .accordion-arrow.open {
            transform: rotate(180deg);
            background: rgba(34,211,238,0.08);
            color: var(--accent-cyan);
            border-color: rgba(34,211,238,0.25);
        }
        .accordion-body {
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1),
                        opacity   0.3s ease,
                        transform 0.3s ease;
        }
        .accordion-body.open  { opacity: 1; transform: translateY(0);   }
        .accordion-body.closed{ opacity: 0; transform: translateY(-6px);}

        /* ── Enhanced Progress Bar ── */
        .vl-track {
            width: 100%; height: 7px;
            background: rgba(255,255,255,0.04);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 4px;
        }
        .vl-fill {
            height: 100%; border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4,0,0.2,1),
                        background 0.4s ease;
            position: relative;
        }
        .vl-fill::after {
            content: '';
            position: absolute; right: 0; top: 0; bottom: 0;
            width: 8px;
            background: rgba(255,255,255,0.35);
            border-radius: 99px;
            filter: blur(2px);
        }

        /* ── Interactive Buttons ── */
        button {
            transition: opacity 0.15s ease, transform 0.15s ease,
                        box-shadow 0.15s ease, background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { opacity: 0.75; transform: scale(0.97); }

        /* ── Input Fields ── */
        input, select, textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Tajawal', sans-serif;
        }

            outline: none;
            border-color: rgba(34,211,238,0.45) !important;
            box-shadow: 0 0 0 2px rgba(34,211,238,0.08);

        /* ── Card hover glow ── */
        .line-card {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
        }
        .line-card:active { transform: scale(0.995); }

        /* ── Toast ── */
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(12px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    }
        }
        .toast-animate { animation: toastIn 0.2s ease; }
    </style>
</head>

        // ⭐ Safe Storage (localStorage مع fallback لـ in-memory لو مش متاح)
        const _memStore = {};

        function pad(n) { return String(n).padStart(2, "0"); }
        function nowStr() {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        function today() {

        function formatNum(n) { return Number(n).toLocaleString("ar-EG"); }
        function formatDateOnly(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split(" ");
            const dateParts = parts[0].split("-");
            return `${dateParts[2]}/${dateParts[1]}/${dateParts[0]} ${parts[1]||""}`;
        }
        function formatDateArabic(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split("-");
            const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
            const d = new Date(dateStr);
            const dayName = days[d.getDay()];
            return `${dayName} ${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        // ⭐ دالة ذكية لاستخراج البيانات من الرسالة
        const evaluateExpression = (input) => {
            try {
                const sanitized = input.replace(/[^0-9+\-*/.]/g, '');
                if (!sanitized) return "";
                const result = Function(`"use strict"; return (${sanitized})`)();
                return isNaN(result) ? input : String(result);
            } catch (e) {
                return input;
            }
        };

                function parseSmartMessage(text, lines = [], visas = []) {
            const result = {
                amount: "",
                personNumber: "",
                lineId: "",
                type: "transfer",
                notes: ""
            };
            if (!text.trim()) return result;
            // 1. استخراج المبلغ الذكي
            const amountMatch = text.match(/(?:مبلغ|قيمة)\s*(\d+(?:\.\d+)?)/) || text.match(/(\d{2,}(?:\.\d{1,2})?)\s*(?:جنيه|EGP)/) || text.match(/(\d{2,}(?:\.\d{1,2})?)/);
            if (amountMatch) result.amount = amountMatch[1];
            // 2. استخراج رقم تليفون العميل
            const phoneMatch = text.match(/(01[0-9]{9})/);
            if (phoneMatch) result.personNumber = phoneMatch[1];
            // 3. تحديد نوع العملية أوتوماتيك
            if (text.includes("تم استلام") || text.includes("إيداع") || text.includes("حوّل لك") || text.includes("تم استقبال")) {
                result.type = "receive";
            } else if (text.includes("تم تحويل") || text.includes("سحب") || text.includes("خصم")) {
                result.type = "transfer";
            }
            // 4. التعرف الذكي على اسم الخط أو الفيزا
            const allSources = [...lines, ...visas];
            for (const source of allSources) {
                if (source.name && text.includes(source.name)) {
                    result.lineId = source.id;
                    break;
                }
            }
            // 5. حفظ نص الرسالة في الملاحظات
            result.notes = `[رسالة تلقائية]: ${text.trim()}`;
            return result;
        }
        function ProgressBar({ used, limit, color, showPct }) {

        function App() {

            function calcSourceStats(source, txns) {
                const num = source.number;
                const sid = source.id;
                const todayStr = today();
                const monthStr = currentMonthStr();
                let usedTodayTransfer = 0, usedMonthTransfer = 0;
                let usedTodayReceive  = 0, usedMonthReceive  = 0;
                for (const t of txns) {
                    const tMonth = (t.date || "").slice(0, 7);
                    const isToday = t.date === todayStr;
                    const isMonth = tMonth === monthStr;
                    const isOutgoing = t.type === "transfer" || t.type === "bank_withdraw" || t.type === "fawri_withdraw";
                    // ⭐ مطابقة بـ sourceId أولاً (الأدق)، وإلا بـ رقم التليفون كـ fallback
                    const matchesOutgoing = t.sourceId === sid || (num && t.fromNumber === num);
                    const matchesIncoming = t.sourceId === sid || (num && t.toNumber === num);
                    // ⭐ نستخدم totalAmount (شامل العمولة) لعمليات السحب
                    const effectiveAmount = t.totalAmount || t.amount || 0;
                    if (isOutgoing && matchesOutgoing) {
                        if (isToday) usedTodayTransfer += effectiveAmount;
                        if (isMonth) usedMonthTransfer += effectiveAmount;
                    }
                    if (t.type === "receive" && matchesIncoming) {
                        if (isToday) usedTodayReceive += (t.amount || 0);
                        if (isMonth) usedMonthReceive += (t.amount || 0);
                    }
                }
                return { usedTodayTransfer, usedMonthTransfer, usedTodayReceive, usedMonthReceive };
            }

            // ⭐ دالة معالجة الـ Smart Paste مع AI Fallback (مُصلَّحة)
            async function handleSmartPaste() {
                const pasteText = smartPaste.trim();
                if (!pasteText) { showToast("الصندوق فارغ — ضع نص الرسالة أولاً", "error"); return; }

                // نلتقط snapshot من sources قبل أي async call
                const sourcesSnapshot = [...sources];
                const parsed = parseSmartMessage(pasteText, lines, visas);

                // تحقق إذا الـ Regex استخرج البيانات الأساسية
                const regexOk = !!(parsed.amount && parsed.personNumber);

                if (regexOk) {
                    // Regex نجح — استخدمه مباشرة
                    const matchedSource = parsed.lineId ? sourcesSnapshot.find(s => s.id === parsed.lineId) : null;
                    setForm(f => ({
                        ...f,
                        amount:     parsed.amount      || f.amount,
                        toNumber:   parsed.personNumber || f.toNumber,
                        type:       parsed.type         || f.type,
                        sourceId:   matchedSource ? matchedSource.id   : f.sourceId,
                        sourceType: matchedSource ? matchedSource.type  : f.sourceType,
                    }));
                    setSmartPaste("");
                    if (matchedSource) showToast(`✅ تم تحديد ${matchedSource.name} تلقائياً`);
                    else showToast("✓ تم استخراج البيانات من الرسالة");
                    return;
                }

                // Regex فشل — استخدم Gemini AI
                const keyMissing = !GEMINI_API_KEY || GEMINI_API_KEY === "ضع_مفتاح_الـ_API_هنا" || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE";
                if (keyMissing) {
                    // Fallback بدون AI — استخدم ما أمكن من الـ Regex
                    setForm(f => ({
                        ...f,
                        amount:   parsed.amount      || f.amount,
                        toNumber: parsed.personNumber || f.toNumber,
                        type:     parsed.type         || f.type,
                    }));
                    setSmartPaste("");
                    showToast("⚠️ بيانات جزئية (أضف Gemini API للاستخراج الكامل)", "error");
                    return;
                }

                showToast("🤖 AI بيحلل الرسالة...");
                try {
                    const systemP = `أنت مساعد ذكي لتطبيق فودافون كاش. مهمتك استخراج بيانات العملية من رسالة SMS أو نص.
أرجع JSON فقط بدون أي نص إضافي أو markdown backticks:
{"amount": "المبلغ رقماً فقط بدون فراغات أو فواصل", "personNumber": "رقم التليفون 11 رقم يبدأ بـ 01", "type": "transfer أو receive"}
- type = "receive" إذا كانت الرسالة تدل على استلام أو إيداع أو حوّل لك
- type = "transfer" إذا كانت تدل على تحويل أو سحب أو خصم
- اترك الحقل فارغاً "" إذا مش موجود في الرسالة
- لا تضف أي نص قبل أو بعد الـ JSON`;

                    const aiRaw = await callGemini(systemP, `استخرج البيانات من الرسالة التالية:
"${pasteText}"`);

                    // تنظيف الرد من أي markdown أو نص زيادة
                    const cleaned = aiRaw
                        .replace(/```json\s*/gi, "")
                        .replace(/```\s*/g, "")
                        .trim();

                    let aiData = {};
                    try {
                        aiData = JSON.parse(cleaned);
                    } catch(parseErr) {
                        // لو فشل الـ JSON parse، نحاول نستخرج بـ regex من الرد
                        const amtM = cleaned.match(/"amount"\s*:\s*"([^"]+)"/);
                        const numM = cleaned.match(/"personNumber"\s*:\s*"([^"]+)"/);
                        const typM = cleaned.match(/"type"\s*:\s*"([^"]+)"/);
                        aiData = {
                            amount:       amtM ? amtM[1] : "",
                            personNumber: numM ? numM[1] : "",
                            type:         typM ? typM[1] : "transfer",
                        };
                    }

                    // دمج نتيجة AI مع Regex كـ fallback لكل حقل
                    const finalAmount = (aiData.amount || parsed.amount || "").replace(/,/g, "");
                    const finalPhone  = aiData.personNumber || parsed.personNumber || "";
                    const finalType   = aiData.type || parsed.type || "transfer";
                    const matchedSrc  = parsed.lineId ? sourcesSnapshot.find(s => s.id === parsed.lineId) : null;

                    setForm(f => ({
                        ...f,
                        amount:     finalAmount  || f.amount,
                        toNumber:   finalPhone   || f.toNumber,
                        type:       finalType    || f.type,
                        sourceId:   matchedSrc ? matchedSrc.id   : f.sourceId,
                        sourceType: matchedSrc ? matchedSrc.type  : f.sourceType,
                    }));
                    setSmartPaste("");
                    showToast("✨ AI استخرج البيانات بنجاح");

                } catch(e) {
                    // Gemini فشل — استخدم ما استخرجه الـ Regex جزئياً
                    setForm(f => ({
                        ...f,
                        amount:   parsed.amount      || f.amount,
                        toNumber: parsed.personNumber || f.toNumber,
                        type:     parsed.type         || f.type,
                    }));
                    setSmartPaste("");
                    showToast(`⚠️ تم استخراج جزئي — ${e.message?.slice(0,40) || "راجع البيانات"}`, "error");
                }
            }

            // ⭐ حساب العمولة بناءً على نوع العملية
            function calcCommission(type, amount) {
                if (type === "bank_withdraw") {
                    const comm = Math.round(amount * 0.01 * 100) / 100;
                    return { commission: comm, total: Math.round((amount + comm) * 100) / 100 };
                }
                if (type === "fawri_withdraw") {
                    const comm = Math.round(((amount * 0.0057) + 15) * 100) / 100;
                    return { commission: comm, total: Math.round((amount + comm) * 100) / 100 };
                }
                return { commission: 0, total: amount };
            }

            function addTransaction() {
                const amount = parseFloat(form.amount);
                if (!form.date || !form.time || !form.personName || !amount || !form.sourceId) { 
                    showToast("أكمل كل البيانات","error"); 
                    return; 
                }

                if (form.type === "transfer" && (!form.fromNumber || !form.toNumber)) {
                    showToast("أكمل أرقام التحويل","error"); 
                    return;
                }

                const personName = form.personName.trim();
                const fullDateTime = `${form.date} ${form.time}`;

                // ⭐ حساب العمولة للأنواع الجديدة
                const { commission, total: totalAmount } = calcCommission(form.type, amount);
                const isWithdraw = form.type === "bank_withdraw" || form.type === "fawri_withdraw";

                // ⭐ إضافة تفاصيل العمولة تلقائياً في الملاحظات
                let autoNotes = form.notes || "";
                if (isWithdraw && commission > 0) {
                    const commLabel = form.type === "bank_withdraw"
                        ? `عمولة بنك 1%: ${commission} ج`
                        : `عمولة فوري (0.57%+15ج): ${commission} ج`;
                    autoNotes = `[${commLabel} | الإجمالي المسحوب: ${totalAmount} ج]${autoNotes ? " " + autoNotes : ""}`;
                }
                
                // ⭐ التقاط رقم الخط/الفيزا المختار تلقائياً لضمان المطابقة في calcSourceStats
                const selectedSrc = sources.find(s => s.id === form.sourceId);
                const actualLineNumber = selectedSrc?.number || "";

            function updateSource(sourceId, sourceType, amount, txnType) {
                // ⭐ سحب بنك وسحب فوري = خروج (زي transfer)
                const isOutgoing = txnType === "transfer" || txnType === "bank_withdraw" || txnType === "fawri_withdraw";
                const delta = isOutgoing ? -amount : amount;
                const updater = prev => prev.map(item => {
                    if (item.id !== sourceId) return item;
                    return {
                        ...item,
                        usedTodayTransfer: (item.usedTodayTransfer||0) + (isOutgoing ? amount : 0),
                        usedMonthTransfer: (item.usedMonthTransfer||0) + (isOutgoing ? amount : 0),
                        usedTodayReceive:  (item.usedTodayReceive||0)  + (txnType==="receive" ? amount : 0),
                        usedMonthReceive:  (item.usedMonthReceive||0)  + (txnType==="receive" ? amount : 0),
                        balance: (item.balance||0) + delta
                    };
                });
                if (sourceType === "line") setLines(updater);
                else if (sourceType === "visa") setVisas(updater);
                else if (sourceType === "instapay") setInstaPays(updater);
            }

            function deleteTransaction(txn) {
                setTransactions(prev => prev.filter(t => t.id !== txn.id));
                const isOutgoing = txn.type === "transfer" || txn.type === "bank_withdraw" || txn.type === "fawri_withdraw";
                const effectiveAmount = txn.totalAmount || txn.amount; // الإجمالي شامل العمولة
                const delta = isOutgoing ? effectiveAmount : -effectiveAmount;
                const reverter = prev => prev.map(item => {
                    if (item.id !== txn.sourceId) return item;
                    return {
                        ...item,
                        usedTodayTransfer: Math.max(0, (item.usedTodayTransfer||0) - (isOutgoing ? effectiveAmount : 0)),
                        usedMonthTransfer: Math.max(0, (item.usedMonthTransfer||0) - (isOutgoing ? effectiveAmount : 0)),
                        usedTodayReceive:  Math.max(0, (item.usedTodayReceive||0)  - (txn.type==="receive" ? effectiveAmount : 0)),
                        usedMonthReceive:  Math.max(0, (item.usedMonthReceive||0)  - (txn.type==="receive" ? effectiveAmount : 0)),
                        balance: (item.balance||0) + delta
                    };
                });
                if (txn.sourceType === "line") setLines(reverter);
                else if (txn.sourceType === "visa") setVisas(reverter);
                else if (txn.sourceType === "instapay") setInstaPays(reverter);
                setConfirmDelete(null);
                showToast("تم حذف العملية ✓");
            }

            // ⭐ عكس العملية - بيرجع الأرقام كأن شيئاً لم يكن
            function reverseTransaction(txn) {
                const isOutgoing = txn.type === "transfer" || txn.type === "bank_withdraw" || txn.type === "fawri_withdraw";
                const effectiveAmount = txn.totalAmount || txn.amount;
                const delta = isOutgoing ? effectiveAmount : -effectiveAmount;

                // نحذف العملية من القائمة
                setTransactions(prev => prev.filter(t => t.id !== txn.id));

                // نعكس أرقام الخط/الفيزا/انستاباي
                const reverter = prev => prev.map(item => {
                    if (item.id !== txn.sourceId) return item;
                    return {
                        ...item,
                        usedTodayTransfer: Math.max(0, (item.usedTodayTransfer||0) - (isOutgoing ? effectiveAmount : 0)),
                        usedMonthTransfer: Math.max(0, (item.usedMonthTransfer||0) - (isOutgoing ? effectiveAmount : 0)),
                        usedTodayReceive:  Math.max(0, (item.usedTodayReceive||0)  - (txn.type==="receive" ? effectiveAmount : 0)),
                        usedMonthReceive:  Math.max(0, (item.usedMonthReceive||0)  - (txn.type==="receive" ? effectiveAmount : 0)),
                        balance: (item.balance||0) + delta
                    };
                });
                if (txn.sourceType === "line") setLines(reverter);
                else if (txn.sourceType === "visa") setVisas(reverter);
                else if (txn.sourceType === "instapay") setInstaPays(reverter);

                // نعكس سجل الشخص لو موجود
                setPeople(prev => prev.map(p => {
                    if (p.personName.toLowerCase() !== txn.personName?.toLowerCase()) return p;
                    return {
                        ...p,
                        records: (p.records || []).filter(r => !(
                            Math.abs(r.amount) === txn.amount &&
                            r.date === (txn.dateTime || txn.date)
                        )),
                        lastUpdated: nowStr()
                    };
                }));

                setConfirmDelete(null);
                showToast("↩️ تم عكس العملية وإرجاع الأرقام ✓");
            }

            function updateCapitalDirectly() {
                // ⭐ دعم العمليات الحسابية (مثلاً: capital + 500 أو 12000)
                let amt;
                const rawInput = capitalInput.trim();
                // لو بدأ بعملية حسابية زي +500 أو -200، طبّقها على رأس المال الحالي
                if (/^[+\-*/]/.test(rawInput)) {
                    try {
                        const sanitized = rawInput.replace(/[^0-9+\-*/.]/g, '');
                        amt = Function(`"use strict"; return (${capital}${sanitized})`)();
                    } catch(e) { amt = NaN; }
                } else {
                    const sanitized = rawInput.replace(/[^0-9+\-*/.]/g, '');
                    try { amt = sanitized ? Function(`"use strict"; return (${sanitized})`)() : NaN; } catch(e) { amt = NaN; }
                }
                if (isNaN(amt) || amt < 0) { showToast("أدخل مبلغ صحيح", "error"); return; }
                amt = Math.round(amt * 100) / 100;
                // ⭐ منع الـ listener من يـoverwrite
                capitalWriting.current = true;
                setCapital(amt);
                // ⭐ حفظ مباشر في Firebase بدون انتظار useEffect
                if (auth.currentUser) {
                    try { 
                        db.ref('capital').set(amt).then(() => {
                            setTimeout(() => { capitalWriting.current = false; }, 2000);
                        }).catch(() => { capitalWriting.current = false; });
                    } catch(e){ capitalWriting.current = false; }
                } else {
                    setTimeout(() => { capitalWriting.current = false; }, 2000);
                }
                saveToLocalStorage('capital', amt);
                setCapitalInput("");
                setModal(null);
                showToast(`✓ رأس المال أصبح ${formatNum(amt)} ج`);
            }

            function saveDailySummary(isAutomatic = false) {

                const todayIncome = financeLogs.filter(l => l.date && l.date.startsWith(todayStr) && l.type === "income").reduce((s, l) => s + l.amount, 0);
                const todayExpense = financeLogs.filter(l => l.date && l.date.startsWith(todayStr) && l.type === "expense").reduce((s, l) => s + l.amount, 0);
                
                const totalTransferred = todayTxnsToArchive.filter(t => t.type === "transfer").reduce((s, t) => s + t.amount, 0);
                const totalReceived = todayTxnsToArchive.filter(t => t.type === "receive").reduce((s, t) => s + t.amount, 0);

                const summary = {
                    date: todayStr,
                    savedAt: nowStr(),
                    isAutomatic,
                    totalTransactions: todayTxnsToArchive.length,
                    totalTransferred,
                    totalReceived,
                    income: todayIncome,
                    expense: todayExpense,
                    netProfit: todayIncome - todayExpense,
                    capital,
                    linesSnapshot: lines.map(l => ({
                        id: l.id, name: l.name, number: l.number,
                        usedTodayTransfer: l.usedTodayTransfer || 0,
                        usedTodayReceive: l.usedTodayReceive || 0,
                        usedMonthTransfer: l.usedMonthTransfer || 0,

                    })),
                };

                // حفظ في Firebase تحت daily_summaries/YYYY-MM-DD
                if (auth.currentUser) {

                            </Field>

                                style={{width:"100%",background:"linear-gradient(135deg,#a78bfa,#9370db)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>
                                ✓ إضافة العميل
                            </button>
                        </Modal>
                    )}

                    {/* MODAL: إضافة حركة */}
                    {custModal==="addMove" && selectedPerson && (
                        <Modal title={custMoveForm.type==="debit" ? "➕ حوّل مني" : "💵 أعطاني / سدّد"} onClose={()=>setCustModal(null)}>
                            {/* اختيار نوع الحركة */}
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
                                <button onClick={()=>setCustMoveForm(f=>({...f,type:"debit"}))}
                                    style={{background:custMoveForm.type==="debit"?"linear-gradient(135deg,#ef4444,#dc2626)":"#1e293b",border:"none",borderRadius:10,padding:12,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                                    ➕ حوّل مني
                                </button>
                                <button onClick={()=>setCustMoveForm(f=>({...f,type:"credit"}))}
                                    style={{background:custMoveForm.type==="credit"?"linear-gradient(135deg,#10b981,#059669)":"#1e293b",border:"none",borderRadius:10,padding:12,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                                    💵 أعطاني
                                </button>
                            </div>
                            <Field label="المبلغ (ج)">
                                <Input value={custMoveForm.amount} onChange={v=>setCustMoveForm(f=>({...f,amount:v}))} placeholder="0" type="number"/>
                            </Field>
                            <Field label="ملاحظة (اختياري)">
                                <Input value={custMoveForm.note} onChange={v=>setCustMoveForm(f=>({...f,note:v}))}
                                    placeholder={custMoveForm.type==="debit"?"تحويل كاش":"سداد دفعة"}/>
                            </Field>
                            {/* معاينة */}
                            {custMoveForm.amount && parseFloat(custMoveForm.amount) > 0 && (
                                <div style={{background:"#0f1e3d",borderRadius:10,padding:12,marginBottom:14,textAlign:"center"}}>
                                    <div style={{fontSize:11,color:"#64748b",marginBottom:4}}>
                                        {custMoveForm.type==="debit"?"ستضاف على مديونيته":"ستُخصم من مديونيته"}
                                    </div>
                                    <div style={{fontSize:20,fontWeight:900,color:custMoveForm.type==="debit"?"#ef4444":"#10b981"}}>
                                        {custMoveForm.type==="debit"?"+ ":"- "}{formatNum(parseFloat(custMoveForm.amount)||0)} ج
                                    </div>
                                    <div style={{fontSize:11,color:"#475569",marginTop:4}}>
                                        الرصيد بعد: {formatNum(Math.abs(getPersonBalance(selectedPerson) + (custMoveForm.type==="debit"?1:-1)*(parseFloat(custMoveForm.amount)||0)))} ج
                                        {(getPersonBalance(selectedPerson) + (custMoveForm.type==="debit"?1:-1)*(parseFloat(custMoveForm.amount)||0)) > 0 ? " عليه" : " له"}
                                    </div>
                                </div>
                            )}
                            <button onClick={()=>addCustomerMove(selectedPerson.id)}
                                style={{width:"100%",background:custMoveForm.type==="debit"?"linear-gradient(135deg,#ef4444,#dc2626)":"linear-gradient(135deg,#10b981,#059669)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>
                                ✓ تسجيل الحركة
                            </button>
                        </Modal>
                    )}

                    {/* MODAL: Add Finance */}
                    {modal==="addFinance" && (
                        <Modal title={`عملية مالية ${financeTab === "daily" ? "يومية" : "شهرية"}`} onClose={()=>setModal(null)}>
                            <Field label="النوع">
                                <select value={financeForm.type} onChange={e=>setFinanceForm(f=>({...f, type: e.target.value}))}
                                    style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:10,padding:"11px 14px",color:"#e2e8f0",fontSize:14,outline:"none"}}>
                                    <option value="income">مكسب</option>
                                    <option value="expense">مصاريف</option>
                                </select>
                            </Field>
                            <Field label="المبلغ"><Input value={financeForm.amount} onChange={v=>setFinanceForm(f=>({...f, amount: v}))} placeholder="0" type="number"/></Field>
                            <Field label="الوصف"><Input value={financeForm.desc} onChange={v=>setFinanceForm(f=>({...f, desc: v}))} placeholder="..."/></Field>
                            <button onClick={addFinanceLog} style={{width:"100%",background: financeForm.type === "income" ? "linear-gradient(135deg,#10b981,#059669)" : "linear-gradient(135deg,#ef4444,#dc2626)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                        </Modal>
                    )}

                    {/* MODAL: Edit Capital */}
                    {modal==="editCapital" && (
                        <Modal title="✏️ تعديل رأس المال" onClose={()=>{setModal(null);setCapitalInput("");}}>
                            {/* القيمة الحالية */}
                            <div style={{background:"#0f1e3d",border:"1px solid #3b82f640",borderRadius:12,padding:14,marginBottom:16,textAlign:"center"}}>
                                <div style={{fontSize:12,color:"#64748b",marginBottom:4}}>رأس المال الحالي</div>
                                <div style={{fontSize:26,fontWeight:900,color:"#3b82f6"}}>{formatNum(capital)} ج</div>
                            </div>
                            {/* أزرار سريعة */}
                            <div style={{fontSize:11,color:"#64748b",marginBottom:6,fontWeight:600}}>تعديل سريع</div>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:14}}>
                                {[+500,+1000,+5000,-500,-1000,-5000].map(v=>(
                                    <button key={v} onClick={()=>setCapitalInput(String(v>=0?"+"+v:v))}
                                        style={{background:v>0?"#10b98120":"#ef444420",border:`1px solid ${v>0?"#10b98140":"#ef444440"}`,borderRadius:8,padding:"6px 0",color:v>0?"#10b981":"#ef4444",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                                        {v>0?"+":""}{v.toLocaleString("ar-EG")}
                                    </button>
                                ))}
                            </div>
                            {/* حقل الإدخال */}
                            <Field label="المبلغ الجديد أو عملية حسابية (مثلاً: 15000 أو +500 أو -200)">
                                <input
                                    value={capitalInput}
                                    onChange={e=>setCapitalInput(e.target.value)}
                                    placeholder={`الحالي: ${capital} — أو اكتب +500 للزيادة`}
                                    autoFocus
                                    style={{width:"100%",background:"#0f1e3d",border:"1px solid #3b82f6",borderRadius:10,padding:"13px 14px",color:"#e2e8f0",fontSize:16,outline:"none",boxSizing:"border-box",textAlign:"right",fontFamily:"'Tajawal',sans-serif",fontWeight:700}}
                                />
                            </Field>
                            {/* معاينة النتيجة */}
                            {capitalInput.trim() && (()=>{
                                let preview = null;
                                try {
                                    const raw = capitalInput.trim();
                                    const sanitized = raw.replace(/[^0-9+\-*/.]/g,'');
                                    if (/^[+\-*/]/.test(raw)) {
                                        preview = Function(`"use strict"; return (${capital}${sanitized})`)();
                                    } else {
                                        preview = sanitized ? Function(`"use strict"; return (${sanitized})`)() : null;
                                    }
                                } catch(e){}
                                if (preview === null || isNaN(preview) || preview < 0) return null;
                                const diff = Math.round((preview - capital)*100)/100;
                                return (
                                    <div style={{background:"#0a1628",border:"1px solid #3b82f640",borderRadius:10,padding:12,marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                        <div style={{fontSize:12,color:"#64748b"}}>النتيجة</div>
                                        <div>
                                            <span style={{fontSize:18,fontWeight:900,color:"#3b82f6"}}>{formatNum(Math.round(preview*100)/100)} ج</span>
                                            {diff !== 0 && <span style={{fontSize:12,marginRight:8,color:diff>0?"#10b981":"#ef4444",fontWeight:700}}>{diff>0?"+":""}{formatNum(diff)} ج</span>}
                                        </div>
                                    </div>
                                );
                            })()}
                            <button onClick={updateCapitalDirectly} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#2563eb)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 15px #3b82f640"}}>✓ حفظ رأس المال</button>
                        </Modal>
                    )}

                    {/* MODAL: Edit Line */}
                    {modal==="editLine" && editLineId && (
                        <EditSourceModal
                            source={[...lines,...visas,...instaPays].find(s=>s.id===editLineId)}
                            isVisa={editLineId.startsWith("visa")}
                            onSave={updated=>{
                                if (editLineId.startsWith("visa")) setVisas(p=>p.map(v=>v.id===editLineId?{...v,...updated}:v));
                                else if (editLineId.startsWith("instapay")) setInstaPays(p=>p.map(v=>v.id===editLineId?{...v,...updated}:v));
                                else setLines(p=>p.map(l=>l.id===editLineId?{...l,...updated}:l));
                                setModal(null); showToast("تم التحديث ✓");
                            }}
                            onClose={()=>setModal(null)}
                        />
                    )}
                </div>
            );
        }

        function AbuAdiScreen({
            target, setTarget, targetInput, setTargetInput,
            amountInput, setAmountInput, payments, setPayments,
            editModal, setEditModal,
            mediaRecorderRef, audioChunksRef,
            recordingId, setRecordingId, recordingState, setRecordingState,
            pendingAudio, setPendingAudio,
            showToast, formatNum,
            abuadiDate, setAbuadiDate,
            canEdit = false
        }) {
            const totalPaid = payments.filter(p => {
                const d = new Date(p.ts);
                const todayStr = new Date().toDateString();
                return d.toDateString() === todayStr;
            }).reduce((s,p) => s + p.amount, 0);

            const remaining = Math.max(0, target - totalPaid);
            const pct = target > 0 ? Math.min(100, (totalPaid / target) * 100) : 0;
            const todayPayments = [...payments]
                .filter(p => new Date(p.ts).toDateString() === new Date().toDateString())
                .sort((a,b) => b.ts - a.ts);

            function nowMsStr() {
                const d = new Date();
                const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
                const dd = String(d.getDate()).padStart(2,"0");
                const mm = String(d.getMonth()+1).padStart(2,"0");
                const yy = d.getFullYear();
                const hh = String(d.getHours()).padStart(2,"0");
                const min = String(d.getMinutes()).padStart(2,"0");
                const ss = String(d.getSeconds()).padStart(2,"0");
                const ms = String(d.getMilliseconds()).padStart(3,"0");
                return `${days[d.getDay()]} ${dd}/${mm}/${yy} — ${hh}:${min}:${ss}.${ms}`;
            }

            function startRecording() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast("المتصفح لا يدعم التسجيل الصوتي","error"); return;
                }
                navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
                    audioChunksRef.current = [];
                    const recorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = recorder;
                    recorder.ondataavailable = e => { if(e.data.size>0) audioChunksRef.current.push(e.data); };
                    recorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, {type:"audio/webm"});
                        const reader = new FileReader();
                        reader.onload = ev => {
                            setPendingAudio(ev.target.result);
                            setRecordingState("done");
                            stream.getTracks().forEach(t=>t.stop());
                        };
                        reader.readAsDataURL(blob);
                    };
                    recorder.start();
                    setRecordingState("recording");
                    showToast("🔴 جاري التسجيل...");
                }).catch(() => { showToast("لم يتم السماح بالمايك","error"); });
            }

            function stopRecording() {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
                    mediaRecorderRef.current.stop();
                }
            }

            function cancelRecording() {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
                    mediaRecorderRef.current.stop();
                }
                setRecordingState("idle");
                setPendingAudio(null);
                audioChunksRef.current = [];
            }

            function addPayment() {
                const amt = parseFloat(amountInput);
                if (!amt || amt <= 0) { showToast("أدخل مبلغ صحيح","error"); return; }
                const newP = {
                    id: Date.now(),
                    amount: amt,
                    ts: Date.now(),
                    label: nowMsStr(),
                    audio: pendingAudio || null,
                };
                setPayments(prev => [newP, ...prev]);
                setAmountInput("");
                setPendingAudio(null);
                setRecordingState("idle");
                showToast(`✓ تم تسجيل دفعة ${formatNum(amt)} ج`);
            }

            function deletePayment(id) {
                setPayments(prev => prev.filter(p => p.id !== id));
                showToast("تم حذف الدفعة ✓");
            }

            function saveEdit() {
                if (!editModal) return;
                const newAmt = parseFloat(editModal.newAmount);
                if (!newAmt || newAmt <= 0) { showToast("أدخل مبلغ صحيح","error"); return; }
                setPayments(prev => prev.map(p => p.id === editModal.payment.id ? {...p, amount: newAmt} : p));
                setEditModal(null);
                showToast("تم التعديل ✓");
            }

            function clearToday() {
                const todayStr = new Date().toDateString();
                setPayments(prev => prev.filter(p => new Date(p.ts).toDateString() !== todayStr));
                setTarget(0);
                setTargetInput("");
                showToast("تم تصفية حساب اليوم ✓");
            }

            const settled = target > 0 && totalPaid >= target;

            return (
                <div style={{paddingBottom:20}}>
                    {/* Header */}
                    <div style={{background:"linear-gradient(135deg,#0f1e3d,#162545)",border:"1px solid #22d3ee30",borderRadius:16,padding:18,marginBottom:16,textAlign:"center",position:"relative",overflow:"hidden"}}>
                        <div style={{position:"absolute",top:0,right:0,width:4,height:"100%",background:"linear-gradient(to bottom,#22d3ee,#0891b2)",borderRadius:"0 16px 16px 0"}}/>
                        <div style={{fontSize:28,marginBottom:4}}>🤝</div>
                        <div style={{fontSize:20,fontWeight:900,color:"#22d3ee"}}>حسابات أبو عدي</div>
                        <div style={{fontSize:12,color:"#475569",marginTop:4}}>تصفية يومية للدفعات الكاش</div>
                    </div>

                    {/* TARGET SETTER */}
                    <div style={{background:"linear-gradient(135deg,#0a1628,#0f1e3d)",border:"1px solid #f59e0b40",borderRadius:14,padding:16,marginBottom:14}}>
                        <div style={{fontSize:12,color:"#f59e0b",fontWeight:700,marginBottom:10}}>💰 إجمالي المبلغ المطلوب تصفيته اليوم</div>
                        {canEdit && (
                            <div style={{display:"flex",gap:8}}>
                                <input
                                    type="number"
                                    value={targetInput}
                                    onChange={e=>setTargetInput(e.target.value)}
                                    placeholder="مثلاً: 120000"
                                    style={{flex:1,background:"#0a0f1e",border:"1px solid #f59e0b50",borderRadius:10,padding:"10px 14px",color:"#e2e8f0",fontSize:15,outline:"none",textAlign:"right",fontFamily:"'Tajawal',sans-serif"}}
                                />
                                <button
                                    onClick={()=>{
                                        const v=parseFloat(targetInput);
                                        if(!v||v<=0){showToast("أدخل مبلغ صحيح","error");return;}
                                        setTarget(v); if(setAbuadiDate) setAbuadiDate(new Date().toISOString().slice(0,10)); showToast("✓ تم تحديد المبلغ المستهدف");
                                    }}
                                    style={{background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:10,padding:"10px 18px",color:"#0a0f1e",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"'Tajawal',sans-serif"}}
                                >تحديد</button>
                            </div>
                        )}
                        {!canEdit && target === 0 && (
                            <div style={{textAlign:"center",color:"#475569",fontSize:12,padding:"6px 0"}}>لم يتم تحديد مبلغ مستهدف بعد</div>
                        )}
                        {target > 0 && (
                            <div style={{marginTop:12}}>
                                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
                                    <div style={{background:"#0a0f1e",borderRadius:10,padding:10,textAlign:"center",border:"1px solid #f59e0b30"}}>
                                        <div style={{fontSize:11,color:"#64748b",marginBottom:3}}>المستهدف</div>
                                        <div style={{fontSize:15,fontWeight:700,color:"#f59e0b"}}>{formatNum(target)}</div>
                                    </div>
                                    <div style={{background:"#0a0f1e",borderRadius:10,padding:10,textAlign:"center",border:"1px solid #10b98130"}}>
                                        <div style={{fontSize:11,color:"#64748b",marginBottom:3}}>تم تسليمه</div>
                                        <div style={{fontSize:15,fontWeight:700,color:"#10b981"}}>{formatNum(totalPaid)}</div>
                                    </div>
                                    <div style={{background:"#0a0f1e",borderRadius:10,padding:10,textAlign:"center",border:`1px solid ${settled?"#10b98130":"#ef444430"}`}}>
                                        <div style={{fontSize:11,color:"#64748b",marginBottom:3}}>المتبقي</div>
                                        <div style={{fontSize:15,fontWeight:700,color:settled?"#10b981":"#ef4444"}}>{settled?"✓ صُفِّي":formatNum(remaining)}</div>
                                    </div>
                                </div>
                                {/* Progress Bar */}
                                <div style={{background:"#1e293b",borderRadius:99,height:12,overflow:"hidden",position:"relative"}}>
                                    <div style={{
                                        width:`${pct}%`,height:"100%",
                                        background: settled ? "linear-gradient(90deg,#10b981,#059669)" : "linear-gradient(90deg,#22d3ee,#0891b2)",
                                        borderRadius:99,transition:"width 0.5s ease",
                                        boxShadow: settled ? "0 0 12px #10b98180" : "0 0 12px #22d3ee80"
                                    }}/>
                                </div>
                                <div style={{textAlign:"center",fontSize:11,color:"#64748b",marginTop:5}}>{pct.toFixed(1)}% تم تسليمه</div>
                                {settled && (
                                    <div style={{background:"#10b98115",border:"1px solid #10b98140",borderRadius:10,padding:10,textAlign:"center",marginTop:10}}>
                                        <div style={{fontSize:16,fontWeight:900,color:"#10b981"}}>✅ تم تصفية الحساب بالكامل!</div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* ADD PAYMENT FORM — للأدمن والمساعد فقط */}
                    {canEdit && (
                    <div style={{background:"linear-gradient(135deg,#0a1628,#0f1e3d)",border:"1px solid #a78bfa40",borderRadius:14,padding:16,marginBottom:14}}>
                        <div style={{fontSize:12,color:"#a78bfa",fontWeight:700,marginBottom:12}}>➕ إضافة دفعة كاش جديدة</div>

                        {/* Amount */}
                        <div style={{display:"flex",gap:8,marginBottom:12}}>
                            <input
                                type="number"
                                value={amountInput}
                                onChange={e=>setAmountInput(e.target.value)}
                                onKeyPress={e=>e.key==="Enter"&&addPayment()}
                                placeholder="المبلغ (مثلاً: 50000)"
                                style={{flex:1,background:"#0a0f1e",border:"1px solid #a78bfa50",borderRadius:10,padding:"12px 14px",color:"#e2e8f0",fontSize:15,outline:"none",textAlign:"right",fontFamily:"'Tajawal',sans-serif"}}
                            />
                        </div>

                        {/* Voice Recorder */}
                        <div style={{background:"#0a0f1e",borderRadius:10,padding:12,marginBottom:12,border:`1px solid ${recordingState==="recording"?"#ef4444":"#1e293b"}`}}>
                            <div style={{fontSize:11,color:"#64748b",marginBottom:8,fontWeight:600}}>🎙️ تسجيل صوتي (اختياري — إثبات التسليم)</div>
                            {recordingState === "idle" && (
                                <button onClick={startRecording}
                                    style={{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:8,padding:10,color:"#94a3b8",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"'Tajawal',sans-serif"}}>
                                    🎙️ ابدأ التسجيل
                                </button>
                            )}
                            {recordingState === "recording" && (
                                <div style={{display:"flex",gap:8}}>
                                    <button onClick={stopRecording}
                                        style={{flex:1,background:"linear-gradient(135deg,#ef4444,#dc2626)",border:"none",borderRadius:8,padding:10,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",animation:"blink 1s infinite",fontFamily:"'Tajawal',sans-serif"}}>
                                        ⏹ إيقاف التسجيل
                                    </button>
                                    <button onClick={cancelRecording}
                                        style={{background:"#1e293b",border:"none",borderRadius:8,padding:"10px 14px",color:"#94a3b8",fontSize:13,cursor:"pointer",fontFamily:"'Tajawal',sans-serif"}}>
                                        ✕
                                    </button>
                                </div>
                            )}
                            {recordingState === "done" && pendingAudio && (
                                <div>
                                    <div style={{fontSize:11,color:"#10b981",marginBottom:8,fontWeight:600}}>✅ تم التسجيل — استمع للمراجعة:</div>
                                    <audio controls src={pendingAudio} style={{width:"100%",height:36,marginBottom:8}}/>
                                    <button onClick={()=>{setPendingAudio(null);setRecordingState("idle");}}
                                        style={{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:8,padding:8,color:"#94a3b8",fontSize:12,cursor:"pointer",fontFamily:"'Tajawal',sans-serif"}}>
                                        🔄 إعادة التسجيل
                                    </button>
                                </div>
                            )}
                        </div>

                        <button onClick={addPayment}
                            style={{width:"100%",background:"linear-gradient(135deg,#a78bfa,#7c3aed)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"'Tajawal',sans-serif",boxShadow:"0 4px 15px #7c3aed40"}}>
                            ✓ تسجيل الدفعة
                        </button>
                    </div>
                    )}

                    {/* TODAY'S PAYMENTS TABLE */}
                    <div style={{marginBottom:16}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                            <div style={{fontSize:14,fontWeight:700,color:"#94a3b8"}}>📋 سجل دفعات اليوم ({todayPayments.length})</div>
                            {canEdit && todayPayments.length > 0 && (
                                <button onClick={()=>{if(window.confirm("هيتم تصفير كل دفعات اليوم والمبلغ المستهدف. متأكد؟"))clearToday();}}
                                    style={{background:"#ef444415",border:"1px solid #ef444440",borderRadius:8,padding:"4px 12px",color:"#ef4444",fontSize:12,cursor:"pointer",fontWeight:600,fontFamily:"'Tajawal',sans-serif"}}>

        function Modal({title, onClose, children}) {

                    <button onClick={()=>onSave({name,number,balance:parseFloat(balance)||0})} style={{width:"100%",background:"linear-gradient(135deg,#22d3ee,#0891b2)",border:"none",borderRadius:12,padding:14,color:"#0a0f1e",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>

        // ══════════════════════════════════════════════════════
        //  ✨  AI CHAT SCREEN — Powered by Gemini 1.5 Flash
        // ══════════════════════════════════════════════════════
        function AIChatScreen({
            transactions, lines, visas, instaPays, capital,
            financeLogs, people, abuadiTarget, abuadiPayments,
            sources, formatNum, today, currentMonthStr, showToast,
            getPersonBalance,
            LINES_LIMIT_DAILY, LINES_LIMIT_MONTHLY,
            VISA_LIMIT_DAILY, VISA_LIMIT_MONTHLY,
            INSTAPAY_LIMIT_DAILY, INSTAPAY_LIMIT_MONTHLY
        }) {
            const STORAGE_KEY = "gemini_chat_v1";
            const [messages, setMessages] = useState(() => {
                try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : []; } catch(e) { return []; }
            });
            const [input, setInput] = useState("");
            const [thinking, setThinking] = useState(false);
            const bottomRef = useRef(null);

            useEffect(() => {
                bottomRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, thinking]);

            function persist(msgs) {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs.slice(-80))); } catch(e) {}
                try { firebase.database().ref("ai_chat_log").set(msgs.slice(-80)); } catch(e) {}
            }

            // ── بناء الـ System Prompt مع بيانات التطبيق ──────────────
            function buildSystemPrompt() {
                const todayStr  = today();
                const monthStr  = currentMonthStr();
                const todayTxns = transactions.filter(t => t.date === todayStr);
                const last15    = [...transactions].slice(-15).reverse();

                // ملخص الخطوط
                const linesSummary = lines.map(l => {
                    const s = sources.find(x => x.id === l.id) || l;
                    return `• ${l.name}: رصيد=${formatNum(l.balance||0)}ج | يومي=${formatNum(s.usedToday||0)}/${formatNum(LINES_LIMIT_DAILY)}ج | شهري=${formatNum(s.usedMonth||0)}/${formatNum(LINES_LIMIT_MONTHLY)}ج`;
                }).join("\n");

                // ملخص الفيزا
                const visasSummary = visas.map(v => {
                    const s = sources.find(x => x.id === v.id) || v;
                    return `• ${v.name}: رصيد=${formatNum(v.balance||0)}ج | يومي=${formatNum(s.usedToday||0)}/${formatNum(VISA_LIMIT_DAILY)}ج | شهري=${formatNum(s.usedMonth||0)}/${formatNum(VISA_LIMIT_MONTHLY)}ج`;
                }).join("\n");

                // ملخص InstaPay
                const ipaySummary = instaPays.length ? instaPays.map(ip => {
                    const s = sources.find(x => x.id === ip.id) || ip;
                    return `• ${ip.name}: رصيد=${formatNum(ip.balance||0)}ج | شهري=${formatNum(s.usedMonth||0)}/${formatNum(INSTAPAY_LIMIT_MONTHLY)}ج`;
                }).join("\n") : "لا يوجد";

                // أرباح الشهر
                const mLogs = financeLogs.filter(l => l.monthDate === monthStr);
                const mInc  = mLogs.filter(l=>l.type==="income").reduce((s,l)=>s+l.amount,0);
                const mExp  = mLogs.filter(l=>l.type==="expense").reduce((s,l)=>s+l.amount,0);

                // العملاء المديونين
                const debtors = people
                    .map(p => ({ name: p.personName, bal: getPersonBalance(p) }))
                    .filter(p => p.bal > 0)
                    .sort((a,b) => b.bal - a.bal)
                    .slice(0, 8)
                    .map(p => `${p.name}: ${formatNum(p.bal)}ج`)
                    .join(" | ");

                // أبو عدي
                const todayMsStr = new Date().toDateString();
                const abuPaid = abuadiPayments.filter(p=>new Date(p.ts).toDateString()===todayMsStr).reduce((s,p)=>s+p.amount,0);
                const abuRem  = Math.max(0, abuadiTarget - abuPaid);

                // آخر 15 عملية
                const txnSummary = last15.map(t => {
                    const typeLabel = t.type==="transfer"?"تحويل":t.type==="receive"?"استلام":t.type==="bank_withdraw"?"سحب بنك":"سحب فوري";
                    return `[${t.date} ${t.time||""}] ${typeLabel} — ${t.personName} — ${formatNum(t.amount)}ج`;
                }).join("\n");

                // حساب إضافي — خطوط متاحة وعدد العملاء
                const availLines = lines.filter(l => l.available !== false).length;
                const availVisas = visas.filter(v => v.available !== false).length;
                const totalDebtVal = people.reduce((s, p) => s + Math.max(0, getPersonBalance(p)), 0);
                const debtorCount  = people.filter(p => getPersonBalance(p) > 0).length;
                const todayTransfer = todayTxns.filter(t=>t.type==="transfer").reduce((s,t)=>s+t.amount,0);
                const todayReceive  = todayTxns.filter(t=>t.type==="receive").reduce((s,t)=>s+t.amount,0);

                return `أنت مساعد ذكي اسمك "حوكر AI" داخل تطبيق "فودافون كاش" لإدارة محافظ فودافون كاش التجارية.
تكلم دايماً بالعامية المصرية بشكل ودود ومختصر وعملي.
- ردك يكون مباشر ومفيد، مش أكتر من 4-5 جمل إلا لو الموضوع يحتاج جدول أو تفاصيل.
- استخدم الأرقام الموجودة في البيانات دايماً، ومتقولش "مش عندي بيانات" لأن كل البيانات موجودة تحت.
- لو حد سألك على أحسن خط، اقترح الخط اللي عنده أقل استخدام شهري ومتاح.
- لو سألك عن الوضع العام، اعطيه ملخص سريع بالأرقام من البيانات دي.

═══════════════════════════════════════
📊 بيانات التطبيق اللحظية — ${todayStr}
═══════════════════════════════════════

💰 رأس المال الحالي: ${formatNum(capital)} ج
📅 عمليات اليوم: ${todayTxns.length} عملية (تحويل: ${formatNum(todayTransfer)}ج | استلام: ${formatNum(todayReceive)}ج)
📈 المالية الشهرية: دخل ${formatNum(mInc)}ج — مصاريف ${formatNum(mExp)}ج — صافي ${formatNum(mInc-mExp)}ج
👥 إجمالي المديونية: ${formatNum(totalDebtVal)}ج من ${debtorCount} عميل

📱 الخطوط (${availLines} متاح من ${lines.length}):
${linesSummary}

💳 فيزا فوري (${availVisas} متاح من ${visas.length}):
${visasSummary}

⚡ إنستا باي:
${ipaySummary}

👥 أكبر المديونين:
${debtors || "لا يوجد ديون حالياً"}

🤝 أبو عدي اليوم:
- هدف التصفية: ${formatNum(abuadiTarget)}ج
- تم تسليمه: ${formatNum(abuPaid)}ج
- المتبقي: ${formatNum(abuRem)}ج ${abuRem === 0 && abuadiTarget > 0 ? "✅ تم تصفية الحساب بالكامل!" : ""}

📋 آخر 15 عملية:
${txnSummary || "لا توجد عمليات مسجلة"}

═══════════════════════════════════════
حدود الخطوط: يومي ${formatNum(LINES_LIMIT_DAILY)}ج | شهري ${formatNum(LINES_LIMIT_MONTHLY)}ج
حدود الفيزا: يومي ${formatNum(VISA_LIMIT_DAILY)}ج | شهري ${formatNum(VISA_LIMIT_MONTHLY)}ج
حدود إنستا باي: يومي ${formatNum(INSTAPAY_LIMIT_DAILY)}ج | شهري ${formatNum(INSTAPAY_LIMIT_MONTHLY)}ج`;
            }

            async function sendMessage(overrideText) {
                const q = (overrideText || input).trim();
                if (!q || thinking) return;
                setInput("");

                const userMsg = { role: "user", text: q, ts: Date.now() };
                const newMsgs = [...messages, userMsg];
                setMessages(newMsgs);
                setThinking(true);

                try {
                    const sysPrompt = buildSystemPrompt();
                    const aiText = await callClaudeChat(sysPrompt, newMsgs.slice(-20));
                    const aiMsg = { role: "ai", text: aiText, ts: Date.now() };
                    const final = [...newMsgs, aiMsg];
                    setMessages(final);
                    persist(final);
                } catch(err) {
                    const aiMsg = { role: "ai", text: `❌ خطأ: ${err.message}`, ts: Date.now() };
                    const final = [...newMsgs, aiMsg];
                    setMessages(final);
                    persist(final);
                } finally {
                    setThinking(false);
                }
            }

            function clearChat() {
                if (!window.confirm("تمسح كل المحادثة؟")) return;
                setMessages([]);
                try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
                try { firebase.database().ref("ai_chat_log").remove(); } catch(e) {}
            }

            const QUICK_MSGS = [
                "كم رأس المال دلوقتي؟",
                "أفضل خط للتحويل؟",
                "أرباح الشهر كام؟",
                "مين أكتر حد مديون؟",
                "باقي أبو عدي كام؟",
                "ملخص عمليات اليوم؟",
            ];

            const hasKey = true; // Claude مدمج — لا يحتاج API Key

            return (
                <div style={{paddingBottom:24}}>

                    {/* Header */}
                    <div style={{
                        background:"linear-gradient(135deg,#08090f,#0d1120)",
                        border:"1px solid #a78bfa30",
                        borderRadius:18,
                        padding:20,
                        marginBottom:16,
                        textAlign:"center",
                        position:"relative",
                        overflow:"hidden"
                    }}>
                        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 0%,#a78bfa10,transparent 70%)",pointerEvents:"none"}}/>
                        <div style={{fontSize:34,marginBottom:6}}>✨</div>
                        <div style={{fontSize:20,fontWeight:900,color:"#a78bfa",letterSpacing:0.5}}>المساعد الذكي</div>
                        <div style={{fontSize:12,color:"#475569",marginTop:4}}>Claude Sonnet • يفهم بياناتك</div>
                        <div style={{display:"inline-flex",alignItems:"center",gap:6,background: hasKey?"#10b98120":"#ef444420",border:`1px solid ${hasKey?"#10b98130":"#ef444430"}`,borderRadius:20,padding:"3px 12px",fontSize:10,color:hasKey?"#10b981":"#ef4444",marginTop:8,fontWeight:700}}>
                            <div style={{width:6,height:6,borderRadius:99,background:hasKey?"#10b981":"#ef4444",animation:hasKey?"blink 2s infinite":"none"}}/>
                            {hasKey ? "API متصل ✓" : "⚠️ أضف API Key"}
                        </div>
                    </div>

                    {!hasKey && (
                        <div style={{background:"#ef444415",border:"1px solid #ef444440",borderRadius:14,padding:14,marginBottom:16,fontSize:13,color:"#ef4444",lineHeight:1.7}}>
                            <b>⚙️ خطوة واحدة للتفعيل:</b><br/>
                            افتح الـ HTML بأي محرر نصوص → ابحث عن <code style={{background:"#1e293b",padding:"1px 6px",borderRadius:4,color:"#22d3ee"}}>GEMINI_API_KEY</code> → ضع مفتاحك من <b>aistudio.google.com</b>
                        </div>
                    )}

                    {/* Quick Suggestions */}
                    <div style={{marginBottom:14}}>
                        <div style={{fontSize:11,color:"#3d4f65",marginBottom:8,fontWeight:600}}>⚡ اقتراحات سريعة</div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                            {QUICK_MSGS.map((q,i) => (
                                <button key={i} onClick={()=>sendMessage(q)} disabled={thinking}
                                    style={{background:"#0d1120",border:"1px solid #a78bfa25",borderRadius:20,padding:"6px 12px",color:"#c8d6e8",fontSize:11,cursor:thinking?"not-allowed":"pointer",fontFamily:"'Tajawal',sans-serif",opacity:thinking?0.5:1}}>
                                    {q}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Chat Messages */}
                    <div style={{
                        background:"#05070f",
                        border:"1px solid #1a2235",
                        borderRadius:16,
                        padding:"14px 12px",
                        minHeight:340,
                        maxHeight:460,
                        overflowY:"auto",
                        marginBottom:12,
                        display:"flex",
                        flexDirection:"column",
                        gap:10
                    }}>
                        {messages.length === 0 && !thinking && (
                            <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#1e3a5f",padding:30,textAlign:"center"}}>
                                <div style={{fontSize:40,marginBottom:10,opacity:0.5}}>✨</div>
                                <div style={{fontSize:13}}>اسأل عن بياناتك بالعامية المصرية</div>
                                <div style={{fontSize:11,marginTop:6,color:"#1a2235"}}>مثلاً: "إيه أحسن خط أحول منه دلوقتي؟"</div>
                            </div>
                        )}

                        {messages.map((m, i) => (
                            <div key={i} style={{display:"flex",flexDirection:"column",alignItems: m.role==="user"?"flex-end":"flex-start"}}>
                                {m.role==="ai" && (
                                    <div style={{fontSize:10,color:"#a78bfa",fontWeight:700,marginBottom:3,marginRight:4}}>✨ Claude</div>
                                )}
                                <div style={{
                                    maxWidth:"88%",
                                    background: m.role==="user"
                                        ? "linear-gradient(135deg,#7c3aed,#6d28d9)"
                                        : "linear-gradient(135deg,#0d1120,#111827)",
                                    border: m.role==="ai" ? "1px solid #1e3a5f" : "none",
                                    borderRadius: m.role==="user" ? "18px 18px 4px 18px" : "4px 18px 18px 18px",
                                    padding:"11px 14px",
                                    fontSize:13.5,
                                    color: m.role==="user" ? "#fff" : "#c8d6e8",
                                    lineHeight:1.7,
                                    whiteSpace:"pre-wrap",
                                    wordBreak:"break-word",
                                    boxShadow: m.role==="user" ? "0 2px 12px #7c3aed30" : "none"
                                }}>
                                    {m.text}
                                </div>
                                <div style={{fontSize:9,color:"#1e3a5f",marginTop:3,paddingRight:4}}>
                                    {new Date(m.ts).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}
                                </div>
                            </div>
                        ))}

                        {thinking && (
                            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-start"}}>
                                <div style={{fontSize:10,color:"#a78bfa",fontWeight:700,marginBottom:3,marginRight:4}}>✨ Claude</div>
                                <div style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:"4px 18px 18px 18px",padding:"12px 18px",display:"flex",gap:5,alignItems:"center"}}>
                                    {[0,0.2,0.4].map((d,i) => (
                                        <div key={i} style={{width:7,height:7,borderRadius:99,background:"#a78bfa",animation:`blink 1.2s ${d}s infinite`}}/>
                                    ))}
                                </div>
                            </div>
                        )}
                        <div ref={bottomRef}/>
                    </div>

                    {/* Input Row */}
                    <div style={{display:"flex",gap:8,marginBottom:10}}>
                        <input
                            value={input}
                            onChange={e=>setInput(e.target.value)}
                            onKeyPress={e=>e.key==="Enter"&&!thinking&&sendMessage()}
                            placeholder="اسأل عن الأرباح، الخطوط، العملاء..."
                            style={{
                                flex:1,
                                background:"#0d1120",
                                border:"1px solid #1e3a5f",
                                borderRadius:12,
                                padding:"12px 14px",
                                color:"#c8d6e8",
                                fontSize:14,
                                outline:"none",
                                textAlign:"right",
                                fontFamily:"'Tajawal',sans-serif",
                                transition:"border-color 0.2s"
                            }}
                        />
                        <button
                            onClick={()=>!thinking&&sendMessage()}
                            disabled={thinking || !input.trim()}
                            style={{
                                background: thinking||!input.trim() ? "#1e293b" : "linear-gradient(135deg,#7c3aed,#6d28d9)",
                                border:"none",
                                borderRadius:12,
                                padding:"12px 20px",
                                color:"#fff",
                                fontSize:16,
                                cursor: thinking||!input.trim() ? "not-allowed" : "pointer",
                                boxShadow: thinking||!input.trim() ? "none" : "0 4px 14px #7c3aed40",
                                transition:"all 0.2s",
                                fontFamily:"'Tajawal',sans-serif",
                                fontWeight:700,
                                minWidth:72
                            }}>
                            {thinking ? "⏳" : "إرسال"}
                        </button>
                    </div>

                    {/* Clear Button */}
                    {messages.length > 0 && (
                        <button onClick={clearChat}
                            style={{width:"100%",background:"#ef444410",border:"1px solid #ef444425",borderRadius:12,padding:10,color:"#ef4444",fontSize:12,cursor:"pointer",fontWeight:600,fontFamily:"'Tajawal',sans-serif"}}>
                            🗑️ مسح المحادثة
                        </button>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
