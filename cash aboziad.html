        // ✅ ضغط الصورة قبل الحفظ — يوفر ~80% من المساحة
        function compressImage(base64Str, maxWidth = 400, maxHeight = 400) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height = Math.round(height * maxWidth / width); width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width = Math.round(width * maxHeight / height); height = maxHeight; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
                img.onerror = () => resolve(base64Str); // fallback لو فشل الضغط
                img.src = base64Str;
            });
        }

        // ⭐ Math Parser آمن 100% — بدون eval أو Function
        const evaluateExpression = (expr) => {
            try {
                // 1. تنظيف الإدخال — أرقام وعمليات فقط
                let clean = String(expr)
                    .replace(/\s/g, '')           // شيل المسافات
                    .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632) // أرقام عربية → إنجليزية
                    .replace(/[^0-9+\-*/().]/g, ''); // شيل أي حاجة تانية

                if (!clean) return 0;

                // 2. Tokenizer — بيقسم النص لأرقام وعمليات
                const tokenize = (s) => {
                    const tokens = [];
                    let i = 0;
                    while (i < s.length) {
                        if (/\d|\./.test(s[i])) {
                            let num = '';
                            while (i < s.length && /[\d.]/.test(s[i])) num += s[i++];
                            tokens.push({ type: 'num', val: parseFloat(num) || 0 });
                        } else if ('+-*/()'.includes(s[i])) {
                            tokens.push({ type: 'op', val: s[i++] });
                        } else {
                            i++;
                        }
                    }
                    return tokens;
                };

                // 3. Parser تعاودي (Recursive Descent) — يتعامل مع الأولويات والأقواس
                const tokens = tokenize(clean);
                let pos = 0;

                const peek = () => tokens[pos] || null;
                const consume = () => tokens[pos++] || null;

                const parseExpr = () => {
                    let left = parseTerm();
                    while (peek() && (peek().val === '+' || peek().val === '-')) {
                        const op = consume().val;
                        const right = parseTerm();
                        left = op === '+' ? left + right : left - right;
                    }
                    return left;
                };

                const parseTerm = () => {
                    let left = parseFactor();
                    while (peek() && (peek().val === '*' || peek().val === '/')) {
                        const op = consume().val;
                        const right = parseFactor();
                        if (op === '*') left *= right;
                        else left = right !== 0 ? left / right : 0;
                    }
                    return left;
                };

                const parseFactor = () => {
                    const t = peek();
                    if (!t) return 0;
                    if (t.val === '(') {
                        consume(); // شيل (
                        const val = parseExpr();
                        if (peek() && peek().val === ')') consume(); // شيل )
                        return val;
                    }
                    if (t.val === '-') { consume(); return -parseFactor(); } // unary minus
                    if (t.val === '+') { consume(); return parseFactor(); }  // unary plus
                    if (t.type === 'num') { consume(); return t.val; }
                    consume(); return 0;
                };

                const result = parseExpr();
                return isNaN(result) || !isFinite(result) ? 0 : Math.round(result * 100) / 100;
            } catch (e) {
                return 0;
            }
        };

        // ⭐ قراءة ذكية للرسائل — بيفرق بين رقمك ورقم العميل
        function parseSmartMessage(text, lines = [], visas = []) {
            const result = { amount: "", personNumber: "", fromNumber: "", toNumber: "", lineId: "", type: "transfer", notes: "" };
            if (!text.trim()) return result;

            // 1. استخراج المبلغ — بالأولوية: كلمة مرفقة → جنيه → أول رقم منطقي
            const amountMatch =
                text.match(/(?:مبلغ|قيمة|شحن|تم تحويل|حوّل)\s*([\d,]+(?:\.\d{1,2})?)/i) ||
                text.match(/([\d,]+(?:\.\d{1,2})?)\s*(?:جنيه|ج\.م|EGP|LE)/i) ||
                text.match(/(\d{2,}(?:\.\d{1,2})?)/);
            if (amountMatch) {
                const raw = (amountMatch[1] || amountMatch[2] || "").replace(/,/g, '');
                result.amount = raw;
            }

            // 2. استخراج الأرقام — يفرق بذكاء بين "من رقم" و"إلى رقم"
            const allPhones = [...(text.matchAll(/01[0125]\d{8}/g))].map(m => m[0]);
            const fromMatch = text.match(/(?:من رقم|من|المرسل)\s*(01[0125]\d{8})/);
            const toMatch   = text.match(/(?:إلى رقم|لرقم|إلى|المستلم|لـ)\s*(01[0125]\d{8})/);

            if (allPhones.length === 1) {
                result.personNumber = allPhones[0];
            } else if (allPhones.length > 1) {
                if (fromMatch) result.fromNumber = fromMatch[1];
                if (toMatch)   result.toNumber   = toMatch[1];
                // رقم العميل = اللي مش رقم الخط
                const lineNumbers = [...lines, ...visas].map(s => s.number).filter(Boolean);
                const clientPhone = allPhones.find(p => !lineNumbers.includes(p));
                result.personNumber = clientPhone || allPhones[0];
            }

            // 3. نوع العملية من الكلمات المفتاحية
            const receiveKeywords = ["تم استلام", "إيداع", "حوّل لك", "تم استقبال", "وصلك", "استلمت"];
            const transferKeywords = ["تم تحويل", "سحب", "خصم", "أرسلت", "تم إرسال"];
            if (receiveKeywords.some(k => text.includes(k))) {
                result.type = "receive";
            } else if (transferKeywords.some(k => text.includes(k))) {
                result.type = "transfer";
            }

            // 4. مطابقة اسم الخط/الفيزا من الرسالة
            for (const source of [...lines, ...visas]) {
                if (source.name && text.includes(source.name)) { result.lineId = source.id; break; }
                if (source.number && text.includes(source.number)) { result.lineId = source.id; break; }
            }

            // 5. ملاحظة تلقائية
            result.notes = result.type === "receive"
                ? "استلام تلقائي عبر الرسالة"
                : "تحويل تلقائي عبر الرسالة";

            return result;
        }

            // ⭐ Firebase Auth Listener
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) {
                        // ✅ إصلاح: بنستخدم الثوابت المعرّفة في مكان واحد
                        const e = user.email;
                        const role = e === ADMIN_EMAIL ? "admin" : e === VIEWER_EMAIL ? "viewer" : "user";
                        setFirebaseUser(user);
                        setUserRole(role);
                    } else {
                        setFirebaseUser(null);
                        setUserRole(null);
                    }

            // Load from Firebase — بيشتغل مرة واحدة بس بعد الـ login
            useEffect(() => {
                if (!userRole) return;

                try {
                    db.ref('lines').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const arr = Array.isArray(data) ? data : Object.values(data);
                            setTimeout(() => {
                                setLines(prev => arr.map(incoming => {
                                    const existing = prev.find(p => p.id === incoming.id);
                                    return existing ? {...existing, ...incoming} : incoming;
                                }));
                                firebaseLoaded.current = true;
                            }, 0);
                        } else {
                            firebaseLoaded.current = true;
                        }
                    });

                    db.ref('visas').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const arr = Array.isArray(data) ? data : Object.values(data);
                            setTimeout(() => setVisas(prev => arr.map(incoming => {
                                const existing = prev.find(p => p.id === incoming.id);
                                return existing ? {...existing, ...incoming} : incoming;
                            })), 0);
                        }
                    });

                    db.ref('transactions').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) setTimeout(() => setTransactions(Array.isArray(data) ? data : Object.values(data)), 0);
                    });

                    db.ref('people').on('value', (snapshot) => {
                        if (isDeletingPerson.current) return;
                        const data = snapshot.val();
                        if (data) {
                            // ✅ Firebase فيه بيانات — هو المصدر
                            const arr = Array.isArray(data) ? data : Object.values(data);
                            setTimeout(() => {
                                if (isDeletingPerson.current) return;
                                setPeople(arr);
                                saveToLocalStorage('people', arr);
                            }, 0);
                        }
                        // ✅ لو Firebase رجع null — منمسحش الـ localStorage أو الـ state
                        // الـ null ممكن يكون بسبب بطء الاتصال مش حذف حقيقي
                    });

                    db.ref('capital').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data !== null) setTimeout(() => setCapital(data), 0);
                    });

                    db.ref('financeLogs').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) setTimeout(() => setFinanceLogs(Array.isArray(data) ? data : Object.values(data)), 0);
                    });

                    // ✅ إصلاح: تحميل بيانات أبو عدي من Firebase
                    db.ref('abuadiDays').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) setTimeout(() => setAbuadiDays(Array.isArray(data) ? data : Object.values(data)), 0);
                    });
                } catch (error) {
                    console.error('Error setting up Firebase listeners:', error);
                }

                return () => {
                    db.ref('lines').off();
                    db.ref('visas').off();
                    db.ref('transactions').off();
                    db.ref('people').off();
                    db.ref('capital').off();
                    db.ref('financeLogs').off();
                    db.ref('abuadiDays').off();
                };
            // ✅ إصلاح جوهري: [] بدل [userRole] — الـ listeners بيتسجلوا مرة واحدة بس
            // userRoleRef.current بيتحدث تلقائياً بدون ما يعيد تشغيل الـ effect
            }, []);

            // ✅ دوال الحفظ الآمنة - تُستدعى يدوياً فقط عند العمليات الفعلية
            // تستخدم .child(id).update() بدل .set() لمنع تضارب البيانات بين المستخدمين

            function persistSources(updatedLines, updatedVisas) {
                saveToLocalStorage('lines', updatedLines);
                saveToLocalStorage('visas', updatedVisas);
                if (userRoleRef.current === "admin" && auth.currentUser) {
                    try {
                        updatedLines.forEach(l => db.ref('lines').child(l.id).update(l));
                        updatedVisas.forEach(v => db.ref('visas').child(v.id).update(v));
                    } catch(e) {}
                }
            }

            function persistTransaction(txn, allTransactions) {
                // ✅ localStorage — بنحفظ العنصر الجديد بس جنب باقي البيانات
                const updated = [txn, ...allTransactions.filter(t => t.id !== txn.id)];
                saveToLocalStorage('transactions', updated);
                // ✅ Firebase — update فردي بدون ما يمسح باقي البيانات
                if (userRoleRef.current === "admin" && auth.currentUser) {
                    try { db.ref('transactions').child(String(txn.id)).set(txn); } catch(e) {}
                }
            }

            function persistTransactionDelete(txnId, allTransactions) {
                // ✅ localStorage
                const updated = allTransactions.filter(t => t.id !== txnId);
                saveToLocalStorage('transactions', updated);
                // ✅ Firebase — حذف عنصر واحد بس
                if (userRoleRef.current === "admin" && auth.currentUser) {
                    try { db.ref('transactions').child(String(txnId)).remove(); } catch(e) {}
                }
            }

            function persistPeople(updatedPeople) {
                saveToLocalStorage('people', updatedPeople);
                if (userRoleRef.current === "admin" && auth.currentUser) {
                    try {
                        // ✅ إصلاح التكرار: بنستخدم String(id) ثابت كـ key في Firebase
                        updatedPeople.forEach(p => db.ref('people').child(String(p.id)).set({...p, id: String(p.id)}));
                    } catch(e) {}
                }
            }

            function persistPersonDelete(personId) {
                if (userRoleRef.current === "admin" && auth.currentUser) {
                    try { db.ref('people').child(String(personId)).remove(); } catch(e) {}
                }
            }

            function persistCapital(newCapital) {
                saveToLocalStorage('capital', newCapital);
                if (userRoleRef.current === "admin" && auth.currentUser) {
                    try { db.ref('capital').set(newCapital); } catch(e) {}
                }
            }

            function persistFinanceLog(newLog) {
                if (userRoleRef.current === "admin" && auth.currentUser) {
                    try { db.ref('financeLogs').child(String(newLog.id)).set(newLog); } catch(e) {}
                }
            }

            function persistFinanceLogDelete(logId) {
                if (userRoleRef.current === "admin" && auth.currentUser) {
                    try { db.ref('financeLogs').child(String(logId)).remove(); } catch(e) {}
                }
            }

            function persistAbuadiDays(days) {
                saveToLocalStorage("abuadiDays", days);
                // ✅ إصلاح: حفظ بيانات أبو عدي في Firebase كمان عشان متتمسحش
                if (userRoleRef.current === "admin" && auth.currentUser) {
                    try { db.ref('abuadiDays').set(days); } catch(e) {}
                }
            }

            function abuadiGetOrCreateToday() {
                const todayKey = today();
                let days = abuadiDays;
                const existing = days.find(d => d.dateKey === todayKey);
                if (existing) return existing;
                const newDay = { dateKey: todayKey, entries: [], closed: false, total: 0 };
                const updated = [newDay, ...days];
                setAbuadiDays(updated);
                persistAbuadiDays(updated);
                return newDay;
            }

            function abuadiAddEntry(amount, audioUrl) {
                const todayKey = today();
                const now = new Date();
                const timeStr = pad(now.getHours()) + ":" + pad(now.getMinutes());
                const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
                const dayName = days[now.getDay()];
                const newEntry = { id: Date.now(), amount: parseFloat(amount), time: timeStr, dayName, audioUrl: audioUrl||null };
                setAbuadiDays(prev => {
                    let updated;
                    const idx = prev.findIndex(d => d.dateKey === todayKey);
                    if (idx !== -1) {
                        const day = prev[idx];
                        const newEntries = [...day.entries, newEntry];
                        const newTotal = newEntries.reduce((s,e)=>s+e.amount,0);
                        updated = prev.map((d,i)=>i===idx?{...d,entries:newEntries,total:newTotal}:d);
                    } else {
                        const newDay = { dateKey: todayKey, entries: [newEntry], closed: false, total: newEntry.amount };
                        updated = [newDay, ...prev];
                    }
                    persistAbuadiDays(updated);
                    return updated;
                });
                setAbuadiActiveDay(todayKey);
            }

            function abuadiDeleteEntry(dateKey, entryId) {
                setAbuadiDays(prev => {
                    const updated = prev.map(d => {
                        if (d.dateKey !== dateKey) return d;
                        const newEntries = d.entries.filter(e=>e.id!==entryId);
                        return {...d, entries:newEntries, total:newEntries.reduce((s,e)=>s+e.amount,0)};
                    });
                    persistAbuadiDays(updated);
                    return updated;
                });
            }

            function abuadiCloseDay(dateKey) {
                setAbuadiDays(prev => {
                    const updated = prev.map(d=>d.dateKey===dateKey?{...d,closed:true}:d);
                    persistAbuadiDays(updated);
                    return updated;
                });
            }

            async function abuadiStartRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
                    const mr = new MediaRecorder(stream);
                    abuadiAudioChunks.current = [];
                    mr.ondataavailable = e => abuadiAudioChunks.current.push(e.data);
                    mr.start();
                    setAbuadiMediaRecorder(mr);
                    setAbuadiRecording(true);
                } catch(e) { showToast("مش قادر يوصل للمايك","error"); }
            }

            function abuadiStopRecording() {
                return new Promise(resolve => {
                    if (!abuadiMediaRecorder) { resolve(null); return; }
                    abuadiMediaRecorder.onstop = () => {
                        const blob = new Blob(abuadiAudioChunks.current, {type:"audio/webm"});
                        const url = URL.createObjectURL(blob);
                        resolve(url);
                    };
                    abuadiMediaRecorder.stop();
                    abuadiMediaRecorder.stream.getTracks().forEach(t=>t.stop());
                    setAbuadiRecording(false);
                    setAbuadiMediaRecorder(null);
                });
            }

            // ⭐ Auto daily reset (must be before early returns)
            useEffect(() => {
                const lastResetDay = loadFromLocalStorage('lastResetDay', null);
                const todayStr = today();
                if (lastResetDay && lastResetDay !== todayStr) {
                    // ✅ إصلاح: بنحفظ في Firebase كمان مش بس localStorage
                    setLines(prev => {
                        const updated = prev.map(l=>({...l,usedTodayTransfer:0,usedTodayReceive:0}));
                        persistSources(updated, visas);
                        return updated;
                    });
                    setVisas(prev => {
                        const updated = prev.map(v=>({...v,usedTodayTransfer:0,usedTodayReceive:0}));
                        persistSources(lines, updated);
                        return updated;
                    });
                }
                saveToLocalStorage('lastResetDay', todayStr);
            }, []);

            // ⭐ Alert when line hits 80%
            useEffect(() => {
                // ✅ إصلاح: بنفرق التحذيرات حسب الشهر عشان ترجع تظهر الشهر الجاي
                const warnKey = `warnedSources_${currentMonthStr()}`;
                const warned = loadFromLocalStorage(warnKey, []);
                const newWarned = [...warned];
                let changed = false;
                [...lines, ...visas].forEach(s => {
                    const isInsta = s.visaType === "insta";
                    const monthlyLimit = s.id.startsWith('visa') ? (isInsta ? VISA_INSTA_LIMIT_MONTHLY : VISA_FAWRY_LIMIT_MONTHLY) : LINES_LIMIT_MONTHLY;
                    const usedMonth = (s.usedMonthTransfer||0) + (s.usedMonthReceive||0);
                    const pct = (usedMonth / monthlyLimit) * 100;
                    if (pct >= 80 && !newWarned.includes(s.id)) {
                        const msg = `⚠️ ${s.name} وصل ${Math.round(pct)}% من الحد الشهري`;
                        setTimeout(() => setToast({msg, type:"error"}), 100);
                        setTimeout(() => setToast(null), 4000);
                        newWarned.push(s.id);
                        changed = true;
                    }
                });
                if (changed) saveToLocalStorage(warnKey, newWarned);

            if (authLoading) {
                return (
                    <div style={{minHeight:"100vh",background:"#0a0f1e",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <div style={{textAlign:"center"}}>
                            <div style={{width:60,height:60,borderRadius:15,background:"linear-gradient(135deg,#e40000,#cc0000)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,fontWeight:900,color:"#fff",margin:"0 auto 20px"}}>V</div>
                            <div className="loading-spinner" style={{margin:"0 auto"}}></div>
                        </div>
                    </div>
                );
            }

            if (!userRole) {
                return <LoginPage onLogin={(role, user) => {
                    setUserRole(role);
                    setFirebaseUser(user);
                }} />;
            }

            function logout() {
                if (firebaseUser) {
                    auth.signOut();
                }
                setUserRole(null);
                setFirebaseUser(null);
                setTab("dashboard");
            }

            function showToast(msg, type="success") { setToast({msg,type}); setTimeout(()=>setToast(null),3000); }

            const getVisaLimits = (v) => {
                if (v.visaType === "insta") return { dailyLimit: VISA_INSTA_LIMIT_DAILY, monthlyLimit: VISA_INSTA_LIMIT_MONTHLY };
                return { dailyLimit: VISA_FAWRY_LIMIT_DAILY, monthlyLimit: VISA_FAWRY_LIMIT_MONTHLY };
            };
            const sources = [
                ...lines.map(l => ({...l, type:"line", dailyLimit:LINES_LIMIT_DAILY, monthlyLimit:LINES_LIMIT_MONTHLY,
                    usedToday: (l.usedTodayTransfer||0)+(l.usedTodayReceive||0),
                    usedMonth: (l.usedMonthTransfer||0)+(l.usedMonthReceive||0),
                })),
                ...visas.map(v => {
                    const lims = getVisaLimits(v);
                    return {...v, type:"visa", ...lims,
                        usedToday: (v.usedTodayTransfer||0)+(v.usedTodayReceive||0),
                        usedMonth: (v.usedMonthTransfer||0)+(v.usedMonthReceive||0),
                    };
                }),
            ];

            async function handleImagePick(e) {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async ev => {
                    try {
                        const compressed = await compressImage(ev.target.result);
                        setForm(f => ({...f, image: compressed}));
                        showToast("✓ تم حفظ الصورة");
                    } catch (err) {
                        showToast("فشل حفظ الصورة - جرب صورة أصغر", "error");
                    }
                };
                reader.readAsDataURL(file);
            }

            // ✅ الصورة دلوقتي base64 مباشرة بعد الضغط
            function getImageSrc(imageRef) {
                if (!imageRef) return null;
                if (imageRef.startsWith("data:") || imageRef.startsWith("http")) return imageRef;
                // fallback للصور القديمة المحفوظة بـ key في localStorage
                try { const v = localStorage.getItem(imageRef); if (v) return v; } catch(e) {}
                return _memStore[imageRef] || null;
            }

            // ⭐ دالة معالجة الـ Smart Paste
            function handleSmartPaste() {
                if (!smartPaste.trim()) { showToast("الحقل فاضي", "error"); return; }
                const parsed = parseSmartMessage(smartPaste, lines, visas);
                
                setForm(f => ({
                    ...f,
                    amount: parsed.amount || f.amount,
                    // ✅ يستخدم أرقام "من" و"إلى" لو اتعرفوا، وإلا يحط رقم العميل في toNumber
                    fromNumber: parsed.fromNumber || f.fromNumber,
                    toNumber: parsed.toNumber || parsed.personNumber || f.toNumber,
                    type: parsed.type || f.type,
                    notes: parsed.notes || f.notes,
                    time: getCurrentTime(),
                    sourceId: parsed.lineId ? parsed.lineId : f.sourceId,
                    sourceType: parsed.lineId ? (sources.find(s => s.id === parsed.lineId)?.type || "line") : f.sourceType,
                }));

                if (parsed.lineId) {
                    const source = sources.find(s => s.id === parsed.lineId);
                    showToast(`✅ تم تحديد ${source?.name} تلقائياً`);
                } else {
                    showToast("✓ تم استخراج البيانات");
                }

                setSmartPaste("");
            }

            function addTransaction() {
                const amount = evaluateExpression(form.amount);
                if (!form.date || !form.time || !form.personName || !amount || !form.sourceId) { 
                    showToast("أكمل كل البيانات","error"); 
                    return; 
                }
                if ((form.txnType === "person" || !form.txnType) && form.txnType !== "receive" && (!form.fromNumber || !form.toNumber)) {
                    showToast("أكمل أرقام التحويل","error"); 
                    return;
                }

                // حساب الخصم التلقائي حسب نوع العملية (مفيش خصم على الاستلام)
                let feeAmount = 0;
                let feeDesc = "";
                if (form.txnType === "bank") {
                    feeAmount = calcBankFee(amount);
                    feeDesc = `خصم بنك تلقائي على ${formatNum(amount)} ج`;
                } else if (form.txnType === "fawry") {
                    feeAmount = calcFawryFee(amount);
                    feeDesc = `خصم فوري تلقائي على ${formatNum(amount)} ج`;
                }
                // استلام: مفيش خصم ومفيش أرقام مطلوبة

                const personName = form.personName.trim();
                const fullDateTime = `${form.date} ${form.time}`;
                
                const newTxn = {
                    id: Date.now(),
                    type: form.txnType === "receive" ? "receive" : "transfer",
                    txnType: form.txnType || "person",
                    date: form.date,
                    dateTime: fullDateTime,
                    fromNumber: form.fromNumber,
                    toNumber: form.toNumber,
                    personName: personName,
                    amount: amount,
                    feeAmount: feeAmount,
                    sourceId: form.sourceId,
                    sourceType: form.sourceType,
                    createdAt: nowStr(),
                    notes: form.notes || "",
                    image: null
                };

                setTransactions(prev => {
                    const updated = [newTxn, ...prev];
                    persistTransaction(newTxn, prev);
                    return updated;
                });
                updateSource(form.sourceId, form.sourceType, amount, form.txnType === "receive" ? "receive" : "transfer");

                // خصم الرسوم تلقائياً من رأس المال
                if (feeAmount > 0) {
                    const feeLog = {
                        id: Date.now() + 1,
                        type: "expense",
                        amount: feeAmount,
                        desc: feeDesc,
                        date: nowStr(),
                        monthDate: currentMonthStr(),
                        logType: "daily",
                    };
                    setFinanceLogs(prev => [feeLog, ...prev]);
                    persistFinanceLog(feeLog);
                    setCapital(prev => {
                        const newCap = prev - feeAmount;
                        persistCapital(newCap);
                        return newCap;
                    });
                }

                const existingPerson = people.find(p => p.personName.toLowerCase() === personName.toLowerCase());
                if (existingPerson) {
                    setPeople(prev => prev.map(p => {
                        if (p.id !== existingPerson.id) return p;
                        const newRecord = {
                            id: Date.now(),
                            type: "transfer",
                            txnType: form.txnType || "person",
                            amount: amount,
                            date: fullDateTime,
                            description: form.txnType === "bank" ? `سحب بنك: ${formatNum(amount)} ج (خصم ${formatNum(feeAmount)} ج)` 
                                       : form.txnType === "fawry" ? `سحب فوري: ${formatNum(amount)} ج (خصم ${formatNum(feeAmount)} ج)`
                                       : `تحويل: ${form.fromNumber} → ${form.toNumber}`
                        };
                        return { ...p, records: [...(p.records || []), newRecord], lastUpdated: nowStr() };
                    }));
                    const actionLabel = form.txnType === "bank" ? "سحب بنك لـ" : form.txnType === "fawry" ? "سحب فوري لـ" : "تحويل لـ";
                    const feeMsg = feeAmount > 0 ? ` — خصم ${formatNum(feeAmount)} ج` : "";
                    showToast(`${actionLabel} ${personName} ✓${feeMsg}`);
                } else {
                    const feeMsg = feeAmount > 0 ? ` — خصم ${formatNum(feeAmount)} ج` : "";
                    showToast(`تم التسجيل ✓${feeMsg}`);
                }

                setForm({ txnType: "person", type: "transfer", date: today(), time: getCurrentTime(), fromNumber: "", toNumber: "", personName: "", amount: "", sourceId: "", sourceType: "line", notes: "", image: null });
                setModal(null);
            }

            function updateSource(sourceId, sourceType, amount, txnType) {
                // txnType هنا "transfer" أو "receive" — الـ txnType (person/bank/fawry) بيتحسب برا
                const delta = txnType === "transfer" ? -amount : amount;
                if (sourceType === "line") {
                    setLines(prev => {
                        const updated = prev.map(l => {
                            if (l.id !== sourceId) return l;
                            return {
                                ...l,
                                usedTodayTransfer: (l.usedTodayTransfer||0) + (txnType==="transfer" ? amount : 0),
                                usedMonthTransfer: (l.usedMonthTransfer||0) + (txnType==="transfer" ? amount : 0),
                                usedTodayReceive:  (l.usedTodayReceive||0)  + (txnType==="receive"  ? amount : 0),
                                usedMonthReceive:  (l.usedMonthReceive||0)  + (txnType==="receive"  ? amount : 0),
                                balance: (l.balance||0) + delta
                            };
                        });
                        persistSources(updated, visas);
                        return updated;
                    });
                } else {
                    setVisas(prev => {
                        const updated = prev.map(v => {
                            if (v.id !== sourceId) return v;
                            return {
                                ...v,
                                usedTodayTransfer: (v.usedTodayTransfer||0) + (txnType==="transfer" ? amount : 0),
                                usedMonthTransfer: (v.usedMonthTransfer||0) + (txnType==="transfer" ? amount : 0),
                                usedTodayReceive:  (v.usedTodayReceive||0)  + (txnType==="receive"  ? amount : 0),
                                usedMonthReceive:  (v.usedMonthReceive||0)  + (txnType==="receive"  ? amount : 0),
                                balance: (v.balance||0) + delta
                            };
                        });
                        persistSources(lines, updated);
                        return updated;
                    });
                }
            }

            function deleteTransaction(txn) {
                setTransactions(prev => { const updated = prev.filter(t => t.id !== txn.id); persistTransactionDelete(txn.id, prev); return updated; });
                const delta = txn.type === "transfer" ? txn.amount : -txn.amount;
                if (txn.sourceType === "line") {
                    setLines(prev => {
                        const updated = prev.map(l => {
                            if (l.id !== txn.sourceId) return l;
                            return {
                                ...l,
                                usedTodayTransfer: Math.max(0, (l.usedTodayTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                                usedMonthTransfer: Math.max(0, (l.usedMonthTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                                usedTodayReceive:  Math.max(0, (l.usedTodayReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                                usedMonthReceive:  Math.max(0, (l.usedMonthReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                                balance: (l.balance||0) + delta
                            };
                        });
                        persistSources(updated, visas);
                        return updated;
                    });
                } else {
                    setVisas(prev => {
                        const updated = prev.map(v => {
                            if (v.id !== txn.sourceId) return v;
                            return {
                                ...v,
                                usedTodayTransfer: Math.max(0, (v.usedTodayTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                                usedMonthTransfer: Math.max(0, (v.usedMonthTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                                usedTodayReceive:  Math.max(0, (v.usedTodayReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                                usedMonthReceive:  Math.max(0, (v.usedMonthReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                                balance: (v.balance||0) + delta
                            };
                        });
                        persistSources(lines, updated);
                        return updated;
                    });
                }
                setConfirmDelete(null);
                showToast("تم حذف التحويل ✓");
            }

            // ⭐ عكس العملية - بيرجع الأرقام كأن شيئاً لم يكن
            function reverseTransaction(txn) {
                // ✅ إصلاح: حذف التحويل من القائمة
                setTransactions(prev => { const updated = prev.filter(t => t.id !== txn.id); persistTransactionDelete(txn.id, prev); return updated; });

                // ✅ إصلاح: عكس تأثير العملية على الرصيد والحدود
                const reverseDelta = txn.type === "transfer" ? txn.amount : -txn.amount; // عكس الـ delta الأصلي

                if (txn.sourceType === "line") {
                    setLines(prev => {
                        const updated = prev.map(l => {
                            if (l.id !== txn.sourceId) return l;
                            return {
                                ...l,
                                usedTodayTransfer: Math.max(0, (l.usedTodayTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                                usedMonthTransfer: Math.max(0, (l.usedMonthTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                                usedTodayReceive:  Math.max(0, (l.usedTodayReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                                usedMonthReceive:  Math.max(0, (l.usedMonthReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                                balance: (l.balance||0) + reverseDelta
                            };
                        });
                        persistSources(updated, visas);
                        return updated;
                    });
                } else {
                    setVisas(prev => {
                        const updated = prev.map(v => {
                            if (v.id !== txn.sourceId) return v;
                            return {
                                ...v,
                                usedTodayTransfer: Math.max(0, (v.usedTodayTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                                usedMonthTransfer: Math.max(0, (v.usedMonthTransfer||0) - (txn.type==="transfer" ? txn.amount : 0)),
                                usedTodayReceive:  Math.max(0, (v.usedTodayReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                                usedMonthReceive:  Math.max(0, (v.usedMonthReceive||0)  - (txn.type==="receive"  ? txn.amount : 0)),
                                balance: (v.balance||0) + reverseDelta
                            };
                        });
                        persistSources(lines, updated);
                        return updated;
                    });
                }

                // ✅ إصلاح: البحث عن الشخص بالـ ID مش الاسم (لو موجود)، وإلا بالاسم كـ fallback
                setPeople(prev => {
                    const updated = prev.map(p => {
                        // ✅ مطابقة بالـ personId لو موجود، وإلا بالاسم
                        const isMatch = txn.personId
                            ? p.id === txn.personId
                            : p.personName.toLowerCase() === txn.personName?.toLowerCase();
                        if (!isMatch) return p;
                        return {
                            ...p,
                            records: (p.records || []).filter(r => !(
                                Math.abs(r.amount) === txn.amount &&
                                r.date === (txn.dateTime || txn.date)
                            )),
                            lastUpdated: nowStr()
                        };
                    });
                    persistPeople(updated);
                    return updated;
                });

                setConfirmDelete(null);
                showToast("↩️ تم عكس العملية وإرجاع الأرقام ✓");
            }

            // FIFO: الدفع بيروح على أقدم جلسة مفتوحة
            function addSessionPayment(personId, sessionId, amount) {
                const amt = parseFloat(amount);
                if (!amt || amt <= 0) { showToast("أدخل مبلغ صحيح","error"); return; }
                const baseId = Date.now();
                setPeople(prev => {
                    const updated = prev.map(p => {
                        if (p.id !== personId) return p;
                        // رتّب من الأقدم للأحدث وخد أول مفتوحة
                        const sorted = [...(p.sessions||[])].sort((a,b) => a.id - b.id);
                        const openSess = sorted.find(s => !s.closed);
                        if (openSess) {
                            const newPayment = { id: baseId, amount: amt, date: nowStr() };
                            const newSessions = (p.sessions||[]).map(s => {
                                if (s.id !== openSess.id) return s;
                                const newPayments = [...(s.payments||[]), newPayment];
                                const totalPaid = newPayments.reduce((sum,pay) => sum+pay.amount, 0);
                                // الدين الكلي للجلسة = transfers لو موجودين، وإلا debtAmount
                                const sessDebt = s.transfers?.length > 0
                                    ? s.transfers.reduce((sum,t) => sum+t.amount, 0)
                                    : (s.debtAmount||0);
                                const isDone = totalPaid >= sessDebt;
                                return { ...s, payments: newPayments, closed: isDone, closedAt: isDone ? nowStr() : s.closedAt };
                            });
                            return { ...p, sessions: newSessions, lastUpdated: nowStr() };
                        } else {
                            // ❌ مفيش جلسة مفتوحة — احسب الدين المتراكم وافتح جلسة تلقائية
                            let currentDebt = 0, currentPaid = 0;
                            (p.sessions||[]).forEach(s => {
                                currentDebt += s.transfers?.length > 0
                                    ? s.transfers.reduce((sum,t) => sum+t.amount, 0)
                                    : (s.debtAmount||0);
                                (s.payments||[]).forEach(pay => currentPaid += pay.amount);
                            });
                            (p.records||[]).forEach(r => {
                                if (r.amount > 0) currentDebt += r.amount;
                                else currentPaid += Math.abs(r.amount);
                            });
                            const currentBalance = Math.max(0, currentDebt - currentPaid);
                            if (currentBalance === 0) {
                                showToast("ما في دين متبقي لهذا العميل", "info");
                                return p;
                            }
                            const autoSess = {
                                id: baseId, debtAmount: currentBalance,
                                desc: "حساب مستمر", date: nowStr(),
                                payments: [{ id: baseId + 1, amount: amt, date: nowStr() }],
                                transfers: [], closed: false, closedAt: null
                            };
                            return { ...p, sessions: [...(p.sessions||[]), autoSess], lastUpdated: nowStr() };
                        }
                    });
                    persistPeople(updated);
                    return updated;
                });
                showToast("✓ تم تسجيل الدفعة");
            }

            function handleTouchStart(e) {
                if (modal || viewImg || e.target.closest('input') || e.target.closest('select')) return;
                touchStartX.current = e.targetTouches[0]?.clientX;
            }

            function handleTouchEnd(e) {
                if (modal || viewImg || e.target.closest('input') || e.target.closest('select')) return;
                touchEndX.current = e.changedTouches[0]?.clientX;
                const swipeDistance = touchStartX.current - touchEndX.current;
                const minSwipeDistance = 60;
                const currentIdx = TABS_ORDER.indexOf(tab);

                if (swipeDistance > minSwipeDistance && currentIdx < TABS_ORDER.length - 1) {
                    setTab(TABS_ORDER[currentIdx + 1]);
                }
                if (swipeDistance < -minSwipeDistance && currentIdx > 0) {
                    setTab(TABS_ORDER[currentIdx - 1]);
                }
            }

            const selectedSource = form.sourceId ? sources.find(s=>s.id===form.sourceId) : null;
            const alertSources = sources.filter(s=>(s.usedMonth/s.monthlyLimit)>=0.8);
            const todayTxns = transactions.filter(t => t.date === today());
            
            // ✅ الجلسة المفتوحة — الأقدم (الأصغر id) من الجلسات غير المقفولة
            const getOpenSession = (person) => {
                if (!person.sessions || person.sessions.length === 0) {
                    if (person.records && person.records.length > 0) {
                        const bal = person.records.reduce((s,r) => s+(r.amount||0), 0);
                        return { balance: Math.max(0, bal), isLegacy: true };
                    }
                    return null;
                }
                const openSessions = person.sessions.filter(s => !s.closed);
                if (openSessions.length === 0) return null;
                return openSessions.sort((a,b) => a.id - b.id)[0];
            };

            const getPersonBalance = (person) => {
                // legacy فقط بدون sessions
                if ((!person.sessions || person.sessions.length === 0) && person.records?.length > 0) {
                    const bal = person.records.reduce((s,r) => s+(r.amount||0), 0);
                    return Math.max(0, bal);
                }
                let totalDebt = 0, totalPaid = 0;
                (person.sessions||[]).forEach(s => {
                    totalDebt += s.debtAmount || 0;
                    (s.payments||[]).forEach(p => totalPaid += p.amount);
                });
                (person.records||[]).forEach(r => {
                    if (r.amount > 0) totalDebt += r.amount;
                    else totalPaid += Math.abs(r.amount);
                });
                return Math.max(0, totalDebt - totalPaid);

                                        // لو في transfers — اعرض كل واحدة لوحدها
                                        sess.transfers.forEach(t => {
                                            const tDate = (t.date||sess.date||"").split(" ")[0];
                                            entries.push({ id: t.id, sessionId: sess.id, dateKey: tDate, kind:"debt", amount: t.amount, label: t.desc||sess.desc||"تحويل", date: t.date||sess.date });
                                        });
                                    } else {
                                        // session بـ debtAmount مباشرة
                                        entries.push({ id: null, sessionId: sess.id, dateKey: sessDate, kind:"debt", amount: sess.debtAmount, label: sess.desc||"تحويل", date: sess.date });
                                    }
                                    // الدفعات
                                    (sess.payments||[]).forEach(pay => {
                                        const payDate = (pay.date||"").split(" ")[0];
                                        entries.push({ id: pay.id, sessionId: sess.id, dateKey: payDate, kind:"payment", amount: pay.amount, date: pay.date });
                                    });
                                });
                                // اجمع كمان records القديمة (للتوافق)
                                (person.records||[]).forEach(r => {
                                    const rDate = (r.date||"").split(" ")[0];
                                    if (r.type === "payment" || r.amount < 0) {
                                        entries.push({ dateKey: rDate, kind:"payment", amount: Math.abs(r.amount), date: r.date });
                                    } else {
                                        entries.push({ dateKey: rDate, kind:"debt", amount: r.amount, label: r.description||"تحويل", date: r.date });
                                    }
                                });

                                // رتّب من الأقدم للأحدث عشان نحسب التراكم
                                entries.sort((a,b) => (a.date||"") > (b.date||"") ? 1 : -1);

                                // اجمع حسب اليوم
                                const dayMap = {};
                                entries.forEach(e => {
                                    if (!e.dateKey) return;
                                    if (!dayMap[e.dateKey]) dayMap[e.dateKey] = { debt:0, paid:0, entries:[] };
                                    if (e.kind === "debt") dayMap[e.dateKey].debt += e.amount;
                                    else dayMap[e.dateKey].paid += e.amount;
                                    dayMap[e.dateKey].entries.push(e);
                                });

                                // رتّب الأيام من الأقدم وأحسب المتراكم
                                const days = Object.keys(dayMap).sort();
                                let running = 0;
                                return days.map(dateKey => {
                                    const d = dayMap[dateKey];
                                    const carryIn = running;
                                    running = running + d.debt - d.paid;
                                    return { dateKey, debt: d.debt, paid: d.paid, carryIn, runningAfter: running, entries: d.entries };
                                }).reverse(); // اعرض من الأحدث للأقدم
                            };

                            const dailyLedger = buildDailyLedger(selectedPerson);

                            return (
                            <div>
                                <button onClick={()=>setSelectedPersonId(null)} style={{width:"100%",background:"#1e293b",border:"none",borderRadius:12,padding:12,color:"#94a3b8",marginBottom:16,cursor:"pointer",fontWeight:600}}>← رجوع</button>

                                {/* هيدر العميل */}
                                <div style={{background:"linear-gradient(135deg,#0f1e3d,#0a1628)",border:"1px solid #a78bfa40",borderRadius:16,padding:16,marginBottom:12}}>
                                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                                        <div>
                                            <div style={{fontSize:20,fontWeight:900,color:"#e2e8f0"}}>{selectedPerson.personName}</div>
                                            <div style={{fontSize:11,color:"#64748b",marginTop:2}}>عمولة: {getPersonCommission(selectedPerson)} ج / الألف</div>
                                        </div>
                                        {isAdmin && <button onClick={()=>setCommissionModal({personId:selectedPerson.id, current:getPersonCommission(selectedPerson)})} style={{background:"#22d3ee20",border:"1px solid #22d3ee40",borderRadius:10,padding:"6px 12px",color:"#22d3ee",fontSize:12,cursor:"pointer",fontWeight:600}}>✏️ عمولة</button>}
                                    </div>
                                    {/* ملخص إجمالي */}
                                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
                                        <div style={{background:"#0a0f1e",borderRadius:10,padding:10,textAlign:"center"}}>
                                            <div style={{fontSize:15,fontWeight:800,color:"#f59e0b"}}>{formatNum(dailyLedger.reduce((s,d)=>s+d.debt,0))} ج</div>
                                            <div style={{fontSize:10,color:"#475569"}}>إجمالي الحوالات</div>
                                        </div>
                                        <div style={{background:"#0a0f1e",borderRadius:10,padding:10,textAlign:"center"}}>
                                            <div style={{fontSize:15,fontWeight:800,color:"#10b981"}}>{formatNum(dailyLedger.reduce((s,d)=>s+d.paid,0))} ج</div>
                                            <div style={{fontSize:10,color:"#475569"}}>إجمالي المدفوع</div>
                                        </div>
                                        <div style={{background:"#0a0f1e",borderRadius:10,padding:10,textAlign:"center"}}>
                                            <div style={{fontSize:15,fontWeight:800,color:balance>0?"#ef4444":"#10b981"}}>{formatNum(balance)} ج</div>
                                            <div style={{fontSize:10,color:"#475569"}}>المتبقي الآن</div>
                                        </div>
                                    </div>
                                    {commission > 0 && (
                                        <div style={{background:"#22d3ee10",border:"1px solid #22d3ee20",borderRadius:8,padding:"8px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                                            <span style={{fontSize:12,color:"#22d3ee"}}>💰 العمولة الكلية</span>
                                            <span style={{fontSize:14,fontWeight:800,color:"#22d3ee"}}>{formatNum(commission)} ج</span>
                                        </div>
                                    )}
                                    {balance > 0 && (
                                        <div>
                                            <ProgressBar used={dailyLedger.reduce((s,d)=>s+d.paid,0)} limit={Math.max(dailyLedger.reduce((s,d)=>s+d.debt,0),1)} color="#a78bfa"/>
                                            <div style={{fontSize:10,color:"#475569",textAlign:"center",marginTop:4}}>
                                                {Math.round((dailyLedger.reduce((s,d)=>s+d.paid,0)/Math.max(dailyLedger.reduce((s,d)=>s+d.debt,0),1))*100)}% تم السداد
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* إضافة دفعة */}
                                {isAdmin && balance > 0 && (
                                    <div style={{background:"linear-gradient(135deg,#0f2820,#0a1628)",border:"2px solid #10b98150",borderRadius:14,padding:14,marginBottom:12}}>
                                        <div style={{fontSize:13,color:"#10b981",marginBottom:8,fontWeight:700}}>💰 تسجيل دفعة — المتبقي: {formatNum(balance)} ج</div>
                                        <PaymentInput onPay={(amt)=>addSessionPayment(selectedPerson.id, openSession?.id, amt)} />
                                        {openSession && !openSession.isLegacy && !openSession.closed && balance === 0 && (
                                            <button onClick={()=>closeSession(selectedPerson.id, openSession.id)}
                                                style={{width:"100%",marginTop:8,background:"linear-gradient(135deg,#10b981,#059669)",border:"none",borderRadius:12,padding:12,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>
                                                ✅ قفل الحساب — الرصيد اتسدد
                                            </button>
                                        )}
                                        {openSession && !openSession.isLegacy && !openSession.closed && balance > 0 && (
                                            <button onClick={()=>{if(window.confirm("هتقفل الحساب وفيه رصيد متأخر. متأكد؟"))closeSession(selectedPerson.id, openSession.id);}}
                                                style={{width:"100%",marginTop:8,background:"#f59e0b20",border:"1px solid #f59e0b40",borderRadius:12,padding:10,color:"#f59e0b",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                                                🔒 قفل الحساب يدوياً (فيه {formatNum(balance)} ج متبقية)
                                            </button>
                                        )}
                                    </div>
                                )}

                                {isAdmin && (
                                    <button onClick={()=>setConfirmDelete({type:"person",data:selectedPerson})} style={{width:"100%",background:"#ef444415",border:"1px solid #ef444430",borderRadius:12,padding:10,color:"#ef4444",cursor:"pointer",fontWeight:600,fontSize:13,marginBottom:12}}>🗑️ حذف العميل</button>
                                )}

                                {/* ⭐ السجل اليومي المفصّل */}
                                <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0",marginBottom:10}}>📋 السجل اليومي</div>
                                {dailyLedger.length === 0 && (
                                    <div style={{textAlign:"center",color:"#475569",padding:20}}>لا توجد سجلات بعد</div>

                                    const dayNet = day.debt - day.paid;

                                                        📅 {formatDateArabic(day.dateKey)}
                                                    </span>
                                                    {isToday && <span style={{fontSize:10,background:"#a78bfa20",color:"#a78bfa",borderRadius:20,padding:"2px 8px",fontWeight:700}}>اليوم</span>}

                                                <span style={{fontSize:14,fontWeight:800,color: day.runningAfter>0?"#ef4444":"#10b981"}}>
                                                    {formatNum(day.runningAfter)} ج

                                                                {entry.label && entry.label !== "تحويل" && <span> · {entry.label}</span>}
                                                            </div>
                                                        </div>
                                                        {isAdmin && (
                                                            <div style={{display:"flex",gap:6}}>
                                                                <button onClick={()=>setEditEntryModal({
                                                                    type: isDebt?"debt":"payment",
                                                                    personId: selectedPerson.id,
                                                                    sessionId: entry.sessionId,
                                                                    entryId: entry.id,
                                                                    amount: entry.amount,
                                                                    date: entry.date
                                                                })} style={{background:"#1e293b",border:"none",borderRadius:8,padding:"4px 8px",color:"#94a3b8",cursor:"pointer",fontSize:12}}>✏️</button>
                                                                <button onClick={()=>{
                                                                    if(window.confirm("تمسح الـ entry ده؟")) {
                                                                        if(isDebt) deleteDebtEntry(selectedPerson.id, entry.sessionId, entry.id);
                                                                        else deletePaymentEntry(selectedPerson.id, entry.sessionId, entry.id);
                                                                    }
                                                                }} style={{background:"#ef444415",border:"none",borderRadius:8,padding:"4px 8px",color:"#ef4444",cursor:"pointer",fontSize:12}}>🗑️</button>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}

                                            {/* صافي اليوم */}
                                            {(day.debt > 0 || day.paid > 0) && (
                                                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,borderTop:"1px solid #1e3a5f",marginTop:4}}>
                                                    <span style={{fontSize:11,color:"#64748b"}}>صافي اليوم</span>
                                                    <span style={{fontSize:12,fontWeight:700,color: dayNet>0?"#ef4444":dayNet<0?"#10b981":"#94a3b8"}}>
                                                        {dayNet>0?"+":""}{formatNum(dayNet)} ج
                                                        {dayNet===0 && " ✅"}
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}

                                {/* الحسابات المقفولة */}
                                {closedSessions.length > 0 && (
                                    <div style={{marginTop:8}}>
                                        <div style={{fontSize:13,fontWeight:700,color:"#10b981",marginBottom:8}}>✅ الحسابات المكتملة ({closedSessions.length})</div>
                                        {closedSessions.map(session => {
                                            const paid = (session.payments||[]).reduce((s,p)=>s+p.amount,0);
                                            return (
                                                <div key={session.id} style={{background:"#0f1e3d",border:"1px solid #10b98120",borderRadius:12,padding:12,marginBottom:8,opacity:0.7}}>
                                                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                                        <div>
                                                            <div style={{fontSize:13,fontWeight:700,color:"#94a3b8"}}>{session.desc || "حساب مكتمل"}</div>
                                                            <div style={{fontSize:10,color:"#475569"}}>{formatDateOnly(session.date)} ← {formatDateOnly(session.closedAt)}</div>
                                                        </div>
                                                        <div style={{textAlign:"left"}}>
                                                            <div style={{fontSize:13,fontWeight:700,color:"#10b981"}}>{formatNum(session.debtAmount)} ج ✓</div>
                                                            <div style={{fontSize:10,color:"#475569"}}>مدفوع: {formatNum(paid)} ج</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                            );
                        })()}

                        {/* LINES */}
                        {tab==="lines" && (
                            <div>
                                <div style={{marginBottom:20}}>
                                    <div style={{fontSize:14,fontWeight:700,color:"#22d3ee",marginBottom:10}}>📱 الخطوط</div>
                                    {lines.map(l=>{
                                        const mtPct = ((l.usedMonthTransfer||0)/LINES_LIMIT_MONTHLY)*100;
                                        const mrPct = ((l.usedMonthReceive||0)/LINES_LIMIT_MONTHLY)*100;
                                        const isDanger = mtPct >= 80 || mrPct >= 80;
                                        const isAvail = l.available !== false;
                                        const borderColor = isDanger ? "#ef444440" : isAvail ? "#22c55e60" : "#ef444460";
                                        const availColor = isAvail ? "#22c55e" : "#ef4444";
                                        const availLabel = isAvail ? "✅ متاح" : "🔴 مش متاح";
                                        const balance = l.balance || 0;
                                        return (
                                            <div key={l.id} style={{background:"#0f1e3d",border:`1px solid ${borderColor}`,borderRadius:12,padding:12,marginBottom:8,opacity: isAvail ? 1 : 0.65}}>

                                                        <span style={{fontSize:14,fontWeight:700,color: isAvail ? "#22d3ee" : "#94a3b8"}}>{l.name}</span>

                                                        {isAdmin && <button onClick={()=>{setEditLineId(l.id);setModal("editLine");}} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer"}}>✏️</button>}
                                                        {isAdmin && lines.length > 1 && <button onClick={()=>{if(window.confirm(`حذف ${l.name}؟`)){setLines(p=>{const nl=p.filter(x=>x.id!==l.id);persistSources(nl,visas);return nl;});}}} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:14}}>🗑️</button>}
                                                    </div>
                                                </div>
                                                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                                                    <span style={{fontSize:11,color:l.number?"#64748b":"#334155",cursor:l.number?"copy":"auto"}} onClick={()=>{if(l.number){navigator.clipboard.writeText(l.number);showToast("تم النسخ ✓");}}}>{l.number ? `${l.number} 📋` : "بلا رقم"}</span>
                                                    <span style={{fontSize:13,fontWeight:700,color: balance >= 0 ? "#10b981" : "#ef4444"}}>💰 {formatNum(balance)} ج</span>

                                                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#94a3b8",marginBottom:3}}>
                                                        <span>💸 تحويل اليوم: <b style={{color:"#f59e0b"}}>{formatNum(l.usedTodayTransfer||0)}</b> / {formatNum(LINES_LIMIT_DAILY)}</span>

                                                    </div>
                                                    <ProgressBar used={l.usedMonthTransfer||0} limit={LINES_LIMIT_MONTHLY} color="#f59e0b"/>
                                                </div>
                                                {/* استلام */}
                                                <div>
                                                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#94a3b8",marginBottom:3}}>
                                                        <span>📥 استلام اليوم: <b style={{color:"#22d3ee"}}>{formatNum(l.usedTodayReceive||0)}</b> / {formatNum(LINES_LIMIT_DAILY)}</span>
                                                        <span>الشهر: <b style={{color: mrPct>=80?"#ef4444":"#22d3ee"}}>{formatNum(l.usedMonthReceive||0)}</b> / {formatNum(LINES_LIMIT_MONTHLY)}</span>
                                                    </div>
                                                    <ProgressBar used={l.usedMonthReceive||0} limit={LINES_LIMIT_MONTHLY} color="#22d3ee"/>

                                <div style={{marginBottom:20}}>
                                    <div style={{fontSize:14,fontWeight:700,color:"#f59e0b",marginBottom:10}}>⚡ فيزا فوري</div>
                                    {visas.filter(v=>v.visaType!=="insta").map(v=>{
                                        const lims = getVisaLimits(v);
                                        const VISA_LIMIT_MONTHLY = lims.monthlyLimit;

                                        const isDanger = mtPct >= 80 || mrPct >= 80;
                                        const isAvail = v.available !== false;
                                        const borderColor = isDanger ? "#ef444440" : isAvail ? "#22c55e60" : "#ef444460";
                                        const availColor = isAvail ? "#22c55e" : "#ef4444";
                                        const availLabel = isAvail ? "✅ متاح" : "🔴 مش متاح";
                                        const balance = v.balance || 0;
                                        return (
                                            <div key={v.id} style={{background:"#0f1e3d",border:`1px solid ${borderColor}`,borderRadius:12,padding:12,marginBottom:8,opacity: isAvail ? 1 : 0.65}}>
                                                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                                                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                                                        <span style={{fontSize:14,fontWeight:700,color: isAvail ? "#a78bfa" : "#94a3b8"}}>{v.name}</span>
                                                        <span style={{fontSize:10,background: isAvail ? "#22c55e20" : "#ef444420",color: availColor,border:`1px solid ${availColor}40`,borderRadius:20,padding:"2px 8px",fontWeight:700}}>{availLabel}</span>

                                                        {isAdmin && <button onClick={()=>{setEditLineId(v.id);setModal("editLine");}} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer"}}>✏️</button>}
