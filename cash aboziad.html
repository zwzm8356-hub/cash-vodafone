        // ══════════════════════════════════════════════════════════════
        //  📊  DailyBalanceHistoryModal — سجل الرصيد اليومي عبر السنين
        //  بيوريك كل يوم كان معاك فيه كام (رأس المال) + المكسب/المصروف بتاع اليوم،
        //  مجموعين حسب السنة والشهر — البيانات دي متسجلة تلقائياً وما بتتمسحش أبداً.
        // ══════════════════════════════════════════════════════════════
        function DailyBalanceHistoryModal({ log = [], onClose, formatNum, maskNum, privacyMode }) {
            const [openGroups, setOpenGroups] = useState({});

            // تجميع حسب السنة → الشهر
            const groups = React.useMemo(() => {
                const byYear = {};
                const sorted = [...log].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
                sorted.forEach(entry => {
                    const year = (entry.date || "----").slice(0, 4);
                    const month = entry.monthDate || (entry.date ? entry.date.slice(0, 7) : "");
                    if (!byYear[year]) byYear[year] = {};
                    if (!byYear[year][month]) byYear[year][month] = [];
                    byYear[year][month].push(entry);
                });
                return byYear;
            }, [log]);

            const years = Object.keys(groups).sort().reverse();
            const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
            function monthLabel(m) {
                if (!m) return "غير محدد";
                const [y, mo] = m.split("-");
                return `${monthNames[parseInt(mo,10)-1] || mo} ${y}`;
            }
            function toggle(key) {
                setOpenGroups(p => ({ ...p, [key]: !p[key] }));
            }

            return (
                <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:9997,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
                    <div onClick={e=>e.stopPropagation()} style={{width:"min(94vw,520px)",maxHeight:"85vh",background:"var(--bg-card,#0a1628)",border:"1px solid var(--border-dim,#1e3a5f)",borderRadius:16,overflow:"hidden",display:"flex",flexDirection:"column",direction:"rtl"}}>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:16,borderBottom:"1px solid var(--border-dim,#1e3a5f)"}}>
                            <div style={{fontSize:15,fontWeight:800,color:"var(--text-bright,#e2e8f0)"}}>📊 سجل الرصيد اليومي</div>
                            <button onClick={onClose} style={{background:"none",border:"none",color:"var(--text-mid,#94a3b8)",fontSize:18,cursor:"pointer"}}>✕</button>
                        </div>
                        <div style={{padding:"8px 16px",fontSize:11,color:"#64748b",borderBottom:"1px solid var(--border-dim,#1e3a5f)"}}>
                            كل يوم بيتسجّل تلقائياً — رأس المال + المكسب والمصروف. البيانات دي متراكمة وما بتتمسحش أبداً.
                        </div>
                        <div style={{overflowY:"auto",padding:12,flex:1}}>
                            {years.length === 0 && (
                                <div style={{textAlign:"center",color:"var(--text-dim,#475569)",padding:30,fontSize:13}}>
                                    لسه مفيش سجلات — هتتسجل تلقائياً أول ما يعدي أول يوم كامل على التطبيق
                                </div>
                            )}
                            {years.map(year => {
                                const months = Object.keys(groups[year]).sort().reverse();
                                return (
                                    <div key={year} style={{marginBottom:14}}>
                                        <div style={{fontSize:13,fontWeight:800,color:"#3b82f6",marginBottom:8,paddingRight:4}}>📅 {year}</div>
                                        {months.map(month => {
                                            const entries = groups[year][month];
                                            const key = `${year}-${month}`;
                                            const isOpen = !!openGroups[key];
                                            const monthNet = entries.reduce((s,e)=>s+(e.net||0),0);
                                            const closingEntry = entries[0]; // الأحدث في الشهر ده (بعد الترتيب التنازلي)
                                            return (
                                                <div key={key} style={{background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:12,marginBottom:8,overflow:"hidden"}}>
                                                    <div onClick={()=>toggle(key)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",cursor:"pointer"}}>
                                                        <div>
                                                            <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0"}}>{monthLabel(month)}</div>
                                                            <div style={{fontSize:10,color:"#64748b",marginTop:2}}>{entries.length} يوم مسجّل{closingEntry ? ` — آخر رصيد ${maskNum(closingEntry.capital, privacyMode)} ج` : ""}</div>
                                                        </div>
                                                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                                                            <span style={{fontSize:13,fontWeight:700,color: monthNet >= 0 ? "#10b981" : "#ef4444"}}>{monthNet >= 0 ? "+" : ""}{maskNum(monthNet, privacyMode)} ج</span>
                                                            <span style={{color:"#64748b",fontSize:12}}>{isOpen ? "▲" : "▼"}</span>
                                                        </div>
                                                    </div>
                                                    {isOpen && (
                                                        <div style={{borderTop:"1px solid #1e3a5f"}}>
                                                            {entries.map(e => (
                                                                <div key={e.date} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 14px",borderBottom:"1px solid #14294a"}}>
                                                                    <div style={{fontSize:12,color:"#94a3b8"}}>{e.date}</div>
                                                                    <div style={{display:"flex",gap:10,alignItems:"center"}}>
                                                                        <span style={{fontSize:10,color:"#10b981"}}>+{maskNum(e.income||0, privacyMode)}</span>
                                                                        <span style={{fontSize:10,color:"#ef4444"}}>-{maskNum(e.expense||0, privacyMode)}</span>
                                                                        <span style={{fontSize:12,fontWeight:700,color:"#3b82f6"}}>💰 {maskNum(e.capital||0, privacyMode)} ج</span>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════
        //  ⚡  QuickAddModal — إضافة عملية سريعة بـ 3 حقول
        // ══════════════════════════════════════════════════════════════
        function QuickAddModal({ sources, onSave, onClose, showToast, commissionSettings, transactions = [], people = [] }) {
            const lastSourceId = (() => { try { return localStorage.getItem("qa_lastSource") || ""; } catch(e){ return ""; } })();
            const [amount, setAmount] = useState("");
            const [toNumber, setToNumber] = useState("");
            const [sourceId, setSourceId] = useState(() => {
                const validLast = sources.find(s => s.id === lastSourceId && s.available !== false);
                return validLast ? lastSourceId : (sources[0]?.id || "");
            });
            const [type, setType] = useState("transfer");
            const fawriRate = commissionSettings?.fawriWithdrawRate ?? 0.0057;
            const fawriFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
            const bankRate = commissionSettings?.bankWithdrawRate ?? 0.002;

            // ⭐ أرقام مستخدمة كتير (أحدث 60 عملية) — بيظهروا كـ chips بدل ما تكتبهم
            const recentNumbers = React.useMemo(() => {
                const counts = {};
                for (const t of transactions.slice(0, 60)) {
                    const n = (t.toNumber || "").trim();
                    if (!n || n.length < 8) continue;
                    counts[n] = (counts[n] || 0) + 1;
                }
                const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,6).map(([n]) => n);
                return sorted.map(n => {
                    const p = people.find(pp => pp.phone === n);
                    return { number: n, name: p?.personName || "" };
                });
            }, [transactions, people]);

            // ⭐ مبالغ متكررة فعليًا عندك (بدل أرقام تخمينية ثابتة)
            const freqAmounts = React.useMemo(() => {
                const counts = {};
                for (const t of transactions.slice(0, 80)) {
                    const a = Math.round(Number(t.amount) || 0);
                    if (!a) continue;
                    counts[a] = (counts[a] || 0) + 1;
                }
                const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,6).map(([a]) => Number(a));
                return sorted.length ? sorted : [50,100,200,500,1000,2000];
            }, [transactions]);

            // ⭐ لصق رسالة فودافون كاش كاملة (SMS/إشعار) — بيطلع منها المبلغ والرقم أوتوماتيك
            function handleSmartPaste(e) {
                const text = (e.clipboardData || window.clipboardData)?.getData("text") || "";
                if (!text || text.length < 6) return;
                const numMatch = text.match(/01[0-2,5]\d{8}/);
                const amtMatch = text.match(/([\d,]+(?:\.\d+)?)\s*(?:ج|جنيه|EGP|LE)/i) || text.match(/([\d,]{2,})/);
                let filled = false;
                if (numMatch) { setToNumber(numMatch[0]); filled = true; }
                if (amtMatch) { setAmount(amtMatch[1].replace(/,/g,"")); filled = true; }
                if (filled) { e.preventDefault(); showToast("📋 اتملت البيانات من الرسالة"); }
            }

            // ⭐ إدخال بالصوت (اختياري) — بتقول رقم أو مبلغ وهو بيحطه في الحقل
            const [listeningField, setListeningField] = React.useState(null);
            const voiceSupported = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
            function startVoice(field) {
                if (!voiceSupported) { showToast("المتصفح ده مش بيدعم الإدخال الصوتي","error"); return; }
                const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new Rec();
                rec.lang = "ar-EG";
                rec.interimResults = false;
                rec.maxAlternatives = 1;
                setListeningField(field);
                rec.onresult = (ev) => {
                    const said = ev.results[0][0].transcript || "";
                    const digits = said.replace(/[^\d]/g, "");
                    if (field === "amount") setAmount(digits);
                    else setToNumber(digits);
                };
                rec.onerror = () => showToast("مسمعتش حاجة، جرب تاني","error");
                rec.onend = () => setListeningField(null);
                rec.start();
            }
            const micBtn = (field) => voiceSupported ? (
                <button type="button" onClick={()=>startVoice(field)}
                    style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",background:listeningField===field?"#e4000022":"transparent",border:"none",fontSize:16,cursor:"pointer",padding:4,color:listeningField===field?"#e40000":"#7a8fa8"}}>
                    {listeningField===field ? "🔴" : "🎤"}
                </button>
            ) : null;

            function calcCommission() {
                const amt = parseFloat(amount) || 0;
                if (!amt) return null;
                if (type === "fawri_withdraw") return { label: "عمولة فوري", val: Math.round((amt * fawriRate + fawriFixed) * 100) / 100 };
                if (type === "bank_withdraw")  return { label: "عمولة بنك",  val: Math.round(amt * bankRate * 100) / 100 };
                return null;
            }
            const comm = calcCommission();
            const availSources = sources.filter(s => s.available !== false);
            function pad(n) { return String(n).padStart(2,"0"); }
            function getToday() { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
            function getTime()  { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

            function handleSave() {
                if (!amount || isNaN(parseFloat(amount))) { showToast("أدخل مبلغ صحيح","error"); return; }
                if (!sourceId) { showToast("اختار خط أو فيزا","error"); return; }
                const src = sources.find(s=>s.id===sourceId);
                try { localStorage.setItem("qa_lastSource", sourceId); } catch(e){}
                onSave({
                    type, amount: parseFloat(amount),
                    fromNumber: src?.number || "",
                    toNumber, personName: toNumber || "—",
                    sourceId, sourceType: src?.type || "line",
                    date: getToday(), time: getTime(), notes: "عملية سريعة", image: null,
                    id: generateUniqueId("txn")
                });
                onClose();
            }

            const iStyle = { width:"100%", background:"#05070f", border:"1px solid #1e3a5f", borderRadius:10, padding:"12px 14px", color:"#c8d6e8", fontSize:14, outline:"none", boxSizing:"border-box", textAlign:"right", fontFamily:"Tajawal,sans-serif" };
            return (
                <div className="glass-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
                    <div className="glass-modal">
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                            <div style={{fontSize:16,fontWeight:700,color:"#22d3ee"}}>⚡ عملية سريعة</div>
                            <button onClick={onClose} aria-label="إغلاق" style={{background:"rgba(255,255,255,0.06)",border:"1px solid #1a2235",borderRadius:8,width:32,height:32,color:"#7a8fa8",cursor:"pointer",fontSize:16}}>×</button>
                        </div>
                        <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
                            {[["transfer","تحويل","#22d3ee"],["receive","استلام","#10b981"],["bank_withdraw","سحب بنك","#3b82f6"],["fawri_withdraw","سحب فوري","#a78bfa"]].map(([v,l,c])=>(
                                <button key={v} onClick={()=>setType(v)}
                                    style={{flex:1,minWidth:70,background:type===v?`${c}22`:"#0d1120",border:`1px solid ${type===v?c:"#1e3a5f"}`,borderRadius:8,padding:"8px 4px",color:type===v?c:"#7a8fa8",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>
                                    {l}
                                </button>
                            ))}
                        </div>
                        <div style={{marginBottom:12}}>
                            <div style={{fontSize:11,color:"#7a8fa8",marginBottom:5}}>المبلغ (ج) — أو الصق رسالة فودافون كاش هنا</div>
                            <div style={{position:"relative"}}>
                                <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} onPaste={handleSmartPaste} placeholder="0" autoFocus style={{...iStyle,paddingLeft:34}}/>
                                {micBtn("amount")}
                            </div>
                            {freqAmounts.length > 0 && (
                                <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
                                    {freqAmounts.map(a => (
                                        <button key={a} onClick={()=>setAmount(String(a))}
                                            style={{background:amount===String(a)?"#22d3ee22":"#0d1120",border:`1px solid ${amount===String(a)?"#22d3ee":"#1e3a5f"}`,borderRadius:20,padding:"4px 12px",color:amount===String(a)?"#22d3ee":"#7a8fa8",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>
                                            {a}
                                        </button>
                                    ))}
                                </div>
                            )}
                            {comm && (
                                <div style={{marginTop:6,background:"#10b98115",border:"1px solid #10b98130",borderRadius:8,padding:"6px 10px",fontSize:12,color:"#10b981",display:"flex",justifyContent:"space-between"}}>
                                    <span>{comm.label}</span><span style={{fontWeight:700}}>{comm.val} ج</span>
                                </div>
                            )}
                        </div>
                        <div style={{marginBottom:12}}>
                            <div style={{fontSize:11,color:"#7a8fa8",marginBottom:5}}>رقم العميل</div>
                            <div style={{position:"relative"}}>
                                <input type="tel" value={toNumber} onChange={e=>setToNumber(e.target.value)} onPaste={handleSmartPaste} placeholder="01xxxxxxxxx" style={{...iStyle,paddingLeft:34}}/>
                                {micBtn("phone")}
                            </div>
                            {recentNumbers.length > 0 && (
                                <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
                                    {recentNumbers.map(({number,name}) => (
                                        <button key={number} onClick={()=>setToNumber(number)}
                                            style={{background:toNumber===number?"#22d3ee22":"#0d1120",border:`1px solid ${toNumber===number?"#22d3ee":"#1e3a5f"}`,borderRadius:20,padding:"4px 12px",color:toNumber===number?"#22d3ee":"#7a8fa8",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>
                                            {name ? name : number.slice(-4)}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div style={{marginBottom:16}}>
                            <div style={{fontSize:11,color:"#7a8fa8",marginBottom:5}}>الخط / الفيزا</div>
                            <select value={sourceId} onChange={e=>setSourceId(e.target.value)} style={{...iStyle}}>
                                {availSources.map(s=><option key={s.id} value={s.id}>{s.name}{s.balance?` (${s.balance} ج)`:""}</option>)}
                            </select>
                        </div>
                        <button onClick={handleSave}
                            style={{width:"100%",background:"linear-gradient(135deg,#22d3ee,#0891b2)",border:"none",borderRadius:12,padding:14,color:"#0a0f1e",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>
                            ✓ حفظ العملية
                        </button>
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════
        //  🔍  GlobalSearch — بحث شامل في العملاء والعمليات والأرقام
        // ══════════════════════════════════════════════════════════════
        function GlobalSearch({ transactions, people, lines, visas, onClose, formatNum, getPersonBalance }) {
            const [q, setQ] = useState("");
            const inputRef = React.useRef();
            React.useEffect(()=>{ inputRef.current?.focus(); },[]);

            const results = React.useMemo(()=>{
                if (!q.trim() || q.length < 2) return { txns:[], persons:[], sources:[] };
                const ql = q.toLowerCase();
                const txns = transactions.filter(t=>
                    (t.personName||"").includes(q) ||
                    (t.fromNumber||"").includes(q) ||
                    (t.toNumber||"").includes(q) ||
                    String(t.amount).includes(q) ||
                    (t.notes||"").includes(q) ||
                    (t.date||"").includes(q)
                ).slice(0,8);
                const persons = people.filter(p=>
                    (p.personName||"").includes(q)||
                    (p.phone||"").includes(q)
                ).slice(0,5);
                const sources = [...lines,...visas].filter(s=>
                    (s.name||"").includes(q)||(s.number||"").includes(q)
                ).slice(0,4);
                return { txns, persons, sources };
            }, [q, transactions, people, lines, visas]);

            const total = results.txns.length + results.persons.length + results.sources.length;
            const typeLabel = t => t.type==="transfer"?"💸 تحويل":t.type==="receive"?"📥 استلام":t.type==="bank_withdraw"?"🏦 سحب بنك":t.type==="fawri_withdraw"?"💳 سحب فوري":"⚡";

            return (
                <div className="glass-overlay" style={{alignItems:"flex-start",paddingTop:60}} onClick={e=>e.target===e.currentTarget&&onClose()}>
                    <div style={{width:"100%",background:"#0a0c16",borderRadius:"0 0 22px 22px",padding:"16px 16px 24px",maxHeight:"80vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,0.8)"}}>
                        <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"center"}}>
                            <div style={{fontSize:18}}>🔍</div>
                            <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)}
                                placeholder="ابحث في كل شيء — عملاء، أرقام، مبالغ، تواريخ..."
                                style={{flex:1,background:"#05070f",border:"1px solid #22d3ee40",borderRadius:10,padding:"12px 14px",color:"#c8d6e8",fontSize:14,outline:"none",fontFamily:"Tajawal,sans-serif",textAlign:"right"}}/>
                            <button onClick={onClose} aria-label="إغلاق البحث" style={{background:"none",border:"none",color:"#7a8fa8",fontSize:22,cursor:"pointer"}}>✕</button>
                        </div>
                        {q.length >= 2 && total === 0 && (
                            <div style={{textAlign:"center",color:"#3d4f65",padding:30,fontSize:14}}>لا توجد نتائج لـ "{q}"</div>
                        )}
                        {results.persons.length > 0 && (
                            <div style={{marginBottom:14}}>
                                <div style={{fontSize:11,color:"#3d4f65",fontWeight:700,marginBottom:6}}>👥 عملاء ({results.persons.length})</div>
                                {results.persons.map(p=>(
                                    <div key={p.id} style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:10,padding:"10px 12px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                        <div>
                                            <div style={{fontSize:13,fontWeight:700,color:"#c8d6e8"}}>{p.personName}</div>
                                            <div style={{fontSize:11,color:"#7a8fa8"}}>{p.phone||"—"}</div>
                                        </div>
                                        <div style={{fontSize:13,fontWeight:700,color:getPersonBalance(p)>0?"#ef4444":"#10b981"}}>
                                            {getPersonBalance(p)>0?"+":""}{formatNum(getPersonBalance(p))} ج
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {results.txns.length > 0 && (
                            <div style={{marginBottom:14}}>
                                <div style={{fontSize:11,color:"#3d4f65",fontWeight:700,marginBottom:6}}>📋 عمليات ({results.txns.length})</div>
                                {results.txns.map(t=>(
                                    <div key={t.id} style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:10,padding:"10px 12px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                        <div>
                                            <div style={{fontSize:13,fontWeight:700,color:"#c8d6e8"}}>{typeLabel(t)} — {t.personName}</div>
                                            <div style={{fontSize:11,color:"#7a8fa8"}}>{t.date} {t.time||""}</div>
                                        </div>
                                        <div style={{fontSize:14,fontWeight:700,color:"#22d3ee"}}>{formatNum(t.amount)} ج</div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {results.sources.length > 0 && (
                            <div>
                                <div style={{fontSize:11,color:"#3d4f65",fontWeight:700,marginBottom:6}}>📱 خطوط وفيزا ({results.sources.length})</div>
                                {results.sources.map(s=>(
                                    <div key={s.id} style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:10,padding:"10px 12px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                        <div style={{fontSize:13,fontWeight:700,color:"#c8d6e8"}}>{s.name}</div>
                                        <div style={{fontSize:12,color:"#7a8fa8"}}>{s.number||""} — {formatNum(s.balance||0)} ج</div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {!q && (
                            <div style={{textAlign:"center",color:"#3d4f65",padding:20,fontSize:13}}>ابدأ الكتابة للبحث في كل البيانات</div>
                        )}
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════

        // ════════════════════════════════════════════════════════════════
        //  📊  DailyClose — وضع المحاسب
        //  ملخص اليوم بالصوت + مقارنة بالأمس + تنبيه ديون غداً
        // ════════════════════════════════════════════════════════════════
        function DailyClose({ transactions, financeLogs, capital, lines, visas, people,
                               getPersonBalance, formatNum, commissionSettings, onClose }) {

            const fawriRate  = commissionSettings?.fawriWithdrawRate  ?? 0.0057;
            const fawriFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
            const bankRate   = commissionSettings?.bankWithdrawRate   ?? 0.002;

            function pad(n){ return String(n).padStart(2,"0"); }
            const now     = new Date();
            const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
            const yest    = new Date(now); yest.setDate(yest.getDate()-1);
            const yesterdayStr = `${yest.getFullYear()}-${pad(yest.getMonth()+1)}-${pad(yest.getDate())}`;
            const tomorrowStr  = (() => { const d = new Date(now); d.setDate(d.getDate()+1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; })();

            // ── حسابات اليوم ──
            const todayTxns  = transactions.filter(t => normalizeDateStr(t.date) === todayStr);
            const yesterTxns = transactions.filter(t => normalizeDateStr(t.date) === yesterdayStr);

            const calcStats = (txns, logs) => {
                const bank  = txns.filter(t=>t.type==="bank_withdraw").reduce((s,t)=>s+t.amount*bankRate,0);
                const fawri = txns.filter(t=>t.type==="fawri_withdraw").reduce((s,t)=>s+(t.amount*fawriRate+fawriFixed),0);
                const inc   = logs.filter(l=>l.type==="income").reduce((s,l)=>s+l.amount,0);
                const exp   = logs.filter(l=>l.type==="expense").reduce((s,l)=>s+l.amount,0);
                const total = txns.reduce((s,t)=>s+t.amount,0);
                const topTxn = txns.length > 0 ? txns.reduce((max,t)=>t.amount>max.amount?t:max, txns[0]) : null;
                return { count: txns.length, total, net: Math.round((bank+fawri+inc-exp)*100)/100, topTxn };
            };

            const todayLogs = financeLogs.filter(l => l.date === todayStr);
            const yesterLogs = financeLogs.filter(l => l.date === yesterdayStr);
            const today   = calcStats(todayTxns, todayLogs);
            const yester  = calcStats(yesterTxns, yesterLogs);

            const diffPct = yester.count > 0
                ? Math.round(((today.count - yester.count) / yester.count) * 100)
                : null;

            // ── ديون غداً ──
            const debtors = people.filter(p => getPersonBalance(p) > 0)
                                  .sort((a,b) => getPersonBalance(b) - getPersonBalance(a));
            const totalDebt = debtors.reduce((s,p) => s+getPersonBalance(p), 0);

            // ── ملخص أرصدة الخطوط ──
            const totalLinesBalance = [...lines, ...visas].reduce((s,l) => s+(l.balance||0), 0);

            // ── الصوت ──
            const [speaking, setSpeaking] = React.useState(false);
            const [spoken,   setSpoken]   = React.useState(false);
            const [phase, setPhase] = React.useState(0); // مرحلة الـ animation

            React.useEffect(() => {
                // entrance animation
                const t = setTimeout(() => setPhase(1), 100);
                return () => clearTimeout(t);
            }, []);

            function speakSummary() {
                if (!window.speechSynthesis) {
                    alert("المتصفح ده مش بيدعم الصوت");
                    return;

                window.speechSynthesis.cancel();
                setSpeaking(true);

                const lines_text = [
                    `تقرير نهاية يوم ${now.toLocaleDateString("ar-EG", {weekday:"long", day:"numeric", month:"long"})}.`,
                    `عدد العمليات النهارده: ${today.count} عملية.`,
                    today.topTxn ? `أعلى عملية كانت لـ ${today.topTxn.personName} بمبلغ ${today.topTxn.amount.toLocaleString("ar-EG")} جنيه.` : "",
                    `صافي الربح: ${today.net.toLocaleString("ar-EG")} جنيه.`,
                    diffPct !== null ? `مقارنةً بالأمس: ${diffPct > 0 ? "أحسن بـ " + diffPct + "٪" : diffPct < 0 ? "أقل بـ " + Math.abs(diffPct) + "٪" : "نفس العدد"}.` : "",
                    debtors.length > 0 ? `تنبيه: عندك ${debtors.length} عميل دين بإجمالي ${totalDebt.toLocaleString("ar-EG")} جنيه.` : "لا توجد ديون. ممتاز!",
                    "تصبح على خير."
                ].filter(Boolean).join(" ");

                const utt = new SpeechSynthesisUtterance(lines_text);
                utt.lang = "ar-EG";
                utt.rate = 0.9;
                utt.pitch = 1;
                // جرّب صوت عربي لو موجود
                const voices = window.speechSynthesis.getVoices();
                const arVoice = voices.find(v => v.lang.startsWith("ar"));
                if (arVoice) utt.voice = arVoice;
                utt.onend = () => { setSpeaking(false); setSpoken(true); };
                utt.onerror = () => setSpeaking(false);
                window.speechSynthesis.speak(utt);

            const StatCard = ({ icon, label, value, sub, color="#22d3ee", glow=false }) => (

                                <div style={{textAlign:"center"}}>

                                            {label:"اليوم", v:today.count,  c:"#22d3ee"},
                                            {label:"الفرق", v:(today.count - yester.count > 0 ? "+" : "")+String(today.count - yester.count),
                                             c: today.count >= yester.count ? "#10b981" : "#ef4444"},

                                                <div style={{fontSize:10,color:"#334155"}}>{x.label}</div>

                                    {today.topTxn && (

                                        ? "ما فيش عمليات اليوم"
                                        : today.net > 0
                                        ? `يوم تمام! ربحت ${today.net.toLocaleString("ar-EG")} ج`
                                        : today.net === 0
                                        ? "يوم عادي — صافي الصفر"
                                        : "يوم صعب — بكره أحسن إن شاء الله"}
                                </div>
                                <div style={{fontSize:11,color:"#334155"}}>
                                    {diffPct !== null && diffPct > 0
                                        ? `📈 أحسن من أمس بـ ${diffPct}٪`
                                        : diffPct !== null && diffPct < 0
                                        ? `📉 أقل من أمس بـ ${Math.abs(diffPct)}٪`
                                        : ""}
                                </div>
                            </div>

                        </div>

            );
        }


        //  📊  DailyReport — تقرير يومي كامل قابل للطباعة
        // ══════════════════════════════════════════════════════════════
        function DailyReport({ transactions, financeLogs, capital, lines, visas, people, getPersonBalance, formatNum, commissionSettings, onClose }) {
            const fawriRate  = commissionSettings?.fawriWithdrawRate  ?? 0.0057;
            const fawriFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
            const bankRate   = commissionSettings?.bankWithdrawRate   ?? 0.002;
            function pad(n){return String(n).padStart(2,"0");}
            const todayStr = (()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;})();
            // ⭐ FIX: نستخدم normalizeDateStr لضمان مطابقة التواريخ بغض النظر عن التنسيق
            const todayTxns  = transactions.filter(t=>normalizeDateStr(t.date)===todayStr);
            const totalIn    = todayTxns.filter(t=>t.type==="transfer").reduce((s,t)=>s+t.amount,0);
            const totalOut   = todayTxns.filter(t=>t.type==="receive").reduce((s,t)=>s+t.amount,0);
            const bankComm   = todayTxns.filter(t=>t.type==="bank_withdraw").reduce((s,t)=>s+t.amount*bankRate,0);
            const fawriComm  = todayTxns.filter(t=>t.type==="fawri_withdraw").reduce((s,t)=>s+(t.amount*fawriRate+fawriFixed),0);
            const todayLogs  = financeLogs.filter(l=>l.date===todayStr);
            const logInc     = todayLogs.filter(l=>l.type==="income").reduce((s,l)=>s+l.amount,0);
            const logExp     = todayLogs.filter(l=>l.type==="expense").reduce((s,l)=>s+l.amount,0);
            const netProfit  = Math.round((bankComm+fawriComm+logInc-logExp)*100)/100;
            const debtors    = people.filter(p=>getPersonBalance(p)>0).sort((a,b)=>getPersonBalance(b)-getPersonBalance(a));
            const totalDebt  = debtors.reduce((s,p)=>s+getPersonBalance(p),0);
            const now        = new Date().toLocaleString("ar-EG");

            function printReport() {
                const el = document.getElementById("daily-report-print-area");
                if (!el) return;
                const orig = document.body.innerHTML;
                document.body.innerHTML = el.innerHTML;
                window.print();
                document.body.innerHTML = orig;
                window.location.reload();
            }

            const row = (label, val, color="#c8d6e8") => (
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #1a2235"}}>
                    <span style={{fontSize:13,color:"#7a8fa8"}}>{label}</span>
                    <span style={{fontSize:14,fontWeight:700,color}}>{val}</span>
                </div>
            );

            return (
                <div className="glass-overlay" style={{alignItems:"center",justifyContent:"center",zIndex:400}} onClick={e=>e.target===e.currentTarget&&onClose()}>
                    <div style={{background:"#0a0c16",border:"1px solid #22d3ee30",borderRadius:18,width:"94%",maxWidth:420,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 -4px 40px rgba(0,0,0,0.8)"}}>
                        <div style={{background:"linear-gradient(135deg,#0d1120,#111827)",borderRadius:"18px 18px 0 0",padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #1e3a5f"}}>
                            <div style={{fontSize:15,fontWeight:700,color:"#22d3ee"}}>📊 التقرير اليومي</div>
                            <button onClick={onClose} aria-label="إغلاق" style={{background:"none",border:"none",color:"#64748b",fontSize:20,cursor:"pointer"}}>✕</button>
                        </div>

                        <div id="daily-report-print-area" style={{padding:"16px 18px"}}>
                            <div style={{textAlign:"center",marginBottom:14}}>
                                <div style={{fontSize:13,color:"#7a8fa8"}}>{now}</div>
                                <div style={{fontSize:18,fontWeight:900,color:"#c8d6e8",marginTop:4}}>تقرير يوم {todayStr}</div>
                            </div>

                            <div style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                                <div style={{fontSize:12,color:"#3d4f65",fontWeight:700,marginBottom:8}}>💰 الملخص المالي</div>
                                {row("رأس المال الحالي", formatNum(capital)+" ج", "#f59e0b")}
                                {row("إجمالي التحويلات", formatNum(totalIn)+" ج", "#22d3ee")}
                                {row("إجمالي الاستلام", formatNum(totalOut)+" ج", "#10b981")}
                                {row("عمولات البنك", formatNum(Math.round(bankComm*100)/100)+" ج", "#3b82f6")}
                                {row("عمولات فوري", formatNum(Math.round(fawriComm*100)/100)+" ج", "#a78bfa")}
                                {row("صافي ربح اليوم", formatNum(netProfit)+" ج", netProfit>=0?"#10b981":"#ef4444")}
                            </div>

                            <div style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                                <div style={{fontSize:12,color:"#3d4f65",fontWeight:700,marginBottom:8}}>📋 العمليات ({todayTxns.length})</div>

                                {todayTxns.slice(0,10).map(t=>(

                                        <span style={{color:"#7a8fa8"}}>{t.time||""} — {t.personName}</span>
                                        <span style={{color:"#22d3ee",fontWeight:700}}>{formatNum(t.amount)} ج</span>
                                    </div>
                                ))}
                                {todayTxns.length>10 && <div style={{fontSize:11,color:"#3d4f65",marginTop:4,textAlign:"center"}}>+ {todayTxns.length-10} عمليات أخرى</div>}
                            </div>

                            <div style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                                <div style={{fontSize:12,color:"#3d4f65",fontWeight:700,marginBottom:8}}>👥 الديون ({formatNum(totalDebt)} ج)</div>
                                {debtors.length===0 && <div style={{color:"#10b981",fontSize:12,textAlign:"center",padding:4}}>✅ لا توجد ديون</div>}
                                {debtors.slice(0,6).map(p=>(
                                    <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #1a2235",fontSize:12}}>
                                        <span style={{color:"#7a8fa8"}}>{p.personName}</span>
                                        <span style={{color:"#ef4444",fontWeight:700}}>{formatNum(getPersonBalance(p))} ج</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div style={{padding:"0 18px 20px",display:"flex",gap:10}}>
                            <button onClick={onClose} style={{flex:1,background:"#1e293b",border:"1px solid #334155",borderRadius:12,padding:12,color:"#94a3b8",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>إغلاق</button>
                            <button onClick={printReport} style={{flex:2,background:"linear-gradient(135deg,#22d3ee,#0891b2)",border:"none",borderRadius:12,padding:12,color:"#000",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>🖨️ طباعة التقرير</button>
                        </div>
                    </div>
                </div>
            );
        }

                function App() {
            const [userRole, setUserRole] = useState(null);
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [tab, setTab] = useState("dashboard");

            // ✅ FIX: تعريف الصلاحيات هنا أول حاجة عشان يكون متاح في كل الـ useEffects
            const isAdmin     = userRole === "admin";
            const isAssistant = userRole === "assistant";
            const isViewer    = userRole === "viewer";
            const isOmar = firebaseUser?.email === "omar@gmail.com";
            
            // ⭐ Load from localStorage on first load
            const [lines, setLines] = useState(() => loadFromLocalStorage('lines', initialLines));
            const [visas, setVisas] = useState(() => loadFromLocalStorage('visas', initialVisas));
            const [instaPays, setInstaPays] = useState(() => loadFromLocalStorage('instaPays', initialInstaPays));
            const [transactions, setTransactions] = useState(() => loadFromLocalStorage('transactions', []));
            const [people, setPeople] = useState(() => loadFromLocalStorage('people', []));
            const [capital, setCapital] = useState(() => loadFromLocalStorage('capital', 0));
            const [inventory, setInventory] = useState(() => loadFromLocalStorage('inventory', { cash: 0, owedToOthers: 0, note: "" }));
            const [financeLogs, setFinanceLogs] = useState(() => loadFromLocalStorage('financeLogs', []));
            // ⭐ سجل الرصيد اليومي — لقطة تلقائية كل يوم (تاريخ + رأس المال + مكسب/مصروف اليوم) تتراكم لسنين
            const [dailyBalanceLog, setDailyBalanceLog] = useState(() => loadFromLocalStorage('dailyBalanceLog', []));
            const [fawriBalance, setFawriBalance] = useState(() => loadFromLocalStorage('fawriBalance', 0));
            
            const [syncStatus, setSyncStatus] = useState("✓ جاهز");
            const [isRefreshing, setIsRefreshing] = useState(false);

            // ⭐ forceRefresh — يجلب كل البيانات من Firebase من جديد ويتجاهل الكاش
            async function forceRefresh() {
                if (isRefreshing || !auth.currentUser) return;
                setIsRefreshing(true);
                setSyncStatus("⏳ جاري التحديث...");
                try {
                    const keys = ['transactions','lines','visas','instaPays','customers','capital','financeLogs','settings','inventory','dailyBalanceLog','personalLedger','personalLedgerOpenings'];
                    const snapshots = await Promise.all(keys.map(k => db.ref(k).once('value')));
                    const [txnSnap, linesSnap, visasSnap, instaSnap, custSnap, capSnap, logsSnap, settSnap, invSnap, dblSnap, plSnap, ploSnap] = snapshots;

                    // transactions
                    const txnData = txnSnap.val();
                    if (txnData) {
                        const arr = Array.isArray(txnData) ? txnData.filter(Boolean) : Object.values(txnData).filter(Boolean);
                        setTransactions(arr);
                        saveToLocalStorage('transactions', arr);
                    }

                    if ('launchQueue' in window) {
                        window.launchQueue.setConsumer(async (launchParams) => {
                            if (!launchParams.files || launchParams.files.length === 0) return;
                            const fileHandle = launchParams.files[0];
                            const file = await fileHandle.getFile();
                            if (file.type.startsWith('image/')) {
                                handleOcrImage(file, true);
                            }
                        });
                    }
                    // 2) Fallback: الصورة محفوظة في SW Cache من POST
                    const params = new URLSearchParams(window.location.search);
                    if (params.get('share') === '1') {
                        window.history.replaceState({}, '', window.location.pathname);
                        try {
                            const cache = await caches.open('share-target-temp');
                            const response = await cache.match('shared-image');
                            if (response) {
                                const blob = await response.blob();
                                const file = new File([blob], 'shared.jpg', { type: blob.type || 'image/jpeg' });
                                await cache.delete('shared-image');
                                handleOcrImage(file, true);
                            }
                        } catch(e) { console.log('Share target cache error:', e); }
                    }

                const WARN = 0.85;
                const allSrcs = [
                    ...lines.map(l => {
                        const s = calcSourceStats(l, transactions);
                        // ⭐ FIX: usedToday = تحويل فقط، الحد اليومي لا يشمل الاستلام
                        return {...l, type:"line", dailyLimit:vodDailyLimit, monthlyLimit:linesMonthlyLimit, usedToday:s.usedTodayTransfer, usedTodayReceive:s.usedTodayReceive, usedMonth:s.usedMonthTransfer};
                    }),
                    ...visas.map(v => {
                        const s = calcSourceStats(v, transactions);
                        return {...v, type:"visa", dailyLimit:visaDailyLimit, monthlyLimit:visaMonthlyLimit, usedToday:s.usedTodayTransfer, usedTodayReceive:s.usedTodayReceive, usedMonth:s.usedMonthTransfer};
                    }),
                    ...instaPays.map(ip => {
                        const s = calcSourceStats(ip, transactions);
                        return {...ip, type:"instapay", dailyLimit:instapayDailyLimit, monthlyLimit:instapayMonthlyLimit, usedToday:s.usedTodayTransfer, usedTodayReceive:s.usedTodayReceive, usedMonth:s.usedMonthTransfer};
                    }),
                ];
                const avail = allSrcs.filter(s => s.available !== false);
                let suggestedId = null, allAtLimit = false;
                if (form.type === "receive" || form.type === "transfer") {
                    // ⭐ FIX: التحقق من الحد اليومي بناءً على التحويلات فقط (usedToday = transfer only)
                    const elig = avail.filter(s => (s.balance||0)>=amt && (s.dailyLimit>0?(s.usedToday+amt)/s.dailyLimit<WARN:true) && (s.monthlyLimit>0?(s.usedMonth+amt)/s.monthlyLimit<WARN:true));
                    const pool = elig.length ? elig : avail.filter(s=>(s.balance||0)>=amt);
                    if (!pool.length) { allAtLimit = true; }
                    else { pool.sort((a,b)=>(b.balance||0)-(a.balance||0)); suggestedId = pool[0].id; }
                } else {
                    // ⭐ FIX: المتبقي اليومي = dailyLimit - usedTodayTransfer (ليس مجموع transfer+receive)
                    const pool = avail.map(s=>({...s,space:Math.min(s.dailyLimit>0?Math.max(0,s.dailyLimit-s.usedToday):Infinity,s.monthlyLimit>0?Math.max(0,s.monthlyLimit-s.usedMonth):Infinity)})).filter(s=>s.space>=amt);
                    if (!pool.length) { allAtLimit = true; }
                    else { pool.sort((a,b)=>b.space-a.space); suggestedId = pool[0].id; }
                }
                setAutoRouting(prev => ({ ...prev, suggestedId, allAtLimit }));
                if (suggestedId) {
                    const sel = allSrcs.find(s => s.id === suggestedId);
                    setForm(f => ({ ...f, sourceId: suggestedId, sourceType: sel ? sel.type : "line" }));
                }

            function parseVoiceCommand(text) {
                // أنماط: "حوّل 500 لزياد" / "استلم 1000 من محمد" / "سحب بنك 2000" / "فوري 500"
                const t = text.trim();
                let amount = null, name = null, type = null, phone = null;

                // استخرج الرقم
                const numMatch = t.match(/(\d[\d,٠-٩]*(?:\.\d+)?)/);
                if (numMatch) {
                    amount = parseFloat(numMatch[1].replace(/,/g, '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632));
                }

                // استخرج النوع
                if (/حوّل|حول|تحويل|ارسل|إرسال/.test(t)) type = "transfer";
                else if (/استلم|استلام|واخد|استقبل/.test(t)) type = "receive";
                else if (/سحب.*بنك|بنك/.test(t)) type = "bank_withdraw";
                else if (/فوري|فوري/.test(t)) type = "fawri_withdraw";
                else if (/انستاباي|انستا/.test(t)) type = "instapay";
                else type = "transfer"; // default

                // استخرج الاسم بعد "لـ" أو "من" أو "لـ"
                const nameMatch = t.match(/(?:ل|لـ|من|إلى|الى)\s+([أ-ي\u0600-\u06FFa-zA-Z]+)/u);
                if (nameMatch) name = nameMatch[1];

                // ابحث عن شخص بالاسم
                let matchedPerson = null;
                if (name) {
                    matchedPerson = people.find(p =>
                        p.personName && p.personName.includes(name)
                    );
                    if (matchedPerson) phone = matchedPerson.phone || "";
                }

                // ملّي الفورم
                setForm(prev => ({
                    ...prev,
                    amount: amount ? String(amount) : prev.amount,
                    type: type || prev.type,
                    toName: name || prev.toName || "",
                    toNumber: phone || prev.toNumber || "",
                }));

                setVoiceStatus("done");
                const summary = `${type==="transfer"?"تحويل":type==="receive"?"استلام":type==="bank_withdraw"?"سحب بنك":"سحب فوري"} ${amount||"?"} ج${name ? ` — ${name}` : ""}`;
                showToast(`🎤 ${summary}`, "success");
                // افتح مودال الإضافة
                setTimeout(() => setModal("addTxn"), 300);
            }

- type = "receive" إذا كانت الرسالة تدل على استلام أو إيداع أو حوّل لك

                    const finalPhone  = aiData.personNumber || parsed.personNumber || "";

استخرج المعلومات التالية من الصورة وأرجعها بصيغة JSON فقط بدون أي نص إضافي:

${knownNumbersText}`;

                    let extractedData = null;

                    // ── Fallback ذكي: Tesseract + Parser متخصص في فودافون كاش ──
                    if (!extractedData?.amount) {
