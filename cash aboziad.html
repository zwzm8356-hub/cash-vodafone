                // Regex فشل — استخدم Gemini AI
                const keyMissing = !GEMINI_API_KEY || GEMINI_API_KEY === "ضع_مفتاح_الـ_API_هنا" || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE";
                if (keyMissing) {
                    // Fallback بدون AI — استخدم ما أمكن من الـ Regex
                    setForm(f => ({
                        ...f,
                        amount:   parsed.amount      || f.amount,
                        toNumber: parsed.personNumber || f.toNumber,

                    }));
                    setSmartPaste("");
                    showToast("⚠️ بيانات جزئية (أضف Gemini API للاستخراج الكامل)", "error");

                }

                showToast("🤖 AI بيحلل الرسالة...");
                try {
                    const systemP = `أنت مساعد ذكي لتطبيق فودافون كاش. مهمتك استخراج بيانات العملية من رسالة SMS أو نص.
أرجع JSON فقط بدون أي نص إضافي أو markdown backticks:
{"amount": "المبلغ رقماً فقط بدون فراغات أو فواصل", "personNumber": "رقم التليفون 11 رقم يبدأ بـ 01", "type": "transfer أو receive"}
- type = "receive" إذا كانت الرسالة تدل على استلام أو إيداع أو حوّل لك
- type = "transfer" إذا كانت تدل على تحويل أو سحب أو خصم
- اترك الحقل فارغاً "" إذا مش موجود في الرسالة
- لا تضف أي نص قبل أو بعد الـ JSON`;

                    // ⭐ Timeout protection — 8 ثواني كحد أقصى
                    const timeoutPromise = new Promise((_, reject) =>
                        setTimeout(() => reject(new Error("انتهى وقت الاتصال بـ AI")), 8000)
                    );
                    const aiRaw = await Promise.race([
                        callGemini(systemP, `استخرج البيانات من الرسالة التالية:\n"${pasteText}"`),

                    // تنظيف الرد من أي markdown أو نص زيادة

            // ⭐ OCR Screenshot Handler — يفتح Modal تأكيد بدل ما يملي الفورم مباشرة
            async function handleOcrImage(file, fromShare = false) {
                if (!file) return;
                setOcrResult(null);
                const previewUrl = URL.createObjectURL(file);
                setOcrPreviewUrl(previewUrl);
                setOcrLoading(true);

                // لو من مشاركة خارجية، افتح المودال الرئيسي أولاً
                if (fromShare && modal !== "addTxn") {
                    setModal("addTxn");
                    setAutoRouting({ suggestedId: null, allAtLimit: false, userOverrode: false });
                    setSplitPlan(null); setSplitConfirmed(false);
                    setOcrConfirm(null);
                    setForm({ type:"transfer", date:today(), time:"12:00", fromNumber:"", toNumber:"", toInternalId:"", personName:"", amount:"", sourceId:"", sourceType:"line", notes:"", image:null });
                }

                try {
                    // ⭐ Lazy load Tesseract — يتحمّل بس لما المستخدم يحتاجه
                    if (typeof Tesseract === "undefined") {
                        await new Promise((resolve, reject) => {
                            const s = document.createElement("script");
                            s.src = "https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js";
                            s.onload = resolve;
                            s.onerror = reject;
                            document.head.appendChild(s);
                        });
                    }
                    const { data: { text } } = await Tesseract.recognize(file, "ara+eng", { logger: () => {} });

                    // ══ استخراج رقم الهاتف ══
                    const phoneMatch = text.match(/01[0-9]{9}/);
                    const phone = phoneMatch ? phoneMatch[0] : "";

                    // ══ استخراج الوقت ══
                    const timeMatch = text.match(/(\d{1,2}):(\d{2})\s*(AM|PM|ص|م)?/i);
                    let extractedTime = "12:00"; // صيغة HH:MM فقط لـ input type="time"
                    if (timeMatch) {
                        let h = parseInt(timeMatch[1]);
                        const mins = timeMatch[2];
                        const ampm = (timeMatch[3] || "").toLowerCase();
                        if ((ampm === "pm" || ampm === "م") && h < 12) h += 12;
                        if ((ampm === "am" || ampm === "ص") && h === 12) h = 0;
                        // تجاهل الوقت لو كان مجرد رقم عشوائي مش منطقي
                        if (h >= 0 && h <= 23) {
                            extractedTime = `${String(h).padStart(2,"0")}:${mins}`;
                        }
                    }

                    // ══ استخراج المبلغ ══
                    const amountPatterns = [
                        /(?:مبلغ|تحويل|استقبال|إيداع|تم تحويل|تم استقبال|قيمة)[^\d]*(\d[\d,\.]*)/i,
                        /(\d[\d,\.]*)\s*(?:جنيه|ج\.م|ج\b|EGP|egp)/i,
                        /(\d{2,6}(?:\.\d{1,2})?)\s*(?:ج|جنيه|EGP)/i,
                    ];
                    let amount = "";
                    for (const pat of amountPatterns) {
                        const m = text.match(pat);
                        if (m) { amount = m[1].replace(/,/g, ""); break; }
                    }
                    if (!amount) {
                        const nums = [...text.matchAll(/\b(\d{2,6}(?:\.\d{1,2})?)\b/g)]
                            .map(m => parseFloat(m[1]))
                            .filter(n => n >= 10 && n <= 200000);
                        if (nums.length) amount = String(Math.max(...nums));
                    }

                    // ══ تحديد نوع العملية ══
                    const isReceive = /استقبال|إيداع|تم إيداع|تم استقبال|received|deposit|أودع|حوّل لك|حول لك/.test(text);
                    const isTransfer = /تم تحويل|سحب|خصم|transfer|sent|دفع|صرف/.test(text.toLowerCase());
                    const detectedType = isReceive ? "receive" : isTransfer ? "transfer" : null;

                    const result = { amount, phone, type: detectedType, raw: text.slice(0, 300) };
                    setOcrResult(result);

                    // ⭐ افتح Modal التأكيد بدل الملء المباشر
                    setOcrConfirm({
                        amount:       amount || "",
                        phone:        phone  || "",
                        time:         extractedTime,
                        date:         today(),
                        detectedType: detectedType,
                        previewUrl:   previewUrl,
                        rawText:      text.slice(0, 200),
                    });

                } catch (e) {
                    showToast("❌ فشل OCR: " + (e.message || "خطأ غير معروف"), "error");
                } finally {
                    setOcrLoading(false);
                }
            }

            // ⭐ حساب العمولة بناءً على نوع العملية — ديناميكي من commissionSettings
            function calcCommission(type, amount) {
                if (type === "bank_withdraw") {
                    const rate = parseFloat(commissionSettings?.bankWithdrawRate) || 0.002;
                    const comm = Math.round(amount * rate * 100) / 100;
                    return { commission: comm, total: Math.round((amount + comm) * 100) / 100 };
                }
                if (type === "fawri_withdraw") {
                    const rate  = parseFloat(commissionSettings?.fawriWithdrawRate)  || 0.0057;
                    const fixed = parseFloat(commissionSettings?.fawriWithdrawFixed) || 15;
                    const comm = Math.round((amount * rate + fixed) * 100) / 100;
                    return { commission: comm, total: Math.round((amount + comm) * 100) / 100 };
                }
                return { commission: 0, total: amount };
            }

            function addTransaction() {
                // ⭐ منع الضغط المتكرر — Race Condition Protection
                if (isSubmitting) return;

                const amount = parseFloat(form.amount);
                if (!form.date || !form.time || !amount || !form.sourceId) { 
                    showToast("أكمل كل البيانات","error"); 
                    return; 
                }
                // ⭐ للتحويل الداخلي، اسم العميل غير مطلوب — يُملأ تلقائياً من اسم الخط المستقبِل
                if (form.type !== "internal_transfer" && !form.personName) {
                    showToast("أكمل كل البيانات","error");
                    return;
                }

                if (form.type === "transfer" && (!form.fromNumber || !form.toNumber)) {
                    showToast("أكمل أرقام التحويل","error"); 
                    return;
                }

                // ⭐ التحويل الداخلي — تحقق من الخط المستقبِل
                if (form.type === "internal_transfer") {
                    if (!form.toInternalId) { showToast("اختر الخط / الفيزا المستقبِل", "error"); return; }
                    if (form.toInternalId === form.sourceId) { showToast("الخط المرسِل والمستقبِل نفس الخط!", "error"); return; }
                }

                // ⭐ تفعيل حالة الحفظ الآمن
                setIsSubmitting(true);

                // ⭐ Haptic feedback — iOS
                if (navigator.vibrate) navigator.vibrate(15);
                // ⭐ للتحويل الداخلي: اسم العميل = اسم الخط المستقبِل تلقائياً
                let personName = form.personName.trim();
                if (form.type === "internal_transfer" && !personName && form.toInternalId) {
                    const destSrcName = [...lines, ...visas, ...instaPays].find(s => s.id === form.toInternalId);
                    personName = destSrcName ? `تحويل داخلي → ${destSrcName.name}` : "تحويل داخلي";
                }
                const fullDateTime = `${form.date} ${form.time}`;

                // ⭐ حساب العمولة للأنواع الجديدة
                const { commission, total: totalAmount } = calcCommission(form.type, amount);
                const isWithdraw = form.type === "bank_withdraw" || form.type === "fawri_withdraw";

                // ⭐ إضافة تفاصيل العمولة تلقائياً في الملاحظات
                let autoNotes = form.notes || "";
                if (isWithdraw && commission > 0) {
                    const commLabel = form.type === "bank_withdraw"
                        ? `عمولة بنك ${(bankWithdrawRate*100).toFixed(2)}%: ${commission} ج`
                        : `عمولة فوري (${(fawriWithdrawRate*100).toFixed(2)}%+${fawriWithdrawFixed}ج): ${commission} ج`;
                    autoNotes = `[${commLabel} | الإجمالي المسحوب: ${totalAmount} ج]${autoNotes ? " " + autoNotes : ""}`;
                }
                // ⭐ ملاحظات التحويل الداخلي التلقائية
                if (form.type === "internal_transfer" && form.toInternalId) {
                    const srcName = sources.find(s => s.id === form.sourceId)?.name || form.sourceId;
                    const destName = [...lines, ...visas, ...instaPays].find(s => s.id === form.toInternalId)?.name || form.toInternalId;
                    autoNotes = `[تحويل داخلي: ${srcName} ← ${destName}]${autoNotes ? " " + autoNotes : ""}`;
                }
                
                // ⭐ التقاط رقم الخط/الفيزا المختار تلقائياً لضمان المطابقة في calcSourceStats
                const selectedSrc = sources.find(s => s.id === form.sourceId);
                const actualLineNumber = selectedSrc?.number || "";
                const autoFromNumber = form.fromNumber || (isWithdraw ? actualLineNumber : "");
                const autoToNumber   = form.toNumber   || (form.type === "receive" ? actualLineNumber : "");

                const newTxn = {
                    id: Date.now(),
                    type: form.type,
                    date: form.date,
                    dateTime: fullDateTime,
                    fromNumber: autoFromNumber,
                    toNumber: autoToNumber,
                    toInternalId: form.type === "internal_transfer" ? (form.toInternalId || null) : undefined,
                    personName: personName,
                    amount: amount,
                    commission: commission,
                    totalAmount: totalAmount,
                    sourceId: form.sourceId,
                    sourceType: form.sourceType,
                    createdAt: nowStr(),
                    notes: autoNotes,
                    image: null
                };

                setTransactions(prev => [newTxn, ...prev]);
                // ✅ حفظ العملية الجديدة بـ ID مباشرة في Firebase — فوري وبدون race condition
                try { db.ref('transactions').child(String(newTxn.id)).set(newTxn); } catch(e){}
                updateSource(form.sourceId, form.sourceType, totalAmount, form.type);

                // ⭐ تحديث رصيد الخط أو الفيزا في Firebase بأمان عبر .transaction()
                // بدلاً من .set() الشامل الذي يسبب Race Condition عند التزامن
                if (form.sourceType === "line") {
                    db.ref(`lines/${form.sourceId}`).transaction((currentLine) => {
                        if (currentLine) {
                            const isOutgoing = form.type === "transfer" || form.type === "bank_withdraw" || form.type === "fawri_withdraw" || form.type === "fawri_transfer" || form.type === "internal_transfer";
                            // نستخدم totalAmount (شامل العمولة) لتطابق updateSource المحلية
                            const change = isOutgoing ? -totalAmount : amount;
                            currentLine.balance = (parseFloat(currentLine.balance) || 0) + change;

                            // تحديث الاستهلاك — totalAmount للصادر، amount للوارد
                            if (form.type === "transfer" || form.type === "bank_withdraw" || form.type === "fawri_withdraw" || form.type === "fawri_transfer" || form.type === "internal_transfer") {
                                currentLine.usedTodayTransfer = (parseFloat(currentLine.usedTodayTransfer) || 0) + totalAmount;
                                currentLine.usedMonthTransfer = (parseFloat(currentLine.usedMonthTransfer) || 0) + totalAmount;
                            } else if (form.type === "receive") {
                                currentLine.usedTodayReceive = (parseFloat(currentLine.usedTodayReceive) || 0) + amount;
                                currentLine.usedMonthReceive = (parseFloat(currentLine.usedMonthReceive) || 0) + amount;
                            }
                        }
                        return currentLine;
                    });
                } else if (form.sourceType === "visa") {
                    db.ref(`visas/${form.sourceId}`).transaction((currentVisa) => {
                        if (currentVisa) {
                            const isOutgoing = form.type === "transfer" || form.type === "bank_withdraw" || form.type === "fawri_withdraw" || form.type === "fawri_transfer" || form.type === "internal_transfer";
                            const change = isOutgoing ? -totalAmount : amount;
                            currentVisa.balance = (parseFloat(currentVisa.balance) || 0) + change;
                        }
                        return currentVisa;
                    });
                }

                const existingPerson = people.find(p => p.personName.toLowerCase() === personName.toLowerCase());
                if (existingPerson) {
                    setPeople(prev => prev.map(p => {
                        if (p.id !== existingPerson.id) return p;
                        const typeLabel = form.type === "transfer" ? "تحويل" : form.type === "receive" ? "استلام" : form.type === "bank_withdraw" ? "سحب بنك" : form.type === "fawri_transfer" ? "تحويل إلى فوري" : "سحب فوري";
                        const newMove = {
                            id: Date.now(),
                            type: form.type === "receive" ? "credit" : "debit",
                            amount: amount,
                            note: typeLabel + (form.notes ? ` — ${form.notes}` : ""),
                            date: fullDateTime,
                            isOld: false
                        };
                        const updated = { ...p, moves: [...(p.moves||[]), newMove], lastUpdated: nowStr() };
                        // ✅ حفظ مباشر في Firebase بعد الإضافة
                        try { db.ref('customers').child(String(p.id)).set(updated); } catch(e){}
                        return updated;
                    }));
                }

                const txnLabels = { transfer: "تحويل", receive: "استلام", bank_withdraw: "سحب بنك", fawri_withdraw: "سحب فوري", fawri_transfer: "تحويل إلى فوري", internal_transfer: "تحويل داخلي" };

                // ⭐ تحويل مباشر لفوري — أضف المبلغ لرصيد فوري التراكمي
                if (form.type === "fawri_transfer") {
                    setFawriBalance(prev => Math.round((prev + parseFloat(amount)) * 100) / 100);
                }

                // ⭐ تحويل داخلي — أضف المبلغ للخط المستقبِل وسجّل عملية استلام مقابلة
                if (form.type === "internal_transfer" && form.toInternalId) {
                    const destSrc = [...lines, ...visas, ...instaPays].find(s => s.id === form.toInternalId);
                    if (destSrc) {
                        const destType = destSrc.id.startsWith('visa') ? 'visa' : destSrc.id.startsWith('instapay') ? 'instapay' : 'line';
                        // أضف المبلغ للمستقبِل مباشرةً
                        const destUpdater = prev => prev.map(item => item.id !== form.toInternalId ? item : {
                            ...item,
                            balance: (item.balance || 0) + amount,
                            usedTodayReceive: (item.usedTodayReceive || 0) + amount,
                            usedMonthReceive: (item.usedMonthReceive || 0) + amount,
                        });
                        if (destType === 'line') setLines(destUpdater);
                        else if (destType === 'visa') setVisas(destUpdater);
                        else setInstaPays(destUpdater);
                        // حدّث Firebase للمستقبِل
                        const destRef = destType === 'line' ? 'lines' : destType === 'visa' ? 'visas' : 'instaPays';
                        db.ref(`${destRef}/${form.toInternalId}`).transaction(curr => {
                            if (!curr) return curr;
                            curr.balance = (parseFloat(curr.balance) || 0) + amount;
                            curr.usedTodayReceive = (parseFloat(curr.usedTodayReceive) || 0) + amount;
                            curr.usedMonthReceive = (parseFloat(curr.usedMonthReceive) || 0) + amount;
                            return curr;
                        });
                    }
                }

                showToast(`تم ${txnLabels[form.type] || "العملية"} بنجاح ✓`);

                // ⭐ سجل الأحداث — يسجل كل عملية عمر أو المساعد
                if (isAssistant || isOmar) {
                    addAuditEntry("➕ إضافة عملية", `${txnLabels[form.type]||""} | ${personName} | ${formatNum(amount)} ج | ${sources.find(s=>s.id===form.sourceId)?.name||""}`);
                    // ⭐ كمان نكتب في Firebase في مكان منفصل عشان الأدمن يشوفه
                    try {
                        db.ref('assistant_log').push({
                            action: "add_transaction",
                            user: userRole,
                            type: form.type,
                            personName,
                            amount,
                            source: sources.find(s=>s.id===form.sourceId)?.name||"",
                            ts: nowStr(),
                            date: form.date,
                        });
                    } catch(e) {}
                }

                setForm({ type: "transfer", date: today(), time: "12:00", fromNumber: "", toNumber: "", toInternalId: "", personName: "", amount: "", sourceId: "", sourceType: "line", notes: "", image: null });
                setModal(null);

                // ⭐ إنهاء حالة الحفظ الآمن
                setIsSubmitting(false);
            }

            // ══════════════════════════════════════════════════════
            //  ✂️  تنفيذ خطة التقسيم — حفظ عمليات متعددة دفعة واحدة
            // ══════════════════════════════════════════════════════
            function executeSplitPlan() {
                if (!splitPlan || !splitPlan.steps.length) return;
                if (isSubmitting) return;

                if (!form.date || !form.time || !form.personName) {
                    showToast("أكمل بيانات العميل والتاريخ أولاً", "error");
                    return;
                }

                setIsSubmitting(true);
                if (navigator.vibrate) navigator.vibrate([15, 50, 15]);

                const personName = form.personName.trim();
                const fullDateTime = `${form.date} ${form.time}`;
                const newTxns = [];

                splitPlan.steps.forEach((step, idx) => {
                    const src = sources.find(s => s.id === step.sourceId);
                    const txnId = Date.now() + idx;
                    const autoFromNumber = form.type === "transfer" ? (form.fromNumber || src?.number || "") : "";
                    const autoToNumber   = form.type === "transfer" ? (form.toNumber   || "") : (src?.number || "");

                    newTxns.push({
                        id: txnId,
                        type: form.type,
                        date: form.date,
                        dateTime: fullDateTime,
                        fromNumber: autoFromNumber,
                        toNumber:   autoToNumber,
                        personName: personName,
                        amount: step.amount,
                        commission: 0,
                        totalAmount: step.amount,
                        sourceId:   step.sourceId,
                        sourceType: step.sourceType,
                        createdAt: nowStr(),
                        notes: `[تقسيم ذكي ${idx+1}/${splitPlan.steps.length}]${form.notes ? " " + form.notes : ""}`,
                        image: null
                    });
                });

                // حفظ كل العمليات في الـ state دفعة واحدة
                setTransactions(prev => [...newTxns.reverse(), ...prev]);

                // تحديث كل مصدر بالأمان عبر Firebase transaction
                newTxns.forEach(txn => {
                    updateSource(txn.sourceId, txn.sourceType, txn.amount, txn.type);
                    if (txn.sourceType === "line") {
                        db.ref(`lines/${txn.sourceId}`).transaction(curr => {
                            if (!curr) return curr;
                            const isOut = txn.type === "transfer";
                            curr.balance = (parseFloat(curr.balance) || 0) + (isOut ? -txn.amount : txn.amount);
                            if (isOut) {
                                curr.usedTodayTransfer = (parseFloat(curr.usedTodayTransfer) || 0) + txn.amount;
                                curr.usedMonthTransfer = (parseFloat(curr.usedMonthTransfer) || 0) + txn.amount;
                            } else {
                                curr.usedTodayReceive = (parseFloat(curr.usedTodayReceive) || 0) + txn.amount;
                                curr.usedMonthReceive = (parseFloat(curr.usedMonthReceive) || 0) + txn.amount;
                            }
                            return curr;
                        });
                    } else if (txn.sourceType === "visa") {
                        db.ref(`visas/${txn.sourceId}`).transaction(curr => {
                            if (!curr) return curr;
                            const isOut = txn.type === "transfer";
                            curr.balance = (parseFloat(curr.balance) || 0) + (isOut ? -txn.amount : txn.amount);
                            return curr;
                        });
                    }
                });

                // تحديث سجل العميل — موحّد على moves
                const existingPerson = people.find(p => p.personName.toLowerCase() === personName.toLowerCase());
                if (existingPerson) {
                    setPeople(prev => prev.map(p => {
                        if (p.id !== existingPerson.id) return p;
                        const newMoves = newTxns.map(txn => ({
                            id: txn.id,
                            type: txn.type === "receive" ? "credit" : "debit",
                            amount: txn.amount,
                            note: `تقسيم ذكي: ${txn.amount} ج من ${sources.find(s=>s.id===txn.sourceId)?.name || txn.sourceId}`,
                            date: fullDateTime,
                            isOld: false
                        }));
                        const updated = { ...p, moves: [...(p.moves||[]), ...newMoves], lastUpdated: nowStr() };
                        // ✅ حفظ مباشر في Firebase
                        try { db.ref('customers').child(String(p.id)).set(updated); } catch(e){}
                        return updated;
                    }));
                }

                showToast(`✅ تم تنفيذ التقسيم: ${splitPlan.steps.length} عمليات — إجمالي ${maskNum(splitPlan.totalCovered, privacyMode)} ج`);
                setSplitPlan(null);
                setSplitConfirmed(false);
                setForm({ type: "transfer", date: today(), time: "12:00", fromNumber: "", toNumber: "", toInternalId: "", personName: "", amount: "", sourceId: "", sourceType: "line", notes: "", image: null });
                setModal(null);
                setIsSubmitting(false);
            }

            function updateSource(sourceId, sourceType, amount, txnType) {
                // ⭐ سحب بنك وسحب فوري والتحويل الداخلي = خروج (زي transfer)
                const isOutgoing = txnType === "transfer" || txnType === "bank_withdraw" || txnType === "fawri_withdraw" || txnType === "fawri_transfer" || txnType === "internal_transfer";
                const delta = isOutgoing ? -amount : amount;
                const updater = prev => prev.map(item => {
                    if (item.id !== sourceId) return item;
                    return {
                        ...item,
                        usedTodayTransfer: (item.usedTodayTransfer||0) + (isOutgoing ? amount : 0),
                        usedMonthTransfer: (item.usedMonthTransfer||0) + (isOutgoing ? amount : 0),
                        usedTodayReceive:  (item.usedTodayReceive||0)  + (txnType==="receive" ? amount : 0),
                        usedMonthReceive:  (item.usedMonthReceive||0)  + (txnType==="receive" ? amount : 0),
                        balance: (item.balance||0) + delta
                    };
                });
                if (sourceType === "line") setLines(updater);
                else if (sourceType === "visa") setVisas(updater);
                else if (sourceType === "instapay") setInstaPays(updater);
            }

            function deleteTransaction(txn) {
                setTransactions(prev => prev.filter(t => t.id !== txn.id));
                // ✅ حذف مباشر بـ ID من Firebase — بدون رفع الـ array كامل
                try { db.ref('transactions').child(String(txn.id)).remove(); } catch(e){}
                const isOutgoing = txn.type === "transfer" || txn.type === "bank_withdraw" || txn.type === "fawri_withdraw" || txn.type === "fawri_transfer" || txn.type === "internal_transfer";
                const effectiveAmount = txn.totalAmount || txn.amount;
                const delta = isOutgoing ? effectiveAmount : -effectiveAmount;
                const reverter = prev => prev.map(item => {
                    if (item.id !== txn.sourceId) return item;
                    return {
                        ...item,
                        usedTodayTransfer: Math.max(0, (item.usedTodayTransfer||0) - (isOutgoing ? effectiveAmount : 0)),
                        usedMonthTransfer: Math.max(0, (item.usedMonthTransfer||0) - (isOutgoing ? effectiveAmount : 0)),
                        usedTodayReceive:  Math.max(0, (item.usedTodayReceive||0)  - (txn.type==="receive" ? effectiveAmount : 0)),
                        usedMonthReceive:  Math.max(0, (item.usedMonthReceive||0)  - (txn.type==="receive" ? effectiveAmount : 0)),
                        balance: (item.balance||0) + delta
                    };
                });
                if (txn.sourceType === "line") setLines(reverter);
                else if (txn.sourceType === "visa") setVisas(reverter);
                else if (txn.sourceType === "instapay") setInstaPays(reverter);
                setConfirmDelete(null);
                showToast("تم حذف العملية ✓");
                if (isAssistant || isOmar) {
                    addAuditEntry("🗑️ حذف عملية", `${txn.personName} | ${maskNum(txn.amount, privacyMode)} ج | ${txn.date}`);
                    try { db.ref('assistant_log').push({ action:"delete_transaction", user:userRole, personName:txn.personName, amount:txn.amount, date:txn.date, ts:nowStr() }); } catch(e) {}
                }
            }

            function reverseTransaction(txn) {
                const isOutgoing = txn.type === "transfer" || txn.type === "bank_withdraw" || txn.type === "fawri_withdraw" || txn.type === "fawri_transfer" || txn.type === "internal_transfer";
                const effectiveAmount = txn.totalAmount || txn.amount;
                const delta = isOutgoing ? effectiveAmount : -effectiveAmount;
                setTransactions(prev => prev.filter(t => t.id !== txn.id));
                // ✅ حذف مباشر بـ ID من Firebase
                try { db.ref('transactions').child(String(txn.id)).remove(); } catch(e){}
                const reverter = prev => prev.map(item => {
                    if (item.id !== txn.sourceId) return item;
                    return {
                        ...item,
                        usedTodayTransfer: Math.max(0, (item.usedTodayTransfer||0) - (isOutgoing ? effectiveAmount : 0)),
                        usedMonthTransfer: Math.max(0, (item.usedMonthTransfer||0) - (isOutgoing ? effectiveAmount : 0)),
                        usedTodayReceive:  Math.max(0, (item.usedTodayReceive||0)  - (txn.type==="receive" ? effectiveAmount : 0)),
                        usedMonthReceive:  Math.max(0, (item.usedMonthReceive||0)  - (txn.type==="receive" ? effectiveAmount : 0)),
                        balance: (item.balance||0) + delta
                    };
                });
                if (txn.sourceType === "line") setLines(reverter);
                else if (txn.sourceType === "visa") setVisas(reverter);
                else if (txn.sourceType === "instapay") setInstaPays(reverter);
                if (txn.type === "internal_transfer" && txn.toInternalId) {
                    const destReverter = prev => prev.map(item => item.id !== txn.toInternalId ? item : {
                        ...item,
                        balance: (item.balance || 0) - effectiveAmount,
                        usedTodayReceive: Math.max(0, (item.usedTodayReceive||0) - effectiveAmount),
                        usedMonthReceive: Math.max(0, (item.usedMonthReceive||0) - effectiveAmount),
                    });
                    setLines(destReverter); setVisas(destReverter); setInstaPays(destReverter);
                }
                setPeople(prev => prev.map(p => {
                    if (p.personName.toLowerCase() !== txn.personName?.toLowerCase()) return p;
                    const updated = {
                        ...p,
                        moves: (p.moves || []).filter(m => !(
                            Math.abs(m.amount) === txn.amount &&
                            (m.date || "").startsWith((txn.dateTime || txn.date || "").slice(0, 10))
                        )),
                        lastUpdated: nowStr()
                    };
                    // ✅ حفظ مباشر في Firebase
                    try { db.ref('customers').child(String(p.id)).set(updated); } catch(e){}
                    return updated;
                }));
                setConfirmDelete(null);
                showToast("↩️ تم عكس العملية وإرجاع الأرقام ✓");
                if (isAssistant || isOmar) {
                    addAuditEntry("↩️ عكس عملية", `${txn.personName} | ${maskNum(txn.amount, privacyMode)} ج | ${txn.date}`);
                    try { db.ref('assistant_log').push({ action:"reverse_transaction", user:userRole, personName:txn.personName, amount:txn.amount, date:txn.date, ts:nowStr() }); } catch(e) {}
                }
            }

            // ══ مميزات جديدة v9 — functions ══

            function addAuditEntry(action, details) {
                const entry = { id: Date.now(), action, details, user: userRole, ts: nowStr() };
                setAuditLog(prev => { const u=[entry,...prev].slice(0,200); saveToLocalStorage('auditLog',u); return u; });
            }

            function startEditTransaction(txn) {
                setEditTxnId(txn.id);
                setForm({ type:txn.type, date:txn.date||today(), time:txn.time||"12:00", fromNumber:txn.fromNumber||"", toNumber:txn.toNumber||"", toInternalId:txn.toInternalId||"", personName:txn.personName||"", amount:String(txn.amount||""), sourceId:txn.sourceId||"", sourceType:txn.sourceType||"line", notes:txn.notes||"", image:txn.image||null });
                setModal("editTxn");
            }

            function saveEditTransaction() {
                if (!editTxnId) return;
                const oldTxn = transactions.find(t=>t.id===editTxnId);
                if (!oldTxn) return;
                const amount = parseFloat(form.amount);
                if (!amount||!form.sourceId) { showToast("أكمل البيانات","error"); return; }
                const oldIsOut = ["transfer","bank_withdraw","fawri_withdraw","fawri_transfer","internal_transfer"].includes(oldTxn.type);
                const oldEff = oldTxn.totalAmount||oldTxn.amount||0;
                const reverter = prev=>prev.map(item=>item.id!==oldTxn.sourceId?item:{...item,balance:(item.balance||0)+(oldIsOut?oldEff:-oldEff),usedTodayTransfer:Math.max(0,(item.usedTodayTransfer||0)-(oldIsOut?oldEff:0)),usedMonthTransfer:Math.max(0,(item.usedMonthTransfer||0)-(oldIsOut?oldEff:0)),usedTodayReceive:Math.max(0,(item.usedTodayReceive||0)-(oldTxn.type==="receive"?oldEff:0)),usedMonthReceive:Math.max(0,(item.usedMonthReceive||0)-(oldTxn.type==="receive"?oldEff:0))});
                if(oldTxn.sourceType==="line")setLines(reverter); else if(oldTxn.sourceType==="visa")setVisas(reverter); else setInstaPays(reverter);
                const {commission,total:totalAmount}=calcCommission(form.type,amount);
                const newIsOut=["transfer","bank_withdraw","fawri_withdraw","fawri_transfer","internal_transfer"].includes(form.type);
                const applier=prev=>prev.map(item=>item.id!==form.sourceId?item:{...item,balance:(item.balance||0)+(newIsOut?-totalAmount:amount),usedTodayTransfer:(item.usedTodayTransfer||0)+(newIsOut?totalAmount:0),usedMonthTransfer:(item.usedMonthTransfer||0)+(newIsOut?totalAmount:0),usedTodayReceive:(item.usedTodayReceive||0)+(form.type==="receive"?amount:0),usedMonthReceive:(item.usedMonthReceive||0)+(form.type==="receive"?amount:0)});
                if(form.sourceType==="line")setLines(applier); else if(form.sourceType==="visa")setVisas(applier); else setInstaPays(applier);
                const updatedTxn={...oldTxn,type:form.type,date:form.date,time:form.time,fromNumber:form.fromNumber,toNumber:form.toNumber,personName:form.personName,amount,commission,totalAmount,sourceId:form.sourceId,sourceType:form.sourceType,notes:form.notes,image:form.image,dateTime:`${form.date} ${form.time}`,editedAt:nowStr()};
                setTransactions(prev=>prev.map(t=>t.id===editTxnId?updatedTxn:t));
                // ✅ تحديث العملية بـ ID مباشرة في Firebase
                try { db.ref('transactions').child(String(editTxnId)).set(updatedTxn); } catch(e){}
                addAuditEntry("تعديل عملية",`${oldTxn.personName} ${oldTxn.amount}ج→${amount}ج`);
                setModal(null); setEditTxnId(null);
                showToast("✅ تم تعديل العملية");
            }

            function sendWhatsapp(txn) {
                const msg = whatsappTemplate.replace("{amount}",txn.amount).replace("{from}",txn.fromNumber||"—").replace("{to}",txn.toNumber||txn.personName||"—").replace("{date}",txn.dateTime||txn.date||"").replace("{name}",txn.personName||"").replace("{source}",sources.find(s=>s.id===txn.sourceId)?.name||"");
                const phone=(txn.toNumber||"").replace(/^0/,"20").replace(/[^0-9]/g,"");
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,"_blank");
                addAuditEntry("إرسال واتساب",`${phone} - ${txn.personName}`);

            function updateCapitalDirectly() {
                // ⭐ دعم العمليات الحسابية (مثلاً: capital + 500 أو 12000)
                let amt;
                const rawInput = capitalInput.trim();
                // لو بدأ بعملية حسابية زي +500 أو -200، طبّقها على رأس المال الحالي
                if (/^[+\-*/]/.test(rawInput)) {
                    const sanitized = rawInput.replace(/[^0-9+\-*/.]/g, '');
                    const result = evaluateExpression(String(capital) + sanitized);
                    amt = parseFloat(result);
                } else {
                    const result = evaluateExpression(rawInput);
                    amt = parseFloat(result);
                }
                if (isNaN(amt) || amt < 0) { showToast("أدخل مبلغ صحيح", "error"); return; }
                amt = Math.round(amt * 100) / 100;
                // ⭐ منع الـ listener من يـoverwrite
                capitalWriting.current = true;
                setCapital(amt);
                // ⭐ حفظ مباشر في Firebase بدون انتظار useEffect
                if (auth.currentUser) {
                    try { 
                        db.ref('capital').set(amt).then(() => {
                            setTimeout(() => { capitalWriting.current = false; }, 2000);
                        }).catch(() => { capitalWriting.current = false; });
                    } catch(e){ capitalWriting.current = false; }
                } else {
                    setTimeout(() => { capitalWriting.current = false; }, 2000);
                }
                saveToLocalStorage('capital', amt);
                setCapitalInput("");
                setModal(null);
                showToast(`✓ رأس المال أصبح ${maskNum(amt, privacyMode)} ج`);
            }

                                                    <span style={{fontSize:9,color:"#3d4f65",flexShrink:0,marginRight:6}}>{e.ts}</span>

                        <BackupRestoreScreen
                            lines={lines} visas={visas} instaPays={instaPays}
                            transactions={transactions} people={people}
                            capital={capital} financeLogs={financeLogs}
                            abuadiTarget={abuadiTarget} abuadiPayments={abuadiPayments}
                            abuadiDate={abuadiDate} abuadiHistory={abuadiHistory}
                            setLines={setLines} setVisas={setVisas} setInstaPays={setInstaPays}
                            setTransactions={setTransactions} setPeople={setPeople}
                            setCapital={setCapital} setFinanceLogs={setFinanceLogs}

                            visaDailyLimit={visaDailyLimit}         setVisaDailyLimit={setVisaDailyLimit}
                            visaMonthlyLimit={visaMonthlyLimit}     setVisaMonthlyLimit={setVisaMonthlyLimit}
                            instapayDailyLimit={instapayDailyLimit} setInstapayDailyLimit={setInstapayDailyLimit}

                    <div style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(5,7,15,0.92)",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",borderTop:"1px solid var(--border-dim)",display:"flex",paddingTop:8,paddingBottom:"calc(12px + env(safe-area-inset-bottom, 0px))",paddingLeft:"env(safe-area-inset-left, 0px)",paddingRight:"env(safe-area-inset-right, 0px)",zIndex:100}}>

                            </button>
                        ))}
                    </div>

                    {/* MODAL: Add Transaction */}
                    {modal==="addTxn" && (
                        <Modal title="إضافة عملية جديدة" onClose={() => { setModal(null); setAutoRouting({ suggestedId: null, allAtLimit: false, userOverrode: false }); setSplitPlan(null); setSplitConfirmed(false); setOcrResult(null); setOcrPreviewUrl(null); }}>
                            {/* 1. حقل اللصق الذكي (Smart Paste) في بداية الفورم */}
                            <div style={{ marginBottom: 20, background: "#162545", padding: 15, borderRadius: 12, border: "1px dashed #1e3a5f" }}>
                                <label style={{ display: "block", fontSize: 13, color: "#22d3ee", marginBottom: 8, fontWeight: "bold" }}>
                                    📋 صندوق الرسائل الذكي (انسخ الرسالة هنا لتعبئة البيانات تلقائياً):
                                </label>
                                <div style={{ display: "flex", gap: 8 }}>
                                    <textarea
                                        value={smartPaste}
                                        onChange={(e) => setSmartPaste(e.target.value)}
                                        placeholder="ضع نص رسالة فودافون كاش أو إنستا باي هنا..."
                                        rows="2"
                                        style={{
                                            flex: 1,
                                            background: "#0a0f1e",
                                            border: "1px solid #1e3a5f",
                                            borderRadius: 10,
                                            padding: 10,
                                            color: "#e2e8f0",
                                            fontSize: 13,
                                            outline: "none",
                                            resize: "none",
                                            textAlign: "right",
                                            fontFamily: "'Tajawal', sans-serif"
                                        }}
                                    />
                                    <button
                                        onClick={handleSmartPaste}
                                        style={{
                                            background: "linear-gradient(135deg,#22d3ee,#0891b2)",
                                            border: "none",
                                            borderRadius: 10,
                                            padding: "0 15px",
                                            color: "#0a0f1e",
                                            fontSize: 14,
                                            fontWeight: "bold",
                                            cursor: "pointer"
                                        }}
                                    >
                                        تطبيق
                                    </button>
                                </div>
                            </div>

                            {/* ✨ OCR Screenshot Section */}
                            <div style={{marginBottom:20, background:"#0d1a2e", padding:15, borderRadius:12, border:"1px dashed #a78bfa50"}}>
                                <div style={{fontSize:13, color:"#a78bfa", marginBottom:10, fontWeight:"bold"}}>
                                    ✨ إدخال ذكي عبر إسكرين شوت
                                </div>

                                {/* زر الرفع */}
                                <div
                                    onClick={()=>ocrInputRef.current?.click()}
                                    style={{
                                        border:"2px dashed #a78bfa40",
                                        borderRadius:10,
                                        padding:"14px 10px",
                                        textAlign:"center",
                                        cursor:"pointer",
                                        background: ocrLoading ? "#1a1040" : "#0a0c18",
                                        transition:"all 0.2s",
                                        marginBottom: ocrResult ? 10 : 0,
                                    }}
                                >
                                    {ocrLoading ? (
                                        <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,color:"#a78bfa",padding:"4px 0"}}>
                                            <div className="loading-spinner" style={{borderTopColor:"#a78bfa",width:26,height:26}}/>
                                            <span style={{fontSize:13,fontWeight:700}}>⏳ جاري قراءة الإسكرينة...</span>
                                            <span style={{fontSize:10,color:"#475569"}}>قد يستغرق 5-15 ثانية حسب حجم الصورة</span>
                                        </div>
                                    ) : ocrPreviewUrl ? (
                                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                                            <img src={ocrPreviewUrl} alt="screenshot" style={{width:48,height:48,objectFit:"cover",borderRadius:8,border:"1px solid #a78bfa40"}}/>
                                            <div style={{textAlign:"right",flex:1}}>
                                                <div style={{fontSize:12,color:"#a78bfa",fontWeight:700}}>✓ تم رفع الصورة</div>
                                                <div style={{fontSize:11,color:"#64748b"}}>اضغط لتغيير الصورة</div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div>
                                            <div style={{fontSize:24,marginBottom:4}}>📸</div>
                                            <div style={{fontSize:12,color:"#7a8fa8"}}>اضغط لرفع إسكرين شوت العملية</div>
                                            <div style={{fontSize:10,color:"#3d4f65",marginTop:3}}>يدعم صور فودافون كاش وإنستا باي</div>
                                        </div>
                                    )}
                                </div>
                                <input
                                    ref={ocrInputRef}
                                    type="file"
                                    accept="image/*"
                                    style={{display:"none"}}
                                    onChange={e=>{ if(e.target.files[0]) handleOcrImage(e.target.files[0]); }}
                                />

                                {/* نتيجة الـ OCR */}
                                {ocrResult && !ocrLoading && (
                                    <div style={{background:"#0a1628",border:"1px solid #a78bfa30",borderRadius:10,padding:12,fontSize:12}}>
                                        <div style={{color:"#a78bfa",fontWeight:700,marginBottom:8}}>📋 البيانات المستخرجة:</div>
                                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                                            <div style={{background:"#111827",borderRadius:8,padding:"8px 10px"}}>
                                                <div style={{color:"#64748b",fontSize:10,marginBottom:2}}>💰 المبلغ</div>
                                                <div style={{color: ocrResult.amount ? "#10b981" : "#ef4444",fontWeight:700}}>
                                                    {ocrResult.amount ? ocrResult.amount + " ج" : "لم يُكتشف"}
                                                </div>
                                            </div>
                                            <div style={{background:"#111827",borderRadius:8,padding:"8px 10px"}}>
                                                <div style={{color:"#64748b",fontSize:10,marginBottom:2}}>📱 الهاتف</div>
                                                <div style={{color: ocrResult.phone ? "#22d3ee" : "#ef4444",fontWeight:700,direction:"ltr"}}>
                                                    {ocrResult.phone || "لم يُكتشف"}
                                                </div>
                                            </div>
                                        </div>
                                        <div style={{background:"#111827",borderRadius:8,padding:"8px 10px",marginBottom:8}}>
                                            <div style={{color:"#64748b",fontSize:10,marginBottom:2}}>🔄 نوع العملية المكتشف</div>
                                            <div style={{color: ocrResult.type==="receive" ? "#10b981" : ocrResult.type==="transfer" ? "#f59e0b" : "#64748b",fontWeight:700}}>
                                                {ocrResult.type==="receive" ? "📥 استلام (إيداع)" : ocrResult.type==="transfer" ? "💸 تحويل (سحب)" : "⚠️ غير محدد — اختر يدوياً"}
                                            </div>
                                        </div>
                                        <div style={{fontSize:10,color:"#475569",background:"#0d1120",borderRadius:6,padding:"6px 8px"}}>
                                            ⚠️ راجع نوع العملية في الأسفل قبل الحفظ
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* 2. باقي حقول الفورم */}
                            <Field label="نوع العملية">
                                <select
                                    value={form.type}
                                    onChange={e => setForm({...form, type: e.target.value})}
                                    style={{ width: "100%", background: "#0f1e3d", border: "1px solid #1e3a5f", borderRadius: 10, padding: 11, color: "#e2e8f0" }}
                                >
                                    <option value="transfer">💸 تحويل (سحب من المحفظة)</option>
                                    <option value="receive">📥 استلام (إيداع في المحفظة)</option>
                                    <option value="internal_transfer">🔄 تحويل داخلي (من خط لخط)</option>
                                    <option value="bank_withdraw">🏦 سحب بنك (عمولة {(bankWithdrawRate*100).toFixed(2)}%)</option>
                                    <option value="fawri_withdraw">💳 سحب فوري ({(fawriWithdrawRate*100).toFixed(2)}% + {fawriWithdrawFixed} ج)</option>
                                    <option value="fawri_transfer">⚡ تحويل مباشر إلى فوري</option>
                                </select>
                            </Field>

                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                                <Field label="التاريخ"><Input type="date" value={form.date} onChange={v => setForm({...form, date: v})}/></Field>
                                <Field label="الوقت"><Input type="time" value={form.time} onChange={v => setForm({...form, time: v})}/></Field>
                            </div>

                            <Field label="المبلغ (ج)">
                                <input
                                    type="text"
                                    value={form.amount || ""}
                                    placeholder="0.00 (يمكنك كتابة حسبة مثل 1000+20)"
                                    onChange={(e) => setForm({...form, amount: e.target.value})}
                                    onBlur={(e) => {
                                        const val = e.target.value.trim();
                                        if (!val) return;
                                        const evaluated = evaluateExpression(val);
                                        const num = parseFloat(evaluated);
                                        if (!isNaN(num) && isFinite(num) && num > 0) {
                                            setForm({...form, amount: String(Math.round(num * 100) / 100)});
                                        }
                                    }}
                                    style={{
                                        width: "100%",
                                        background: "#0f1e3d",
                                        border: "1px solid #1e3a5f",
                                        borderRadius: 10,
                                        padding: "11px 14px",
                                        color: "#e2e8f0",
                                        fontSize: 14,
                                        outline: "none",
                                        boxSizing: "border-box",
                                        textAlign: "right"
                                    }}
                                />
                            </Field>

                            {/* ⭐ FEATURE: حاسبة العمولة المدمجة */}
                            {(() => {
                                const amt = parseFloat(form.amount) || 0;
                                if (!amt || amt <= 0) return null;
                                const fRate  = commissionSettings?.fawriWithdrawRate  ?? 0.0057;
                                const fFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
                                const bRate  = commissionSettings?.bankWithdrawRate   ?? 0.002;
                                let commLabel = null, commVal = 0;
                                if (form.type === "fawri_withdraw") { commLabel = "عمولة سحب فوري"; commVal = Math.round((amt * fRate + fFixed) * 100) / 100; }
                                else if (form.type === "bank_withdraw") { commLabel = "عمولة سحب بنك"; commVal = Math.round(amt * bRate * 100) / 100; }
                                if (!commLabel) return null;
                                return (
                                    <div style={{background:"#10b98110",border:"1px solid #10b98130",borderRadius:10,padding:"8px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                        <span style={{fontSize:12,color:"#10b981"}}>{commLabel}</span>
                                        <span style={{fontSize:14,fontWeight:700,color:"#10b981"}}>{commVal} ج</span>
                                    </div>
                                );
                            })()}

                            {/* ✂️ Smart Multi-Line Split Panel */}
                            {splitPlan && (form.type === "transfer" || form.type === "receive") && (() => {
                                const accent = splitPlan.isComplete ? "#10b981" : "#f59e0b";
                                const stepColors = ["#22d3ee","#a78bfa","#f59e0b","#10b981","#3b82f6","#ef4444","#ec4899","#14b8a6"];
                                return (
                                    <div style={{
                                        background: "linear-gradient(135deg,#0a1a0d,#0d1120)",
                                        border: `1px solid ${accent}50`,
                                        borderRadius: 14,
                                        padding: 16,
                                        marginBottom: 14,
                                        position: "relative",
                                        overflow: "hidden"
                                    }}>
                                        {/* شريط لوني على الجانب */}
                                        <div style={{position:"absolute",top:0,right:0,width:4,height:"100%",background:`linear-gradient(180deg,${accent},${accent}80)`,borderRadius:"0 14px 14px 0"}}/>

                                        {/* العنوان */}
                                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                                            <div style={{fontSize:18}}>✂️</div>
                                            <div>
                                                <div style={{fontSize:13,fontWeight:900,color:accent}}>
                                                    {splitPlan.isComplete ? "خطة التقسيم الذكي ✓" : "⚠️ تقسيم جزئي — الرصيد غير كافٍ تماماً"}
                                                </div>
                                                <div style={{fontSize:10,color:"#475569",marginTop:2}}>
                                                    {splitPlan.isComplete
                                                        ? `المبلغ ${maskNum(splitPlan.needed, privacyMode)} ج سيتم توزيعه على ${splitPlan.steps.length} خط`
                                                        : `يمكن تغطية ${maskNum(splitPlan.totalCovered, privacyMode)} ج فقط من أصل ${maskNum(splitPlan.needed, privacyMode)} ج`}
                                                </div>
                                            </div>
                                            {!splitPlan.isComplete && (
                                                <div style={{marginRight:"auto",fontSize:10,background:"#ef444420",border:"1px solid #ef444440",borderRadius:20,padding:"3px 10px",color:"#ef4444",fontWeight:700}}>
                                                    متبقي: {maskNum(splitPlan.remaining, privacyMode)} ج
                                                </div>
                                            )}
                                        </div>

                                        {/* خطوات التقسيم */}
                                        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:12}}>
                                            {splitPlan.steps.map((step, i) => (
                                                <div key={step.sourceId} style={{
                                                    display:"flex",alignItems:"center",gap:10,
                                                    background:"rgba(255,255,255,0.03)",
                                                    border:`1px solid ${stepColors[i % stepColors.length]}30`,
                                                    borderRadius:10,padding:"8px 12px"
                                                }}>
                                                    <div style={{
                                                        width:22,height:22,borderRadius:"50%",
                                                        background:`${stepColors[i % stepColors.length]}20`,
                                                        border:`1.5px solid ${stepColors[i % stepColors.length]}`,
                                                        display:"flex",alignItems:"center",justifyContent:"center",
                                                        fontSize:10,fontWeight:900,color:stepColors[i % stepColors.length],
                                                        flexShrink:0
                                                    }}>{i+1}</div>
                                                    <div style={{flex:1}}>
                                                        <div style={{fontSize:12,fontWeight:700,color:"#c8d6e8"}}>{step.sourceName}</div>
                                                        <div style={{fontSize:10,color:"#475569"}}>
                                                            رصيد متاح: {maskNum(step.balance, privacyMode)} ج • سعة: {maskNum(step.capacity, privacyMode)} ج
                                                        </div>
                                                    </div>
                                                    <div style={{textAlign:"left",flexShrink:0}}>
                                                        <div style={{fontSize:15,fontWeight:900,color:stepColors[i % stepColors.length]}}>{maskNum(step.amount, privacyMode)} ج</div>
                                                        <div style={{fontSize:9,color:"#3d4f65",textAlign:"center"}}>
                                                            {Math.round(step.amount / splitPlan.needed * 100)}%
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {/* شريط الإجمالي */}
                                        <div style={{
                                            display:"flex",justifyContent:"space-between",alignItems:"center",
                                            background:`${accent}10`,border:`1px solid ${accent}30`,
                                            borderRadius:10,padding:"8px 12px",marginBottom:12
                                        }}>
                                            <div style={{fontSize:11,color:"#7a8fa8"}}>
                                                📊 {splitPlan.steps.length} خطوط × إجمالي
                                            </div>
                                            <div style={{fontSize:16,fontWeight:900,color:accent}}>
                                                {maskNum(splitPlan.totalCovered, privacyMode)} ج
                                            </div>
                                        </div>

                                        {/* أزرار الإجراء */}
                                        {splitPlan.isComplete ? (
                                            !splitConfirmed ? (
                                                <div style={{display:"flex",gap:8}}>
                                                    <button
                                                        onClick={() => setSplitConfirmed(true)}
                                                        disabled={isSubmitting}
                                                        style={{
                                                            flex:1,background:"linear-gradient(135deg,#10b981,#059669)",
                                                            border:"none",borderRadius:10,padding:"11px 0",
                                                            color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",
                                                            boxShadow:"0 4px 14px #10b98130"
                                                        }}>
                                                        ✅ تأكيد التقسيم
                                                    </button>
                                                    <button
                                                        onClick={() => { setSplitPlan(null); setSplitConfirmed(false); }}
                                                        style={{
                                                            width:42,background:"#ef444415",border:"1px solid #ef444430",
                                                            borderRadius:10,padding:"11px 0",color:"#ef4444",
                                                            fontSize:16,cursor:"pointer"
                                                        }}>✕</button>
                                                </div>
                                            ) : (
                                                <div>
                                                    <div style={{
                                                        background:"#10b98115",border:"1px solid #10b98140",
                                                        borderRadius:10,padding:"10px 14px",marginBottom:10,
                                                        fontSize:12,color:"#10b981",lineHeight:1.6
                                                    }}>
                                                        ✅ جاهز للتنفيذ — أدخل باقي البيانات (العميل، التاريخ) ثم اضغط "تنفيذ التقسيم"
                                                    </div>
                                                    <div style={{display:"flex",gap:8}}>
                                                        <button
                                                            onClick={executeSplitPlan}
                                                            disabled={isSubmitting || !form.personName}
                                                            style={{
                                                                flex:1,
                                                                background: isSubmitting || !form.personName
                                                                    ? "linear-gradient(135deg,#333,#444)"
                                                                    : "linear-gradient(135deg,#10b981,#059669)",
                                                                border:"none",borderRadius:10,padding:"12px 0",
                                                                color:"#fff",fontSize:14,fontWeight:900,
                                                                cursor: isSubmitting || !form.personName ? "not-allowed":"pointer",
                                                                boxShadow: isSubmitting || !form.personName ? "none":"0 4px 18px #10b98140"
                                                            }}>
                                                            {isSubmitting ? "⏳ جاري التنفيذ..." : `✂️ تنفيذ التقسيم (${splitPlan.steps.length} عمليات)`}
                                                        </button>

                                                        }}>✕</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })()}

                            {/* ⭐ حاسبة الخصم والعمولة التلقائية */}
                            {(() => {
                                const amt = parseFloat(form.amount);
                                const selectedSrc = form.sourceId ? sources.find(s => s.id === form.sourceId) : null;
                                if (!selectedSrc || !amt || isNaN(amt) || amt <= 0) return null;

                                let deduction = 0;
                                let label = "";
                                let colorAccent = "#f59e0b";
                                let details = "";

                                if (selectedSrc.type === "instapay") {
                                    // البنك: 1% خصم
                                    deduction = amt * 0.01;
                                    label = "🏦 عمولة البنك (1%)";
                                    colorAccent = "#3b82f6";
                                    details = `${formatNum(Math.round(deduction * 100) / 100)} ج`;
                                } else if (selectedSrc.type === "visa") {
                                    // فيزا فوري: 0.57% + 15 ج ثابتة
                                    const __cs = (() => { try { const s = localStorage.getItem("commissionSettings"); return s ? JSON.parse(s) : null; } catch(e) { return null; } })();
                                    deduction = (amt * (__cs?.fawriWithdrawRate ?? 0.0057)) + (__cs?.fawriWithdrawFixed ?? 15);
                                    label = "💳 عمولة فيزا فوري (0.57% + 15 ج)";
                                    colorAccent = "#a78bfa";
                                    details = `${formatNum(Math.round(amt * (__cs?.fawriWithdrawRate ?? 0.0057) * 100) / 100)} ج + ${(__cs?.fawriWithdrawFixed ?? 15)} ج ثابتة`;
                                } else {
                                    return null;
                                }

                                const net = amt - deduction;

                                return (
                                    <div style={{
                                        background: "linear-gradient(135deg,#0a1628,#0f1e3d)",
                                        border: `1px solid ${colorAccent}40`,
                                        borderRadius: 12,
                                        padding: 14,
                                        marginBottom: 14,
                                        position: "relative",
                                        overflow: "hidden"
                                    }}>
                                        <div style={{
                                            position: "absolute", top: 0, right: 0,
                                            width: 4, height: "100%",
                                            background: colorAccent,
                                            borderRadius: "0 12px 12px 0"

                                        <div style={{fontSize: 12, color: colorAccent, fontWeight: 700, marginBottom: 10}}>
                                            🧮 {label}
                                        </div>
                                        <div style={{display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, textAlign: "center"}}>
                                            <div>
                                                <div style={{fontSize: 11, color: "#64748b", marginBottom: 4}}>المبلغ الأصلي</div>
                                                <div style={{fontSize: 15, fontWeight: 700, color: "#e2e8f0"}}>{maskNum(amt, privacyMode)} ج</div>
                                            </div>
                                            <div>
                                                <div style={{fontSize: 11, color: "#64748b", marginBottom: 4}}>الخصم</div>
                                                <div style={{fontSize: 15, fontWeight: 700, color: "#ef4444"}}>
                                                    - {formatNum(Math.round(deduction * 100) / 100)} ج
                                                </div>
                                                <div style={{fontSize: 10, color: "#475569", marginTop: 2}}>{details}</div>
                                            </div>
                                            <div style={{background: `${colorAccent}15`, borderRadius: 8, padding: "4px 6px"}}>
                                                <div style={{fontSize: 11, color: colorAccent, marginBottom: 4}}>✅ الصافي النهائي</div>
                                                <div style={{fontSize: 17, fontWeight: 900, color: colorAccent}}>
                                                    {formatNum(Math.round(net * 100) / 100)} ج
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })()}

                            {/* ⭐ حاسبة العمولة الحية */}
                            {(() => {
                                const amt = parseFloat(form.amount);
                                if ((!form.type === "bank_withdraw" && form.type !== "fawri_withdraw") || !amt || isNaN(amt) || amt <= 0) return null;
                                if (form.type !== "bank_withdraw" && form.type !== "fawri_withdraw") return null;

                                const isBank = form.type === "bank_withdraw";
                                const commission = isBank
                                    ? Math.round(amt * bankWithdrawRate * 100) / 100
                                    : Math.round(((amt * fawriWithdrawRate) + fawriWithdrawFixed) * 100) / 100;
                                const total = Math.round((amt + commission) * 100) / 100;
                                const accent = isBank ? "#3b82f6" : "#a78bfa";
                                const commDetail = isBank
                                    ? `${amt.toLocaleString('ar-EG')} × ${(bankWithdrawRate * 100).toFixed(2)}%`
                                    : `(${amt.toLocaleString('ar-EG')} × ${(fawriWithdrawRate * 100).toFixed(2)}%) + ${fawriWithdrawFixed} ج`;

                                return (
                                    <div style={{
                                        background: "#0a1628",
                                        border: `1px solid ${accent}50`,
                                        borderRadius: 12,
                                        padding: 14,
                                        marginBottom: 14,
                                        borderRight: `4px solid ${accent}`
                                    }}>
                                        <div style={{fontSize: 12, color: accent, fontWeight: 700, marginBottom: 10}}>
                                            🧮 {isBank ? "حسبة عمولة البنك" : "حسبة عمولة فوري"}
                                        </div>
