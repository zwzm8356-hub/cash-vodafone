<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- ══ PWA Core ══ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#05070f">
    <meta name="background-color" content="#05070f">

    <meta property="og:title" content="ماليه المر — مدير فودافون كاش">

    <title>ماليه المر v23 — فودافون كاش Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin
        onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js';this.onerror=function(){this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js';};"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin
        onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js';this.onerror=function(){this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js';};"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/@babel/standalone/babel.min.js';"></script>
    <script>
    // ✅ Disable Babel's internal dynamic imports that break on file:// protocol
    document.addEventListener('DOMContentLoaded', function() {
        // Force Babel to process scripts synchronously
        var scripts = document.querySelectorAll('script[type="text/babel"]');
        scripts.forEach(function(s) { s.setAttribute('data-type', 'module'); });
    });
    </script>

    <!-- ══ Inline Manifest fallback (بديل لو manifest.json مش موجود) ══ -->
    <script id="pwa-manifest-inline">
    (function() {
        // Inline manifest as blob — يشتغل حتى لو الملف مرفوع مباشرةً بدون web server
        const manifest = {
            name: "ماليه المر — مدير فودافون كاش",
            short_name: "ماليه المر",
            description: "مدير التحويلات والمالية",
            start_url: "./",
            display: "standalone",
            orientation: "portrait-primary",
            background_color: "#05070f",
            theme_color: "#05070f",
            lang: "ar",
            dir: "rtl",
            icons: [
                {
                    src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='36' fill='%2305070f'/><text x='96' y='130' font-size='110' text-anchor='middle' fill='%23e40000' font-family='serif' font-weight='bold'>V</text></svg>`),
                    sizes: "192x192",
                    type: "image/svg+xml",
                    purpose: "any maskable"
                },
                {
                    src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='%2305070f'/><text x='256' y='350' font-size='290' text-anchor='middle' fill='%23e40000' font-family='serif' font-weight='bold'>V</text></svg>`),
                    sizes: "512x512",
                    type: "image/svg+xml",
                    purpose: "any maskable"
                }
            ],
            categories: ["finance", "productivity"],
            shortcuts: [
                {
                    name: "عملية جديدة",
                    short_name: "جديد",
                    description: "إضافة عملية تحويل",
                    url: "./"
                }
            ]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"});
        const url  = URL.createObjectURL(blob);
        // نفعّل الـ blob manifest لو مفيش manifest.json حقيقي
        const existing = document.querySelector('link[rel="manifest"]');
        if (existing) {
            fetch(existing.href).catch(() => { existing.href = url; });
        }
    })();
    </script>

    <style>
        /* ══════════════════════════════════════════
           Ultra-Dark OLED Theme — فودافون كاش
        ══════════════════════════════════════════ */
        :root {
            --bg-void:     #05070f;
            --bg-deep:     #0a0c16;
            --bg-card:     #0d1120;
            --bg-card2:    #111827;
            --bg-input:    #0a0e1a;
            --border-dim:  #1a2235;
            --border-glow: #1e3a5f;
            --text-bright: #c8d6e8;
            --text-mid:    #7a8fa8;
            --text-dim:    #3d4f65;
            --accent-red:  #e40000;
            --accent-cyan: #22d3ee;
            --accent-green:#10b981;
            --accent-gold: #f59e0b;
            --accent-violet:#a78bfa;
            --accent-blue: #3b82f6;
            --glass-bg:    rgba(10, 14, 26, 0.82);
            --glass-blur:  blur(18px);
            --shadow-deep: 0 8px 32px rgba(0,0,0,0.6);
            --radius-card: 14px;
            --radius-btn:  10px;
        }


        /* ══════════════════════════════════════════
           ☀️  Light Mode — data-theme="light"
        ══════════════════════════════════════════ */
        [data-theme="light"] {
            --bg-void:     #f0f4f8;
            --bg-deep:     #e8edf3;
            --bg-card:     #ffffff;
            --bg-card2:    #f5f8fc;
            --bg-input:    #edf2f7;
            --border-dim:  #cbd5e1;
            --border-glow: #93c5fd;
            --text-bright: #0f172a;
            --text-mid:    #475569;
            --text-dim:    #94a3b8;
            --glass-bg:    rgba(255,255,255,0.88);
            --shadow-deep: 0 8px 32px rgba(0,0,0,0.12);
        }
        [data-theme="light"] body { background-color: #f0f4f8; }
        [data-theme="light"] ::-webkit-scrollbar-track { background: #e8edf3; }
        [data-theme="light"] ::-webkit-scrollbar-thumb { background: #93c5fd; }

        /* ══════════════════════════════════════════
           🌌  Neon 2090 Mode — data-theme="neon2090"
        ══════════════════════════════════════════ */
        [data-theme="neon2090"] {
            --bg-void:     #030308;
            --bg-deep:     #06060f;
            --bg-card:     #0a0a18;
            --bg-card2:    #0e0e20;
            --bg-input:    #08081420;
            --border-dim:  #1f2a4a;
            --border-glow: #00f0ff;
            --text-bright: #e8f6ff;
            --text-mid:    #8fa8c8;
            --text-dim:    #45527a;
            --accent-red:  #ff2d6d;
            --accent-cyan: #00f0ff;
            --accent-green:#00ffa3;
            --accent-gold: #ffd23f;
            --accent-violet:#c86bff;
            --accent-blue: #4d7fff;
            --glass-bg:    rgba(8, 8, 20, 0.78);
            --shadow-deep: 0 8px 32px rgba(0,240,255,0.12);
        }
        [data-theme="neon2090"] body {
            background:
                radial-gradient(ellipse 800px 500px at 15% -5%, rgba(0,240,255,0.10), transparent 60%),
                radial-gradient(ellipse 700px 500px at 100% 10%, rgba(200,107,255,0.10), transparent 60%),
                radial-gradient(ellipse 600px 600px at 50% 100%, rgba(255,45,109,0.06), transparent 60%),
                #030308;
        }
        [data-theme="neon2090"] ::-webkit-scrollbar-track { background: #030308; }
        [data-theme="neon2090"] ::-webkit-scrollbar-thumb { background: #00f0ff50; }
        [data-theme="neon2090"] .kpi-card,
        [data-theme="neon2090"] .card-entry {
            position: relative;
            box-shadow: 0 0 0 1px rgba(0,240,255,0.06), 0 6px 24px rgba(0,240,255,0.08);
        }
        [data-theme="neon2090"] .hawker-bottom-nav {
            box-shadow: 0 -2px 20px rgba(0,240,255,0.15);
        }
        @keyframes neonPulse2090 {
            0%, 100% { opacity: 0.55; filter: brightness(1); }
            50%      { opacity: 1;    filter: brightness(1.35); }
        }
        @keyframes neonScan2090 {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .neon2090-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 9px; font-weight: 900; letter-spacing: 0.5px;
            padding: 2px 7px; border-radius: 20px;
            background: linear-gradient(135deg,#00f0ff25,#c86bff25);
            border: 1px solid #00f0ff50; color: #00f0ff;
            animation: neonPulse2090 2.4s ease-in-out infinite;
        }
        .scan-line-2090 {
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
            animation: neonScan2090 3s linear infinite;
            pointer-events: none;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-void);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-bright);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-void); }
        ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }

        /* ── Page fade-in ── */
        .page-container {
            animation: fadeIn 0.3s ease;
            -webkit-overflow-scrolling: touch;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px) scale(0.99); }
            to   { opacity: 1; transform: translateY(0)   scale(1);    }
        }

        /* ── Blink ── */
        @keyframes blink {
            0%, 50%     { opacity: 1;   }
            50.1%, 100% { opacity: 0.45;}
        }

        /* ══ Street Mode — إخفاء شامل للأرقام والمبالغ ══ */
        .street-mode-blur {
            filter: blur(7px) !important;
            user-select: none !important;
            transition: filter 0.3s ease;
        }
        .street-mode-overlay::after {
            content: "🕵️";
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5,7,15,0.85);
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; z-index: 8888; pointer-events: none;
        }

        /* ══ Voice Pulse Animation ══ */
        @keyframes voicePulse {
            0%   { box-shadow: 0 0 0 0 rgba(34,211,238,0.5); }
            70%  { box-shadow: 0 0 0 10px rgba(34,211,238,0); }
            100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); }
        }
        .voice-listening { animation: voicePulse 1s infinite; }

        /* ── Spinner ── */
        .loading-spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid rgba(30,58,95,0.35);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }

        /* ── Glassmorphism Modal Overlay ── */
        .glass-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: flex-end;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.2s ease;
        }
        @keyframes overlayIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── Glass Modal Panel ── */
        .glass-modal {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(34,211,238,0.1);
            border-bottom: none;
            border-radius: 22px 22px 0 0;
            padding: 22px 20px 32px;
            max-height: 92vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            animation: slideUp 0.25s cubic-bezier(0.22,0.61,0.36,1);
            box-shadow: 0 -4px 40px rgba(0,0,0,0.7);
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* ── Collapsible Accordion ── */
        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 10px 0;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid var(--border-dim);
            margin-bottom: 12px;
        }
        .accordion-arrow {
            width: 24px; height: 24px;
            background: var(--bg-card2);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: var(--text-mid);
            transition: transform 0.25s ease, background 0.2s ease;
            flex-shrink: 0;
        }
        .accordion-arrow.open {
            transform: rotate(180deg);
            background: rgba(34,211,238,0.08);
            color: var(--accent-cyan);
            border-color: rgba(34,211,238,0.25);
        }
        .accordion-body {
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1),
                        opacity   0.3s ease,
                        transform 0.3s ease;
        }
        .accordion-body.open  { opacity: 1; transform: translateY(0);   }
        .accordion-body.closed{ opacity: 0; transform: translateY(-6px);}

        /* ── Enhanced Progress Bar ── */
        .vl-track {
            width: 100%; height: 7px;
            background: rgba(255,255,255,0.04);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 4px;
        }
        .vl-fill {
            height: 100%; border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4,0,0.2,1),
                        background 0.4s ease;
            position: relative;
        }
        .vl-fill::after {
            content: '';
            position: absolute; right: 0; top: 0; bottom: 0;
            width: 8px;
            background: rgba(255,255,255,0.35);
            border-radius: 99px;
            filter: blur(2px);
        }

        /* ── Interactive Buttons ── */
        button {
            transition: opacity 0.15s ease, transform 0.15s ease,
                        box-shadow 0.15s ease, background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { opacity: 0.75; transform: scale(0.97); }

        /* ── Input Fields ── */
        input, select, textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Tajawal', sans-serif;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: rgba(34,211,238,0.45) !important;
            box-shadow: 0 0 0 2px rgba(34,211,238,0.08);
        }

        /* ── Card hover glow ── */
        .line-card {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
        }
        .line-card:active { transform: scale(0.995); }

        /* ── Toast ── */
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(12px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    }
        }
        .toast-animate { animation: toastIn 0.2s ease; }

        /* ── نيون وميض للتحذير عند الحد الأقصى ── */
        @keyframes neonPulse {
            0%,100% { box-shadow: 0 0 0px #ef444400, inset 0 0 0px #ef444400; }
            50%      { box-shadow: 0 0 10px #ef444460, inset 0 0 6px #ef444418; }
        }
        @keyframes neonPulseAmber {
            0%,100% { box-shadow: 0 0 0px #f59e0b00, inset 0 0 0px #f59e0b00; }
            50%      { box-shadow: 0 0 8px #f59e0b50, inset 0 0 4px #f59e0b15; }
        }
        .limit-critical { animation: neonPulse 1.6s ease-in-out infinite; }
        .limit-warning  { animation: neonPulseAmber 2s ease-in-out infinite; }

        /* ── Smart Auto-Routing Badge ── */
        @keyframes smartGlow {
            0%,100% { box-shadow: 0 0 4px #a78bfa60, 0 0 10px #a78bfa30; opacity: 1; }
            50%      { box-shadow: 0 0 10px #a78bfa90, 0 0 20px #a78bfa50; opacity: 0.85; }
        }
        .smart-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: linear-gradient(135deg, #a78bfa25, #7c3aed20);
            border: 1px solid #a78bfa60; border-radius: 20px;
            padding: 3px 10px; font-size: 10px; color: #a78bfa; font-weight: 700;
            animation: smartGlow 2s ease-in-out infinite; white-space: nowrap;
        }
        .smart-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: #a78bfa; animation: blink 1.5s infinite; }

        /* ══════════════════════════════════════════
           🖨️  Thermal Receipt Print Styles
        ══════════════════════════════════════════ */
        @media print {
            body * { visibility: hidden; }
            #thermal-receipt-print, #thermal-receipt-print * { visibility: visible; }
            .thermal-receipt, .thermal-receipt * { visibility: visible; }
            #thermal-receipt-print {
                display: block !important;
                position: absolute;
                left: 0; top: 0;
                width: 80mm;
                padding: 4mm;
                background: #fff !important;
                color: #000 !important;
                font-family: 'Tajawal', 'Courier New', monospace;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print { display: none !important; }
            @page { margin: 0; size: 80mm auto; }
        }
        #thermal-receipt-print { display: none; }

        /* ══════════════════════════════════════════
           ✨  PREMIUM v23 — Ultra Enterprise Design
        ══════════════════════════════════════════ */

        /* ── Ambient Background Animation ── */
        @keyframes ambientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── Shimmer / Loading Skeleton ── */
        @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position:  200% center; }
        }
        .skeleton {
            background: linear-gradient(90deg,
                var(--bg-card2) 25%,
                rgba(255,255,255,0.06) 50%,
                var(--bg-card2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s ease infinite;
            border-radius: 8px;
        }

        /* ── Premium Glow Badges ── */
        @keyframes glowPulse {
            0%,100% { box-shadow: 0 0 6px currentColor, 0 0 12px transparent; }
            50%      { box-shadow: 0 0 14px currentColor, 0 0 24px currentColor; opacity:.8; }
        }
        .glow-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 20px; font-size: 10px;
            font-weight: 700; letter-spacing: 0.3px;
            animation: glowPulse 2.5s ease-in-out infinite;
        }
        .glow-badge.green  { color:#10b981; background:rgba(16,185,129,.12); border:1px solid rgba(16,185,129,.35); }
        .glow-badge.red    { color:#ef4444; background:rgba(239,68,68,.12);  border:1px solid rgba(239,68,68,.35);  }
        .glow-badge.cyan   { color:#22d3ee; background:rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.35); }
        .glow-badge.gold   { color:#f59e0b; background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.35); }

        /* ── Premium KPI Card ── */
        .kpi-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card2) 100%);
            border: 1px solid var(--border-dim);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }
        .kpi-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: opacity .3s ease;
        }
        .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.5); border-color: var(--border-glow); }
        .kpi-card:hover::before { opacity: .6; }

        /* ── Ripple Effect ── */
        .ripple-btn {
            position: relative; overflow: hidden;
        }
        .ripple-btn::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            transform: scale(0);
            animation: rippleAnim .5s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ── Success Animation ── */
        @keyframes successPop {
            0%   { transform: scale(0) rotate(-10deg); opacity: 0; }
            60%  { transform: scale(1.15) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .success-icon { animation: successPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }

        /* ── Premium Number Display ── */
        .premium-amount {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
            letter-spacing: -0.5px;
        }

        // ⭐ دالة حساب آمنة — بدون eval أو Function() — تحل العمليات الحسابية مع أولوية صحيحة
        // ✅ إصلاح: يدعم أولوية العمليات (* و / قبل + و -) والأقواس
        const evaluateExpression = (input) => {
            try {
                const sanitized = String(input).trim().replace(/[^0-9+\-*/.() ]/g, '');
                if (!sanitized) return "";

                // Tokenizer
                const tokens = sanitized.match(/(\d+\.?\d*)|([+\-*/()])/g);
                if (!tokens) return input;

                // ── Recursive Descent Parser ──
                let pos = 0;

                function peek()    { return tokens[pos]; }
                function consume() { return tokens[pos++]; }

                function parseExpr() {
                    let left = parseTerm();
                    while (peek() === '+' || peek() === '-') {
                        const op = consume();
                        const right = parseTerm();
                        left = op === '+' ? left + right : left - right;
                    }
                    return left;
                }

                function parseTerm() {
                    let left = parseFactor();
                    while (peek() === '*' || peek() === '/') {
                        const op = consume();
                        const right = parseFactor();
                        if (op === '*') left = left * right;
                        else left = right !== 0 ? left / right : left; // division by zero → keep left
                    }
                    return left;
                }

                function parseFactor() {
                    const tok = peek();
                    if (tok === '(') {
                        consume(); // '('
                        const val = parseExpr();
                        if (peek() === ')') consume(); // ')'
                        return val;
                    }
                    if (tok === '-') { consume(); return -parseFactor(); } // unary minus
                    const num = parseFloat(consume());
                    return isNaN(num) ? 0 : num;
                }

                const result = parseExpr();
                return isNaN(result) || !isFinite(result) ? input : String(Math.round(result * 100) / 100);
            } catch (e) {
                return input;
            }
        };

                function parseSmartMessage(text, lines = [], visas = []) {
            const result = {

            const amountMatch = text.match(/(?:مبلغ|قيمة)\s*(\d+(?:\.\d+)?)/) || text.match(/(\d{2,}(?:\.\d{1,2})?)\s*(?:جنيه|EGP)/) || text.match(/(\d{2,}(?:\.\d{1,2})?)/);
            if (amountMatch) result.amount = amountMatch[1];
            // 2. استخراج رقم تليفون العميل — يقبل الأرقام مع مسافات أو شرطات أو بدونها
            const phoneMatch = text.match(/01[0-9][\s\-]?[0-9]{4}[\s\-]?[0-9]{4}/) || text.match(/(01[0-9]{9})/);
            if (phoneMatch) result.personNumber = phoneMatch[0].replace(/[\s\-]/g, '');
            // 3. تحديد نوع العملية أوتوماتيك
            if (text.includes("تم استلام") || text.includes("إيداع") || text.includes("حوّل لك") || text.includes("تم استقبال")) {
                result.type = "receive";
            } else if (text.includes("تم تحويل") || text.includes("سحب") || text.includes("خصم")) {
                result.type = "transfer";

            // 4. التعرف الذكي على اسم الخط أو الفيزا

        /** حساب إحصائيات مصدر معين (خط/فيزا/إنستاباي) من سجل العمليات */
        function calcSourceStats(source, txns) {
            const num = source.number;
            const sid = source.id;
            const todayStr = today();
            const monthStr = currentMonthStr();
            let usedTodayTransfer = 0, usedMonthTransfer = 0;
            let usedTodayReceive  = 0, usedMonthReceive  = 0;
            for (const t of txns) {
                const tMonth = (t.date || "").slice(0, 7);
                const isToday = t.date === todayStr;
                const isMonth = tMonth === monthStr;

                // ══ تظبيط يدوي للعداد الشهري (لمطابقة تطبيق الشركة) ══
                if (t.type === "monthly_adjustment" && t.sourceId === sid) {
                    if (isMonth) {
                        if (t.adjustTarget === "transfer") usedMonthTransfer += (t.amount || 0);
                        else if (t.adjustTarget === "receive") usedMonthReceive += (t.amount || 0);
                    }
                    continue;
                }

                const isOutgoing = t.type === "transfer" || t.type === "bank_withdraw" ||
                                   t.type === "fawri_withdraw" || t.type === "fawri_transfer" ||
                                   t.type === "internal_transfer";
                const matchesOutgoing = t.sourceId === sid || (num && t.fromNumber === num);
                const matchesIncoming = t.sourceId === sid || (num && t.toNumber === num);
                const effectiveAmount = t.totalAmount || t.amount || 0;
                if (isOutgoing && matchesOutgoing) {
                    if (isToday) usedTodayTransfer += effectiveAmount;
                    if (isMonth) usedMonthTransfer += effectiveAmount;
                }
                if (t.type === "receive" && matchesIncoming) {
                    if (isToday) usedTodayReceive += (t.amount || 0);
                    if (isMonth) usedMonthReceive += (t.amount || 0);
                }
            }
            // ⚠️ العداد ميرجعش تحت الصفر حتى لو التظبيط بالسالب أكبر من المُستهلك الفعلي
            return {
                usedTodayTransfer, usedTodayReceive,
                usedMonthTransfer: Math.max(0, usedMonthTransfer),
                usedMonthReceive:  Math.max(0, usedMonthReceive),
            };
        }

        /** بناء قائمة المصادر الكاملة مع إحصائياتها */
        function buildSources(lines, visas, instaPays, transactions, limits) {
            const { vodDailyLimit, linesMonthlyLimit, visaDailyLimit, visaMonthlyLimit,
                    instapayDailyLimit, instapayMonthlyLimit } = limits;
            const enrich = (arr, type, dailyLimit, monthlyLimit) =>
                arr.map(s => {
                    const stats = calcSourceStats(s, transactions);
                    return { ...s, type, dailyLimit, monthlyLimit,
                        usedToday:           stats.usedTodayTransfer,
                        usedTodayReceive:    stats.usedTodayReceive,
                        usedMonth:           stats.usedMonthTransfer,
                        usedMonthTransfer:   stats.usedMonthTransfer,
                        usedMonthReceive:    stats.usedMonthReceive,
                    };
                });
            return [
                ...enrich(lines,      "line",      vodDailyLimit,      linesMonthlyLimit),
                ...enrich(visas,      "visa",      visaDailyLimit,     visaMonthlyLimit),
                ...enrich(instaPays,  "instapay",  instapayDailyLimit, instapayMonthlyLimit),
            ];
        }

            function scoreSource(s, txns) {

                // عدد عمليات اليوم على هذا الخط (يفضّل الخط الأقل استخداماً)
                const todayStr  = new Date().toISOString().slice(0, 10);
                const txnCount  = (txns || []).filter(t => t.sourceId === s.id && (t.date||"").startsWith(todayStr)).length;
                // Score: رصيد عالي + استهلاك منخفض + عمليات أقل = أفضل
                const balanceScore  = Math.min((s.balance || 0) / (amt * 3), 1);       // 0→1
                const usageScore    = 1 - Math.max(dailyPct, monthPct);                // 0→1 (أقل استهلاك أحسن)
                const countPenalty  = Math.max(0, 1 - txnCount * 0.08);               // كل عملية تنزل الأولوية 8%
                return balanceScore * 0.4 + usageScore * 0.4 + countPenalty * 0.2;
            }

            if (txnType === "receive" || txnType === "transfer") {
                const eligible = available.filter(s => {
                    const bal = s.balance || 0;
                    const afterDaily   = (s.usedToday || 0) + amt;
                    const afterMonthly = (s.usedMonth || 0) + amt;
                    const dailyOk   = s.dailyLimit   > 0 ? (afterDaily   / s.dailyLimit)   < WARN : true;
                    const monthlyOk = s.monthlyLimit > 0 ? (afterMonthly / s.monthlyLimit) < WARN : true;
                    return bal >= amt && dailyOk && monthlyOk;
                });
                if (!eligible.length) {
                    const fallback = available.filter(s => (s.balance || 0) >= amt);
                    if (!fallback.length) return { suggestedId: null, allAtLimit: true };
                    fallback.sort((a, b) => scoreSource(b) - scoreSource(a));
                    return { suggestedId: fallback[0].id, allAtLimit: false };
                }
                eligible.sort((a, b) => scoreSource(b) - scoreSource(a));
                return { suggestedId: eligible[0].id, allAtLimit: false };
            } else {
                const withSpace = available.map(s => {
                    const dR = s.dailyLimit   > 0 ? Math.max(0, s.dailyLimit   - (s.usedToday || 0)) : Infinity;
                    const mR = s.monthlyLimit > 0 ? Math.max(0, s.monthlyLimit - (s.usedMonth || 0)) : Infinity;
                    const space = Math.min(dR, mR);
                    return { ...s, space, canAbsorb: space >= amt };
                });
                const canAbsorb = withSpace.filter(s => s.canAbsorb);
                if (!canAbsorb.length) return { suggestedId: null, allAtLimit: true };
                canAbsorb.sort((a, b) => scoreSource(b) - scoreSource(a));
                return { suggestedId: canAbsorb[0].id, allAtLimit: false };
            }
        }

        // ⭐ Fraud Detection — يكشف العمليات الغريبة قبل الحفظ
        function detectPotentialFraud(newTxn, allTransactions) {
            const warnings = [];
            const amt = newTxn.amount || 0;
            const type = newTxn.type;
            const phone = newTxn.toNumber || newTxn.fromNumber || "";

            // 1. مبلغ ضخم جداً (أكتر من 3x متوسط العمليات المتشابهة)
            const sameTxns = allTransactions.filter(t => t.type === type && t.amount > 0);
            if (sameTxns.length >= 5) {
                const avg = sameTxns.reduce((s, t) => s + t.amount, 0) / sameTxns.length;
                if (amt > avg * 3 && amt > 5000) {
                    warnings.push(`💰 المبلغ (${amt.toLocaleString("ar-EG")} ج) أكبر بـ 3x من متوسطك المعتاد (${Math.round(avg).toLocaleString("ar-EG")} ج)`);
                }
            }

            // 2. رقم هاتف غير مسبوق مع مبلغ كبير
            if (phone && phone.length >= 10 && amt > 10000) {
                const knownPhone = allTransactions.some(t =>
                    (t.toNumber === phone || t.fromNumber === phone) && t.id !== newTxn.id
                );
                if (!knownPhone) {
                    warnings.push(`📱 الرقم (${phone}) مش موجود في سجلك قبل كده — مبلغ كبير مع رقم جديد`);
                }
            }

            // 3. نفس المبلغ اتكرر أكتر من 3 مرات في نفس اليوم
            const todayStr = newTxn.date || "";
            const sameAmtToday = allTransactions.filter(t =>
                t.date === todayStr && t.amount === amt && t.type === type
            ).length;
            if (sameAmtToday >= 3) {
                warnings.push(`🔁 نفس المبلغ (${amt.toLocaleString("ar-EG")} ج) اتكرر ${sameAmtToday} مرة النهارده`);
            }

            return warnings;
        }

        /** حساب خطة التقسيم الذكي على عدة خطوط */
        function calcSmartSplit(sources, amount, txnType) {
            const amt = parseFloat(amount);
            if (!amt || isNaN(amt) || amt <= 0) return null;
            if (txnType !== "transfer" && txnType !== "receive") return null;
            const isTransfer = txnType === "transfer";
            const candidates = sources
                .filter(s => s.available !== false)
                .map(s => {
                    const balance  = parseFloat(s.balance) || 0;
                    const dUT = s.usedToday || 0;
                    const dUR = s.usedTodayReceive || 0;
                    const dL  = s.dailyLimit   || Infinity;
                    const mU  = s.usedMonth    || 0;
                    const mL  = s.monthlyLimit || Infinity;
                    const dRT = Math.max(0, dL - dUT);
                    const dRR = Math.max(0, dL - dUR);
                    const mR  = Math.max(0, mL - mU);
                    const capacity = isTransfer
                        ? Math.min(balance, dRT, mR)
                        : Math.min(dRR, mR);
                    return { ...s, capacity: Math.floor(capacity * 100) / 100 };
                })
                .filter(s => s.capacity > 0)
                .sort((a, b) => b.capacity - a.capacity);
            if (!candidates.length) return null;
            if (candidates.some(s => s.capacity >= amt)) return null; // لا داعي للتقسيم
            const steps = [];
            let remaining = amt;
            for (const src of candidates) {
                if (remaining <= 0) break;
                const take = Math.min(src.capacity, remaining);
                if (take > 0) {
                    steps.push({ sourceId: src.id, sourceName: src.name, sourceType: src.type,
                                 amount: Math.round(take * 100) / 100,
                                 balance: src.balance || 0, capacity: src.capacity });
                    remaining = Math.round((remaining - take) * 100) / 100;
                }
            }
            const totalCovered = Math.round((amt - remaining) * 100) / 100;
            return { steps, totalCovered, needed: amt, remaining: Math.max(0, remaining), isComplete: remaining <= 0 };
        }

        /** حساب العمولة لعملية معينة */
        function calcCommissionPure(type, amount, commissionSettings) {
            if (type === "bank_withdraw") {
                const rate = parseFloat(commissionSettings?.bankWithdrawRate) || 0.002;
                const comm = Math.round(amount * rate * 100) / 100;
                return { commission: comm, total: Math.round((amount + comm) * 100) / 100 };
            }
            if (type === "fawri_withdraw") {
                const rate  = parseFloat(commissionSettings?.fawriWithdrawRate)  || 0.0057;
                const fixed = parseFloat(commissionSettings?.fawriWithdrawFixed) || 15;
                const comm  = Math.round((amount * rate + fixed) * 100) / 100;
                return { commission: comm, total: Math.round((amount + comm) * 100) / 100 };
            }
            return { commission: 0, total: amount };
        }

        /** حساب delta الرصيد عند إضافة/حذف عملية */
        function calcSourceDelta(txnType, amount, reverse = false) {
            const isOutgoing = ["transfer","bank_withdraw","fawri_withdraw",
                                "fawri_transfer","internal_transfer"].includes(txnType);
            const delta = isOutgoing ? -amount : amount;
            return reverse ? -delta : delta;
        }

        /** بناء updater وظيفي لتحديث رصيد المصدر */
        function buildSourceUpdater(sourceId, txnType, amount, reverse = false) {
            const isOutgoing = ["transfer","bank_withdraw","fawri_withdraw",
                                "fawri_transfer","internal_transfer"].includes(txnType);
            const delta = isOutgoing ? -amount : amount;
            const sign  = reverse ? -1 : 1;
            return prev => prev.map(item => {
                if (item.id !== sourceId) return item;
                return {
                    ...item,
                    usedTodayTransfer: Math.max(0,(item.usedTodayTransfer||0) + sign*(isOutgoing ? amount : 0)),
                    usedMonthTransfer: Math.max(0,(item.usedMonthTransfer||0) + sign*(isOutgoing ? amount : 0)),
                    usedTodayReceive:  Math.max(0,(item.usedTodayReceive||0)  + sign*(txnType==="receive" ? amount : 0)),
                    usedMonthReceive:  Math.max(0,(item.usedMonthReceive||0)  + sign*(txnType==="receive" ? amount : 0)),
                    balance: (item.balance||0) + sign*delta,
                };
            });
        }

        /** الـ updater الذي يطبّق buildSourceUpdater على الـ setState الصح */
        function applySourceUpdate(txn, amount, setLines, setVisas, setInstaPays, reverse = false) {
            const updater = buildSourceUpdater(txn.sourceId, txn.type, amount, reverse);
            if (txn.sourceType === "line")      setLines(updater);
            else if (txn.sourceType === "visa") setVisas(updater);
            else                                setInstaPays(updater);
        }

        /** إحصائيات اليومية السريعة للـ Dashboard */
        function calcDailyStats(transactions, financeLogs, commissionSettings) {
            const todayStr = today();
            const todayTxns = transactions.filter(t => (t.date||"").startsWith(todayStr));
            const fawriRate  = commissionSettings?.fawriWithdrawRate  ?? 0.0057;
            const fawriFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
            const bankRate   = commissionSettings?.bankWithdrawRate   ?? 0.002;
            return {
                todayTxns,
                totalIn:    todayTxns.filter(t=>t.type==="transfer").reduce((s,t)=>s+t.amount,0),
                totalOut:   todayTxns.filter(t=>t.type==="receive").reduce((s,t)=>s+t.amount,0),
                bankComm:   todayTxns.filter(t=>t.type==="bank_withdraw").reduce((s,t)=>s+(t.amount*bankRate),0),
                fawriComm:  todayTxns.filter(t=>t.type==="fawri_withdraw").reduce((s,t)=>s+(t.amount*fawriRate+fawriFixed),0),
                count:      todayTxns.length,
            };
        }

        /** رصيد العميل (مجموع الديون - المدفوعات) */
        function getPersonBalancePure(person) {
            const moves = person.moves || [];
            const debit  = moves.filter(m=>m.type==="debit") .reduce((s,m)=>s+(m.amount||0),0);
            const credit = moves.filter(m=>m.type==="credit").reduce((s,m)=>s+(m.amount||0),0);
            return debit - credit;
        }

        // ══════════════════════════════════════════════════════════════
        //  📊  PERFORMANCE HELPERS — تحليل أداء المساعدين (pure)
        // ══════════════════════════════════════════════════════════════

        /** بناء لوحة أداء المساعدين من سجل العمليات */
        function calcPerformanceBoard(transactions) {
            const board = {};
            for (const t of transactions) {
                const name = t.addedBy || "غير محدد";
                if (!board[name]) {
                    board[name] = { name, count: 0, reversed: 0, totalMs: 0, timeSamples: 0 };
                }
                board[name].count++;
                if (t.reversed) board[name].reversed++;
                if (t.addedAt && t.createdAt) {
                    // وقت الإدخال = الفرق بين وقت فتح المودال ووقت الحفظ (بالثواني)
                    const ms = new Date(t.addedAt) - new Date(t.createdAt);
                    if (ms > 0 && ms < 600000) { // بين 0 و10 دقايق
                        board[name].totalMs += ms;
                        board[name].timeSamples++;
                    }
                }
            }
            return Object.values(board)
                .map(b => ({
                    ...b,
                    avgSec: b.timeSamples > 0 ? Math.round(b.totalMs / b.timeSamples / 1000) : null,
                    efficiency: b.count > 0 ? Math.round(((b.count - b.reversed) / b.count) * 100) : 100
                }))
                .sort((a, b) => b.count - a.count);
        }

        // ══════════════════════════════════════════════════════════════
        //  🔮  FORECASTING HELPERS — التنبؤ المالي (pure)
        // ══════════════════════════════════════════════════════════════

        /** تحليل نمط 7 أيام وتوقع احتياج السيولة لليوم القادم */
        function calcLiquidityForecast(transactions, sources) {
            const days = 7;
            const results = [];

            // نبني array للـ 7 أيام الماضية
            const dayData = [];
            for (let i = days - 1; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().slice(0, 10);
                const dayTxns = transactions.filter(t => (t.date || "").startsWith(dateStr));
                const outflow = dayTxns
                    .filter(t => ["transfer","bank_withdraw","fawri_withdraw","fawri_transfer","internal_transfer"].includes(t.type))
                    .reduce((s, t) => s + (t.totalAmount || t.amount || 0), 0);
                dayData.push({ dateStr, outflow, count: dayTxns.length });
            }

            const avgOutflow = dayData.length > 0
                ? dayData.reduce((s, d) => s + d.outflow, 0) / dayData.length
                : 0;

            // توقع الغد = متوسط + 10% buffer
            const tomorrowForecast = Math.round(avgOutflow * 1.1);

            // تحليل كل مصدر — هل رصيده يكفي الغد؟
            const sourceAlerts = sources
                .filter(s => s.available !== false && s.type === "line")
                .map(s => {
                    const bal = s.balance || 0;
                    const avgDaily = dayData.reduce((sum, d) => {
                        const dayOut = transactions
                            .filter(t => (t.date || "").startsWith(d.dateStr) && t.sourceId === s.id)
                            .reduce((ss, t) => ss + (t.totalAmount || t.amount || 0), 0);
                        return sum + dayOut;
                    }, 0) / Math.max(dayData.filter(d => d.count > 0).length, 1);

                    const daysLeft = avgDaily > 0 ? Math.floor(bal / avgDaily) : 99;
                    return { ...s, avgDaily: Math.round(avgDaily), daysLeft, willRunOut: daysLeft <= 1 };
                })
                .filter(s => s.willRunOut);

            // اتجاه آخر 3 أيام vs 4 أيام قبلها
            const recent3  = dayData.slice(-3).reduce((s, d) => s + d.outflow, 0) / 3;
            const before4  = dayData.slice(0, 4).reduce((s, d) => s + d.outflow, 0) / 4;
            const trend    = before4 > 0 ? Math.round(((recent3 - before4) / before4) * 100) : 0;

            return {
                tomorrowForecast,
                avgOutflow: Math.round(avgOutflow),
                trend,          // % تغير الاتجاه (موجب = زيادة)
                sourceAlerts,   // خطوط ستنفد غداً
                dayData,
            };
        }

        // ══════════════════════════════════════════════════════════════
        //  🧠  الرادار الذكي — Smart Insights Engine (pure, rule-based)
        // ══════════════════════════════════════════════════════════════
        /** يحلل حالة اليوم ويطلع أهم 3-5 ملاحظات/توصيات ذكية مرتبة بالأولوية */
        function generateSmartInsights({ todayTxns, warningSources, alertSources, oldDebtors, totalDebt, netMonthProfit, liquidityForecast, performanceBoard, capital }) {
            const insights = [];

            // 🚨 أولوية قصوى: خطوط وصلت الحد أو هتنفد غداً
            if (alertSources && alertSources.length > 0) {
                insights.push({ level: "critical", icon: "🚨", text: `${alertSources.length} خط وصل لحد السحب/الاستلام الشهري — يحتاج تدخل فوري` });
            }
            if (liquidityForecast?.sourceAlerts?.length > 0) {
                insights.push({ level: "critical", icon: "⛽", text: `${liquidityForecast.sourceAlerts.length} خط متوقع ينفد غداً بناءً على معدل الاستهلاك الحالي` });
            }
            // ⚠️ تحذيرات متوسطة
            if (warningSources && warningSources.length > 0) {
                insights.push({ level: "warning", icon: "⚠️", text: `${warningSources.length} خط اقترب من الحد اليومي (80%+) — راقبه خلال الساعات الجايه` });
            }
            if (oldDebtors && oldDebtors.length > 0) {
                const topDebtor = oldDebtors[0];
                insights.push({ level: "warning", icon: "🕐", text: `${oldDebtors.length} عميل متأخر في السداد أكتر من 3 أيام، أكبرهم دين "${topDebtor.personName}"` });
            }
            // 📈 اتجاه السيولة
            if (liquidityForecast) {
                if (liquidityForecast.trend >= 15) {
                    insights.push({ level: "info", icon: "📈", text: `الطلب على السحب في ارتفاع (+${liquidityForecast.trend}%) — جهّز سيولة إضافية` });
                } else if (liquidityForecast.trend <= -15) {
                    insights.push({ level: "positive", icon: "📉", text: `السحب في انخفاض (${liquidityForecast.trend}%) مقارنة بالمتوسط — استقرار جيد` });
                }
            }
            // 🏆 أفضل أداء
            if (performanceBoard && performanceBoard.length > 0) {
                const top = performanceBoard[0];
                if (top.count >= 3) {
                    insights.push({ level: "positive", icon: "🏆", text: `"${top.name}" الأكثر نشاطاً اليوم بكفاءة ${top.efficiency}%` });
                }
            }
            // 💰 صافي الشهر
            if (typeof netMonthProfit === "number") {
                if (netMonthProfit > 0) {
                    insights.push({ level: "positive", icon: "💰", text: `صافي ربح الشهر إيجابي حتى الآن — استمر على نفس الوتيرة` });
                } else if (netMonthProfit < 0) {
                    insights.push({ level: "warning", icon: "📉", text: `المصاريف تجاوزت الدخل هذا الشهر — راجع بنود الصرف` });
                }
            }
            // 🌙 لا نشاط
            if (todayTxns && todayTxns.length === 0) {
                insights.push({ level: "info", icon: "🌙", text: `لسه مفيش عمليات النهاردة — ابدأ أول عملية` });
            }
            // ✅ كل حاجة تمام
            if (insights.length === 0) {
                insights.push({ level: "positive", icon: "✅", text: `كل المؤشرات مستقرة، مفيش تنبيهات حرجة دلوقتي` });
            }

            // ترتيب حسب الأولوية
            const order = { critical: 0, warning: 1, info: 2, positive: 3 };
            insights.sort((a, b) => order[a.level] - order[b.level]);
            return insights.slice(0, 5);
        }

        /** مقارنة الشهر الحالي بالشهر اللي فات — نمو/تراجع الأرباح والنشاط */
        function calcMonthComparison(transactions, financeLogs) {
            function monthStr(offset) {
                const d = new Date();
                d.setMonth(d.getMonth() + offset);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
            }
            const curM = monthStr(0), prevM = monthStr(-1);
            function statsFor(m) {
                const logs = financeLogs.filter(l => (l.monthDate || (l.date ? String(l.date).slice(0,7) : null)) === m);
                const income  = logs.filter(l => l.type === "income").reduce((s,l)=>s+l.amount,0);
                const expense = logs.filter(l => l.type === "expense").reduce((s,l)=>s+l.amount,0);
                const txns = transactions.filter(t => (t.date||"").startsWith(m));
                return { income, expense, net: income - expense, count: txns.length };
            }
            const cur = statsFor(curM), prev = statsFor(prevM);
            const netChangePct = prev.net !== 0 ? Math.round(((cur.net - prev.net) / Math.abs(prev.net)) * 100) : (cur.net > 0 ? 100 : 0);
            const countChangePct = prev.count !== 0 ? Math.round(((cur.count - prev.count) / prev.count) * 100) : (cur.count > 0 ? 100 : 0);
            return { cur, prev, netChangePct, countChangePct };
        }

        /** رصيد العميل (مجموع الديون - المدفوعات) */
        function calcDebtAge(person) {
            // أقدم دين غير مسدد بالأيام
            const moves = person.moves || [];
            const debitMoves = moves
                .filter(m => m.type === "debit")
                .sort((a, b) => new Date(a.date) - new Date(b.date));
            if (!debitMoves.length) return 0;
            const oldest = new Date(debitMoves[0].date);
            const now    = new Date();
            return Math.floor((now - oldest) / (1000 * 60 * 60 * 24));
        }

        /** IndexedDB wrapper بسيط لتخزين الصور وأي بيانات كبيرة */
        const IDB = (() => {
            const DB_NAME = "HawkerCashDB";
            const STORE   = "images";
            let _db = null;

            function open() {
                if (_db) return Promise.resolve(_db);
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, 1);
                    req.onupgradeneeded = e => {
                        e.target.result.createObjectStore(STORE);
                    };
                    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
                    req.onerror   = () => reject(req.error);
                });
            }

            return {
                async set(key, value) {
                    const db = await open();
                    return new Promise((res, rej) => {
                        const tx = db.transaction(STORE, "readwrite");
                        tx.objectStore(STORE).put(value, key);
                        tx.oncomplete = () => res(true);
                        tx.onerror    = () => rej(tx.error);
                    });
                },
                async get(key) {
                    const db = await open();
                    return new Promise((res, rej) => {
                        const tx  = db.transaction(STORE, "readonly");
                        const req = tx.objectStore(STORE).get(key);
                        req.onsuccess = () => res(req.result || null);
                        req.onerror   = () => rej(req.error);
                    });
                },
                async delete(key) {
                    const db = await open();
                    return new Promise((res, rej) => {
                        const tx = db.transaction(STORE, "readwrite");
                        tx.objectStore(STORE).delete(key);
                        tx.oncomplete = () => res(true);
                        tx.onerror    = () => rej(tx.error);
                    });
                },
                async keys() {
                    const db = await open();
                    return new Promise((res, rej) => {
                        const tx  = db.transaction(STORE, "readonly");
                        const req = tx.objectStore(STORE).getAllKeys();
                        req.onsuccess = () => res(req.result || []);
                        req.onerror   = () => rej(req.error);
                    });
                },
                /** تنظيف الصور القديمة غير المرتبطة بأي عملية */
                async cleanup(usedKeys) {
                    const all = await this.keys();
                    const used = new Set(usedKeys);
                    for (const k of all) {
                        if (!used.has(k)) await this.delete(k);
                    }
                }
            };
        })();

        /** حفظ صورة في IndexedDB وإرجاع مفتاحها */
        async function saveImageToIDB(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async ev => {
                    try {
                        const key = `img_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
                        await IDB.set(key, ev.target.result);
                        resolve(key);
                    } catch(e) { reject(e); }
                };
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        /** جلب صورة من IndexedDB أو fallback على localStorage/_memStore */
        async function getImageFromIDB(imageRef) {
            if (!imageRef) return null;
            if (imageRef.startsWith("http") || imageRef.startsWith("data:")) return imageRef;
            // جرب IDB أولاً
            try {
                const v = await IDB.get(imageRef);
                if (v) return v;
            } catch(e) {}
            // fallback على localStorage (للصور القديمة)
            try { const v = localStorage.getItem(imageRef); if (v) return v; } catch(e) {}
            return _memStore[imageRef] || null;
        }

        // ── مكون مستقل: SVG Bar Chart ─────────────────────────────────
        function SvgBarChart({ data, valueKey, gradient, id, labelColor, mounted, tooltip, setTooltip }) {
            const W = 320, H = 140, padL = 38, padB = 28, padT = 12, padR = 8;
            const chartW = W - padL - padR;
            const chartH = H - padT - padB;
            const maxVal = Math.max(...data.map(d => d[valueKey] || 0), 1);
            const barW   = Math.floor(chartW / data.length) - 4;
            const barGap = chartW / data.length;
            const ySteps = [0, 0.25, 0.5, 0.75, 1];
            const fmtY = (v) => {
                if (v >= 1000000) return (v / 1000000).toFixed(1) + "م";
                if (v >= 1000) return Math.round(v / 1000) + "ك";
                return String(Math.round(v));
            };
            return (
                <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", overflow: "visible" }}>
                    <defs>
                        <linearGradient id={id} x1="0" y1="1" x2="0" y2="0">
                            {gradient.map((g, i) => (
                                <stop key={i} offset={g.offset} stopColor={g.color} stopOpacity={g.opacity || 1} />
                            ))}
                        </linearGradient>
                        <linearGradient id={`${id}-dim`} x1="0" y1="1" x2="0" y2="0">
                            {gradient.map((g, i) => (
                                <stop key={i} offset={g.offset} stopColor={g.color} stopOpacity={(g.opacity || 1) * 0.25} />
                            ))}
                        </linearGradient>
                    </defs>
                    {ySteps.map((s, i) => {
                        const y = padT + chartH - s * chartH;
                        return (
                            <g key={i}>
                                <line x1={padL} y1={y} x2={W - padR} y2={y}
                                    stroke={s === 0 ? "#1e3a5f" : "#1a2235"} strokeWidth={s === 0 ? 1.5 : 0.8} />
                                {i > 0 && (
                                    <text x={padL - 4} y={y + 3.5} textAnchor="end"
                                        fontSize="7.5" fill="#3d4f65" fontFamily="Tajawal,sans-serif">
                                        {fmtY(maxVal * s)}
                                    </text>
                                )}
                            </g>
                        );
                    })}
                    {data.map((d, i) => {
                        const val = d[valueKey] || 0;
                        const pct = val / maxVal;
                        const bH  = Math.max(pct * chartH, val > 0 ? 3 : 0);
                        const x   = padL + i * barGap + (barGap - barW) / 2;
                        const y   = padT + chartH - bH;
                        const isHov = tooltip && tooltip.idx === i && tooltip.chartId === id;
                        return (
                            <g key={i}
                                onMouseEnter={() => setTooltip({ idx: i, chartId: id, label: d.full, value: val })}
                                onMouseLeave={() => setTooltip(null)}
                                onTouchStart={() => setTooltip({ idx: i, chartId: id, label: d.full, value: val })}
                                style={{ cursor: "pointer" }}>
                                <rect x={x} y={padT} width={barW} height={chartH}
                                    fill={isHov ? "#ffffff08" : "transparent"} rx="3" />
                                <rect x={x} y={y} width={barW} height={bH}
                                    fill={val > 0 ? `url(#${id})` : `url(#${id}-dim)`}
                                    rx="3" opacity={isHov ? 1 : 0.85}
                                    style={{ transition: mounted ? `height 0.6s cubic-bezier(0.34,1.56,0.64,1) ${i * 0.06}s` : "none" }} />
                                {val > 0 && (
                                    <circle cx={x + barW / 2} cy={y} r="2.5"
                                        fill={gradient[1].color}
                                        filter={`drop-shadow(0 0 3px ${gradient[1].color})`}
                                        opacity={isHov ? 1 : 0.7} />
                                )}
                                <text x={x + barW / 2} y={H - 6} textAnchor="middle"
                                    fontSize="8" fill={isHov ? labelColor : "#3d4f65"}
                                    fontFamily="Tajawal,sans-serif" fontWeight={isHov ? "700" : "400"}>
                                    {d.label}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

        // ── مكون مستقل: SVG Line Chart ───────────────────────────────
        function SvgLineChart({ data, valueKey, gradient, id, labelColor, mounted, tooltip, setTooltip }) {
            const W = 320, H = 130, padL = 38, padB = 28, padT = 16, padR = 8;
            const chartW = W - padL - padR;
            const chartH = H - padT - padB;
            const maxVal = Math.max(...data.map(d => d[valueKey] || 0), 1);
            const ySteps = [0, 0.25, 0.5, 0.75, 1];
            const fmtY = (v) => {
                if (v >= 1000000) return (v / 1000000).toFixed(1) + "م";
                if (v >= 1000) return Math.round(v / 1000) + "ك";
                return String(Math.round(v));
            };
            const pts = data.map((d, i) => ({
                x: padL + (i / Math.max(data.length - 1, 1)) * chartW,
                y: padT + chartH - ((d[valueKey] || 0) / maxVal) * chartH,
                d, i
            }));
            const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
            const areaPath = pts.length > 0
                ? `${linePath} L ${pts[pts.length - 1].x} ${padT + chartH} L ${pts[0].x} ${padT + chartH} Z`
                : "";
            return (
                <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", overflow: "visible" }}>
                    <defs>
                        <linearGradient id={id} x1="0" y1="1" x2="0" y2="0">
                            {gradient.map((g, i) => (
                                <stop key={i} offset={g.offset} stopColor={g.color} stopOpacity={g.opacity || 1} />
                            ))}
                        </linearGradient>
                        <linearGradient id={`${id}-area`} x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor={gradient[1].color} stopOpacity="0.25" />
                            <stop offset="100%" stopColor={gradient[1].color} stopOpacity="0.02" />
                        </linearGradient>
                        <clipPath id={`${id}-clip`}>
                            <rect x={padL} y={padT} width={chartW} height={chartH} />
                        </clipPath>
                    </defs>
                    {ySteps.map((s, i) => {
                        const y = padT + chartH - s * chartH;
                        return (
                            <g key={i}>
                                <line x1={padL} y1={y} x2={W - padR} y2={y}
                                    stroke={s === 0 ? "#1e3a5f" : "#1a2235"} strokeWidth={s === 0 ? 1.5 : 0.8} />
                                {i > 0 && (
                                    <text x={padL - 4} y={y + 3.5} textAnchor="end"
                                        fontSize="7.5" fill="#3d4f65" fontFamily="Tajawal,sans-serif">
                                        {fmtY(maxVal * s)}
                                    </text>
                                )}
                            </g>
                        );
                    })}
                    <path d={areaPath} fill={`url(#${id}-area)`} clipPath={`url(#${id}-clip)`}
                        style={{ transition: mounted ? "opacity 0.8s ease" : "none", opacity: mounted ? 1 : 0 }} />
                    <path d={linePath} fill="none" stroke={`url(#${id})`} strokeWidth="2.5"
                        strokeLinecap="round" strokeLinejoin="round" clipPath={`url(#${id}-clip)`} />
                    {pts.map((p, i) => {
                        const isHov = tooltip && tooltip.idx === i && tooltip.chartId === id;
                        return (
                            <g key={i}
                                onMouseEnter={() => setTooltip({ idx: i, chartId: id, label: p.d.full, value: p.d[valueKey] || 0 })}
                                onMouseLeave={() => setTooltip(null)}
                                onTouchStart={() => setTooltip({ idx: i, chartId: id, label: p.d.full, value: p.d[valueKey] || 0 })}
                                style={{ cursor: "pointer" }}>
                                <circle cx={p.x} cy={p.y} r="12" fill="transparent" />
                                <circle cx={p.x} cy={p.y} r={isHov ? 5 : 3}
                                    fill={gradient[1].color} stroke="#05070f" strokeWidth="1.5"
                                    filter={isHov ? `drop-shadow(0 0 5px ${gradient[1].color})` : "none"} />
                                <text x={p.x} y={H - 6} textAnchor="middle"
                                    fontSize="8" fill={isHov ? labelColor : "#3d4f65"}
                                    fontFamily="Tajawal,sans-serif" fontWeight={isHov ? "700" : "400"}>
                                    {p.d.label}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

        // ══════════════════════════════════════════════════════════════
        //  🖨️  Thermal Receipt — نظام الفواتير الحرارية
        // ══════════════════════════════════════════════════════════════

        // ── QR Code generator (pure JS → SVG, بدون مكتبات) ──────────
        // نستخدم خوارزمية بسيطة تولد matrix 25×25 من نص مشفر
        function generateQRMatrix(text) {
            // Simple deterministic pseudo-QR using hash-based pattern
            const size = 25;
            const mat  = Array.from({length:size}, ()=>Array(size).fill(0));
            // Finder patterns (ركن أعلى يسار)
            const fp = (r, c) => {
                for (let i=0;i<7;i++) for (let j=0;j<7;j++) {
                    const border = i===0||i===6||j===0||j===6;
                    const inner  = i>=2&&i<=4&&j>=2&&j<=4;
                    mat[r+i][c+j] = (border||inner) ? 1 : 0;
                }
            };
            fp(0,0); fp(0,size-7); fp(size-7,0);
            // Separators
            for (let i=0;i<8;i++){mat[7][i]=0;mat[i][7]=0;mat[7][size-1-i]=0;mat[i][size-8]=0;mat[size-8][i]=0;mat[size-1-i][7]=0;}
            // Timing patterns
            for (let i=8;i<size-8;i++){mat[6][i]=i%2===0?1:0;mat[i][6]=i%2===0?1:0;}
            // Dark module
            mat[size-8][8]=1;
            // Data area — fill with hash of text
            let h = 5381;
            for (let i=0;i<text.length;i++) h=((h<<5)+h)+text.charCodeAt(i);
            let bit = 0;
            for (let r=0;r<size;r++) for (let c=0;c<size;c++) {
                if (mat[r][c]===0) {
                    h = ((h*1664525)+1013904223)>>>0;
                    mat[r][c] = (h>>>bit)&1 ? 1 : 0;
                    bit = (bit+1)%32;
                }
            }
            return mat;
        }

        function QRCodeSVG({ text, size = 120 }) {
            const mat  = generateQRMatrix(text);
            const n    = mat.length;
            const cell = size / n;
            const rects = [];
            for (let r=0;r<n;r++) for (let c=0;c<n;c++) {
                if (mat[r][c]) rects.push(<rect key={`${r}-${c}`} x={c*cell} y={r*cell} width={cell} height={cell} fill="#000"/>);
            }
            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block",background:"#fff"}}>
                    {rects}
                </svg>
            );
        }

        // ── مكون الفاتورة الحرارية ────────────────────────────────────
        function ThermalReceiptModal({ txn, lines, visas, instaPays, formatNum, onClose }) {
            if (!txn) return null;

            const typeLabels = { transfer:"تحويل (سحب)", receive:"استلام (إيداع)", bank_withdraw:"سحب بنك", fawri_withdraw:"سحب فوري", fawri_transfer:"تحويل إلى فوري" };
            const typeLabel  = typeLabels[txn.type] || txn.type;
            const allSrcs    = [...(lines||[]), ...(visas||[]), ...(instaPays||[])];
            const srcName    = txn.sourceId ? (allSrcs.find(s=>s.id===txn.sourceId)?.name || txn.sourceId) : "—";
            const txnNum     = txn.id ? String(txn.id).slice(-6).toUpperCase() : "000000";
            const qrData     = `TXN:${txnNum}|AMT:${txn.amount}|DATE:${txn.date||""}|TYPE:${txn.type}`;

            function doPrint() {
                // نسخ محتوى الفاتورة إلى div مخصص للطباعة
                const printEl = document.getElementById("thermal-receipt-print");
                const srcEl   = document.getElementById("receipt-content-inner");
                if (printEl && srcEl) { printEl.innerHTML = srcEl.innerHTML; }
                if (navigator.vibrate) navigator.vibrate(15);
                window.print();
            }

            // ══ Bluetooth Thermal Print (Web Bluetooth API) ══
            async function doBluetooth() {
                if (!navigator.bluetooth) {
                    alert("المتصفح مش بيدعم Bluetooth — جرب Chrome على أندرويد");
                    return;
                }
                try {
                    const device = await navigator.bluetooth.requestDevice({
                        filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }],
                        optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
                    });
                    const server = await device.gatt.connect();
                    const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                    const char = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                    // ESC/POS commands للطباعة الحرارية
                    const srcEl = document.getElementById("receipt-content-inner");
                    const text = srcEl ? srcEl.innerText : "فاتورة";

                    await char.writeValue(encoder.encode(text + "\n\n\n"));
                    await char.writeValue(cutCmd);
                    alert("✅ تم الإرسال للطابعة!");

        // ══════════════════════════════════════════════════════════════
        //  ⌘  Command Palette 2090 — أوامر سريعة بالبحث
        // ══════════════════════════════════════════════════════════════
        function CommandPalette({ actions, onClose }) {
            const [q, setQ] = useState("");
            const [activeIdx, setActiveIdx] = useState(0);
            const inputRef = useRef(null);

            useEffect(() => {
                setTimeout(() => inputRef.current?.focus(), 30);
            }, []);

            const filtered = React.useMemo(() => {
                const query = q.trim().toLowerCase();
                if (!query) return actions;
                return actions.filter(a =>
                    a.label.toLowerCase().includes(query) ||
                    (a.keywords || "").toLowerCase().includes(query)
                );
            }, [q, actions]);

            useEffect(() => { setActiveIdx(0); }, [q]);

            function runAction(a) {
                if (!a) return;
                onClose();
                setTimeout(() => a.run(), 10);
            }

            function handleKeyDown(e) {
                if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx(i => Math.min(i + 1, filtered.length - 1)); }
                else if (e.key === "ArrowUp") { e.preventDefault(); setActiveIdx(i => Math.max(i - 1, 0)); }
                else if (e.key === "Enter") { e.preventDefault(); runAction(filtered[activeIdx]); }
                else if (e.key === "Escape") { onClose(); }
            }

            return (
                <div onClick={onClose} style={{
                    position:"fixed", inset:0, background:"rgba(3,3,8,0.75)", backdropFilter:"blur(6px)",
                    zIndex:9998, display:"flex", alignItems:"flex-start", justifyContent:"center", paddingTop:"12vh"
                }}>
                    <div onClick={e => e.stopPropagation()} style={{
                        width:"min(92vw,480px)", background:"linear-gradient(135deg,#0a0a18,#0d0d20)",
                        border:"1px solid #00f0ff40", borderRadius:16, boxShadow:"0 20px 60px rgba(0,240,255,0.15)",
                        overflow:"hidden", direction:"rtl"
                    }}>
                        <div style={{display:"flex",alignItems:"center",gap:8,padding:"14px 16px",borderBottom:"1px solid #1f2a4a"}}>
                            <span style={{fontSize:16,color:"#00f0ff"}}>⌘</span>
                            <input
                                ref={inputRef}
                                value={q}
                                onChange={e => setQ(e.target.value)}
                                onKeyDown={handleKeyDown}
                                placeholder="اكتب أمر أو ابحث عن أي حاجة..."
                                style={{
                                    flex:1, background:"transparent", border:"none", outline:"none",
                                    color:"#e8f6ff", fontSize:15, fontFamily:"'Tajawal',sans-serif"
                                }}
                            />
                            <span className="neon2090-badge">2090</span>
                        </div>
                        <div style={{maxHeight:"50vh",overflowY:"auto",padding:8}}>
                            {filtered.length === 0 && (
                                <div style={{padding:20,textAlign:"center",color:"#45527a",fontSize:13}}>مفيش نتائج مطابقة</div>
                            )}
                            {filtered.map((a, i) => (
                                <div key={a.id} onClick={() => runAction(a)} onMouseEnter={() => setActiveIdx(i)}
                                    style={{
                                        display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:10,
                                        cursor:"pointer", marginBottom:2,
                                        background: activeIdx === i ? "linear-gradient(135deg,#00f0ff15,#c86bff15)" : "transparent",
                                        border: activeIdx === i ? "1px solid #00f0ff30" : "1px solid transparent"
                                    }}>
                                    <span style={{fontSize:16}}>{a.icon}</span>
                                    <span style={{flex:1,fontSize:13,color:"#e8f6ff",fontWeight:600}}>{a.label}</span>
                                    {a.hint && <span style={{fontSize:10,color:"#45527a"}}>{a.hint}</span>}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        //  🔒  PIN Lock Screen 2090
        // ══════════════════════════════════════════════════════════════
        function PinLockScreen({ hasPin, onUnlock }) {
            const [pin, setPin] = useState("");
            const [error, setError] = useState(false);

            function press(d) {
                if (pin.length >= 6) return;
                const next = pin + d;
                setPin(next);
                setError(false);
                if (next.length >= 4) {
                    setTimeout(() => {
                        if (verifyAppPin(next)) {
                            logAudit("unlock_success", "فتح التطبيق بنجاح");
                            onUnlock();
                        } else if (next.length >= 6) {
                            setError(true);
                            logAudit("unlock_failed", "محاولة فتح فاشلة");
                            setTimeout(() => setPin(""), 400);
                        }
                    }, 80);
                }
            }
            function del() { setPin(p => p.slice(0, -1)); setError(false); }

            if (!hasPin) {
                return (
                    <div style={{minHeight:"100vh",background:"#05070f",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Tajawal',sans-serif",direction:"rtl"}}>

                            🔓 فتح التطبيق
                        </button>
                    </div>
                );
            }

            return (
                <div style={{minHeight:"100vh",background:"radial-gradient(ellipse 700px 500px at 50% 0%, rgba(0,240,255,0.10), transparent 60%), #05070f",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Tajawal',sans-serif",direction:"rtl"}}>
                    <div style={{fontSize:48,marginBottom:10}}>🔐</div>
                    <div style={{fontSize:18,fontWeight:800,color:"#e8f6ff",marginBottom:4}}>مقفول بـ PIN الأمان</div>
                    <div style={{fontSize:12,color:"#64748b",marginBottom:24}}>ادخل الرقم السري للمتابعة</div>
                    <div style={{display:"flex",gap:10,marginBottom:28}}>
                        {[0,1,2,3,4,5].map(i => (
                            <div key={i} style={{
                                width:14,height:14,borderRadius:99,
                                background: i < pin.length ? (error ? "#ef4444" : "#00f0ff") : "#1a2235",
                                border: "1px solid " + (i < pin.length ? (error ? "#ef4444" : "#00f0ff") : "#1a2235"),
                                transition:"all 0.15s"
                            }}/>
                        ))}
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(3,64px)",gap:14}}>
                        {["1","2","3","4","5","6","7","8","9","del","0","ok"].map((d,i) => {
                            if (d === "del") return (
                                <button key={i} onClick={del} style={{width:64,height:64,borderRadius:99,background:"#0d1120",border:"1px solid #1a2235",color:"#7a8fa8",fontSize:18,cursor:"pointer"}}>⌫</button>
                            );
                            if (d === "ok") return <div key={i}/>;
                            return (
                                <button key={i} onClick={() => press(d)} style={{width:64,height:64,borderRadius:99,background:"#0d1120",border:"1px solid #1a2235",color:"#e8f6ff",fontSize:22,fontWeight:700,cursor:"pointer"}}>{d}</button>
