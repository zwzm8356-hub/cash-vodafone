                                        value={smartPaste}
                                        onChange={(e) => setSmartPaste(e.target.value)}
                                        placeholder="ضع نص رسالة فودافون كاش أو إنستا باي هنا..."
                                        rows="2"
                                        style={{
                                            flex: 1,
                                            background: "#0a0f1e",
                                            border: "1px solid #1e3a5f",
                                            borderRadius: 10,
                                            padding: 10,
                                            color: "#e2e8f0",
                                            fontSize: 13,
                                            outline: "none",
                                            resize: "none",
                                            textAlign: "right",
                                            fontFamily: "'Tajawal', sans-serif"
                                        }}
                                    />
                                    <button
                                        onClick={handleSmartPaste}
                                        style={{
                                            background: "linear-gradient(135deg,#22d3ee,#0891b2)",
                                            border: "none",
                                            borderRadius: 10,
                                            padding: "0 15px",
                                            color: "#0a0f1e",
                                            fontSize: 14,
                                            fontWeight: "bold",
                                            cursor: "pointer"
                                        }}
                                    >
                                        تطبيق
                                    </button>
                                </div>
                            </div>

                            {/* 2. باقي حقول الفورم */}
                            <Field label="نوع العملية">
                                <select
                                    value={form.txnType || "person"}
                                    onChange={e => setForm({...form, txnType: e.target.value})}
                                    style={{ width: "100%", background: "#0f1e3d", border: "1px solid #1e3a5f", borderRadius: 10, padding: 11, color: "#e2e8f0" }}
                                >
                                    <option value="person">💸 تحويل لشخص</option>
                                    <option value="bank">🏦 سحب لبنك (خصم 1%)</option>
                                    <option value="fawry">⚡ سحب فوري (0.57% + 15 ج)</option>
                                    <option value="receive">📥 استلام (إيداع في المحفظة)</option>
                                </select>
                            </Field>
                            {/* معاينة الخصم */}
                            {form.amount && (form.txnType === "bank" || form.txnType === "fawry") && (() => {
                                const amt = evaluateExpression(form.amount);
                                const fee = form.txnType === "bank" ? calcBankFee(amt) : calcFawryFee(amt);
                                return amt > 0 ? (
                                    <div style={{background: form.txnType==="bank" ? "#3b82f610" : "#f59e0b10", border:`1px solid ${form.txnType==="bank"?"#3b82f630":"#f59e0b30"}`, borderRadius:10, padding:10, marginBottom:14, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                                        <span style={{fontSize:12, color:"#94a3b8"}}>الخصم التلقائي</span>
                                        <span style={{fontSize:15, fontWeight:800, color: form.txnType==="bank"?"#3b82f6":"#f59e0b"}}>- {formatNum(fee)} ج</span>
                                    </div>
                                ) : null;
                            })()}

                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                                <Field label="التاريخ"><Input type="date" value={form.date} onChange={v => setForm({...form, date: v})}/></Field>
                                <Field label="الوقت"><Input type="time" value={form.time} onChange={v => setForm({...form, time: v})}/></Field>
                            </div>

                            <Field label="المبلغ (ج)">
                                <input
                                    type="text"
                                    value={form.amount || ""}
                                    placeholder="0.00 (يمكنك كتابة حسبة مثل 1000+20)"
                                    onChange={(e) => setForm({...form, amount: e.target.value})}
                                    onBlur={(e) => {
                                        const val = e.target.value.trim();
                                        if (!val) return;
                                        const evaluated = evaluateExpression(val);
                                        const num = parseFloat(evaluated);
                                        if (!isNaN(num) && isFinite(num) && num > 0) {
                                            setForm({...form, amount: String(Math.round(num * 100) / 100)});
                                        }
                                    }}
                                    style={{
                                        width: "100%",
                                        background: "#0f1e3d",
                                        border: "1px solid #1e3a5f",
                                        borderRadius: 10,
                                        padding: "11px 14px",
                                        color: "#e2e8f0",
                                        fontSize: 14,
                                        outline: "none",
                                        boxSizing: "border-box",
                                        textAlign: "right"
                                    }}
                                />
                            </Field>

                            <Field label="اسم العميل">
                                <Input value={form.personName} onChange={v => setForm({...form, personName: v})} placeholder="اسم الشخص أو العميل"/>
                            </Field>

                            {(form.txnType === "person" || !form.txnType) && (
                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                                    <Field label="من رقم المحفظة"><Input value={form.fromNumber} onChange={v => setForm({...form, fromNumber: v})} placeholder="01xxxxxxxxx"/></Field>
                                    <Field label="إلى رقم المحفظة"><Input value={form.toNumber} onChange={v => setForm({...form, toNumber: v})} placeholder="01xxxxxxxxx"/></Field>
                                </div>
                            )}
                            {form.txnType === "bank" && (
                                <Field label="رقم الحساب البنكي (اختياري)"><Input value={form.toNumber} onChange={v => setForm({...form, toNumber: v})} placeholder="رقم الحساب أو IBAN"/></Field>
                            )}

                            <Field label="اختر الخط أو الفيزا">
                                <select
                                    value={form.sourceId}
                                    onChange={e => {
                                        const sel = sources.find(s => s.id === e.target.value);
                                        setForm({...form, sourceId: e.target.value, sourceType: sel ? sel.type : "line"});
                                    }}
                                    style={{ width: "100%", background: "#0f1e3d", border: "1px solid #1e3a5f", borderRadius: 10, padding: 11, color: "#e2e8f0" }}
                                >
                                    <option value="">-- اختر خط العملية --</option>
                                    {sources.map(s => {
                                        const typeLabel = s.visaType==="insta" ? " 🏧إنستا" : s.visaType==="fawry" ? " ⚡فوري" : "";
                                        return <option key={s.id} value={s.id}>{s.name}{typeLabel} (رصيده: {formatNum(s.balance || 0)} ج)</option>;
                                    })}
                                </select>
                            </Field>

                            <button
                                onClick={addTransaction}
                                style={{
                                    width: "100%",
                                    background: "linear-gradient(135deg,#e40000,#cc0000)",
                                    border: "none",
                                    borderRadius: 12,
                                    padding: 14,
                                    color: "#fff",
                                    fontSize: 15,
                                    fontWeight: 700,
                                    cursor: "pointer",
                                    marginTop: 10,
                                    boxShadow: "0 4px 15px #e4000030"
                                }}
                            >
                                ✓ حفظ العملية وتحديث الأرصدة
                            </button>
                        </Modal>
                    )}

                    {/* MODAL: Viewer Note */}
                    {viewerNote && (
                        <Modal title="📝 ملاحظة" onClose={()=>setViewerNote(null)}>
                            <Field label="اكتب ملاحظتك">
                                <textarea
                                    value={viewerNote.text}
                                    onChange={e=>setViewerNote(v=>({...v, text: e.target.value}))}
                                    rows={4}
                                    style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:10,padding:"11px 14px",color:"#e2e8f0",fontSize:14,outline:"none",boxSizing:"border-box",textAlign:"right",resize:"vertical",fontFamily:"'Tajawal', sans-serif"}}
                                />
                            </Field>
                            <button onClick={()=>{
                                setTransactions(prev=>prev.map(t=>t.id===viewerNote.txnId?{...t,notes:viewerNote.text}:t));
                                setViewerNote(null);
                                showToast("تم حفظ الملاحظة ✓");
                            }} style={{width:"100%",background:"linear-gradient(135deg,#22d3ee,#0891b2)",border:"none",borderRadius:12,padding:14,color:"#0a0f1e",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                        </Modal>
                    )}

                    {/* MODAL: Add Debt / Open Session */}
                    {modal==="addDebt" && (
                        <Modal title="➕ فتح حساب جديد" onClose={()=>setModal(null)}>
                            <Field label="اسم العميل"><Input value={peopleForm.personName} onChange={v=>setPeopleForm(f=>({...f,personName:v}))} placeholder="اسم العميل..."/></Field>
                            <Field label="المبلغ (ج)"><Input value={peopleForm.debtAmount} onChange={v=>setPeopleForm(f=>({...f,debtAmount:v}))} placeholder="0" type="number"/></Field>
                            <Field label="وصف الحساب (اختياري)"><Input value={peopleForm.desc} onChange={v=>setPeopleForm(f=>({...f,desc:v}))} placeholder="مثال: تحويل يوم الخميس..."/></Field>
                            {peopleForm.personName && peopleForm.debtAmount && (() => {
                                const person = people.find(p=>p.personName.toLowerCase()===peopleForm.personName.toLowerCase().trim());
                                const rate = person ? getPersonCommission(person) : 10;
                                const amt = parseFloat(peopleForm.debtAmount)||0;
                                const comm = Math.round((amt/1000)*rate);
                                return amt > 0 ? (
                                    <div style={{background:"#22d3ee10",border:"1px solid #22d3ee20",borderRadius:8,padding:10,marginBottom:10,display:"flex",justifyContent:"space-between",fontSize:12}}>
                                        <span style={{color:"#64748b"}}>العمولة المتوقعة ({rate} ج/الف)</span>
                                        <span style={{color:"#22d3ee",fontWeight:700}}>{formatNum(comm)} ج</span>
                                    </div>
                                ) : null;
                            })()}
                            <button onClick={addDebtToPerson} style={{width:"100%",background:"linear-gradient(135deg,#a78bfa,#9370db)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ فتح الحساب</button>
                        </Modal>
                    )}

                    {/* MODAL: Add Finance */}
                    {modal==="addFinance" && (
                        <Modal title={`عملية مالية ${financeTab === "daily" ? "يومية" : "شهرية"}`} onClose={()=>setModal(null)}>
                            <Field label="النوع">
                                <select value={financeForm.type} onChange={e=>setFinanceForm(f=>({...f, type: e.target.value}))}
                                    style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:10,padding:"11px 14px",color:"#e2e8f0",fontSize:14,outline:"none"}}>
                                    <option value="income">مكسب</option>
                                    <option value="expense">مصاريف</option>
                                </select>
                            </Field>
                            <Field label="المبلغ"><Input value={financeForm.amount} onChange={v=>setFinanceForm(f=>({...f, amount: v}))} placeholder="0" type="number"/></Field>
                            <Field label="الوصف"><Input value={financeForm.desc} onChange={v=>setFinanceForm(f=>({...f, desc: v}))} placeholder="..."/></Field>
                            <button onClick={addFinanceLog} style={{width:"100%",background: financeForm.type === "income" ? "linear-gradient(135deg,#10b981,#059669)" : "linear-gradient(135deg,#ef4444,#dc2626)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                        </Modal>
                    )}

                    {/* MODAL: Edit Capital */}
                    {modal==="editCapital" && (
                        <Modal title="تعديل رأس المال" onClose={()=>setModal(null)}>
                            <Field label="المبلغ"><Input value={capitalInput} onChange={setCapitalInput} placeholder="0" type="number"/></Field>
                            <button onClick={updateCapitalDirectly} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#2563eb)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                        </Modal>
                    )}

                    {/* MODAL: Commission */}
                    {commissionModal && (
                        <Modal title="تعديل عمولة العميل" onClose={()=>setCommissionModal(null)}>
                            <CommissionModalBody
                                commissionModal={commissionModal}
                                people={people}
                                updatePersonCommission={updatePersonCommission}
                                formatNum={formatNum}
                            />
                        </Modal>
                    )}

                    {/* MODAL: Fee (Bank/Fawry) */}
                    {feeModal && (
                        <Modal title={feeModal.type==="bank" ? "🏦 خصم البنك" : "⚡ خصم فوري"} onClose={()=>setFeeModal(null)}>
                            <Field label="المبلغ الأصلي (ج)">
                                <Input value={feeForm.amount} onChange={v=>setFeeForm(f=>({...f,amount:v}))} placeholder="مثال: 15000" type="number"/>
                            </Field>
                            {feeModal.type==="bank" && feeForm.amount && (
                                <div style={{background:"#3b82f610",border:"1px solid #3b82f620",borderRadius:8,padding:10,marginBottom:10,fontSize:12,color:"#3b82f6"}}>
                                    1% تقريباً = {formatNum(Math.round(parseFloat(feeForm.amount||0)*0.01))} ج
                                </div>
                            )}
                            <Field label="المبلغ المخصوم فعلاً (ج)">
                                <Input value={feeForm.fee} onChange={v=>setFeeForm(f=>({...f,fee:v}))} placeholder={feeModal.type==="bank"?"مثال: 150":"مثال: 85"} type="number"/>
                            </Field>
                            <button onClick={addFeeLog}
                                style={{width:"100%",background:feeModal.type==="bank"?"linear-gradient(135deg,#3b82f6,#2563eb)":"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>
                                ✓ تسجيل الخصم من المالية
                            </button>
                        </Modal>
                    )}

                    {/* MODAL: Edit Entry (debt or payment) */}
                    {editEntryModal && (
                        <EditEntryModal
                            entry={editEntryModal}
                            onSave={saveEditEntry}
                            onClose={()=>setEditEntryModal(null)}
                            formatNum={formatNum}
                        />
                    )}

                    {/* MODAL: Edit Line */}
                    {modal==="editLine" && editLineId && (
                        <EditSourceModal
                            source={[...lines,...visas].find(s=>s.id===editLineId)}
                            isVisa={editLineId.startsWith("visa")}
                            onSave={updated=>{
                                if (editLineId.startsWith("visa")) {
                                    setVisas(prev => {
                                        const newVisas = prev.map(v=>v.id===editLineId?{...v,...updated}:v);
                                        persistSources(lines, newVisas);
                                        return newVisas;
                                    });
                                } else {
                                    setLines(prev => {
                                        const newLines = prev.map(l=>l.id===editLineId?{...l,...updated}:l);
                                        persistSources(newLines, visas);
                                        return newLines;
                                    });
                                }
                                setModal(null); showToast("تم التحديث ✓");
                            }}
                            onClose={()=>setModal(null)}
                        />
                    )}
                </div>
            );
        }

        // ✅ Modal تعديل دين أو دفعة
        function EditEntryModal({ entry, onSave, onClose, formatNum }) {
            const [amount, setAmount] = React.useState(String(entry.amount));
            const [date, setDate] = React.useState(entry.date ? entry.date.split(" ")[0] : "");
            const [time, setTime] = React.useState(entry.date ? (entry.date.split(" ")[1]||"") : "");
            const isDebt = entry.type === "debt";
            return (
                <Modal title={isDebt ? "✏️ تعديل الدين" : "✏️ تعديل الدفعة"} onClose={onClose}>
                    <Field label="المبلغ (ج)">
                        <Input value={amount} onChange={setAmount} placeholder="0" type="number"/>
                    </Field>
                    <Field label="التاريخ">
                        <input type="date" value={date} onChange={e=>setDate(e.target.value)}
                            style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:10,padding:"11px 14px",color:"#e2e8f0",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
                    </Field>
                    <Field label="الوقت">
                        <input type="time" value={time} onChange={e=>setTime(e.target.value)}
                            style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:10,padding:"11px 14px",color:"#e2e8f0",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
                    </Field>
                    <div style={{background:"#0f1e3d",borderRadius:10,padding:10,marginBottom:14,display:"flex",justifyContent:"space-between",fontSize:12}}>
                        <span style={{color:"#64748b"}}>كان</span>
                        <span style={{color: isDebt?"#ef4444":"#10b981",fontWeight:700}}>{formatNum(entry.amount)} ج</span>
                    </div>
                    <button onClick={()=>onSave({
                        ...entry,
                        newAmount: parseFloat(amount)||0,
                        newDate: date && time ? `${date} ${time}` : date ? `${date} 00:00` : entry.date
                    })} style={{width:"100%",background: isDebt?"linear-gradient(135deg,#ef4444,#dc2626)":"linear-gradient(135deg,#10b981,#059669)",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>
                        ✓ حفظ التعديل
                    </button>
                </Modal>
            );
        }

        // ✅ إصلاح: CommissionModalBody كـ component منفصل عشان useState يشتغل صح
        function CommissionModalBody({ commissionModal, people, updatePersonCommission, formatNum }) {
            const [rate, setRate] = React.useState(String(commissionModal.current || 10));
            return (
                <>
                    <Field label="العمولة لكل ألف جنيه (ج)">
                        <Input value={rate} onChange={setRate} placeholder="10" type="number"/>
                    </Field>
                    <div style={{background:"#0f1e3d",borderRadius:10,padding:12,marginBottom:14,textAlign:"center"}}>
                        <div style={{fontSize:11,color:"#64748b",marginBottom:4}}>مثال: على 10,000 ج</div>
                        <div style={{fontSize:18,fontWeight:800,color:"#22d3ee"}}>{formatNum(Math.round((10000/1000)*(parseFloat(rate)||0)))} ج عمولة</div>
                    </div>
                    <button onClick={()=>updatePersonCommission(commissionModal.personId, rate)}
                        style={{width:"100%",background:"linear-gradient(135deg,#22d3ee,#0891b2)",border:"none",borderRadius:12,padding:14,color:"#0a0f1e",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                </>
            );
        }

        function PaymentInput({onPay}) {
            const [val, setVal] = React.useState("");
            return (
                <div style={{display:"flex",gap:8}}>
                    <input type="number" value={val} onChange={e=>setVal(e.target.value)}
                        placeholder="مبلغ الدفعة"
                        style={{flex:1,background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:10,padding:"10px 12px",color:"#e2e8f0",fontSize:13,outline:"none",textAlign:"right"}}/>
                    <button onClick={()=>{if(val){onPay(val);setVal("");}}}
                        style={{background:"linear-gradient(135deg,#10b981,#059669)",border:"none",borderRadius:10,padding:"10px 16px",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                        ✓ دفع
                    </button>
                </div>
            );
        }

        function QuickPayRow({onPay}) {
            const [val, setVal] = React.useState("");
            return (
                <div style={{display:"flex",gap:6}}>
                    <input type="number" value={val} onChange={e=>setVal(e.target.value)}
                        placeholder="دفع سريع..."
                        style={{flex:1,background:"#0a0f1e",border:"1px solid #a78bfa40",borderRadius:8,padding:"7px 10px",color:"#e2e8f0",fontSize:12,outline:"none",textAlign:"right"}}/>
                    <button onClick={()=>{if(val){onPay(val);setVal("");}}}
                        style={{background:"linear-gradient(135deg,#10b981,#059669)",border:"none",borderRadius:8,padding:"7px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                        💰 دفع
                    </button>
                </div>
            );
        }

        function Modal({title, onClose, children}) {
            return (
                <div style={{position:"fixed",inset:0,background:"#000a",zIndex:200,display:"flex",alignItems:"flex-end"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
                    <div style={{background:"#0a1628",borderRadius:"20px 20px 0 0",border:"1px solid #1e3a5f",padding:20,width:"100%",maxHeight:"90vh",overflowY:"auto"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                            <div style={{fontSize:17,fontWeight:700,color:"#e2e8f0"}}>{title}</div>
                            <button onClick={onClose} style={{background:"#1e293b",border:"none",borderRadius:8,width:32,height:32,color:"#94a3b8",cursor:"pointer",fontSize:16}}>×</button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        }

        function Field({label, children}) {
            return <div style={{marginBottom:14}}><div style={{fontSize:12,color:"#64748b",marginBottom:6,fontWeight:600}}>{label}</div>{children}</div>;
        }

        function Input({value, onChange, placeholder, type="text"}) {
            return <input type={type} value={value} placeholder={placeholder} onChange={e=>onChange(e.target.value)} style={{width:"100%",background:"#0f1e3d",border:"1px solid #1e3a5f",borderRadius:10,padding:"11px 14px",color:"#e2e8f0",fontSize:14,outline:"none",boxSizing:"border-box",textAlign:"right"}}/>;
        }

        function EditSourceModal({source, isVisa, onSave, onClose}) {
            const [name, setName] = useState(source.name);
            const [number, setNumber] = useState(source.number||"");
            const [balance, setBalance] = useState(String(source.balance || 0));
            return (
                <Modal title="تعديل" onClose={onClose}>
                    <Field label="الاسم"><Input value={name} onChange={setName} placeholder="..."/></Field>
                    <Field label="الرقم"><Input value={number} onChange={setNumber} placeholder="01xxxxxxxxx"/></Field>
                    <Field label="الرصيد الحالي (ج)"><Input value={balance} onChange={setBalance} placeholder="0" type="number"/></Field>
                    <button onClick={()=>onSave({name,number,balance:parseFloat(balance)||0})} style={{width:"100%",background:"linear-gradient(135deg,#22d3ee,#0891b2)",border:"none",borderRadius:12,padding:14,color:"#0a0f1e",fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ حفظ</button>
                </Modal>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
