                                        </button>
                                        <button onClick={()=>setAdjustForm(f=>({...f,target:"receive",amount:""}))}
                                            style={{flex:1,background:adjustForm.target==="receive"?"linear-gradient(135deg,#10b981,#059669)":"#1e293b",border:"none",borderRadius:10,padding:"9px 0",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                                            ⬆️ استلام شهري
                                        </button>
                                    </div>
                                </div>

                                {/* الرقم الحالي */}
                                <div style={{background:"#0a0f1e",borderRadius:10,padding:"10px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                    <span style={{fontSize:12,color:"#64748b"}}>الرقم الحالي في التطبيق</span>
                                    <span style={{fontSize:15,fontWeight:700,color:"#94a3b8"}}>{formatNum(curVal)} ج</span>
                                </div>

                                {/* الرقم الصح */}
                                <div style={{marginBottom:12}}>
                                    <div style={{fontSize:12,color:"#94a3b8",marginBottom:6}}>اكتب الرقم الصح (من تطبيق فودافون)</div>
                                    <input type="number" value={adjustForm.amount}
                                        onChange={e=>setAdjustForm(f=>({...f,amount:e.target.value}))}
                                        placeholder={`مثال: ${Math.round(curVal * 0.9)}`}
                                        style={{width:"100%",background:"#0d1120",border:"1px solid #a78bfa50",borderRadius:10,padding:"10px 12px",color:"#e2e8f0",fontSize:16,outline:"none",fontFamily:"'Tajawal',sans-serif",direction:"ltr",textAlign:"right",boxSizing:"border-box",fontWeight:700}}/>
                                </div>

                                {/* معاينة الفرق */}
                                {diff !== null && (
                                    <div style={{background: diff<0?"#ef444415":"#10b98115", border:`1px solid ${diff<0?"#ef444430":"#10b98130"}`, borderRadius:10,padding:"8px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                        <span style={{fontSize:12,color:"#94a3b8"}}>الفرق اللي هيتسجل</span>
                                        <span style={{fontSize:14,fontWeight:700,color:diff<0?"#ef4444":"#10b981"}}>{diff>0?"+":""}{formatNum(diff)} ج</span>
                                    </div>
                                )}

                                <div style={{display:"flex",gap:8}}>
                                    <button onClick={()=>setAdjustModal(null)} style={{flex:1,background:"#1e293b",border:"none",borderRadius:10,padding:11,color:"#94a3b8",fontSize:13,fontWeight:700,cursor:"pointer"}}>إلغاء</button>
                                    <button onClick={()=>{
                                        if (diff === null || diff === 0) { showToast("اكتب رقم مختلف عن الحالي", "error"); return; }
                                        setAdjustForm(f=>({...f, amount: String(diff)}));
                                        setTimeout(submitMonthlyAdjustment, 0);
                                    }} style={{flex:2,background:"linear-gradient(135deg,#a78bfa,#7c3aed)",border:"none",borderRadius:10,padding:11,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>✓ تظبيط</button>
                                </div>
                            </div>
                        </div>
                        );
                    })()}

                    {modal==="editLine" && editLineId && (
                        <EditSourceModal
                            source={[...lines,...visas,...instaPays].find(s=>s.id===editLineId)}
                            isVisa={editLineId.startsWith("visa")}
                            onSave={updated=>{
                                if (editLineId.startsWith("visa")) {
                                    const newVisas = visas.map(v=>v.id===editLineId?{...v,...updated}:v);
                                    setVisas(newVisas);
                                    if (auth.currentUser) safeFirebaseSet(db, 'visas', newVisas);
                                } else if (editLineId.startsWith("instapay")) {
                                    const newIPs = instaPays.map(v=>v.id===editLineId?{...v,...updated}:v);
                                    setInstaPays(newIPs);
                                    if (auth.currentUser) safeFirebaseSet(db, 'instapays', newIPs);
                                } else {
                                    const newLines = lines.map(l=>l.id===editLineId?{...l,...updated}:l);
                                    setLines(newLines);
                                    // ⭐ إصلاح: نكتب التعديل في Firebase فوراً عشان مايترجعش للقديم
                                    if (auth.currentUser) safeFirebaseSet(db, 'lines', newLines);
                                }
                                setModal(null); showToast("تم التحديث ✓");
                            }}
                            onClose={()=>setModal(null)}
                        />
                    )}

                    {/* 🖨️ MODAL: Thermal Receipt */}
                    {activeReceipt && (
                        <ThermalReceiptModal
                            txn={activeReceipt}
                            lines={lines}
                            visas={visas}
                            instaPays={instaPays}
                            formatNum={formatNum}
                            onClose={()=>setActiveReceipt(null)}
                        />
                    )}

                    {/* 📝 سجل النشاط 2090 */}
                    {showAuditLog && (
                        <AuditLogModal onClose={() => setShowAuditLog(false)} />
                    )}

                    {/* ⌘ Command Palette 2090 */}
                    {showCommandPalette && (
                        <CommandPalette
                            onClose={() => setShowCommandPalette(false)}
                            actions={[
                                { id:"tab-dashboard", icon:"🏠", label:"الذهاب للرئيسية", keywords:"dashboard home", run:()=>setTab("dashboard") },
                                { id:"tab-transactions", icon:"📋", label:"الذهاب لسجل العمليات", keywords:"transactions", run:()=>setTab("transactions") },
                                { id:"tab-people", icon:"👥", label:"الذهاب للعملاء", keywords:"people customers", run:()=>setTab("people") },
                                { id:"tab-lines", icon:"📱", label:"الذهاب للخطوط", keywords:"lines", run:()=>setTab("lines") },
                                ...(isAdmin ? [{ id:"tab-finance", icon:"💰", label:"الذهاب للمالية", keywords:"finance", run:()=>setTab("finance") }] : []),
                                ...(isAdmin ? [{ id:"tab-personal-ledger", icon:"🧾", label:"الذهاب لحساباتي الشخصية", keywords:"personal ledger حساباتي فلوسي", run:()=>setTab("personalLedger") }] : []),
                                { id:"tab-abuadi", icon:"📒", label:"الذهاب لدفتر أبو عدي", keywords:"abuadi", run:()=>setTab("abuadi") },
                                { id:"tab-ai", icon:"🤖", label:"الذهاب للمساعد الذكي", keywords:"ai chat", run:()=>setTab("ai") },
                                ...(isAdmin ? [{ id:"tab-jard", icon:"📦", label:"الذهاب للجرد", keywords:"jard inventory", run:()=>setTab("jard") }] : []),
                                { id:"tab-settings", icon:"⚙️", label:"الذهاب للإعدادات", keywords:"settings", run:()=>setTab("settings") },
                                ...(canAddTxn ? [{ id:"quick-add", icon:"⚡", label:"إضافة عملية سريعة", keywords:"add new transaction", hint:"سريع", run:()=>setShowQuickAdd(true) }] : []),
                                { id:"global-search", icon:"🔍", label:"بحث شامل", keywords:"search find", run:()=>setShowGlobalSearch(true) },
                                { id:"daily-close", icon:"🌙", label:"نهاية اليوم", keywords:"daily close", run:()=>setShowDailyClose(true) },
                                { id:"toggle-privacy", icon: privacyMode ? "🙈" : "👁️", label: privacyMode ? "إظهار الأرقام (إيقاف وضع الشارع)" : "إخفاء الأرقام (وضع الشارع)", keywords:"privacy street mode hide", run:()=>setPrivacyMode(v=>!v) },
                                { id:"theme-dark", icon:"🌙", label:"تفعيل الوضع المظلم", keywords:"theme dark", run:()=>applyTheme("dark") },
                                { id:"theme-light", icon:"☀️", label:"تفعيل الوضع المضيء", keywords:"theme light", run:()=>applyTheme("light") },
                                { id:"theme-neon", icon:"🌌", label:"تفعيل وضع نيون 2090", keywords:"theme neon2090 future", run:()=>applyTheme("neon2090") },
                                { id:"refresh", icon:"🔄", label:"تحديث البيانات من Firebase", keywords:"refresh sync", run:()=>forceRefresh() },
                                { id:"audit-log", icon:"📝", label:"عرض سجل النشاط", keywords:"audit log history", run:()=>setShowAuditLog(true) },
                            ]}
                        />
                    )}

                    {/* ⭐ FEATURE MODALS */}
                    {showQuickAdd && canAddTxn && (
                        <QuickAddModal
                            sources={sources}
                            transactions={transactions}
                            people={people}
                            commissionSettings={commissionSettings}
                            showToast={showToast}
                            onClose={()=>setShowQuickAdd(false)}
                            onSave={(txnData)=>{
                                const newTxn = { ...txnData, id: generateUniqueId("txn") };
                                const updated = [newTxn, ...transactions];
                                setTransactions(updated);
                                saveToLocalStorage("transactions", updated);
                                try { db.ref("transactions").set(updated); } catch(e){}
                                showToast("✅ تم حفظ العملية السريعة");
                            }}
                        />
                    )}
                    {showGlobalSearch && (
                        <GlobalSearch
                            transactions={transactions}
                            people={people}
                            lines={lines}
                            visas={visas}
                            formatNum={formatNum}
                            getPersonBalance={getPersonBalance}
                            onClose={()=>setShowGlobalSearch(false)}
                        />
                    )}
                    {showDailyClose && (
                        <DailyClose
                            transactions={transactions}
                            financeLogs={financeLogs}
                            capital={capital}
                            lines={lines}
                            visas={visas}
                            people={people}
                            getPersonBalance={getPersonBalance}
                            formatNum={formatNum}
                            commissionSettings={commissionSettings}
                            onClose={()=>setShowDailyClose(false)}
                        />
                    )}

                    {showDailyReport && (
                        <DailyReport
                            transactions={transactions}
                            financeLogs={financeLogs}
                            capital={capital}
                            lines={lines}
                            visas={visas}
                            people={people}
                            getPersonBalance={getPersonBalance}
                            formatNum={formatNum}
                            commissionSettings={commissionSettings}
                            onClose={()=>setShowDailyReport(false)}
                        />
                    )}

                    {/* 🖨️ MODAL: AbuAdi Receipt */}
                    {activeAbuAdiReceipt && (
                        <AbuAdiReceiptModal
                            day={activeAbuAdiReceipt.day}
                            totalHistoryPaid={activeAbuAdiReceipt.totalHistoryPaid}
                            onClose={()=>setActiveAbuAdiReceipt(null)}
                        />
                    )}

                    {/* 🖨️ MODAL: Customer Receipt */}
                    {activeCustomerReceipt && (
                        <CustomerReceiptModal
                            person={activeCustomerReceipt}
                            getPersonBalance={getPersonBalance}
                            formatNum={formatNum}
                            onClose={()=>setActiveCustomerReceipt(null)}
                        />
                    )}

                    {/* Hidden print container */}
                    <div id="thermal-receipt-print" aria-hidden="true"/>

                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════
        // ⭐ حساباتي الشخصية (Personal Ledger)
        // مستقلة تمامًا عن حسابات العملاء/الجرد/المالية العامة.
        // كل حركة فيها linkedTxnId (حاليًا null دايمًا) — مجهّزة مستقبلًا لو
        // حبينا نربط عملية "قبضت من عميل" بحركة دخل هنا تلقائيًا، من غير
        // ما نغيّر سلوك سجل العمليات الحالي أو نكرّر المبالغ.
        // ══════════════════════════════════════════════════════════════
        function PersonalLedgerScreen({ entries, setEntries, openings, setOpenings, selectedDate, setSelectedDate, showToast, formatNum }) {
            function pad2(n){ return String(n).padStart(2,"0"); }
            function nowTimeStr(){ const d=new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
            function shiftDate(dateStr, days){
                const d = new Date(dateStr+"T00:00:00");
                d.setDate(d.getDate()+days);
                return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
            }
            function dayLabel(dateStr){
                const days=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
                try { const d = new Date(dateStr+"T00:00:00"); return `${days[d.getDay()]} ${dateStr}`; }
                catch(e){ return dateStr; }
            }

            const [form, setForm] = useState({ type:"expense", amount:"", desc:"", category:"", note:"", time: nowTimeStr() });
            const [editId, setEditId] = useState(null);
            const [openingInput, setOpeningInput] = useState("");
            const [showOpeningEdit, setShowOpeningEdit] = useState(false);
            const [reportMode, setReportMode] = useState("day"); // day | week | month

            const safeEntries = Array.isArray(entries) ? entries : [];
            const safeOpenings = openings || {};

            // ── إيجاد آخر رصيد ختامي قبل تاريخ معيّن (لو مفيش رصيد بداية محفوظ لليوم ده) ──
            function findPriorClosingBalance(dateStr){
                const allDates = new Set([...Object.keys(safeOpenings), ...safeEntries.map(e=>e.date)]);
                const priorDates = [...allDates].filter(d => d && d < dateStr).sort();
                if (!priorDates.length) return 0;
                const lastDate = priorDates[priorDates.length-1];
                const opening = safeOpenings[lastDate] !== undefined ? Number(safeOpenings[lastDate]) : findPriorClosingBalance(lastDate);
                const dayEntries = safeEntries.filter(e=>e.date===lastDate);
                const income = dayEntries.filter(e=>e.type==="income").reduce((s,e)=>s+Number(e.amount||0),0);
                const expense = dayEntries.filter(e=>e.type==="expense").reduce((s,e)=>s+Number(e.amount||0),0);
                return opening + income - expense;
            }

            const hasExplicitOpening = safeOpenings[selectedDate] !== undefined;
            const openingBalance = hasExplicitOpening ? Number(safeOpenings[selectedDate]) : findPriorClosingBalance(selectedDate);

            const dayEntries = safeEntries
                .filter(e=>e.date===selectedDate)
                .sort((a,b)=> (a.time||"").localeCompare(b.time||"") || String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
            const totalIncome  = dayEntries.filter(e=>e.type==="income").reduce((s,e)=>s+Number(e.amount||0),0);
            const totalExpense = dayEntries.filter(e=>e.type==="expense").reduce((s,e)=>s+Number(e.amount||0),0);
            const netChange = totalIncome - totalExpense;
            const currentBalance = openingBalance + netChange;

            function resetForm(){ setForm({ type:"expense", amount:"", desc:"", category:"", note:"", time: nowTimeStr() }); setEditId(null); }

            function saveEntry(){
                const amt = parseFloat(form.amount);
                if (!form.desc || !form.desc.trim()) { showToast("اكتب وصف الحركة", "error"); return; }
                if (!amt || isNaN(amt) || amt <= 0) { showToast("المبلغ لازم يكون رقم أكبر من صفر", "error"); return; }

                if (form.type === "expense") {
                    const otherEntries = dayEntries.filter(e => editId ? e.id !== editId : true);
                    const runningBefore = openingBalance + otherEntries.reduce((s,e)=> s + (e.type==="income"?Number(e.amount||0):-Number(e.amount||0)), 0);
                    if (runningBefore - amt < 0) {
                        showToast("⚠️ المصروف ده هيخلي رصيدك سالب — اتسجل على أي حال", "info");
                    }
                }

                if (editId) {
                    setEntries(prev => prev.map(e => e.id===editId ? { ...e, type:form.type, amount:amt, desc:form.desc.trim(), category:(form.category||"").trim()||null, note:(form.note||"").trim(), time:form.time||nowTimeStr() } : e));
                    showToast("✅ تم تعديل الحركة");
                } else {
                    const newEntry = {
                        id: Date.now() + "_" + Math.random().toString(36).slice(2,7),
                        date: selectedDate,
                        time: form.time || nowTimeStr(),
                        type: form.type,
                        amount: amt,
                        desc: form.desc.trim(),
                        category: (form.category||"").trim() || null,
                        note: (form.note||"").trim(),
                        createdAt: new Date().toISOString(),
                        linkedTxnId: null,
                    };
                    setEntries(prev => [...(prev||[]), newEntry]);
                    showToast(form.type==="income" ? "✅ تم تسجيل الدخل" : "✅ تم تسجيل المصروف");
                }
                resetForm();
            }

            function startEdit(entry){
                setEditId(entry.id);
                setForm({ type: entry.type, amount: String(entry.amount), desc: entry.desc, category: entry.category||"", note: entry.note||"", time: entry.time||nowTimeStr() });
            }

            function deleteEntry(entry){
                if (window.confirm(`هل تريد حذف حركة "${entry.desc}" (${formatNum(entry.amount)} ج)؟`)) {
                    setEntries(prev => (prev||[]).filter(e=>e.id!==entry.id));
                    if (editId===entry.id) resetForm();
                    showToast("🗑️ تم حذف الحركة");
                }
            }

            function saveOpening(){
                const amt = parseFloat(openingInput);
                if (isNaN(amt) || amt < 0) { showToast("رصيد بداية اليوم لازم يكون رقم صحيح", "error"); return; }
                setOpenings(prev => ({ ...(prev||{}), [selectedDate]: amt }));
                setShowOpeningEdit(false);
                setOpeningInput("");
                showToast("✅ تم حفظ رصيد بداية اليوم");
            }

            // ── تقارير أسبوعية/شهرية بسيطة (نافذة متحركة تنتهي عند اليوم المختار) ──
            function rangeSummary(days){
                const endD = new Date(selectedDate+"T00:00:00");
                const startD = new Date(endD); startD.setDate(startD.getDate()-(days-1));
                const startStr = `${startD.getFullYear()}-${pad2(startD.getMonth()+1)}-${pad2(startD.getDate())}`;
                const rangeEntries = safeEntries.filter(e=> e.date >= startStr && e.date <= selectedDate);
                const inc = rangeEntries.filter(e=>e.type==="income").reduce((s,e)=>s+Number(e.amount||0),0);
                const exp = rangeEntries.filter(e=>e.type==="expense").reduce((s,e)=>s+Number(e.amount||0),0);
                return { startStr, inc, exp, net: inc-exp, count: rangeEntries.length };
            }
            const weekSummary  = rangeSummary(7);
            const monthSummary = rangeSummary(30);
            const activeRange = reportMode==="week" ? weekSummary : reportMode==="month" ? monthSummary : null;

            const inputStyle = {width:"100%",background:"var(--bg-input)",border:"1px solid var(--border-dim)",borderRadius:8,padding:"8px 10px",color:"var(--text-bright)",fontSize:13,boxSizing:"border-box"};
            const labelStyle = {fontSize:11,color:"#7a8fa8",marginBottom:4,display:"block",fontWeight:600};

            return (
                <div style={{padding:"0 2px 24px"}}>
                    {/* ── رأس الصفحة + التنقل بين الأيام ── */}
                    <div style={{background:"var(--bg-card)",border:"1px solid var(--border-dim)",borderRadius:14,padding:14,marginBottom:12}}>
                        <div style={{fontSize:15,fontWeight:700,color:"#22d3ee",marginBottom:10}}>🧾 حساباتي الشخصية</div>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                            <button onClick={()=>setSelectedDate(shiftDate(selectedDate,-1))} style={{background:"#1e293b",border:"none",borderRadius:8,padding:"8px 12px",color:"#fff",cursor:"pointer",fontSize:14}}>◀</button>
                            <div style={{flex:1,textAlign:"center"}}>
                                <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} style={{...inputStyle,textAlign:"center"}} />
                                <div style={{fontSize:11,color:"#7a8fa8",marginTop:4}}>{dayLabel(selectedDate)}</div>
                            </div>
                            <button onClick={()=>setSelectedDate(shiftDate(selectedDate,1))} style={{background:"#1e293b",border:"none",borderRadius:8,padding:"8px 12px",color:"#fff",cursor:"pointer",fontSize:14}}>▶</button>
                            {selectedDate!==today() && <button onClick={()=>setSelectedDate(today())} style={{background:"#22d3ee20",border:"1px solid #22d3ee40",borderRadius:8,padding:"8px 10px",color:"#22d3ee",cursor:"pointer",fontSize:11,fontWeight:700}}>النهاردة</button>}
                        </div>

                        {/* ── رصيد بداية اليوم ── */}
                        {!showOpeningEdit ? (
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--bg-input)",borderRadius:10,padding:"8px 12px"}}>
                                <div>
                                    <div style={{fontSize:10,color:"#7a8fa8"}}>رصيد بداية اليوم {hasExplicitOpening ? "" : "(محسوب تلقائيًا من الأمس)"}</div>
                                    <div style={{fontSize:15,fontWeight:700,color:"#c8d6e8"}}>{formatNum(openingBalance)} ج</div>
                                </div>
                                <button onClick={()=>{setOpeningInput(String(openingBalance)); setShowOpeningEdit(true);}} style={{background:"#a78bfa15",border:"1px solid #a78bfa30",borderRadius:8,padding:"6px 10px",color:"#a78bfa",cursor:"pointer",fontSize:11,fontWeight:700}}>✏️ تعديل</button>
                            </div>
                        ) : (
                            <div style={{display:"flex",gap:8,alignItems:"center"}}>
                                <input type="number" value={openingInput} onChange={e=>setOpeningInput(e.target.value)} placeholder="رصيد بداية اليوم" style={inputStyle} />
                                <button onClick={saveOpening} style={{background:"#22c55e20",border:"1px solid #22c55e40",borderRadius:8,padding:"8px 12px",color:"#22c55e",cursor:"pointer",fontSize:12,fontWeight:700,whiteSpace:"nowrap"}}>حفظ</button>
                                <button onClick={()=>setShowOpeningEdit(false)} style={{background:"#ef444420",border:"1px solid #ef444440",borderRadius:8,padding:"8px 12px",color:"#ef4444",cursor:"pointer",fontSize:12,whiteSpace:"nowrap"}}>إلغاء</button>
                            </div>
                        )}
                    </div>

                    {/* ── الملخص اليومي ── */}
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                        <div style={{background:"var(--bg-card)",border:"1px solid #22c55e30",borderRadius:12,padding:10}}>
                            <div style={{fontSize:10,color:"#7a8fa8"}}>💚 إجمالي الدخل</div>
                            <div style={{fontSize:16,fontWeight:700,color:"#22c55e"}}>{formatNum(totalIncome)} ج</div>
                        </div>
                        <div style={{background:"var(--bg-card)",border:"1px solid #ef444430",borderRadius:12,padding:10}}>
                            <div style={{fontSize:10,color:"#7a8fa8"}}>💸 إجمالي المصروفات</div>
                            <div style={{fontSize:16,fontWeight:700,color:"#ef4444"}}>{formatNum(totalExpense)} ج</div>
                        </div>
                        <div style={{background:"var(--bg-card)",border:"1px solid #3b82f630",borderRadius:12,padding:10}}>
                            <div style={{fontSize:10,color:"#7a8fa8"}}>📈 صافي الحركة</div>
                            <div style={{fontSize:16,fontWeight:700,color: netChange>=0?"#3b82f6":"#ef4444"}}>{netChange>=0?"+":""}{formatNum(netChange)} ج</div>
                        </div>
                        <div style={{background:"var(--bg-card)",border:"1px solid #22d3ee30",borderRadius:12,padding:10}}>
                            <div style={{fontSize:10,color:"#7a8fa8"}}>💰 الرصيد الحالي</div>
                            <div style={{fontSize:16,fontWeight:700,color: currentBalance>=0?"#22d3ee":"#ef4444"}}>{formatNum(currentBalance)} ج</div>
                        </div>
                    </div>

                    {/* ── تقارير أسبوعية / شهرية ── */}
                    <div style={{background:"var(--bg-card)",border:"1px solid var(--border-dim)",borderRadius:12,padding:10,marginBottom:12}}>
                        <div style={{display:"flex",gap:6,marginBottom: reportMode!=="day" ? 10 : 0}}>
                            <button onClick={()=>setReportMode("day")} style={{flex:1,background:reportMode==="day"?"linear-gradient(135deg,#3b82f6,#2563eb)":"#1e293b",border:"none",borderRadius:8,padding:8,color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>يوم</button>
                            <button onClick={()=>setReportMode("week")} style={{flex:1,background:reportMode==="week"?"linear-gradient(135deg,#3b82f6,#2563eb)":"#1e293b",border:"none",borderRadius:8,padding:8,color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>آخر 7 أيام</button>
                            <button onClick={()=>setReportMode("month")} style={{flex:1,background:reportMode==="month"?"linear-gradient(135deg,#3b82f6,#2563eb)":"#1e293b",border:"none",borderRadius:8,padding:8,color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>آخر 30 يوم</button>
                        </div>
                        {activeRange && (
                            <div style={{fontSize:12,color:"#c8d6e8",lineHeight:1.9}}>
                                <div>من {activeRange.startStr} إلى {selectedDate} — {activeRange.count} حركة</div>
                                <div>💚 دخل: <b style={{color:"#22c55e"}}>{formatNum(activeRange.inc)} ج</b> &nbsp;|&nbsp; 💸 مصروف: <b style={{color:"#ef4444"}}>{formatNum(activeRange.exp)} ج</b></div>
                                <div>📈 صافي: <b style={{color: activeRange.net>=0?"#3b82f6":"#ef4444"}}>{activeRange.net>=0?"+":""}{formatNum(activeRange.net)} ج</b></div>
                            </div>
                        )}
                    </div>

                    {/* ── فورم إضافة/تعديل حركة ── */}
                    <div style={{background:"var(--bg-card)",border:"1px solid var(--border-dim)",borderRadius:12,padding:12,marginBottom:12}}>
                        <div style={{fontSize:13,fontWeight:700,color:"#c8d6e8",marginBottom:10}}>{editId ? "✏️ تعديل حركة" : "➕ حركة جديدة"}</div>
                        <div style={{display:"flex",gap:8,marginBottom:10}}>
                            <button onClick={()=>setForm(f=>({...f,type:"income"}))} style={{flex:1,background: form.type==="income" ? "#22c55e25" : "#1e293b", border:`1px solid ${form.type==="income"?"#22c55e60":"transparent"}`, borderRadius:8,padding:10,color: form.type==="income"?"#22c55e":"#7a8fa8",cursor:"pointer",fontSize:13,fontWeight:700}}>💚 دخل</button>
                            <button onClick={()=>setForm(f=>({...f,type:"expense"}))} style={{flex:1,background: form.type==="expense" ? "#ef444425" : "#1e293b", border:`1px solid ${form.type==="expense"?"#ef444460":"transparent"}`, borderRadius:8,padding:10,color: form.type==="expense"?"#ef4444":"#7a8fa8",cursor:"pointer",fontSize:13,fontWeight:700}}>💸 مصروف</button>
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                            <div>
                                <label style={labelStyle}>المبلغ (ج)</label>
                                <input type="number" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="0" style={inputStyle} />
                            </div>
                            <div>
                                <label style={labelStyle}>الوقت</label>
                                <input type="time" value={form.time} onChange={e=>setForm(f=>({...f,time:e.target.value}))} style={inputStyle} />
                            </div>
                        </div>
                        <div style={{marginBottom:8}}>
                            <label style={labelStyle}>الوصف</label>
                            <input type="text" value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))} placeholder="مثال: كشري، مواصلات، قبضت من فلان..." style={inputStyle} />
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                            <div>
                                <label style={labelStyle}>التصنيف (اختياري)</label>
                                <input type="text" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} placeholder="أكل، مواصلات..." style={inputStyle} />
                            </div>
                            <div>
                                <label style={labelStyle}>ملاحظة (اختياري)</label>
                                <input type="text" value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="ملاحظة" style={inputStyle} />
                            </div>
                        </div>
                        <div style={{display:"flex",gap:8}}>
                            <button onClick={saveEntry} style={{flex:1,background:"linear-gradient(135deg,#3b82f6,#2563eb)",border:"none",borderRadius:10,padding:12,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>{editId ? "💾 حفظ التعديل" : "➕ إضافة الحركة"}</button>
                            {editId && <button onClick={resetForm} style={{background:"#ef444420",border:"1px solid #ef444440",borderRadius:10,padding:"12px 16px",color:"#ef4444",cursor:"pointer",fontSize:13,fontWeight:700}}>إلغاء</button>}
                        </div>
                    </div>

                    {/* ── قائمة حركات اليوم (Timeline) ── */}
                    <div style={{fontSize:13,fontWeight:700,color:"#c8d6e8",marginBottom:8}}>📋 حركات {dayLabel(selectedDate)} ({dayEntries.length})</div>
                    {dayEntries.length === 0 ? (
                        <div style={{textAlign:"center",padding:"24px 12px",color:"#7a8fa8",fontSize:13,background:"var(--bg-card)",borderRadius:12,border:"1px dashed var(--border-dim)"}}>لا توجد حركات في هذا اليوم بعد</div>
                    ) : (
                        dayEntries.map(entry => {
                            const isIncome = entry.type === "income";
                            const color = isIncome ? "#22c55e" : "#ef4444";
                            return (
                                <div key={entry.id} style={{background:"var(--bg-card)",border:`1px solid ${color}30`,borderRadius:12,padding:12,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                                    <div style={{display:"flex",alignItems:"center",gap:10,flex:1,minWidth:0}}>
                                        <div style={{fontSize:18}}>{isIncome ? "💚" : "💸"}</div>
                                        <div style={{minWidth:0}}>
                                            <div style={{fontSize:13,fontWeight:700,color:"#c8d6e8",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{entry.desc}</div>
                                            <div style={{fontSize:10,color:"#7a8fa8"}}>
                                                {entry.time || ""} {entry.category ? `· ${entry.category}` : ""}{entry.note ? ` · ${entry.note}` : ""}
                                            </div>
                                        </div>
                                    </div>
                                    <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                                        <div style={{fontSize:14,fontWeight:700,color}}>{isIncome?"+":"-"}{formatNum(entry.amount)}</div>
                                        <button onClick={()=>startEdit(entry)} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:14}}>✏️</button>
                                        <button onClick={()=>deleteEntry(entry)} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:14}}>🗑️</button>
                                    </div>
                                </div>
                            );
                        })
                    )}
                </div>
            );
        }

        function AbuAdiScreen({
            target, setTarget, targetInput, setTargetInput,
            amountInput, setAmountInput, payments, setPayments,
            editModal, setEditModal,
            mediaRecorderRef, audioChunksRef,
            recordingId, setRecordingId, recordingState, setRecordingState,
            pendingAudio, setPendingAudio,
            showToast, formatNum,
            abuadiDate, setAbuadiDate,
            history, setHistory,
            db, auth, firebaseReady,
            saveToLocalStorage,
            canEdit = false,
            isAdmin = false,
            setActiveAbuAdiReceipt = null
        }) {
            // ── حسابات اليوم الحالي ──────────────────────────────────
            // ⭐ إصلاح: نستخدم التوقيت المحلي (مش UTC) لتجنب اختفاء الدفعات بسبب فرق التوقيت
            function localDateStr(ts) {
                const d = ts ? new Date(ts) : new Date();
                const pad2 = n => String(n).padStart(2,"0");
                return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
            }
            const todayStr = localDateStr();
            const todayPayments = [...payments]
                .filter(p => localDateStr(p.ts) === todayStr)
                .sort((a, b) => b.ts - a.ts);
            const totalPaid = todayPayments.reduce((s, p) => s + p.amount, 0);
            const remaining = Math.max(0, target - totalPaid);
            const pct = target > 0 ? Math.min(100, (totalPaid / target) * 100) : 0;
            const settled = target > 0 && totalPaid >= target;

            // ── عرض السجل التاريخي ───────────────────────────────────
            const [showHistory, setShowHistory] = useState(false);
            const [historyDetailDate, setHistoryDetailDate] = useState(null); // dateStr لعرض التفاصيل
            const [dayNote, setDayNote] = useState(""); // ملاحظات اليوم قبل الأرشفة
            const [historyFilter, setHistoryFilter] = useState(""); // فلتر التاريخ YYYY-MM-DD
            // ✅ FIX v23: منع الضغط المزدوج على "تسجيل الدفعة"
            const [isAdding, setIsAdding] = useState(false);

            function nowMsStr() {
                const d = new Date();
                const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
                const dd = String(d.getDate()).padStart(2,"0");
                const mm = String(d.getMonth()+1).padStart(2,"0");
                const yy = d.getFullYear();
                const hh = String(d.getHours()).padStart(2,"0");
                const min = String(d.getMinutes()).padStart(2,"0");
                const ss = String(d.getSeconds()).padStart(2,"0");
                return `${days[d.getDay()]} ${dd}/${mm}/${yy} — ${hh}:${min}:${ss}`;
            }

            // ── دالة الأرشفة اليومية (تحفظ اليوم في السجل التاريخي) ──
            function archiveToday(onDone, noteOverride) {
                if (totalPaid === 0 && target === 0) {
                    showToast("لا توجد بيانات لأرشفتها اليوم", "error");
                    return;
                }
                // لا نؤرشف اليوم لو موجود بالفعل في السجل بنفس التاريخ
                const alreadyExists = (history || []).find(h => h.dateStr === todayStr);
                const record = {
                    dateStr: todayStr,
                    target,
                    totalPaid,
                    remaining: Math.max(0, target - totalPaid),
                    settled: target > 0 && totalPaid >= target,
                    paymentsCount: todayPayments.length,
                    note: (noteOverride !== undefined ? noteOverride : dayNote).trim(),
                    // نحفظ الدفعات بدون الـ audio لتوفير المساحة
                    payments: todayPayments.map(p => ({ id: p.id, amount: p.amount, label: p.label, ts: p.ts })),
                    archivedAt: new Date().toISOString(),
                };

                let newHistory;
                if (alreadyExists) {
                    // تحديث السجل الموجود
                    newHistory = (history || []).map(h => h.dateStr === todayStr ? record : h);
                } else {
                    newHistory = [record, ...(history || [])];
                }
                newHistory.sort((a, b) => String(b.dateStr || "").localeCompare(String(a.dateStr || "")));

                setHistory(newHistory);
                saveToLocalStorage('abuadiHistory', newHistory);

                // حفظ في Firebase تحت abuAdi_history/{dateStr}
                if (auth && auth.currentUser && db && firebaseReady) {
                    try {
                        db.ref(`abuAdi_history/${todayStr}`).set(record)
                            .then(() => { if (onDone) onDone(record); })
                            .catch(() => { if (onDone) onDone(record); });
                    } catch(e) { if (onDone) onDone(record); }
                } else {
                    if (onDone) onDone(record);
                }
            }

            // ── إنهاء اليوم: أرشفة ثم تصفير ─────────────────────────
            function closeDay() {
                if (!window.confirm(`هيتم أرشفة يوم ${todayStr} (هدف: ${formatNum(target)} ج | تم: ${formatNum(totalPaid)} ج) ثم تصفير اليوم. متأكد؟`)) return;
                const noteToSave = dayNote.trim();
                archiveToday(() => {
                    // تصفير دفعات اليوم فقط — الدفعات السابقة (لو موجودة) تفضل
                    setPayments(prev => prev.filter(p => localDateStr(p.ts) !== todayStr));
                    setTarget(0);
                    setTargetInput("");
                    setDayNote("");
                    if (setAbuadiDate) setAbuadiDate(todayStr);
                    showToast(`✅ تم أرشفة يوم ${todayStr} وتصفير الحساب`);
                }, noteToSave);
            }

            // ── تصفير اليوم بدون أرشفة (طلب صريح من الأدمن) ─────────
            function clearTodayNoArchive() {
                if (!window.confirm("هيتم مسح دفعات اليوم والمستهدف بدون أرشفة. متأكد؟")) return;
                setPayments(prev => prev.filter(p => localDateStr(p.ts) !== todayStr));
                setTarget(0);
                setTargetInput("");
                showToast("تم التصفير بدون أرشفة");
            }

            // ── حذف يوم من السجل التاريخي (أدمن فقط) ───────────────
            function deleteHistoryDay(dateStrToDelete) {
                if (!window.confirm(`هيتم حذف سجل يوم ${dateStrToDelete} نهائياً من الأرشيف. متأكد؟`)) return;
                const newHistory = (history || []).filter(h => h.dateStr !== dateStrToDelete);
                setHistory(newHistory);
                saveToLocalStorage('abuadiHistory', newHistory);
                if (auth && auth.currentUser && db && firebaseReady) {
                    try { db.ref(`abuAdi_history/${dateStrToDelete}`).remove(); } catch(e){}
                }
                if (historyDetailDate === dateStrToDelete) setHistoryDetailDate(null);
                showToast(`تم حذف سجل يوم ${dateStrToDelete} ✓`);
            }

            function startRecording() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast("المتصفح لا يدعم التسجيل الصوتي","error"); return;
                }
                navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
                    audioChunksRef.current = [];
                    const recorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = recorder;
                    recorder.ondataavailable = e => { if(e.data.size>0) audioChunksRef.current.push(e.data); };
                    recorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, {type:"audio/webm"});
                        const reader = new FileReader();
                        reader.onload = ev => {
                            setPendingAudio(ev.target.result);
                            setRecordingState("done");
                            stream.getTracks().forEach(t=>t.stop());
                        };
                        reader.readAsDataURL(blob);
                    };
                    recorder.start();
                    setRecordingState("recording");
                    showToast("🔴 جاري التسجيل...");
                }).catch(() => { showToast("لم يتم السماح بالمايك","error"); });
            }

            function stopRecording() {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
                    mediaRecorderRef.current.stop();
                }
            }

            function cancelRecording() {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
                    mediaRecorderRef.current.stop();
                }
                setRecordingState("idle");
                setPendingAudio(null);
                audioChunksRef.current = [];
            }

            function addPayment() {
                if (isAdding) return; // ✅ FIX v23: منع الضغط المزدوج
                const amt = parseFloat(amountInput);
                if (!amt || amt <= 0) { showToast("أدخل مبلغ صحيح","error"); return; }
                // ⭐ Haptic feedback — iOS
                if (navigator.vibrate) navigator.vibrate(15);
                setIsAdding(true); // ✅ قفل فوري لمنع الضغط المزدوج
                // ✅ FIX: generateUniqueId يضمن ID فريد حتى لو ضغطت 100 مرة في نفس الـ ms
                const uniqueId = generateUniqueId('pmt');
                const nowTs = Date.now();
                const newP = {
                    id: uniqueId,          // ✅ FIXED: كان Date.now() يسبب تكرار
                    amount: amt,
                    ts: nowTs,
                    label: nowMsStr(),
                    audio: pendingAudio || null,
                    createdAt: new Date().toISOString(), // ✅ timestamp بشري للـ debugging
                };
                // ✅ FIX: نستخدم functional update لضمان أحدث state (منع race condition)
                setPayments(prev => {
                    // ✅ Double-check: تأكد مفيش دفعة بنفس الـ ID (دفاع إضافي)
                    if (prev.some(p => p.id === uniqueId)) {
                        console.warn('Duplicate ID detected and prevented:', uniqueId);
                        return prev;
                    }
                    return [newP, ...prev];
                });
                setAmountInput("");
                setPendingAudio(null);
                setRecordingState("idle");
                showToast(`✓ تم تسجيل دفعة ${maskNum(amt, privacyMode)} ج`);
                // ✅ فك القفل بعد 800ms
                setTimeout(() => setIsAdding(false), 800);
            }

            function deletePayment(id) {
                setPayments(prev => prev.filter(p => p.id !== id));
                showToast("تم حذف الدفعة ✓");
            }

            function saveEdit() {
                if (!editModal) return;
                const newAmt = parseFloat(editModal.newAmount);
                if (!newAmt || newAmt <= 0) { showToast("أدخل مبلغ صحيح","error"); return; }
                setPayments(prev => prev.map(p => p.id === editModal.payment.id ? {...p, amount: newAmt} : p));
                setEditModal(null);
                showToast("تم التعديل ✓");
            }

            // ── مجاميع الأرشيف ───────────────────────────────────────
            const historyList = (history || []).filter(Boolean).slice().sort((a,b) => String(b.dateStr || "").localeCompare(String(a.dateStr || "")));
            const totalHistoryTarget = historyList.reduce((s,h) => s + (h.target||0), 0);
            const totalHistoryPaid   = historyList.reduce((s,h) => s + (h.totalPaid||0), 0);

            // ── إحصائيات آخر 7 أيام والشهر الحالي ──────────────────
            const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 6);
            const sevenDaysAgoStr = localDateStr(sevenDaysAgo);
            const currentMonthPrefix = todayStr.slice(0,7); // YYYY-MM
            const last7List   = historyList.filter(h => (h.dateStr || "") >= sevenDaysAgoStr);
            const thisMonthList = historyList.filter(h => String(h.dateStr || "").startsWith(currentMonthPrefix));
            const last7Paid     = last7List.reduce((s,h) => s + (h.totalPaid||0), 0);
            const last7Target   = last7List.reduce((s,h) => s + (h.target||0), 0);
            const monthPaid     = thisMonthList.reduce((s,h) => s + (h.totalPaid||0), 0);
            const monthTarget   = thisMonthList.reduce((s,h) => s + (h.target||0), 0);

            // ── الفلترة بالتاريخ ─────────────────────────────────────
            const filteredHistory = historyFilter
                ? historyList.filter(h => h.dateStr === historyFilter)
                : historyList;

            // ── يوم التفاصيل ─────────────────────────────────────────
            const detailDay = historyDetailDate ? historyList.find(h => h.dateStr === historyDetailDate) : null;

            // ── دالة تنسيق التاريخ ───────────────────────────────────
            function fmtDate(ds) {
                if (!ds) return "";
                const [y,m,d] = ds.split("-");
                const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
                const dayName = days[new Date(`${ds}T12:00:00`).getDay()];
                return `${dayName} ${d}/${m}/${y}`;
            }

            return (
                <div style={{paddingBottom:20}}>

                    {/* ══ Header — Premium ══ */}
                    <div style={{background:"linear-gradient(135deg,#071028,#0c1a38,#071528)",border:"1px solid #22d3ee25",borderRadius:20,padding:22,marginBottom:16,textAlign:"center",position:"relative",overflow:"hidden"}}>
                        {/* Ambient glow */}
                        <div style={{position:"absolute",top:-30,left:"50%",transform:"translateX(-50%)",width:200,height:100,background:"radial-gradient(ellipse,rgba(34,211,238,0.15),transparent 70%)",pointerEvents:"none"}}/>
                        <div style={{position:"absolute",top:0,right:0,width:3,height:"100%",background:"linear-gradient(to bottom,#22d3ee,transparent)",borderRadius:"0 20px 20px 0"}}/>
                        <div style={{fontSize:32,marginBottom:6}}>🤝</div>
                        <div className="gradient-text-cyan" style={{fontSize:22,fontWeight:900}}>حسابات أبو عدي</div>
                        <div style={{fontSize:11,color:"#475569",marginTop:5,letterSpacing:"0.5px"}}>نظام تراكمي تاريخي • {fmtDate(todayStr)}</div>
                        {historyList.length > 0 && (
                            <div style={{display:"inline-flex",alignItems:"center",gap:5,background:"#10b98112",border:"1px solid #10b98130",borderRadius:20,padding:"4px 14px",fontSize:11,color:"#10b981",marginTop:10,fontWeight:700}}>
                                <span className="live-dot" style={{width:6,height:6,borderRadius:"50%",background:"#10b981",display:"inline-block"}}/>
                                {historyList.length} يوم مؤرشف
                            </div>
                        )}
                    </div>

                    {/* ══ تبويبات اليوم / السجل التاريخي ══ */}
                    <div style={{display:"flex",gap:0,marginBottom:16,background:"#0a0c16",borderRadius:12,padding:4,border:"1px solid #1a2235"}}>
                        <button onClick={()=>setShowHistory(false)}
                            style={{flex:1,background:!showHistory?"linear-gradient(135deg,#22d3ee,#0891b2)":"none",border:"none",borderRadius:9,padding:"10px 0",color:!showHistory?"#0a0c16":"#3d4f65",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'Tajawal',sans-serif",transition:"all 0.2s"}}>
                            📅 اليوم الحالي
                        </button>
                        <button onClick={()=>{setShowHistory(true);setHistoryDetailDate(null);}}
                            style={{flex:1,background:showHistory?"linear-gradient(135deg,#a78bfa,#7c3aed)":"none",border:"none",borderRadius:9,padding:"10px 0",color:showHistory?"#fff":"#3d4f65",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'Tajawal',sans-serif",transition:"all 0.2s"}}>
                            📚 السجل التاريخي {historyList.length > 0 && `(${historyList.length})`}
                        </button>
                    </div>

                    {/* ══════════════════════════════════════════
                        قسم اليوم الحالي
                    ══════════════════════════════════════════ */}
                    {!showHistory && (
                    <div>
                        {/* TARGET SETTER */}
                        <div style={{background:"linear-gradient(135deg,#0a1628,#0f1e3d)",border:"1px solid #f59e0b40",borderRadius:14,padding:16,marginBottom:14}}>
                            <div style={{fontSize:12,color:"#f59e0b",fontWeight:700,marginBottom:10}}>💰 إجمالي المبلغ المطلوب تصفيته اليوم</div>
                            {canEdit && (
                                <div style={{display:"flex",gap:8}}>
                                    <input
                                        type="number"
                                        value={targetInput}
                                        onChange={e=>setTargetInput(e.target.value)}
                                        placeholder="مثلاً: 120000"

        // AES-256 encryption using SubtleCrypto (Web Crypto API — يشتغل على المتصفح والموبايل)
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false, ["encrypt", "decrypt"]
            );
        }

        async function aesEncrypt(data, password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv   = crypto.getRandomValues(new Uint8Array(12));
            const key  = await deriveKey(password, salt);
            const enc  = new TextEncoder();
            const ct   = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(data));
            // دمج salt + iv + ciphertext في base64 واحدة
            const combined = new Uint8Array(salt.length + iv.length + ct.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(ct), salt.length + iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function aesDecrypt(b64, password) {
            const bytes    = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
            const salt     = bytes.slice(0, 16);
            const iv       = bytes.slice(16, 28);
            const ct       = bytes.slice(28);
            const key      = await deriveKey(password, salt);
            const dec      = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
            return new TextDecoder().decode(dec);
        }

            }

            function downloadFile(content, filename, type) {
                const blob = new Blob([content], { type });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = filename; a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            function getNowStamp() {
                const d = new Date();
                const pad = n => String(n).padStart(2,"0");
                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}`;
            }

            function handleExportPlain() {
                try {
                    const obj = buildBackupObject();
                    const json = JSON.stringify(obj, null, 2);
                    const fname = `Backup_${getNowStamp()}.json`;
                    downloadFile(json, fname, "application/json");
                    try { localStorage.setItem("lastBackupTime", new Date().toLocaleString("ar-EG")); } catch(e){}
                    showToast(`✅ تم إنشاء النسخة: ${fname}`);
                    setStatus({ msg: `✅ تم تحميل: ${fname}`, type: "success" });
                } catch(err) {
                    setStatus({ msg: `❌ فشل الإنشاء: ${err.message}`, type: "error" });
                }
            }

            function handleImportFile(file) {
                if (!file) return;
                setLoading(true);
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const obj = JSON.parse(ev.target.result);
                        const err = validateBackup(obj);
                        if (err) {
                            setStatus({ msg: `❌ ${err}`, type: "error" });
                            setLoading(false);
                            return;
                        }
                        setConfirmModal({ type: "restore", data: obj, filename: file.name });
                    } catch(e) {
                        setStatus({ msg: "❌ الملف تالف أو ليس JSON صحيح", type: "error" });
                    }
                    setLoading(false);
                };
                reader.onerror = () => {
                    setStatus({ msg: "❌ فشل قراءة الملف", type: "error" });
                    setLoading(false);
                };
                reader.readAsText(file);
                restoreFileRef.current.value = "";
            }

            async function handleEncryptedExport() {
                const pw = pwInput.trim();
                if (!pw || pw.length < 4) {
                    setStatus({ msg: "❌ كلمة المرور يجب أن تكون 4 أحرف على الأقل", type: "error" });
                    return;
                }
                setLoading(true);
                try {
                    const obj = buildBackupObject();
                    const json = JSON.stringify(obj);
                    const encrypted = await aesEncrypt(json, pw);
                    const fname = `Backup_Encrypted_${getNowStamp()}.hbk`;
                    downloadFile(encrypted, fname, "application/octet-stream");
                    try { localStorage.setItem("lastBackupTime", new Date().toLocaleString("ar-EG")); } catch(e){}
                    showToast(`🔒 تم تصدير نسخة مشفرة: ${fname}`);
                    setStatus({ msg: `🔒 تم التصدير المشفر: ${fname}`, type: "success" });
                    setPwInput("");
                    setEncModal(null);
                } catch(err) {
                    setStatus({ msg: `❌ فشل التشفير: ${err.message}`, type: "error" });
                }
                setLoading(false);
            }

            async function handleEncryptedImport(file) {
                if (!file) return;
                const pw = pwInput.trim();
                if (!pw) {
                    setStatus({ msg: "❌ أدخل كلمة المرور أولاً", type: "error" });
                    return;
                }
                setLoading(true);
                try {
                    const b64 = await new Promise((res, rej) => {
                        const r = new FileReader();
                        r.onload = (e) => res(e.target.result.trim());
                        r.onerror = () => rej(new Error("فشل القراءة"));
                        r.readAsText(file);
                    });
                    const json = await aesDecrypt(b64, pw);
                    const obj = JSON.parse(json);
                    const err = validateBackup(obj);
                    if (err) {
                        setStatus({ msg: `❌ ${err}`, type: "error" });
                        setLoading(false);
                        return;
                    }
                    setConfirmModal({ type: "restore", data: obj, filename: file.name });
                    setPwInput("");
                    setEncModal(null);
                } catch(err) {
                    setStatus({ msg: "❌ فشل فك التشفير — كلمة المرور خاطئة أو الملف تالف", type: "error" });
                }
                setLoading(false);
                if (encFileRef.current) encFileRef.current.value = "";
            }

            async function applyRestore(obj) {
                setLoading(true);
                try {
                    // 1. تحديث React State
                    setLines(obj.lines || []);
                    setVisas(obj.visas || []);
                    setInstaPays(obj.instaPays || []);
                    setTransactions(obj.transactions || []);
                    setPeople(obj.people || []);
                    setCapital(typeof obj.capital === "number" ? obj.capital : 0);
                    setFinanceLogs(obj.financeLogs || []);
                    if (Array.isArray(obj.dailyBalanceLog) && setDailyBalanceLog) {
                        setDailyBalanceLog(obj.dailyBalanceLog);
                    }
                    setInventory(obj.inventory || { cash: 0, owedToOthers: 0, note: "" });
                    if (obj.abuAdi) {
                        setAbuadiTarget(obj.abuAdi.target || 0);
                        setAbuadiPayments(obj.abuAdi.payments || []);
                        setAbuadiDate(obj.abuAdi.date || "");
                    }
                    if (Array.isArray(obj.abuAdiHistory)) {
                        setAbuadiHistory(obj.abuAdiHistory);
                    }
                    if (Array.isArray(obj.personalLedger) && setPersonalLedger) {
                        setPersonalLedger(obj.personalLedger);
                    }
                    if (obj.personalLedgerOpenings && setPersonalLedgerOpenings) {
                        setPersonalLedgerOpenings(obj.personalLedgerOpenings);
                    }

                    // 2. تحديث localStorage
                    const keys = ["lines","visas","instaPays","transactions","people","capital","financeLogs","dailyBalanceLog"];
                    keys.forEach(k => { if (obj[k] !== undefined) saveToLocalStorage(k, obj[k]); });
                    if (obj.abuAdi) {
                        saveToLocalStorage("abuadiTarget", obj.abuAdi.target || 0);
                        saveToLocalStorage("abuadiPayments", obj.abuAdi.payments || []);
                        saveToLocalStorage("abuadiDate", obj.abuAdi.date || "");
                    }
                    if (Array.isArray(obj.abuAdiHistory)) {
                        saveToLocalStorage("abuadiHistory", obj.abuAdiHistory);
                    }
                    if (Array.isArray(obj.personalLedger)) {
                        saveToLocalStorage("personalLedger", obj.personalLedger);
                    }
                    if (obj.personalLedgerOpenings) {
                        saveToLocalStorage("personalLedgerOpenings", obj.personalLedgerOpenings);
                    }
                    if (obj.settings) {
                        try {
                            if (obj.settings.lastResetDay) localStorage.setItem("lastResetDay", obj.settings.lastResetDay);
                            if (obj.settings.warnedSources) localStorage.setItem("warnedSources", JSON.stringify(obj.settings.warnedSources));
                        } catch(e){}
                    }

                    // 3. تحديث Firebase
                    if (auth.currentUser && firebaseReady) {
                        const historyWrites = (obj.abuAdiHistory || []).map(day =>
                            db.ref(`abuAdi_history/${day.dateStr}`).set(day)

                        await Promise.allSettled([
                            db.ref("lines").set(obj.lines || []),
                            db.ref("visas").set(obj.visas || []),
                            db.ref("instaPays").set(obj.instaPays || []),
                            db.ref("transactions").set(obj.transactions || []),
                            db.ref("financeLogs").set(obj.financeLogs || []),
                            db.ref("dailyBalanceLog").set(obj.dailyBalanceLog || []),
                            db.ref("capital").set(typeof obj.capital === "number" ? obj.capital : 0),
                            db.ref("abuAdi").set(obj.abuAdi || {}),
                            db.ref("personalLedger").set(obj.personalLedger || []),
                            db.ref("personalLedgerOpenings").set(obj.personalLedgerOpenings || {}),
                            ...historyWrites,
                            ...((obj.people || []).map(p => db.ref("customers").child(String(p.id)).set(p)))
                        ]);
                    }

                    setStatus({ msg: `✅ تمت الاستعادة بنجاح — ${new Date().toLocaleString("ar-EG")}`, type: "success" });
                    showToast("✅ تمت استعادة البيانات بالكامل!");
                } catch(err) {
                    setStatus({ msg: `❌ فشل الاستعادة: ${err.message}`, type: "error" });
                    showToast("❌ فشل الاستعادة", "error");
                }
                setLoading(false);
                setConfirmModal(null);
            }

            function persist(msgs) {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs.slice(-80))); } catch(e) {}
                try { firebase.database().ref("ai_chat_log").set(msgs.slice(-80)); } catch(e) {}
            }

            // ── بناء الـ System Prompt مع بيانات التطبيق ──────────────
            function buildSystemPrompt() {
                const todayStr  = today();
                const monthStr  = currentMonthStr();
                const todayTxns = transactions.filter(t => t.date === todayStr);
                const last15    = [...transactions].slice(-15).reverse();

                // ملخص الخطوط
                const linesSummary = lines.map(l => {
                    const s = sources.find(x => x.id === l.id) || l;
                    return `• ${l.name}: رصيد=${formatNum(l.balance||0)}ج | يومي=${formatNum(s.usedToday||0)}/${formatNum(LINES_LIMIT_DAILY)}ج | شهري=${formatNum(s.usedMonth||0)}/${formatNum(LINES_LIMIT_MONTHLY)}ج`;
                }).join("\n");

                // ملخص الفيزا
                const visasSummary = visas.map(v => {
                    const s = sources.find(x => x.id === v.id) || v;
                    return `• ${v.name}: رصيد=${formatNum(v.balance||0)}ج | يومي=${formatNum(s.usedToday||0)}/${formatNum(VISA_LIMIT_DAILY)}ج | شهري=${formatNum(s.usedMonth||0)}/${formatNum(VISA_LIMIT_MONTHLY)}ج`;
                }).join("\n");

                // ملخص InstaPay
                const ipaySummary = instaPays.length ? instaPays.map(ip => {
                    const s = sources.find(x => x.id === ip.id) || ip;
                    return `• ${ip.name}: رصيد=${formatNum(ip.balance||0)}ج | شهري=${formatNum(s.usedMonth||0)}/${formatNum(INSTAPAY_LIMIT_MONTHLY)}ج`;
                }).join("\n") : "لا يوجد";

                // أرباح الشهر — FIX: دعم السجلات القديمة بدون monthDate
                const mLogs = financeLogs.filter(l => {
                    const lMonth = l.monthDate || (l.date ? String(l.date).slice(0,7) : null);
                    return lMonth === monthStr;
                });
                const mInc  = mLogs.filter(l=>l.type==="income").reduce((s,l)=>s+l.amount,0);
                const mExp  = mLogs.filter(l=>l.type==="expense").reduce((s,l)=>s+l.amount,0);

                // العملاء المديونين
                const debtors = people
                    .map(p => ({ name: p.personName, bal: getPersonBalance(p) }))
                    .filter(p => p.bal > 0)
                    .sort((a,b) => b.bal - a.bal)
                    .slice(0, 8)
                    .map(p => `${p.name}: ${formatNum(p.bal)}ج`)
                    .join(" | ");

                // أبو عدي
                const todayMsStr = new Date().toDateString();
                const abuPaid = abuadiPayments.filter(p=>new Date(p.ts).toDateString()===todayMsStr).reduce((s,p)=>s+p.amount,0);
                const abuRem  = Math.max(0, abuadiTarget - abuPaid);

                // آخر 15 عملية
                const txnSummary = last15.map(t => {
                    const typeLabel = t.type==="transfer"?"تحويل":t.type==="receive"?"استلام":t.type==="bank_withdraw"?"سحب بنك":t.type==="fawri_transfer"?"تحويل إلى فوري":t.type==="internal_transfer"?"تحويل داخلي":"سحب فوري";
                    return `[${t.date} ${t.time||""}] ${typeLabel} — ${t.personName} — ${formatNum(t.amount)}ج`;
                }).join("\n");

                // حساب إضافي — خطوط متاحة وعدد العملاء
                const availLines = lines.filter(l => l.available !== false).length;
                const availVisas = visas.filter(v => v.available !== false).length;
                const totalDebtVal = people.reduce((s, p) => s + Math.max(0, getPersonBalance(p)), 0);
                const debtorCount  = people.filter(p => getPersonBalance(p) > 0).length;
                const todayTransfer = todayTxns.filter(t=>t.type==="transfer").reduce((s,t)=>s+t.amount,0);
                const todayReceive  = todayTxns.filter(t=>t.type==="receive").reduce((s,t)=>s+t.amount,0);

                return `أنت مساعد ذكي اسمك "حوكر AI" داخل تطبيق "فودافون كاش" لإدارة محافظ فودافون كاش التجارية.
تكلم دايماً بالعامية المصرية بشكل ودود ومختصر وعملي.
- ردك يكون مباشر ومفيد، مش أكتر من 4-5 جمل إلا لو الموضوع يحتاج جدول أو تفاصيل.

- لو حد سألك على أحسن خط، اقترح الخط اللي عنده أقل استخدام شهري ومتاح.
- لو سألك عن الوضع العام، اعطيه ملخص سريع بالأرقام من البيانات دي.

═══════════════════════════════════════
📊 بيانات التطبيق اللحظية — ${todayStr}
═══════════════════════════════════════

حدود إنستا باي: يومي ${formatNum(INSTAPAY_LIMIT_DAILY)}ج | شهري ${formatNum(INSTAPAY_LIMIT_MONTHLY)}ج`;
            }

            async function sendMessage(overrideText) {
                const q = (overrideText || input).trim();
                if (!q || thinking) return;
                setInput("");

                const userMsg = { role: "user", text: q, ts: Date.now() };
                const newMsgs = [...messages, userMsg];
                setMessages(newMsgs);
                setThinking(true);

                try {
                    const sysPrompt = buildSystemPrompt();
                    const aiText = await callClaudeChat(sysPrompt, newMsgs.slice(-20));
                    const aiMsg = { role: "ai", text: aiText, ts: Date.now() };
                    const final = [...newMsgs, aiMsg];
                    setMessages(final);
                    persist(final);
                } catch(err) {
                    const aiMsg = { role: "ai", text: `❌ خطأ: ${err.message}`, ts: Date.now() };
                    const final = [...newMsgs, aiMsg];
                    setMessages(final);
                    persist(final);
                    if (err.code === "NO_API_KEY") setShowKeyInput(true);
                } finally {
                    setThinking(false);
                }
            }

    <!-- ✅ Manual Babel Transform - bypasses 500KB limit -->
    <script>
    (function() {
        var jsxRetries = 0;
        function runJSX() {
            var src = document.getElementById('main-jsx-src');
            // ⭐ لو React/ReactDOM لسه مش اتحملوا (مشكلة نت/CDN)، استنى شوية كمان قبل ما تفشل
            if (!src || !window.Babel || !window.React || !window.ReactDOM) {
                jsxRetries++;
                if (jsxRetries > 100) { // ~10 ثواني محاولات
                    if (!window.React || !window.ReactDOM) {
                        showFallbackError('التطبيق محتاج اتصال بالإنترنت أول مرة يفتح فيها (لتحميل React). تأكد إن عندك نت شغال وجرب تفتح الملف تاني. لو المشكلة استمرت، جرب متصفح تاني أو افتح الرابط أونلاين بدل ما تفتح الملف من الجهاز مباشرة.');
                    } else {
                        showFallbackError('فيه ملف أساسي (Babel) اتأخر في التحميل. تأكد من اتصال الإنترنت وجرب تاني.');
                    }
                    return;
                }
                setTimeout(runJSX, 100);
                return;
            }
            try {
                var code = src.textContent;
                var result = Babel.transform(code, {
                    presets: ['react'],
                    sourceType: 'script',
                    compact: false,
                    generatorOpts: { compact: false }
                });
                // Execute directly via eval to avoid blob URL module issues
                (new Function(result.code))();
            } catch(e) {
                console.error('Babel transform failed:', e);
                showFallbackError(e.message);
            }
        }
        function showFallbackError(msg) {
            var root = document.getElementById('root');
            if (root) root.innerHTML = '<div style="color:#ef4444;padding:40px;font-family:Tajawal,sans-serif;text-align:center;background:#05070f;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:48px">⚠️</div><div style="font-size:20px;font-weight:700;margin-top:16px">خطأ في التحميل</div><div style="font-size:13px;color:#94a3b8;margin-top:8px;max-width:340px">' + msg + '</div></div>';
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runJSX);
        } else {
            runJSX();
        }
    })();
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        // نسجّل Service Worker لو موجود (Netlify/GitHub Pages)
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('✅ SW registered:', reg.scope))
            .catch(() => {
                // لو sw.js مش موجود، نعمل inline SW بـ blob
                const swCode = `
const CACHE = 'hawker-v1';
const ASSETS = [
    './',
    'https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap',
    'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js'
];
self.addEventListener('install', e => {
    e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
    self.skipWaiting();
});
self.addEventListener('activate', e => {
    e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    ));
    self.clients.claim();
});
self.addEventListener('fetch', e => {
    if (e.request.method !== 'GET') return;
    e.respondWith(
        fetch(e.request)
            .then(res => {
                const clone = res.clone();
                caches.open(CACHE).then(c => c.put(e.request, clone));
                return res;
            })
            .catch(() => caches.match(e.request))
    );
});`;
                const blob = new Blob([swCode], {type:'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob))
                    .then(r => console.log('✅ Inline SW registered'))
                    .catch(e => console.log('SW unavailable (file://)', e.message));
            });
    }

    // ══ Install Prompt (Android/Desktop Chrome) ══
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.getElementById('pwa-install-btn');
        if (btn) {
            btn.style.display = 'flex';
            btn.onclick = () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(choice => {
                    if (choice.outcome === 'accepted') btn.style.display = 'none';
                    deferredPrompt = null;
                });
            };
        }
    });
    window.addEventListener('appinstalled', () => {
        const btn = document.getElementById('pwa-install-btn');
        if (btn) btn.style.display = 'none';
        console.log('✅ PWA installed');
    });
    </script>

    <!-- ══ Install Button (يظهر تلقائياً لو الجهاز يدعم الـ Install) ══ -->
    <div id="pwa-install-btn" style="
        display: none;
        position: fixed;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        background: linear-gradient(135deg,#e40000,#a00000);
        color: #fff;
        border: none;
        border-radius: 30px;
        padding: 12px 24px;
        font-family: 'Tajawal', sans-serif;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(228,0,0,0.5);
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        direction: rtl;
    ">
        <span style="font-size:18px">📲</span>
        <span>ثبّت التطبيق على جهازك</span>
    </div>
</body>
</html>
