    <title>الحوكر — فودافون كاش</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- ══ Inline Manifest fallback (بديل لو manifest.json مش موجود) ══ -->
    <script id="pwa-manifest-inline">
    (function() {
        // Inline manifest as blob — يشتغل حتى لو الملف مرفوع مباشرةً بدون web server
        const manifest = {
            name: "الحوكر — مدير فودافون كاش",
            short_name: "الحوكر",
            description: "مدير التحويلات والمالية",
            start_url: "./",
            display: "standalone",
            orientation: "portrait-primary",
            background_color: "#05070f",
            theme_color: "#05070f",
            lang: "ar",
            dir: "rtl",
            icons: [
                {
                    src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='36' fill='%2305070f'/><text x='96' y='130' font-size='110' text-anchor='middle' fill='%23e40000' font-family='serif' font-weight='bold'>V</text></svg>`),
                    sizes: "192x192",
                    type: "image/svg+xml",
                    purpose: "any maskable"
                },
                {
                    src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='%2305070f'/><text x='256' y='350' font-size='290' text-anchor='middle' fill='%23e40000' font-family='serif' font-weight='bold'>V</text></svg>`),
                    sizes: "512x512",
                    type: "image/svg+xml",
                    purpose: "any maskable"
                }
            ],
            categories: ["finance", "productivity"],
            shortcuts: [
                {
                    name: "عملية جديدة",
                    short_name: "جديد",
                    description: "إضافة عملية تحويل",
                    url: "./"
                }
            ]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"});
        const url  = URL.createObjectURL(blob);
        // نفعّل الـ blob manifest لو مفيش manifest.json حقيقي
        const existing = document.querySelector('link[rel="manifest"]');
        if (existing) {
            fetch(existing.href).catch(() => { existing.href = url; });
        }
    })();
    </script>

    <style>
        /* ══════════════════════════════════════════
           Ultra-Dark OLED Theme — فودافون كاش
        ══════════════════════════════════════════ */
        :root {
            --bg-void:     #05070f;
            --bg-deep:     #0a0c16;
            --bg-card:     #0d1120;
            --bg-card2:    #111827;
            --bg-input:    #0a0e1a;
            --border-dim:  #1a2235;
            --border-glow: #1e3a5f;
            --text-bright: #c8d6e8;
            --text-mid:    #7a8fa8;
            --text-dim:    #3d4f65;
            --accent-red:  #e40000;
            --accent-cyan: #22d3ee;
            --accent-green:#10b981;
            --accent-gold: #f59e0b;
            --accent-violet:#a78bfa;
            --accent-blue: #3b82f6;
            --glass-bg:    rgba(10, 14, 26, 0.82);
            --glass-blur:  blur(18px);
            --shadow-deep: 0 8px 32px rgba(0,0,0,0.6);
            --radius-card: 14px;
            --radius-btn:  10px;
        }


        /* ══════════════════════════════════════════
           ☀️  Light Mode — data-theme="light"
        ══════════════════════════════════════════ */
        [data-theme="light"] {
            --bg-void:     #f0f4f8;
            --bg-deep:     #e8edf3;
            --bg-card:     #ffffff;
            --bg-card2:    #f5f8fc;
            --bg-input:    #edf2f7;
            --border-dim:  #cbd5e1;
            --border-glow: #93c5fd;
            --text-bright: #0f172a;
            --text-mid:    #475569;
            --text-dim:    #94a3b8;
            --glass-bg:    rgba(255,255,255,0.88);
            --shadow-deep: 0 8px 32px rgba(0,0,0,0.12);
        }
        [data-theme="light"] body { background-color: #f0f4f8; }
        [data-theme="light"] ::-webkit-scrollbar-track { background: #e8edf3; }
        [data-theme="light"] ::-webkit-scrollbar-thumb { background: #93c5fd; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-void);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-bright);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-void); }
        ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }

        /* ── Page fade-in ── */
        .page-container {
            animation: fadeIn 0.3s ease;
            -webkit-overflow-scrolling: touch;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px) scale(0.99); }
            to   { opacity: 1; transform: translateY(0)   scale(1);    }
        }

        /* ── Blink ── */
        @keyframes blink {
            0%, 50%     { opacity: 1;   }
            50.1%, 100% { opacity: 0.45;}
        }

        /* ── Spinner ── */
        .loading-spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid rgba(30,58,95,0.35);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Glassmorphism Modal Overlay ── */
        .glass-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: flex-end;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.2s ease;
        }
        @keyframes overlayIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── Glass Modal Panel ── */
        .glass-modal {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(34,211,238,0.1);
            border-bottom: none;
            border-radius: 22px 22px 0 0;
            padding: 22px 20px 32px;
            max-height: 92vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            animation: slideUp 0.25s cubic-bezier(0.22,0.61,0.36,1);
            box-shadow: 0 -4px 40px rgba(0,0,0,0.7);
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* ── Collapsible Accordion ── */
        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 10px 0;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid var(--border-dim);
            margin-bottom: 12px;
        }
        .accordion-arrow {
            width: 24px; height: 24px;
            background: var(--bg-card2);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: var(--text-mid);
            transition: transform 0.25s ease, background 0.2s ease;
            flex-shrink: 0;
        }
        .accordion-arrow.open {
            transform: rotate(180deg);
            background: rgba(34,211,238,0.08);
            color: var(--accent-cyan);
            border-color: rgba(34,211,238,0.25);
        }
        .accordion-body {
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1),
                        opacity   0.3s ease,
                        transform 0.3s ease;
        }
        .accordion-body.open  { opacity: 1; transform: translateY(0);   }
        .accordion-body.closed{ opacity: 0; transform: translateY(-6px);}

        /* ── Enhanced Progress Bar ── */
        .vl-track {
            width: 100%; height: 7px;
            background: rgba(255,255,255,0.04);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 4px;
        }
        .vl-fill {
            height: 100%; border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4,0,0.2,1),
                        background 0.4s ease;
            position: relative;
        }
        .vl-fill::after {
            content: '';
            position: absolute; right: 0; top: 0; bottom: 0;
            width: 8px;
            background: rgba(255,255,255,0.35);
            border-radius: 99px;
            filter: blur(2px);
        }

        /* ── Interactive Buttons ── */
        button {
            transition: opacity 0.15s ease, transform 0.15s ease,
                        box-shadow 0.15s ease, background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { opacity: 0.75; transform: scale(0.97); }

        /* ── Input Fields ── */
        input, select, textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Tajawal', sans-serif;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: rgba(34,211,238,0.45) !important;
            box-shadow: 0 0 0 2px rgba(34,211,238,0.08);
        }

        /* ── Card hover glow ── */
        .line-card {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
        }
        .line-card:active { transform: scale(0.995); }

        /* ── Toast ── */
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(12px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    }
        }
        .toast-animate { animation: toastIn 0.2s ease; }

        /* ── نيون وميض للتحذير عند الحد الأقصى ── */
        @keyframes neonPulse {
            0%,100% { box-shadow: 0 0 0px #ef444400, inset 0 0 0px #ef444400; }
            50%      { box-shadow: 0 0 10px #ef444460, inset 0 0 6px #ef444418; }
        }
        @keyframes neonPulseAmber {
            0%,100% { box-shadow: 0 0 0px #f59e0b00, inset 0 0 0px #f59e0b00; }
            50%      { box-shadow: 0 0 8px #f59e0b50, inset 0 0 4px #f59e0b15; }
        }
        .limit-critical { animation: neonPulse 1.6s ease-in-out infinite; }
        .limit-warning  { animation: neonPulseAmber 2s ease-in-out infinite; }

        /* ── Smart Auto-Routing Badge ── */
        @keyframes smartGlow {
            0%,100% { box-shadow: 0 0 4px #a78bfa60, 0 0 10px #a78bfa30; opacity: 1; }
            50%      { box-shadow: 0 0 10px #a78bfa90, 0 0 20px #a78bfa50; opacity: 0.85; }
        }
        .smart-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: linear-gradient(135deg, #a78bfa25, #7c3aed20);
            border: 1px solid #a78bfa60; border-radius: 20px;
            padding: 3px 10px; font-size: 10px; color: #a78bfa; font-weight: 700;
            animation: smartGlow 2s ease-in-out infinite; white-space: nowrap;
        }
        .smart-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: #a78bfa; animation: blink 1.5s infinite; }

        /* ══════════════════════════════════════════
           🖨️  Thermal Receipt Print Styles
        ══════════════════════════════════════════ */
        @media print {
            body * { visibility: hidden; }
            #thermal-receipt-print, #thermal-receipt-print * { visibility: visible; }
            .thermal-receipt, .thermal-receipt * { visibility: visible; }
            #thermal-receipt-print {
                display: block !important;
                position: absolute;
                left: 0; top: 0;
                width: 80mm;
                padding: 4mm;
                background: #fff !important;
                color: #000 !important;
                font-family: 'Tajawal', 'Courier New', monospace;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print { display: none !important; }
            @page { margin: 0; size: 80mm auto; }
        }
        #thermal-receipt-print { display: none; }
        /* ══════════════════════════════════════════
           📱  iOS / PWA — تحسينات الجوال المتقدمة
        ══════════════════════════════════════════ */

        /* Safe area — Dynamic Island / Notch / Home Bar */
        :root {
            --sat: env(safe-area-inset-top,    0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left,   0px);
            --sar: env(safe-area-inset-right,  0px);

        /* منع الـ Auto-Zoom في iOS — كل الحقول ≥ 16px */
        input, select, textarea {
            font-size: 16px !important;
        }

        /* Momentum scrolling لكل القوائم */
        .page-container,
        .glass-modal,
        div[style*="overflow-y: auto"],
        div[style*="overflowY:\"auto\""] {
            -webkit-overflow-scrolling: touch;
        }

        /* Premium iOS border radius */
        .glass-modal {
            border-radius: 26px 26px 0 0 !important;
        }

        /* منع تحديد النص أثناء اللمس */
        button { -webkit-user-select: none; user-select: none; }

        /* Tap highlight */
        * { -webkit-tap-highlight-color: transparent; }

        /* ═══ Sync Indicator Animations ═══ */
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50%       { opacity: 1;   transform: scale(1);   }
        }

        /* ═══ Responsive — شاشات صغيرة (< 380px) ═══ */
        @media (max-width: 380px) {
            .page-container { padding: 10px 10px 0 !important; }
            .glass-modal    { padding: 16px 14px 28px !important; }
        }

        /* ═══ Responsive — شاشات كبيرة (tablet/desktop) ═══ */
        @media (min-width: 768px) {
            #root { max-width: 480px; margin: 0 auto; }
            .glass-modal { border-radius: 16px !important; max-width: 460px; margin: auto; }
            .glass-overlay { align-items: center !important; justify-content: center !important; }
        }

        /* ═══ تحسين Tap targets لكل الأزرار ═══ */
        button { min-height: 40px; }

        /* ═══ منع overflow أفقي ═══ */
        body, #root { overflow-x: hidden; max-width: 100vw; }

        .no-print { /* أزرار لا تُطبع */ }

        .receipt-paper {
            font-family: 'Courier New', 'Tajawal', monospace;
            background: #fff;
            color: #000;
            width: 100%;
            max-width: 72mm;
            margin: 0 auto;
            padding: 8px 6px;
            direction: rtl;
        }
        .receipt-divider {
            border: none;
            border-top: 1px dashed #000;
            margin: 6px 0;
        }
        .receipt-divider-solid {
            border: none;
            border-top: 2px solid #000;
            margin: 6px 0;
        }
    </style>
</head>

    <div id="root" role="main" aria-label="تطبيق الحوكر — مدير فودافون كاش"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ══════════════════════════════════════════════════════════════
        //  🛡️  Error Boundary — يحمي التطبيق من الكراش الكامل
        // ══════════════════════════════════════════════════════════════
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, info) {
                console.error("🚨 ErrorBoundary caught:", error, info);
            }
            render() {
                if (this.state.hasError) {
                    return React.createElement("div", {
                        style: { padding: 32, textAlign: "center", color: "#ef4444", fontFamily: "Tajawal,sans-serif" }
                    },
                        React.createElement("div", { style: { fontSize: 40 } }, "⚠️"),
                        React.createElement("div", { style: { fontSize: 18, fontWeight: 700, marginTop: 12 } }, "حصل خطأ غير متوقع"),
                        React.createElement("div", { style: { fontSize: 13, color: "#94a3b8", marginTop: 8 } }, String(this.state.error?.message || "")),
                        React.createElement("button", {
                            onClick: () => this.setState({ hasError: false, error: null }),
                            style: { marginTop: 20, background: "#ef444420", border: "1px solid #ef444450", borderRadius: 10, padding: "10px 24px", color: "#ef4444", cursor: "pointer", fontFamily: "Tajawal,sans-serif", fontSize: 14 }
                        }, "🔄 إعادة المحاولة")
                    );
                }
                return this.props.children;
            }
        }

        // ══════════════════════════════════════════════════════════════
        //  🌙  Light/Dark Mode — يحفظ التفضيل في localStorage
        // ══════════════════════════════════════════════════════════════
        (function initTheme() {
            const saved = (() => { try { return localStorage.getItem("hawker_theme"); } catch(e) { return null; } })();
            if (saved === "light") document.documentElement.setAttribute("data-theme", "light");
        })();

        // ══════════════════════════════════════════════════════════════════
        //  🤖  Claude AI — يشتغل تلقائي بدون API Key
        // ══════════════════════════════════════════════════════════════════
        const GEMINI_API_KEY = "CLAUDE_ACTIVE"; // لا تغير هذا السطر

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDui8QbprvL2AAh5DGIlwEjrqF4TsOr1wc",
            authDomain: "cash-vod.firebaseapp.com",
            databaseURL: "https://cash-vod-default-rtdb.firebaseio.com",
            projectId: "cash-vod",
            storageBucket: "cash-vod.firebasestorage.app",
            messagingSenderId: "576418809704",
            appId: "1:576418809704:web:677a344658ebdc4647f8dd"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
        } catch (error) {
            console.log('Firebase already initialized or error:', error.message);
        }

        const firebaseApp = firebase.app();
        const db = firebase.database();
        const auth = firebase.auth();

        // (تم نقل GEMINI_API_KEY إلى أعلى الـ script مباشرةً)

        // ══════════════════════════════════════════════════════════════════
        //  🤖  OpenRouter AI API
        // ══════════════════════════════════════════════════════════════════
        // ⭐ OpenRouter Key — محفوظ في localStorage للأمان (مش مكتوب في الكود)
        function getOpenRouterKey() {
            try { return localStorage.getItem("openrouter_api_key") || ""; } catch(e) { return ""; }
        }
        function setOpenRouterKey(k) {
            try { localStorage.setItem("openrouter_api_key", k.trim()); } catch(e) {}
        }

        async function callClaudeChat(systemPrompt, history) {
            const key = getOpenRouterKey();
            if (!key) {
                throw new Error("مفيش API Key — روح تبويب AI وأضف مفتاح OpenRouter");
            }
            const messages = [
                { role: "user", content: `[تعليمات النظام]:\n${systemPrompt}\n\nحاضر.` },
                { role: "assistant", content: "حاضر، هتبعت على حسب التعليمات دي." },
                ...history.map(m => ({
                    role: m.role === "user" ? "user" : "assistant",
                    content: m.text
                }))
            ];

            const FREE_MODELS = [
                "openrouter/free",
                "mistralai/mistral-small-3.1-24b-instruct:free",
                "nvidia/llama-3.1-nemotron-nano-8b-v1:free",
                "meta-llama/llama-3.2-3b-instruct:free",
            ];

            let lastErr = "";
            for (const model of FREE_MODELS) {
                try {
                    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${getOpenRouterKey()}`,
                            "HTTP-Referer": "https://hawker-app.local",
                            "X-Title": "Hawker AI"
                        },
                        body: JSON.stringify({ model, messages, max_tokens: 900, temperature: 0.5 })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
                    const text = data?.choices?.[0]?.message?.content;
                    if (!text) throw new Error("رد فارغ");
                    console.log(`✅ OK: ${model}`);
                    return text;
                } catch(e) {
                    console.warn(`⚠️ ${model}: ${e.message}`);
                    lastErr = e.message;

        // ⭐ دالة حساب آمنة — بدون eval أو Function() — تحل العمليات الحسابية فقط
        /**
         * evaluateExpression — محلل حسابي آمن بدون eval
         * يسمح فقط بالأرقام والعمليات +، -، *، /، والأقواس
         * يرفض أي حرف غير رياضي لمنع Code Injection
         */
        const evaluateExpression = (input) => {
            try {
                // ⭐ تنقية صارمة: أرقام وعمليات حسابية فقط — لا حروف ولا خاصيات
                const sanitized = String(input).trim().replace(/[^0-9+\-*/.() ]/g, '');
                if (!sanitized || sanitized.length > 100) return "";
                // تحقق إضافي: لا يبدأ بعملية مضاعفة ولا يحتوي على نقاط متتالية
                if (/[*\/]{2,}|\.{2,}/.test(sanitized)) return "";

                const tokens = sanitized.match(/(\d+\.?\d*)|([+\-*/()])/g);
                if (!tokens || tokens.length > 50) return input;

                let result = 0;
                let operator = '+';
                const stack = [];
                for (const tok of tokens) {
                    if (tok === '(') {
                        stack.push({ result, operator });
                        result = 0; operator = '+';
                    } else if (tok === ')') {
                        const num = result;
                        const frame = stack.pop();
                        if (!frame) return input;
                        result = frame.result;
                        operator = frame.operator;
                        if (operator === '+') result += num;
                        else if (operator === '-') result -= num;
                        else if (operator === '*') result *= num;
                        else if (operator === '/') result = num !== 0 ? result / num : result;
                    } else if (['+','-','*','/'].includes(tok)) {
                        operator = tok;
                    } else {
                        const num = parseFloat(tok);
                        if (isNaN(num)) return input;
                        if (operator === '+') result += num;
                        else if (operator === '-') result -= num;
                        else if (operator === '*') result *= num;
                        else if (operator === '/') result = num !== 0 ? result / num : result;
                    }
                }
                // تحقق من النتيجة: يجب أن تكون رقم حقيقي وليس لا نهاية
                if (isNaN(result) || !isFinite(result) || result < 0) return input;
                return String(Math.round(result * 100) / 100);
            } catch (e) {
                return input;
            }
        };

                function parseSmartMessage(text, lines = [], visas = []) {
            const result = {
                amount: "",
                personNumber: "",
                lineId: "",
                type: "transfer",
                notes: ""
            };
            if (!text.trim()) return result;
            // 1. استخراج المبلغ الذكي
            const amountMatch = text.match(/(?:مبلغ|قيمة)\s*(\d+(?:\.\d+)?)/) || text.match(/(\d{2,}(?:\.\d{1,2})?)\s*(?:جنيه|EGP)/) || text.match(/(\d{2,}(?:\.\d{1,2})?)/);
            if (amountMatch) result.amount = amountMatch[1];
            // 2. استخراج رقم تليفون العميل — يقبل الأرقام مع مسافات أو شرطات أو بدونها
            const phoneMatch = text.match(/01[0-9][\s\-]?[0-9]{4}[\s\-]?[0-9]{4}/) || text.match(/(01[0-9]{9})/);
            if (phoneMatch) result.personNumber = phoneMatch[0].replace(/[\s\-]/g, '');
            // 3. تحديد نوع العملية أوتوماتيك
            if (text.includes("تم استلام") || text.includes("إيداع") || text.includes("حوّل لك") || text.includes("تم استقبال")) {
                result.type = "receive";
            } else if (text.includes("تم تحويل") || text.includes("سحب") || text.includes("خصم")) {
                result.type = "transfer";
            }
            // 4. التعرف الذكي على اسم الخط أو الفيزا
            const allSources = [...lines, ...visas];
            for (const source of allSources) {
                if (source.name && text.includes(source.name)) {
                    result.lineId = source.id;
                    break;
                }
            }
            // 5. حفظ نص الرسالة في الملاحظات
            result.notes = `[رسالة تلقائية]: ${text.trim()}`;
            return result;
        }
        // ══════════════════════════════════════════════════════════════

        // ── مكون مستقل: SVG Bar Chart ─────────────────────────────────
        function SvgBarChart({ data, valueKey, gradient, id, labelColor, mounted, tooltip, setTooltip }) {
            const W = 320, H = 140, padL = 38, padB = 28, padT = 12, padR = 8;
            const chartW = W - padL - padR;
            const chartH = H - padT - padB;
            const maxVal = Math.max(...data.map(d => d[valueKey] || 0), 1);
            const barW   = Math.floor(chartW / data.length) - 4;
            const barGap = chartW / data.length;
            const ySteps = [0, 0.25, 0.5, 0.75, 1];
            const fmtY = (v) => {
                if (v >= 1000000) return (v / 1000000).toFixed(1) + "م";
                if (v >= 1000) return Math.round(v / 1000) + "ك";
                return String(Math.round(v));
            };
            return (
                <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", overflow: "visible" }}>
                    <defs>
                        <linearGradient id={id} x1="0" y1="1" x2="0" y2="0">
                            {gradient.map((g, i) => (
                                <stop key={i} offset={g.offset} stopColor={g.color} stopOpacity={g.opacity || 1} />
                            ))}
                        </linearGradient>
                        <linearGradient id={`${id}-dim`} x1="0" y1="1" x2="0" y2="0">
                            {gradient.map((g, i) => (
                                <stop key={i} offset={g.offset} stopColor={g.color} stopOpacity={(g.opacity || 1) * 0.25} />
                            ))}
                        </linearGradient>
                    </defs>
                    {ySteps.map((s, i) => {
                        const y = padT + chartH - s * chartH;
                        return (
                            <g key={i}>
                                <line x1={padL} y1={y} x2={W - padR} y2={y}
                                    stroke={s === 0 ? "#1e3a5f" : "#1a2235"} strokeWidth={s === 0 ? 1.5 : 0.8} />
                                {i > 0 && (
                                    <text x={padL - 4} y={y + 3.5} textAnchor="end"
                                        fontSize="7.5" fill="#3d4f65" fontFamily="Tajawal,sans-serif">
                                        {fmtY(maxVal * s)}
                                    </text>
                                )}
                            </g>
                        );
                    })}
                    {data.map((d, i) => {
                        const val = d[valueKey] || 0;
                        const pct = val / maxVal;
                        const bH  = Math.max(pct * chartH, val > 0 ? 3 : 0);
                        const x   = padL + i * barGap + (barGap - barW) / 2;
                        const y   = padT + chartH - bH;
                        const isHov = tooltip && tooltip.idx === i && tooltip.chartId === id;
                        return (
                            <g key={i}
                                onMouseEnter={() => setTooltip({ idx: i, chartId: id, label: d.full, value: val })}
                                onMouseLeave={() => setTooltip(null)}
                                onTouchStart={() => setTooltip({ idx: i, chartId: id, label: d.full, value: val })}
                                style={{ cursor: "pointer" }}>
                                <rect x={x} y={padT} width={barW} height={chartH}
                                    fill={isHov ? "#ffffff08" : "transparent"} rx="3" />
                                <rect x={x} y={y} width={barW} height={bH}
                                    fill={val > 0 ? `url(#${id})` : `url(#${id}-dim)`}
                                    rx="3" opacity={isHov ? 1 : 0.85}
                                    style={{ transition: mounted ? `height 0.6s cubic-bezier(0.34,1.56,0.64,1) ${i * 0.06}s` : "none" }} />
                                {val > 0 && (
                                    <circle cx={x + barW / 2} cy={y} r="2.5"
                                        fill={gradient[1].color}
                                        filter={`drop-shadow(0 0 3px ${gradient[1].color})`}
                                        opacity={isHov ? 1 : 0.7} />
                                )}
                                <text x={x + barW / 2} y={H - 6} textAnchor="middle"
                                    fontSize="8" fill={isHov ? labelColor : "#3d4f65"}
                                    fontFamily="Tajawal,sans-serif" fontWeight={isHov ? "700" : "400"}>
                                    {d.label}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

        // ── مكون مستقل: SVG Line Chart ───────────────────────────────
        function SvgLineChart({ data, valueKey, gradient, id, labelColor, mounted, tooltip, setTooltip }) {
            const W = 320, H = 130, padL = 38, padB = 28, padT = 16, padR = 8;
            const chartW = W - padL - padR;
            const chartH = H - padT - padB;
            const maxVal = Math.max(...data.map(d => d[valueKey] || 0), 1);
            const ySteps = [0, 0.25, 0.5, 0.75, 1];
            const fmtY = (v) => {
                if (v >= 1000000) return (v / 1000000).toFixed(1) + "م";
                if (v >= 1000) return Math.round(v / 1000) + "ك";
                return String(Math.round(v));
            };
            const pts = data.map((d, i) => ({
                x: padL + (i / Math.max(data.length - 1, 1)) * chartW,
                y: padT + chartH - ((d[valueKey] || 0) / maxVal) * chartH,
                d, i
            }));
            const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
            const areaPath = pts.length > 0
                ? `${linePath} L ${pts[pts.length - 1].x} ${padT + chartH} L ${pts[0].x} ${padT + chartH} Z`
                : "";
            return (
                <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", overflow: "visible" }}>
                    <defs>
                        <linearGradient id={id} x1="0" y1="1" x2="0" y2="0">

                                <stop key={i} offset={g.offset} stopColor={g.color} stopOpacity={g.opacity || 1} />

                        </linearGradient>
                        <linearGradient id={`${id}-area`} x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor={gradient[1].color} stopOpacity="0.25" />
                            <stop offset="100%" stopColor={gradient[1].color} stopOpacity="0.02" />
                        </linearGradient>
                        <clipPath id={`${id}-clip`}>
                            <rect x={padL} y={padT} width={chartW} height={chartH} />
                        </clipPath>
                    </defs>
                    {ySteps.map((s, i) => {
                        const y = padT + chartH - s * chartH;
                        return (
                            <g key={i}>
                                <line x1={padL} y1={y} x2={W - padR} y2={y}
                                    stroke={s === 0 ? "#1e3a5f" : "#1a2235"} strokeWidth={s === 0 ? 1.5 : 0.8} />
                                {i > 0 && (
                                    <text x={padL - 4} y={y + 3.5} textAnchor="end"
                                        fontSize="7.5" fill="#3d4f65" fontFamily="Tajawal,sans-serif">
                                        {fmtY(maxVal * s)}
                                    </text>
                                )}
                            </g>
                        );
                    })}
                    <path d={areaPath} fill={`url(#${id}-area)`} clipPath={`url(#${id}-clip)`}
                        style={{ transition: mounted ? "opacity 0.8s ease" : "none", opacity: mounted ? 1 : 0 }} />
                    <path d={linePath} fill="none" stroke={`url(#${id})`} strokeWidth="2.5"
                        strokeLinecap="round" strokeLinejoin="round" clipPath={`url(#${id}-clip)`} />
                    {pts.map((p, i) => {
                        const isHov = tooltip && tooltip.idx === i && tooltip.chartId === id;
                        return (
                            <g key={i}
                                onMouseEnter={() => setTooltip({ idx: i, chartId: id, label: p.d.full, value: p.d[valueKey] || 0 })}
                                onMouseLeave={() => setTooltip(null)}
                                onTouchStart={() => setTooltip({ idx: i, chartId: id, label: p.d.full, value: p.d[valueKey] || 0 })}
                                style={{ cursor: "pointer" }}>
                                <circle cx={p.x} cy={p.y} r="12" fill="transparent" />
                                <circle cx={p.x} cy={p.y} r={isHov ? 5 : 3}
                                    fill={gradient[1].color} stroke="#05070f" strokeWidth="1.5"
                                    filter={isHov ? `drop-shadow(0 0 5px ${gradient[1].color})` : "none"} />
                                <text x={p.x} y={H - 6} textAnchor="middle"
                                    fontSize="8" fill={isHov ? labelColor : "#3d4f65"}
                                    fontFamily="Tajawal,sans-serif" fontWeight={isHov ? "700" : "400"}>
                                    {p.d.label}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

        // ── المكون الرئيسي: DashboardCharts ──────────────────────────
        function DashboardCharts({ transactions, financeLogs, formatNum, commissionSettings }) {

            // ── حساب بيانات آخر 7 أيام ──────────────────────────────
            function getLast7Days() {
                const days = [];
                const dayNames = ["أحد","اثن","ثلا","أرب","خمس","جمع","سبت"];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const yy = d.getFullYear();
                    const mm = String(d.getMonth() + 1).padStart(2, "0");
                    const dd = String(d.getDate()).padStart(2, "0");
                    const dateStr = `${yy}-${mm}-${dd}`;
                    const shortLabel = `${dd}/${mm}`;
                    const dayName = dayNames[d.getDay()];
                    days.push({ dateStr, label: dayName, shortLabel, full: `${dayName} ${dd}/${mm}` });
                }
                return days;
            }

            const last7 = getLast7Days();

            // الرسم الأول: حجم التداول (تحويل + استلام) لكل يوم
            const tradingData = last7.map(day => {
                const dayTxns = transactions.filter(t => t.date === day.dateStr);
                const transfers = dayTxns.filter(t => t.type === "transfer").reduce((s, t) => s + (t.amount || 0), 0);
                const receives  = dayTxns.filter(t => t.type === "receive").reduce((s, t) => s + (t.amount || 0), 0);
                const total     = transfers + receives;
                return { ...day, transfers, receives, total };
            });

            // الرسم الثاني: صافي الأرباح (financeLogs) لكل يوم
            const profitData = last7.map(day => {
                const dayLogs = financeLogs.filter(l => l.date === day.dateStr || (l.monthDate && l.date === day.dateStr));
                const dayTxns   = transactions.filter(t => t.date === day.dateStr);
                // ⭐ FIX: نستخدم commissionSettings من الـ state مباشرة (متزامن مع Firebase) بدل localStorage
                const _bankRate  = commissionSettings?.bankWithdrawRate  ?? 0.002;
                const _fawriRate = commissionSettings?.fawriWithdrawRate ?? 0.0057;
                const _fawriFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
                const bankComm  = dayTxns.filter(t => t.type === "bank_withdraw").reduce((s, t) => s + (t.amount || 0) * _bankRate, 0);
                const fawriComm = dayTxns.filter(t => t.type === "fawri_withdraw").reduce((s, t) => s + (t.amount || 0) * _fawriRate + _fawriFixed, 0);
                // دخل من finance logs يومي
                const logIncome = dayLogs.filter(l => l.type === "income").reduce((s, l) => s + (l.amount || 0), 0);
                const logExpense = dayLogs.filter(l => l.type === "expense").reduce((s, l) => s + (l.amount || 0), 0);
                const profit = Math.round((bankComm + fawriComm + logIncome - logExpense) * 100) / 100;
                return { ...day, profit: Math.max(0, profit) };
            });

            // حساب مؤشرات الملخص
            const weekTotal  = tradingData.reduce((s, d) => s + d.total, 0);
            const weekProfit = profitData.reduce((s, d) => s + d.profit, 0);
            const peakDay    = tradingData.reduce((max, d) => d.total > max.total ? d : max, tradingData[0] || { total: 0, full: "—" });

            return (
                <div style={{ marginBottom: 16 }}>

        // ── QR Code generator (pure JS → SVG, بدون مكتبات) ──────────
        // نستخدم خوارزمية بسيطة تولد matrix 25×25 من نص مشفر
        function generateQRMatrix(text) {
            // Simple deterministic pseudo-QR using hash-based pattern
            const size = 25;
            const mat  = Array.from({length:size}, ()=>Array(size).fill(0));
            // Finder patterns (ركن أعلى يسار)
            const fp = (r, c) => {
                for (let i=0;i<7;i++) for (let j=0;j<7;j++) {
                    const border = i===0||i===6||j===0||j===6;
                    const inner  = i>=2&&i<=4&&j>=2&&j<=4;
                    mat[r+i][c+j] = (border||inner) ? 1 : 0;
                }
            };
            fp(0,0); fp(0,size-7); fp(size-7,0);
            // Separators
            for (let i=0;i<8;i++){mat[7][i]=0;mat[i][7]=0;mat[7][size-1-i]=0;mat[i][size-8]=0;mat[size-8][i]=0;mat[size-1-i][7]=0;}
            // Timing patterns
            for (let i=8;i<size-8;i++){mat[6][i]=i%2===0?1:0;mat[i][6]=i%2===0?1:0;}
            // Dark module
            mat[size-8][8]=1;
            // Data area — fill with hash of text
            let h = 5381;
            for (let i=0;i<text.length;i++) h=((h<<5)+h)+text.charCodeAt(i);
            let bit = 0;
            for (let r=0;r<size;r++) for (let c=0;c<size;c++) {
                if (mat[r][c]===0) {
                    h = ((h*1664525)+1013904223)>>>0;
                    mat[r][c] = (h>>>bit)&1 ? 1 : 0;
                    bit = (bit+1)%32;
                }
            }
            return mat;
        }

        function QRCodeSVG({ text, size = 120 }) {
            const mat  = generateQRMatrix(text);
            const n    = mat.length;
            const cell = size / n;
            const rects = [];
            for (let r=0;r<n;r++) for (let c=0;c<n;c++) {
                if (mat[r][c]) rects.push(<rect key={`${r}-${c}`} x={c*cell} y={r*cell} width={cell} height={cell} fill="#000"/>);
            }
            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block",background:"#fff"}}>
                    {rects}
                </svg>
            );
        }

        function ProgressBar({ used, limit, color, showPct }) {
            const pct = Math.min(limit > 0 ? (used / limit) * 100 : 0, 100);
            const bg = pct >= 85 ? "#ef4444" : pct >= 60 ? "#f59e0b" : color || "#22d3ee";
            return (
                <div style={{width:"100%"}}>
                    <div className="vl-track">
                        <div className="vl-fill" style={{ width:`${pct}%`, background: bg }} />
                    </div>
                    {showPct && <div style={{fontSize:9,color:"#3d4f65",marginTop:2,textAlign:"left"}}>{Math.round(pct)}%</div>}
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════
        //  ⚡  QuickAddModal — إضافة عملية سريعة بـ 3 حقول
        // ══════════════════════════════════════════════════════════════
        function QuickAddModal({ sources, onSave, onClose, showToast, commissionSettings }) {
            const [amount, setAmount] = useState("");
            const [toNumber, setToNumber] = useState("");
            const [sourceId, setSourceId] = useState(sources[0]?.id || "");
            const [type, setType] = useState("transfer");
            const fawriRate = commissionSettings?.fawriWithdrawRate ?? 0.0057;
            const fawriFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
            const bankRate = commissionSettings?.bankWithdrawRate ?? 0.002;

            function calcCommission() {
                const amt = parseFloat(amount) || 0;
                if (!amt) return null;
                if (type === "fawri_withdraw") return { label: "عمولة فوري", val: Math.round((amt * fawriRate + fawriFixed) * 100) / 100 };
                if (type === "bank_withdraw")  return { label: "عمولة بنك",  val: Math.round(amt * bankRate * 100) / 100 };
                return null;
            }
            const comm = calcCommission();
            const availSources = sources.filter(s => s.available !== false);
            function pad(n) { return String(n).padStart(2,"0"); }
            function getToday() { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
            function getTime()  { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

            function handleSave() {
                if (!amount || isNaN(parseFloat(amount))) { showToast("أدخل مبلغ صحيح","error"); return; }
                if (!sourceId) { showToast("اختار خط أو فيزا","error"); return; }
                const src = sources.find(s=>s.id===sourceId);
                onSave({
                    type, amount: parseFloat(amount),
                    fromNumber: src?.number || "",
                    toNumber, personName: toNumber || "—",
                    sourceId, sourceType: src?.type || "line",
                    date: getToday(), time: getTime(), notes: "عملية سريعة", image: null,
                    id: "txn-" + Date.now()
                });
                onClose();
            }

            const iStyle = { width:"100%", background:"#05070f", border:"1px solid #1e3a5f", borderRadius:10, padding:"12px 14px", color:"#c8d6e8", fontSize:14, outline:"none", boxSizing:"border-box", textAlign:"right", fontFamily:"Tajawal,sans-serif" };
            return (
                <div className="glass-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
                    <div className="glass-modal">
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                            <div style={{fontSize:16,fontWeight:700,color:"#22d3ee"}}>⚡ عملية سريعة</div>
                            <button onClick={onClose} aria-label="إغلاق" style={{background:"rgba(255,255,255,0.06)",border:"1px solid #1a2235",borderRadius:8,width:32,height:32,color:"#7a8fa8",cursor:"pointer",fontSize:16}}>×</button>
                        </div>
                        <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
                            {[["transfer","تحويل","#22d3ee"],["receive","استلام","#10b981"],["bank_withdraw","سحب بنك","#3b82f6"],["fawri_withdraw","سحب فوري","#a78bfa"]].map(([v,l,c])=>(
                                <button key={v} onClick={()=>setType(v)}
                                    style={{flex:1,minWidth:70,background:type===v?`${c}22`:"#0d1120",border:`1px solid ${type===v?c:"#1e3a5f"}`,borderRadius:8,padding:"8px 4px",color:type===v?c:"#7a8fa8",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>
                                    {l}
                                </button>
                            ))}
                        </div>
                        <div style={{marginBottom:12}}>
                            <div style={{fontSize:11,color:"#7a8fa8",marginBottom:5}}>المبلغ (ج)</div>
                            <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0" autoFocus style={iStyle}/>
                            {comm && (
                                <div style={{marginTop:6,background:"#10b98115",border:"1px solid #10b98130",borderRadius:8,padding:"6px 10px",fontSize:12,color:"#10b981",display:"flex",justifyContent:"space-between"}}>
                                    <span>{comm.label}</span><span style={{fontWeight:700}}>{comm.val} ج</span>
                                </div>
                            )}
                        </div>
                        <div style={{marginBottom:12}}>
                            <div style={{fontSize:11,color:"#7a8fa8",marginBottom:5}}>رقم العميل</div>
                            <input type="tel" value={toNumber} onChange={e=>setToNumber(e.target.value)} placeholder="01xxxxxxxxx" style={iStyle}/>
                        </div>
                        <div style={{marginBottom:16}}>
                            <div style={{fontSize:11,color:"#7a8fa8",marginBottom:5}}>الخط / الفيزا</div>
                            <select value={sourceId} onChange={e=>setSourceId(e.target.value)} style={{...iStyle}}>
                                {availSources.map(s=><option key={s.id} value={s.id}>{s.name}{s.balance?` (${s.balance} ج)`:""}</option>)}
                            </select>
                        </div>
                        <button onClick={handleSave}
                            style={{width:"100%",background:"linear-gradient(135deg,#22d3ee,#0891b2)",border:"none",borderRadius:12,padding:14,color:"#0a0f1e",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>
                            ✓ حفظ العملية
                        </button>
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════
        //  🔍  GlobalSearch — بحث شامل في العملاء والعمليات والأرقام
        // ══════════════════════════════════════════════════════════════
        function GlobalSearch({ transactions, people, lines, visas, onClose, formatNum, getPersonBalance }) {
            const [q, setQ] = useState("");
            const inputRef = React.useRef();
            React.useEffect(()=>{ inputRef.current?.focus(); },[]);

            const results = React.useMemo(()=>{
                if (!q.trim() || q.length < 2) return { txns:[], persons:[], sources:[] };
                const ql = q.toLowerCase();
                const txns = transactions.filter(t=>
                    (t.personName||"").includes(q) ||
                    (t.fromNumber||"").includes(q) ||
                    (t.toNumber||"").includes(q) ||
                    String(t.amount).includes(q) ||
                    (t.notes||"").includes(q) ||
                    (t.date||"").includes(q)
                ).slice(0,8);
                const persons = people.filter(p=>
                    (p.personName||"").includes(q)||
                    (p.phone||"").includes(q)
                ).slice(0,5);
                const sources = [...lines,...visas].filter(s=>
                    (s.name||"").includes(q)||(s.number||"").includes(q)
                ).slice(0,4);
                return { txns, persons, sources };
            }, [q, transactions, people, lines, visas]);

            const total = results.txns.length + results.persons.length + results.sources.length;
            const typeLabel = t => t.type==="transfer"?"💸 تحويل":t.type==="receive"?"📥 استلام":t.type==="bank_withdraw"?"🏦 سحب بنك":t.type==="fawri_withdraw"?"💳 سحب فوري":"⚡";

            return (
                <div className="glass-overlay" style={{alignItems:"flex-start",paddingTop:60}} onClick={e=>e.target===e.currentTarget&&onClose()}>
                    <div style={{width:"100%",background:"#0a0c16",borderRadius:"0 0 22px 22px",padding:"16px 16px 24px",maxHeight:"80vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,0.8)"}}>
                        <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"center"}}>
                            <div style={{fontSize:18}}>🔍</div>
                            <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)}
                                placeholder="ابحث في كل شيء — عملاء، أرقام، مبالغ، تواريخ..."
                                style={{flex:1,background:"#05070f",border:"1px solid #22d3ee40",borderRadius:10,padding:"12px 14px",color:"#c8d6e8",fontSize:14,outline:"none",fontFamily:"Tajawal,sans-serif",textAlign:"right"}}/>
                            <button onClick={onClose} aria-label="إغلاق البحث" style={{background:"none",border:"none",color:"#7a8fa8",fontSize:22,cursor:"pointer"}}>✕</button>
                        </div>
                        {q.length >= 2 && total === 0 && (

        function DailyReport({ transactions, financeLogs, capital, lines, visas, people, getPersonBalance, formatNum, commissionSettings, onClose }) {
            const fawriRate  = commissionSettings?.fawriWithdrawRate  ?? 0.0057;
            const fawriFixed = commissionSettings?.fawriWithdrawFixed ?? 15;
            const bankRate   = commissionSettings?.bankWithdrawRate   ?? 0.002;
            function pad(n){return String(n).padStart(2,"0");}
            const todayStr = (()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;})();
            const todayTxns  = transactions.filter(t=>t.date===todayStr);
            const totalIn    = todayTxns.filter(t=>t.type==="transfer").reduce((s,t)=>s+t.amount,0);
            const totalOut   = todayTxns.filter(t=>t.type==="receive").reduce((s,t)=>s+t.amount,0);
            const bankComm   = todayTxns.filter(t=>t.type==="bank_withdraw").reduce((s,t)=>s+t.amount*bankRate,0);
            const fawriComm  = todayTxns.filter(t=>t.type==="fawri_withdraw").reduce((s,t)=>s+(t.amount*fawriRate+fawriFixed),0);
            const todayLogs  = financeLogs.filter(l=>l.date===todayStr);
            const logInc     = todayLogs.filter(l=>l.type==="income").reduce((s,l)=>s+l.amount,0);
            const logExp     = todayLogs.filter(l=>l.type==="expense").reduce((s,l)=>s+l.amount,0);
            const netProfit  = Math.round((bankComm+fawriComm+logInc-logExp)*100)/100;
            const debtors    = people.filter(p=>getPersonBalance(p)>0).sort((a,b)=>getPersonBalance(b)-getPersonBalance(a));
            const totalDebt  = debtors.reduce((s,p)=>s+getPersonBalance(p),0);
            const now        = new Date().toLocaleString("ar-EG");

            function printReport() {
                const el = document.getElementById("daily-report-print-area");
                if (!el) return;
                const orig = document.body.innerHTML;
                document.body.innerHTML = el.innerHTML;
                window.print();
                document.body.innerHTML = orig;
                window.location.reload();
            }

            const row = (label, val, color="#c8d6e8") => (
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #1a2235"}}>
                    <span style={{fontSize:13,color:"#7a8fa8"}}>{label}</span>
                    <span style={{fontSize:14,fontWeight:700,color}}>{val}</span>
                </div>
            );

            return (
                <div className="glass-overlay" style={{alignItems:"center",justifyContent:"center",zIndex:400}} onClick={e=>e.target===e.currentTarget&&onClose()}>
                    <div style={{background:"#0a0c16",border:"1px solid #22d3ee30",borderRadius:18,width:"94%",maxWidth:420,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 -4px 40px rgba(0,0,0,0.8)"}}>
                        <div style={{background:"linear-gradient(135deg,#0d1120,#111827)",borderRadius:"18px 18px 0 0",padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #1e3a5f"}}>
                            <div style={{fontSize:15,fontWeight:700,color:"#22d3ee"}}>📊 التقرير اليومي</div>
                            <button onClick={onClose} aria-label="إغلاق" style={{background:"none",border:"none",color:"#64748b",fontSize:20,cursor:"pointer"}}>✕</button>
                        </div>

                        <div id="daily-report-print-area" style={{padding:"16px 18px"}}>
                            <div style={{textAlign:"center",marginBottom:14}}>
                                <div style={{fontSize:13,color:"#7a8fa8"}}>{now}</div>
                                <div style={{fontSize:18,fontWeight:900,color:"#c8d6e8",marginTop:4}}>تقرير يوم {todayStr}</div>
                            </div>

                            <div style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                                <div style={{fontSize:12,color:"#3d4f65",fontWeight:700,marginBottom:8}}>💰 الملخص المالي</div>
                                {row("رأس المال الحالي", formatNum(capital)+" ج", "#f59e0b")}
                                {row("إجمالي التحويلات", formatNum(totalIn)+" ج", "#22d3ee")}
                                {row("إجمالي الاستلام", formatNum(totalOut)+" ج", "#10b981")}
                                {row("عمولات البنك", formatNum(Math.round(bankComm*100)/100)+" ج", "#3b82f6")}
                                {row("عمولات فوري", formatNum(Math.round(fawriComm*100)/100)+" ج", "#a78bfa")}
                                {row("صافي ربح اليوم", formatNum(netProfit)+" ج", netProfit>=0?"#10b981":"#ef4444")}
                            </div>

                            <div style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                                <div style={{fontSize:12,color:"#3d4f65",fontWeight:700,marginBottom:8}}>📋 العمليات ({todayTxns.length})</div>
                                {todayTxns.length===0 && <div style={{color:"#3d4f65",fontSize:12,textAlign:"center",padding:8}}>لا توجد عمليات اليوم</div>}
                                {todayTxns.slice(0,10).map(t=>(
                                    <div key={t.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #1a2235",fontSize:12}}>
                                        <span style={{color:"#7a8fa8"}}>{t.time||""} — {t.personName}</span>
                                        <span style={{color:"#22d3ee",fontWeight:700}}>{maskNum(t.amount, privacyMode)} ج</span>
                                    </div>
                                ))}
                                {todayTxns.length>10 && <div style={{fontSize:11,color:"#3d4f65",marginTop:4,textAlign:"center"}}>+ {todayTxns.length-10} عمليات أخرى</div>}
                            </div>

                            <div style={{background:"#0d1120",border:"1px solid #1e3a5f",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                                <div style={{fontSize:12,color:"#3d4f65",fontWeight:700,marginBottom:8}}>👥 الديون ({formatNum(totalDebt)} ج)</div>
                                {debtors.length===0 && <div style={{color:"#10b981",fontSize:12,textAlign:"center",padding:4}}>✅ لا توجد ديون</div>}
                                {debtors.slice(0,6).map(p=>(
                                    <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #1a2235",fontSize:12}}>
                                        <span style={{color:"#7a8fa8"}}>{p.personName}</span>
                                        <span style={{color:"#ef4444",fontWeight:700}}>{formatNum(getPersonBalance(p))} ج</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div style={{padding:"0 18px 20px",display:"flex",gap:10}}>
                            <button onClick={onClose} style={{flex:1,background:"#1e293b",border:"1px solid #334155",borderRadius:12,padding:12,color:"#94a3b8",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>إغلاق</button>
                            <button onClick={printReport} style={{flex:2,background:"linear-gradient(135deg,#22d3ee,#0891b2)",border:"none",borderRadius:12,padding:12,color:"#000",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>🖨️ طباعة التقرير</button>
                        </div>
                    </div>
                </div>
            );
        }

                                    if (prev.length === arr.length && prev[0]?.id === arr[0]?.id && prev[prev.length-1]?.id === arr[arr.length-1]?.id) return prev;

                    db.ref('settings').on('value', (snapshot) => {

                        if (s.linesMonthlyLimit  !== undefined) { setLinesMonthlyLimit(s.linesMonthlyLimit);   saveToLocalStorage('linesMonthlyLimit', s.linesMonthlyLimit); }
                        if (s.visaDailyLimit     !== undefined) { setVisaDailyLimit(s.visaDailyLimit);         saveToLocalStorage('visaDailyLimit', s.visaDailyLimit); }
                        if (s.visaMonthlyLimit   !== undefined) { setVisaMonthlyLimit(s.visaMonthlyLimit);     saveToLocalStorage('visaMonthlyLimit', s.visaMonthlyLimit); }

                        // ⭐ استقبال نسب العمولات الديناميكية

                        if (s.fawriWithdrawRate !== undefined || s.fawriWithdrawFixed !== undefined || s.bankWithdrawRate !== undefined) {

                                saveToLocalStorage('commissionSettings', updated);

                return () => {

                    db.ref('financeLogs').off();

                }

            useEffect(() => {

            useEffect(() => {

                const checkTime = () => {

                    const isNight = h >= 20 || h < 7;
                    const cur = document.documentElement.getAttribute("data-theme");
                    if (isNight && cur === "light") { document.documentElement.removeAttribute("data-theme"); saveToLocalStorage("hawker_theme","dark"); }
                    else if (!isNight && cur !== "light") { document.documentElement.setAttribute("data-theme","light"); saveToLocalStorage("hawker_theme","light"); }
                };
                checkTime();
                const iv = setInterval(checkTime, 60000);
                return () => clearInterval(iv);
            }, [autoTheme]);

            useEffect(() => {
                if (!firebaseReady || !lowBalanceAlert) return;
                const lows = [...lines,...visas,...instaPays].filter(s => s.available!==false && (s.balance||0) < lowBalanceAlert && (s.balance||0) >= 0);
                if (lows.length > 0) saveToLocalStorage('lowBalanceLines', lows.map(s=>s.name));
            }, [lines, visas, instaPays, firebaseReady, lowBalanceAlert]);

            // ⭐ Web Share Target — استقبال الصور المشاركة من واتساب وغيره
            useEffect(() => {
                async function checkSharedFile() {
                    // 1) Web Share Target API (Chrome Android)
                    if ('launchQueue' in window) {
                        window.launchQueue.setConsumer(async (launchParams) => {
                            if (!launchParams.files || launchParams.files.length === 0) return;
                            const fileHandle = launchParams.files[0];
                            const file = await fileHandle.getFile();
                            if (file.type.startsWith('image/')) {
                                handleOcrImage(file, true);
                            }
                        });
                    }
                    // 2) Fallback: الصورة محفوظة في SW Cache من POST
                    const params = new URLSearchParams(window.location.search);
                    if (params.get('share') === '1') {
                        window.history.replaceState({}, '', window.location.pathname);
                        try {
                            const cache = await caches.open('share-target-temp');
                            const response = await cache.match('shared-image');
                            if (response) {
                                const blob = await response.blob();
                                const file = new File([blob], 'shared.jpg', { type: blob.type || 'image/jpeg' });
                                await cache.delete('shared-image');
                                handleOcrImage(file, true);
                            }
                        } catch(e) { console.log('Share target cache error:', e); }
                    }
                }
                checkSharedFile();
            }, []);

            useEffect(() => { 
                saveToLocalStorage('financeLogs', financeLogs);
                if (isAdmin && auth.currentUser && firebaseReady) { try { db.ref('financeLogs').set(financeLogs); } catch(e){} }
            }, [financeLogs]);

            // ✅ sync أبو عدي — بس بعد ما abuAdiLoaded (يمنع المسح عند الرفريش)
            useEffect(() => {
                try { localStorage.setItem('abuadiTarget',   JSON.stringify(abuadiTarget));   } catch(e){}

                try { localStorage.setItem('abuadiDate',     JSON.stringify(abuadiDate));     } catch(e){}
                // 🛡️ نكتب على Firebase لو في user متسجل + Firebase حمّل البيانات فعلاً
                if (auth.currentUser && firebaseReady && abuAdiLoaded.current) {
                    try {

            }, [abuadiTarget, abuadiPayments, abuadiDate]);

            useEffect(() => {

                const todayStr = today();
                if (lastResetDay && lastResetDay !== todayStr) {
                    setLines(p=>p.map(l=>({...l,usedTodayTransfer:0,usedTodayReceive:0})));
                    setVisas(p=>p.map(v=>({...v,usedTodayTransfer:0,usedTodayReceive:0})));
                    setInstaPays(p=>p.map(v=>({...v,usedTodayTransfer:0,usedTodayReceive:0})));
                    // ⭐ أبو عدي: مش بيتمسح تلقائياً — البيانات بتفضل موجودة
                    // المستخدم بيصفر يدوياً بس
                }
                saveToLocalStorage('lastResetDay', todayStr);
            }, []);

            // ⭐ حماية أبو عدي من المسح: لو Firebase رجع بيانات فاضية في يوم جديد، احتفظ بالـ target
            useEffect(() => {
                if (!firebaseReady) return;
                const savedDate = loadFromLocalStorage('abuadiDate', null);
                const todayStr = today();
                // لو نفس اليوم ومفيش target في Firebase، ارجع للـ localStorage
                if (savedDate === todayStr && abuadiTarget === 0) {
                    const savedTarget = loadFromLocalStorage('abuadiTarget', 0);
                    if (savedTarget > 0) setAbuadiTarget(savedTarget);
                }
            }, [firebaseReady]);

            // ⭐ Alert when line hits 80% — Transfer وReceive كل واحد على حدة
            useEffect(() => {
                const warned = loadFromLocalStorage('warnedSources', []);
                const newWarned = [...warned];
                let changed = false;
                [...lines, ...visas].forEach(s => {
                    const monthlyLimit = s.id.startsWith('visa') ? visaMonthlyLimit : linesMonthlyLimit;
                    const stats = calcSourceStats(s, transactions);

                    // فحص حد السحب (Transfer) منفصل
                    const pctTransfer = (stats.usedMonthTransfer / monthlyLimit) * 100;
                    const transferKey = `${s.id}_transfer`;
                    if (pctTransfer >= 80 && !newWarned.includes(transferKey)) {
                        const msg = `⚠️ ${s.name} — السحب وصل ${Math.round(pctTransfer)}% من الحد الشهري`;
                        setTimeout(() => setToast({msg, type:"error"}), 100);
                        setTimeout(() => setToast(null), 4500);
                        newWarned.push(transferKey);
                        changed = true;
                    }

                    // فحص حد الاستلام (Receive) منفصل
                    const pctReceive = (stats.usedMonthReceive / monthlyLimit) * 100;
                    const receiveKey = `${s.id}_receive`;
                    if (pctReceive >= 80 && !newWarned.includes(receiveKey)) {
                        const msg = `⚠️ ${s.name} — الاستلام وصل ${Math.round(pctReceive)}% من الحد الشهري`;
                        setTimeout(() => setToast({msg, type:"error"}), 2300);
                        setTimeout(() => setToast(null), 6800);
                        newWarned.push(receiveKey);
                        changed = true;
                    }
                });
                if (changed) saveToLocalStorage('warnedSources', newWarned);
            }, [lines, visas, transactions, linesMonthlyLimit, visaMonthlyLimit]);

            // ⭐ Auto-Routing: يجري قبل أي return مشروط — قاعدة hooks
            useEffect(() => {
                if (modal !== "addTxn" || autoRouting.userOverrode) return;
                // نحسب getSmartRoute مؤجلة لأن sources مش متاح هنا — بنستخدم lines/visas/instaPays مباشرة
                const amt = parseFloat(form.amount);
                if (!amt || isNaN(amt) || amt <= 0) return;
                const WARN = 0.85;
                const allSrcs = [
                    ...lines.map(l => {
                        const s = calcSourceStats(l, transactions);
                        // ⭐ FIX: usedToday = تحويل فقط، الحد اليومي لا يشمل الاستلام
                        return {...l, type:"line", dailyLimit:vodDailyLimit, monthlyLimit:linesMonthlyLimit, usedToday:s.usedTodayTransfer, usedTodayReceive:s.usedTodayReceive, usedMonth:s.usedMonthTransfer};
                    }),
                    ...visas.map(v => {
                        const s = calcSourceStats(v, transactions);
                        return {...v, type:"visa", dailyLimit:visaDailyLimit, monthlyLimit:visaMonthlyLimit, usedToday:s.usedTodayTransfer, usedTodayReceive:s.usedTodayReceive, usedMonth:s.usedMonthTransfer};
                    }),
                    ...instaPays.map(ip => {
                        const s = calcSourceStats(ip, transactions);
                        return {...ip, type:"instapay", dailyLimit:instapayDailyLimit, monthlyLimit:instapayMonthlyLimit, usedToday:s.usedTodayTransfer, usedTodayReceive:s.usedTodayReceive, usedMonth:s.usedMonthTransfer};
                    }),
                ];
                const avail = allSrcs.filter(s => s.available !== false);
                let suggestedId = null, allAtLimit = false;
                if (form.type === "receive" || form.type === "transfer") {
                    // ⭐ FIX: التحقق من الحد اليومي بناءً على التحويلات فقط (usedToday = transfer only)
                    const elig = avail.filter(s => (s.balance||0)>=amt && (s.dailyLimit>0?(s.usedToday+amt)/s.dailyLimit<WARN:true) && (s.monthlyLimit>0?(s.usedMonth+amt)/s.monthlyLimit<WARN:true));
                    const pool = elig.length ? elig : avail.filter(s=>(s.balance||0)>=amt);
                    if (!pool.length) { allAtLimit = true; }
                    else { pool.sort((a,b)=>(b.balance||0)-(a.balance||0)); suggestedId = pool[0].id; }
                } else {
                    // ⭐ FIX: المتبقي اليومي = dailyLimit - usedTodayTransfer (ليس مجموع transfer+receive)
                    const pool = avail.map(s=>({...s,space:Math.min(s.dailyLimit>0?Math.max(0,s.dailyLimit-s.usedToday):Infinity,s.monthlyLimit>0?Math.max(0,s.monthlyLimit-s.usedMonth):Infinity)})).filter(s=>s.space>=amt);
                    if (!pool.length) { allAtLimit = true; }
                    else { pool.sort((a,b)=>b.space-a.space); suggestedId = pool[0].id; }
                }
                setAutoRouting(prev => ({ ...prev, suggestedId, allAtLimit }));
                if (suggestedId) {
                    const sel = allSrcs.find(s => s.id === suggestedId);
                    setForm(f => ({ ...f, sourceId: suggestedId, sourceType: sel ? sel.type : "line" }));

            // ⭐ حساب الـ stats من الـ transactions بناءً على رقم الخط (number) — يحل مشكلة تغيير الـ ID بعد الحذف والإضافة
            function calcSourceStats(source, txns) {
                const num = source.number;
                const sid = source.id;
                const todayStr = today();
                const monthStr = currentMonthStr();
                let usedTodayTransfer = 0, usedMonthTransfer = 0;
                let usedTodayReceive  = 0, usedMonthReceive  = 0;
                for (const t of txns) {
                    const tMonth = (t.date || "").slice(0, 7);
                    const isToday = t.date === todayStr;
                    const isMonth = tMonth === monthStr;
                    const isOutgoing = t.type === "transfer" || t.type === "bank_withdraw" || t.type === "fawri_withdraw" || t.type === "fawri_transfer" || t.type === "internal_transfer";
                    // ⭐ مطابقة بـ sourceId أولاً (الأدق)، وإلا بـ رقم التليفون كـ fallback
                    const matchesOutgoing = t.sourceId === sid || (num && t.fromNumber === num);
                    const matchesIncoming = t.sourceId === sid || (num && t.toNumber === num);
                    // ⭐ نستخدم totalAmount (شامل العمولة) لعمليات السحب
                    const effectiveAmount = t.totalAmount || t.amount || 0;
                    if (isOutgoing && matchesOutgoing) {
                        if (isToday) usedTodayTransfer += effectiveAmount;
                        if (isMonth) usedMonthTransfer += effectiveAmount;
                    }
                    if (t.type === "receive" && matchesIncoming) {
                        if (isToday) usedTodayReceive += (t.amount || 0);
                        if (isMonth) usedMonthReceive += (t.amount || 0);
                    }
                }
                return { usedTodayTransfer, usedMonthTransfer, usedTodayReceive, usedMonthReceive };
            }

            // ══════════════════════════════════════════════════════
            //  💡 توزيع العمليات الذكي — Smart Auto-Routing Logic
            // ══════════════════════════════════════════════════════
            function getSmartRoute(amount, txnType) {
                const amt = parseFloat(amount);
                if (!amt || isNaN(amt) || amt <= 0) return { suggestedId: null, allAtLimit: false };

                // الخطوط المتاحة فقط
                const available = sources.filter(s => s.available !== false);
                if (available.length === 0) return { suggestedId: null, allAtLimit: true };

                const WARN_THRESHOLD = 0.85; // 85% من الحد = خط مرهق

                if (txnType === "receive" || txnType === "transfer") {
                    // ═══ تحويل/استلام: نحتاج خطاً برصيد كافٍ وضمن الحد اليومي ═══
                    const eligible = available.filter(s => {
                        const bal = s.balance || 0;
                        const hasBalance = bal >= amt;
                        // ⭐ FIX: usedToday = تحويلات فقط، لا نجمع الاستلام
                        const afterDailyTransfer = (s.usedToday || 0) + amt;
                        const afterMonthly       = (s.usedMonth || 0) + amt;
                        const dailyOk   = s.dailyLimit   > 0 ? (afterDailyTransfer / s.dailyLimit)   < WARN_THRESHOLD : true;
                        const monthlyOk = s.monthlyLimit > 0 ? (afterMonthly       / s.monthlyLimit) < WARN_THRESHOLD : true;
                        return hasBalance && dailyOk && monthlyOk;
                    });

                    if (eligible.length === 0) {
                        // fallback: على الأقل رصيد كافٍ بدون شرط الـ 85%
                        const fallback = available.filter(s => (s.balance || 0) >= amt);
                        if (fallback.length === 0) return { suggestedId: null, allAtLimit: true };
                        fallback.sort((a, b) => (b.balance || 0) - (a.balance || 0));
                        return { suggestedId: fallback[0].id, allAtLimit: false };
                    }
                    eligible.sort((a, b) => (b.balance || 0) - (a.balance || 0));
                    return { suggestedId: eligible[0].id, allAtLimit: false };

                } else {
                    // ═══ سحب بنك/فوري: نحتاج خطاً له مساحة في حدّه اليومي ═══
                    const withSpace = available.map(s => {
                        // ⭐ FIX: المتبقي = dailyLimit - usedTodayTransfer (تحويلات فقط)
                        const dailyRemaining   = s.dailyLimit   > 0 ? Math.max(0, s.dailyLimit   - (s.usedToday || 0)) : Infinity;
                        const monthlyRemaining = s.monthlyLimit > 0 ? Math.max(0, s.monthlyLimit - (s.usedMonth || 0)) : Infinity;
                        const space = Math.min(dailyRemaining, monthlyRemaining);
                        return { ...s, space, canAbsorb: space >= amt };
                    });

                    const canAbsorb = withSpace.filter(s => s.canAbsorb);
                    if (canAbsorb.length === 0) return { suggestedId: null, allAtLimit: true };
                    canAbsorb.sort((a, b) => b.space - a.space);
                    return { suggestedId: canAbsorb[0].id, allAtLimit: false };
                }
            }

            // ══════════════════════════════════════════════════════
            //  ✂️  Smart Multi-Line Splitting — حساب خطة التقسيم
            // ══════════════════════════════════════════════════════
            function calcSmartSplit(amount, txnType) {
                const amt = parseFloat(amount);
                if (!amt || isNaN(amt) || amt <= 0) return null;

                // فقط للتحويل والاستلام (العمليات التي تتأثر بالرصيد واليومي)
                if (txnType !== "transfer" && txnType !== "receive") return null;

                const isTransfer = txnType === "transfer";

                // نبني قائمة المصادر المتاحة مع حساب السعة الفعلية لكل واحد
                const candidates = sources
                    .filter(s => s.available !== false)
                    .map(s => {
                        const balance = parseFloat(s.balance) || 0;
                        // ⭐ FIX: الحد اليومي يُطبَّق على التحويلات فقط (s.usedToday = transfer only بعد الإصلاح)
                        const dailyUsedTransfer = s.usedToday || 0;          // تحويلات اليوم فقط
                        const dailyUsedReceive  = s.usedTodayReceive || 0;   // استلامات اليوم فقط
                        const dailyLimit   = s.dailyLimit   || Infinity;
                        const monthlyUsed  = s.usedMonth    || 0;
                        const monthlyLimit = s.monthlyLimit || Infinity;

                        // ⭐ FIX: المتبقي اليومي = dailyLimit - usedTodayTransfer (لا نجمع الاستلام)
                        const dailyRemainingTransfer = Math.max(0, dailyLimit - dailyUsedTransfer);
                        const dailyRemainingReceive  = Math.max(0, dailyLimit - dailyUsedReceive);
                        const monthlyRemaining       = Math.max(0, monthlyLimit - monthlyUsed);

                        const capacity = isTransfer
                            ? Math.min(balance, dailyRemainingTransfer, monthlyRemaining)
                            : Math.min(dailyRemainingReceive, monthlyRemaining); // الاستلام: حد يومي منفصل

                        return { ...s, capacity: Math.floor(capacity * 100) / 100 };
                    })
                    .filter(s => s.capacity > 0)
                    .sort((a, b) => b.capacity - a.capacity); // ترتيب تنازلي بالسعة

                if (candidates.length === 0) return null;

                // فحص سريع: هل في خط واحد يستوعب المبلغ كاملاً؟
                const singleLineOk = candidates.some(s => s.capacity >= amt);
                if (singleLineOk) return null; // لا داعي للتقسيم

                // بناء خطة التقسيم — greedy من الأعلى سعة للأدنى
                const steps = [];
                let remaining = amt;

                for (const src of candidates) {
                    if (remaining <= 0) break;
                    const take = Math.min(src.capacity, remaining);
                    if (take > 0) {
                        steps.push({
                            sourceId:   src.id,
                            sourceName: src.name,
                            sourceType: src.type,
                            amount:     Math.round(take * 100) / 100,
                            balance:    src.balance || 0,
                            capacity:   src.capacity
                        });
                        remaining = Math.round((remaining - take) * 100) / 100;
                    }
                }

                const totalCovered = Math.round((amt - remaining) * 100) / 100;
                const isComplete   = remaining <= 0;

                return { steps, totalCovered, needed: amt, remaining: Math.max(0, remaining), isComplete };
            }
